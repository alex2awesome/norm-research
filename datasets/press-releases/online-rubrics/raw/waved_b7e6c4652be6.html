    function setCampaignIdFirst(url, campaignId) {
        // Get existing search params

        // Create new search params with campaignid first
        var newSearchParams = new URLSearchParams();
        newSearchParams.append('campaignid', campaignId);

        searchParams.forEach((value, key) => {
            if (key !== 'campaignid') {

<script defer="true">
    //Function to check if the canonical tag is created
    function checkForCanonical() {
        var linkElement = document.querySelector('link[rel="canonical"][data-owner="setSEOProperties"]');

        //Checks if the linkelement attribute is present and it has the prefix "__c" that indicates the canonical url exists
        if (linkElement && linkElement.getAttribute('href').includes("__c")) {
            // If the href has a value, remove the <link> element
            linkElement.parentNode.removeChild(linkElement);
        //SCMTP-11213: Add canonical to Topic Pages
        //Check if the linkelement attribute is present and if has "toBeReplaced" keyword that indicates the canonical tag exists
        } else if (linkElement && linkElement.getAttribute('href').includes("toBeReplaced")){
            //Gets the window url
            var topicWindowURL = window.location.href;
            document.querySelector('link[rel="canonical"]').href = topicWindowURL;
        }
    }

    // Execute when the page is fully loaded
    document.addEventListener('DOMContentLoaded', function() {
        checkForCanonical(); // Check for the link element on initial load

        // Create a MutationObserver to watch for changes in the head
        var observer = new MutationObserver(checkForCanonical);

        // Get the current head element
        var currentHead = document.head;

        // Configure the observer to watch for childList changes in the head
        observer.observe(currentHead, {
            childList: true
        });
    });
</script>
