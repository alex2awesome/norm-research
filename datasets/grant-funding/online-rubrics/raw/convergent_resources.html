",\"slug\":{\"_type\":\"slug\",\"current\":\"roadmap\"}},{\"_createdAt\":\"2025-10-15T20:38:41Z\",\"_id\":\"4eac8fe0-153f-4931-820e-6c923f668e1d\",\"_rev\":\"piJ4sB46CR4DpKnvwGH84f\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-15T20:38:48Z\",\"name\":\"Substack\",\"slug\":{\"_type\":\"slug\",\"current\":\"substack\"}}]}],[\"$\",\"$L21\",null,{\"uniqueTopics\":[{\"_createdAt\":\"2025-10-03T16:12:39Z\",\"_id\":\"a0434d65-7fca-4bb6-b9e8-6dba6d301993\",\"_rev\":\"DIQGglHLJ789Bk1yAgxVMA\",\"_type\":\"topic\",\"_updatedAt\":\"2025-10-03T16:12:43Z\",\"name\":\"Metascience\",\"slug\":{\"_type\":\"slug\",\"current\":\"metascience\"}}]}]]}],[\"$\",\"section\",null,{\"ref\":\"$undefined\",\"data-slicetype\":\"$undefined\",\"id\":null,\"className\":\"\",\"data-sanity\":\"$undefined\",\"children\":[\"$\",\"div\",null,{\"className\":\"h-[64px] md:h-[120px]\"}]}],[\"$\",\"$L22\",null,{\"posts\":[{\"_createdAt\":\"2025-10-14T17:49:30Z\",\"_id\":\"a915dd4c-d4c8-4369-8fae-19b15d2cead6\",\"_rev\":\"ouiRwKup4ANFrhR4PlxkGw\",\"_system\":{\"base\":{\"id\":\"a915dd4c-d4c8-4369-8fae-19b15d2cead6\",\"rev\":\"x40W3zaTSGk0CSwuiHMLt4\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-15T17:10:53Z\",\"authors\":[{\"_createdAt\":\"2025-08-13T12:03:21Z\",\"_id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"_rev\":\"DIQGglHLJ789Bk1yAgyBfB\",\"_system\":{\"base\":{\"id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"rev\":\"pF523yb6HepLTPp3dPnvhi\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-03T16:24:34Z\",\"avatar\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-b42559f83aa9e114e95a72502470abcd52a2e18d-1270x1270-png\",\"_type\":\"reference\"},\"crop\":{\"_type\":\"sanity.imageCrop\",\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"_type\":\"sanity.imageHotspot\",\"height\":0.776920510467929,\"width\":0.6540578863958628,\"x\":0.4634665109683876,\"y\":0.43715072149470346}},\"bio\":[{\"_key\":\"16cea80a920e\",\"_type\":\"block\",\"children\":[{\"_key\":\"21339cc69acd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is the CEO of Convergent Research. He is working with a large and growing network of collaborators and advisors to develop a strategic roadmap for future FROs.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"65718741f248\",\"_type\":\"block\",\"children\":[{\"_key\":\"d4729306597d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Outside of CR, he serves on the boards of several non-profits pursuing new methods of funding and organizing scientific research including Norn Group and New Science, and as an interviewer for the Hertz Foundation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5737aa92471b\",\"_type\":\"block\",\"children\":[{\"_key\":\"134dff467e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, he was a Schmidt Futures Innovation Fellow, a Fellow with the Federation of American Scientists (FAS), a research scientist at Google DeepMind, Chief Strategy Officer of the brain-computer interface company Kernel, a research scientist at MIT, a PhD student in biophysics with George Church and colleagues at Harvard, and a theoretical physics student at Yale. He has also previously helped to start companies like BioBright, and advised foundations such as the Open Philanthropy Project.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6c67d6ead7ee\",\"_type\":\"block\",\"children\":[{\"_key\":\"4c155739aa55\",\"_type\":\"span\",\"marks\":[],\"text\":\"His work has been recognized with a Technology Review 35 Innovators Under 35 Award (2018), a Fannie and John Hertz Foundation Fellowship (2010) and a Goldwater Scholarship (2008).\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0e90c913b107\",\"_type\":\"block\",\"children\":[{\"_key\":\"39cf4d54a20a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is a fan of sweets and his cats (Tortoiseshell) Lyra and (giant orange Maine Coon) Neo.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"name\":\"Adam Marblestone\",\"role\":\"CEO \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"adam-marblestone\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T16:48:00Z\",\"_id\":\"7246c5f9-acc8-4f68-9142-50aa8363a6b3\",\"_rev\":\"vDTWRLEpXesEd0F5RqlaSr\",\"_system\":{\"base\":{\"id\":\"7246c5f9-acc8-4f68-9142-50aa8363a6b3\",\"rev\":\"MjdSXFelIF5IivE64wNelK\"}},\"_type\":\"person\",\"_updatedAt\":\"2026-03-27T22:15:23Z\",\"avatar\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-c404c23dbab3c6fa071fdc682e0b57d1a96216d3-964x1430-png\",\"_type\":\"reference\"},\"crop\":{\"_type\":\"sanity.imageCrop\",\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"_type\":\"sanity.imageHotspot\",\"height\":0.746938883386663,\"width\":1,\"x\":0.5,\"y\":0.3734694416933315}},\"bio\":[{\"_key\":\"4be79c25c12d\",\"_type\":\"block\",\"children\":[{\"_key\":\"2f65e37f4fff\",\"_type\":\"span\",\"marks\":[],\"text\":\"Anastasia Gamick is the Co-Founder and President of Convergent Research, where she helped pioneer \"},{\"_key\":\"5ff9d60d5ce1\",\"_type\":\"span\",\"marks\":[\"8e84f427eb30\"],\"text\":\"the Focused Research Organization (FRO) model\"},{\"_key\":\"4cab6f1c3e64\",\"_type\":\"span\",\"marks\":[],\"text\":\": mission-driven, time-bound teams designed to solve large-scale scientific bottlenecks that neither academia nor industry is well-structured to tackle.\"}],\"markDefs\":[{\"_key\":\"8e84f427eb30\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"internalReference\":{\"_ref\":\"f40f3d74-d9a9-48b1-b209-af1090833c73\",\"_type\":\"reference\"},\"linkType\":\"internal\"}],\"style\":\"normal\"},{\"_key\":\"6665ca3fc4c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"56c8ff402c15\",\"_type\":\"span\",\"marks\":[],\"text\":\"Anatasia grew Convergent from an idea into a nonprofit incubator supporting multiple FROs across fields like neuroscience, synthetic biology, and climate. She sits on the boards of \"},{\"_key\":\"59f5c77093ac\",\"_type\":\"span\",\"marks\":[\"f0f979f195db\"],\"text\":\"Forest Neurotech\"},{\"_key\":\"110438162682\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"ce19943a9600\",\"_type\":\"span\",\"marks\":[\"d64dea878fea\"],\"text\":\"EvE Bio\"},{\"_key\":\"3b31518bb698\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"202723461f7d\",\"_type\":\"span\",\"marks\":[\"30a8f7382ebe\"],\"text\":\"Cultivarium\"},{\"_key\":\"3e5c2d74e74a\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"d83ec240e060\",\"_type\":\"span\",\"marks\":[\"affcb03131ae\"],\"text\":\"Dragonfly\"},{\"_key\":\"55b3a1238a98\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"f167d8f01cd9\",\"_type\":\"span\",\"marks\":[\"31e25bb0f90e\"],\"text\":\"[C]Worthy\"},{\"_key\":\"2a8fabd637a8\",\"_type\":\"span\",\"marks\":[],\"text\":\", Unitary Fund, and others, advising bold scientific efforts with public-good missions. Her work blends startup execution with institutional design, helping build the infrastructure and partnerships needed for science at scale.\"}],\"markDefs\":[{\"_key\":\"f0f979f195db\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://forestneurotech.org\",\"linkType\":\"external\"},{\"_key\":\"d64dea878fea\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://evebio.org/\",\"linkType\":\"external\"},{\"_key\":\"30a8f7382ebe\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cultivarium.org\",\"linkType\":\"external\"},{\"_key\":\"31e25bb0f90e\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cworthy.org\",\"linkType\":\"external\"},{\"_key\":\"affcb03131ae\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.mothratelescope.org/\",\"linkType\":\"external\"}],\"style\":\"normal\"},{\"_key\":\"17935e7e6b47\",\"_type\":\"block\",\"children\":[{\"_key\":\"e9c385450cef\",\"_type\":\"span\",\"marks\":[],\"text\":\"Prior to Convergent, she held roles at Neuralink, Creator, Segovia, and Curative, with a career spanning frontier tech, global health, and science operations.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"name\":\"Anastasia Gamick\",\"role\":\"President \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"anastasia-gamick\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T17:34:03Z\",\"_id\":\"56498785-d4f1-4fa4-b092-a975183e2d7c\",\"_rev\":\"Eiw57G9wlN7pMt4O6flNNl\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T17:34:16Z\",\"avatar\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-2684a2d04f4f8c004928327be699b4ad8c3c3f6e-512x512-webp\",\"_type\":\"reference\"}},\"bio\":[{\"_key\":\"6a6fd07ec845\",\"_type\":\"block\",\"children\":[{\"_key\":\"8c7770749cc5\",\"_type\":\"span\",\"marks\":[],\"text\":\"Mary is Head of Strategic Initiatives at Convergent Research. She is responsible for ensuring that Convergent Research's immediate and long-term strategic vision is achieved efficiently and effectively.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a950d8fa4973\",\"_type\":\"block\",\"children\":[{\"_key\":\"9c2cf8ccebf7\",\"_type\":\"span\",\"marks\":[],\"text\":\"Mary previously led strategic planning and served as Chief of Staff to the CEO at Scripps Research and Calibr, advancing partnership and funding opportunities and governance, philanthropy, and business development initiatives. She was a PhD student with Chad Mirkin at Northwestern University and studied chemical engineering at MIT.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"name\":\"Mary Wang\",\"role\":\"Head of Strategic Initiatives\",\"slug\":{\"_type\":\"slug\",\"current\":\"mary-wang\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T16:56:18Z\",\"_id\":\"f76c902d-d1ef-4ec1-816f-1f6c0e9e7532\",\"_rev\":\"Eiw57G9wlN7pMt4O6fgorR\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T16:56:47Z\",\"avatar\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-42ab4c8aec4fac50cc8db8286f91d4f00bd3fb4f-1000x1000-webp\",\"_type\":\"reference\"}},\"bio\":[{\"_key\":\"f388b916b30e\",\"_type\":\"block\",\"children\":[{\"_key\":\"286ab0c5217e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Joseph is Convergent Research’s Head of Communications. He moved over from Ginkgo Bioworks, where he spent four-ish years leading PR, IR, internal comms, and special projects around worker-ownership and governance. Joseph has degrees in cognitive science/history of science, journalism, business, and will graduate with a JD from CUNY Law in 2026. Joseph has served as a trustee of the Telluride Association for over a decade and is a board member of the Sand Mountain Cooperative Education Center.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"96ddb7c33288\",\"_type\":\"block\",\"children\":[{\"_key\":\"747db8fbef56\",\"_type\":\"span\",\"marks\":[],\"text\":\"In his spare time, he loves writing (and teaching writing to academics), collaborating with friends on educational and art projects, and making music. (He's currently taking singing lessons for fun, though he's still shy about his falsetto.) Joseph lives in Astoria, NY with his wife, a climate scientist at MIT who thinks a lot about melting Antarctic glaciers, and their two ragdoll cats.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"name\":\"Joseph Fridman\",\"role\":\"Head of Communications\",\"slug\":{\"_type\":\"slug\",\"current\":\"joseph-fridman\"},\"status\":\"public\"}],\"body\":null,\"categories\":[{\"_createdAt\":\"2025-10-08T13:50:44Z\",\"_id\":\"52a85e76-5759-455a-8d4f-f01bc33d21bf\",\"_rev\":\"6WtiBizt6GSRcp6LvNQ6Xy\",\"_system\":{\"base\":{\"id\":\"52a85e76-5759-455a-8d4f-f01bc33d21bf\",\"rev\":\"FAV00vf4xIs1yUzUzcNI9n\"}},\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-08T13:50:58Z\",\"name\":\"Guide\",\"slug\":{\"_type\":\"slug\",\"current\":\"guide\"}}],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-d58b47bfaa1902fc981f12cc53d46a0103883090-2648x1222-png\",\"_type\":\"sanity.imageAsset\", e29acff0fd38\",\"_rev\":\"aGpldou8uDCYtULGTLYAm3\",\"_system\":{\"base\":{\"id\":\"023c7320-5596-4655-8e2f-e29acff0fd38\",\"rev\":\"FAV00vf4xIs1yUzUzcNFsG\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-08T20:06:28Z\",\"authors\":null,\"body\":[{\"_key\":\"5664bf57b176\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"65c24524cd99\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are thrilled to announce a new collaboration with the \"},{\"_key\":\"9f6e935f35c8\",\"_type\":\"span\",\"marks\":[\"6795e26ba194\"],\"text\":\"Advanced Research and Intervention Agency (ARIA)\"},{\"_key\":\"039616e29573\",\"_type\":\"span\",\"marks\":[],\"text\":\" to launch \"},{\"_key\":\"07423c6c505f\",\"_type\":\"span\",\"marks\":[\"6d263ce56013\"],\"text\":\"Focused Research Organizations\"},{\"_key\":\"7c268cf320bd\",\"_type\":\"span\",\"marks\":[],\"text\":\" (FROs) for science and technology in the UK (“FROST UK”).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"6795e26ba194\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.aria.org.uk/about-aria/\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"6d263ce56013\",\"_type\":\"internalLink\",\"additionalProperties\":null,\"advancedSettings\":false,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":{\"_type\":\"page\",\"actionType\":null,\"resourceCategory\":null,\"slug\":{\"_type\":\"slug\",\"current\":\"about-fros\"},\"title\":\"About FROs\"},\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8885a99ff785\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"89f869d3113d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e4613abb89ef\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ebec66998a0f\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"What does this mean?\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"6a0c4df06862\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ce1f72d9f027\",\"_type\":\"span\",\"marks\":[],\"text\":\"In spring 2025, we’ll launch an open call for FRO proposals inviting visionary scientists and engineers to propose bold ideas for FROs to accelerate ARIA’s opportunity spaces. We’ll select a cohort of proposers for our inaugural Founder in Residence (FiR) program, during which they will develop their concept. Our goal is to incubate and launch at least one FRO in the UK, based on our learnings launching 10 FROs in the US over the past 3 years.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"940ca19f33bc\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"c33d3cddb006\",\"_type\":\"span\",\"marks\":[],\"text\":\"Our FiR program is intended to pilot key design elements of our FRO creation process, including how we train scientists to found a FRO. We hope to tap into the UK’s ecosystem of scientists, innovators, and engineers to galvanize transformative mid-scale systems research projects.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e2e2e56500d9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4922225c29b\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"3a5b880c4e95\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b44477f7f79d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Part of a network: ARIA’s activation partners\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"c98f000ec9cc\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"8853bc90ace8\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are proud to be doing this as part of ARIA’s \"},{\"_key\":\"5f6a995958f4\",\"_type\":\"span\",\"marks\":[\"bc245127aa21\"],\"text\":\"Activation Partners\"},{\"_key\":\"0e9832384db9\",\"_type\":\"span\",\"marks\":[],\"text\":\" program, a network of organizations working to help architect scientific entrepreneurship in ARIA’s opportunity spaces.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"bc245127aa21\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.aria.org.uk/meet-our-activation-partners/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e31c76b428a1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"84c333e4edb8\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will do this by working with ARIA’s Program Directors to identify bottlenecks within their opportunity spaces that could be unblocked with large-scale public goods technologies or datasets. In many ways, this will be our first time partnering with a funding agency to evaluate gaps in their areas of focus and help “create a performer” to address them. This allows us to take advantage of natural complementarity between the ARPA mechanism and the FRO mechanism we are pioneering. The FRO that is ultimately launched will be uniquely positioned to coordinate and collaborate with others in the ARIA ecosystem.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b85e0ea9283a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"19d5b149ec1f\",\"_type\":\"span\",\"marks\":[],\"text\":\"Partnering with ARIA gives us the opportunity to work within a visionary, risk-tolerant framework, created by an organization with aligned values and an equally thoughtful approach to R\u0026D. We’re excited to work together to grow our counterfactual impact – and expand it to the UK.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"29dcf50dd7db\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0229f12e9644\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e4ce351d0c60\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"1a5d33b99b73\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"What you can do\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"4538dc0580de\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"83ef30bc5157\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you’re a scientist with a big idea – either based in the UK or willing to relocate in 2026 – we encourage you to start dreaming up your FRO. For inspiration, check out our list of \"},{\"_key\":\"2340795b4237\",\"_type\":\"span\",\"marks\":[\"975b98decc34\"],\"text\":\"FROs\"},{\"_key\":\"eff97c648933\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"975b98decc34\",\"_type\":\"internalLink\",\"additionalProperties\":null,\"advancedSettings\":false,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":{\"_type\":\"ecosystemListingPage\",\"actionType\":null,\"resourceCategory\":null,\"slug\":null,\"title\":null},\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f83803d8ca17\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"6f12cb9297f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"93f21abde546\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"20ad7eb73dc3\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"About Convergent Research\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h3\"},{\"_key\":\"130d5436233f\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0b5c8682f0d4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Convergent Research is a non-profit science studio best known for pioneering the Focused Research Organization (FRO). We architect pivotal infrastructure that removes bottlenecks to breakthrough scientific research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"76c640f73ff3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"345930fecbd9\",\"_type\":\"span\",\"marks\":[],\"text\":\"FROs are a new operating model for science that enables a high level of team science and systems engineering for public goods creation. Convergent secures funding and provides an operational backbone for counterfactual R\u0026D, creating space for scientists to do what they do best. FRO teams are agile, creative, and risk-tolerant as a result. They make fast progress because they start and stay focused.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c4f70f724dee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"df130cf0788c\",\"_type\":\"span\",\"marks\":[],\"text\":\"We have seven successful public projects running: E11 Bio, Cultivarium, PTI, EvE Bio, Lean FRO, Forest Neurotech, and [C] Worthy. Three more are being built, and all have been instigated since 2021.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"3d259b845b6d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4dec70af867\",\"_type\":\"span\",\"marks\":[],\"text\":\"There are dozens of major bottlenecks on our list so far. If there are 20 crucial fundamental fields of science and a few bottlenecks each that can’t be solved by the existing science establishment, that’s a public goods “market size” of about 100. Our FROs replace these bottlenecks with concrete products: tools, datasets and platforms that are accessible to the world. Our mission is to remove them all.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"dab532438989\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3c702eefe232\",\"_type\":\"span\",\"marks\":[],\"text\":\"At Convergent we discover these bottlenecks through our roadmapping process, which focuses on recurring and stubborn impediments to paradigm-shifting work. Then we assemble and fund world-class teams uniquely committed and suited to each pursuit. We give them a low operational burden, combined with a high degree of freedom to operate. Milestone management and governance are handled centrally.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"beaa3d91f755\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"81fa92f41408\",\"_type\":\"span\",\"marks\":[],\"text\":\"We work closely with colleagues in academia and venture capital, who are the ultimate users of the products we create. Our work addresses specific challenges that they are not best-suited to attack.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"21a72fec8ff2\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b51d66b6792e\",\"_type\":\"span\",\"marks\":[],\"text\":\"For more information on us and our portfolio, please visit www.convergentresearch.org\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"categories\":[{\"_createdAt\":\"2025-10-08T13:41:08Z\",\"_id\":\"b3130efc-7f89-4ac1-b07f-eb5beb97701c\",\"_rev\":\"6WtiBizt6GSRcp6LvNPsLq\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-08T13:41:13Z\",\"name\":\"Announcement\",\"slug\":{\"_type\":\"slug\",\"current\":\"announcement\"}}],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-9bfbfa8f39984d5e51be6acd9185a195c25b3e74-1444x812-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAALABQDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAACAADBv/EACMQAAIBAwMEAwAAAAAAAAAAAAIDAAEEBQcRMRIiMjdCcbH/xAAXAQADAQAAAAAAAAAAAAAAAAACAwQF/8QAGhEBAAEFAAAAAAAAAAAAAAAAAAECBDEzcf/aAAwDAQACEQMRAD8ASV7k7y3f0LxzXBv5DWkKet1sF1qPk2MeCC2DsPniMODPX72dk/ lug\":{\"_type\":\"slug\",\"current\":\"inside-the-uk-fro-founder-residency-with-aria\"},\"status\":\"public\",\"subtitle\":\"A big step forward in how we source and incubate new FRO projects\",\"title\":\"Inside the UK FRO Founder Residency with ARIA\",\"topics\":null},{\"_createdAt\":\"2025-09-08T11:12:45Z\",\"_id\":\"de03eab8-c381-4eac-99be-d5279918a89a\",\"_rev\":\"aGpldou8uDCYtULGTLOaqJ\",\"_system\":{\"base\":{\"id\":\"de03eab8-c381-4eac-99be-d5279918a89a\",\"rev\":\"DIQGglHLJ789Bk1yAh0hG8\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-08T13:49:39Z\",\"authors\":null,\"body\":[{\"_key\":\"2e8b4271b0e3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"80aaebf0a897\",\"_type\":\"span\",\"marks\":[],\"text\":\"SARS-CoV-2 circulated in human populations as an unknown respiratory disease for an \"},{\"_key\":\"3d8701d524b1\",\"_type\":\"span\",\"marks\":[\"fd2b55fc6d17\"],\"text\":\"estimated 4-8 weeks\"},{\"_key\":\"065b41c25c51\",\"_type\":\"span\",\"marks\":[],\"text\":\", undiagnosed by traditional methods like culture and PCR. Imagine if, instead, we lived in a world where the first severe cases are linked to a yet unknown novel coronavirus, and public health authorities get a chance to contain the outbreak before it develops into a devastating pandemic.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"fd2b55fc6d17\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.science.org/doi/10.1126/science.abf8003\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"9d5cd8055858\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"8bae3b951020\",\"_type\":\"span\",\"marks\":[],\"text\":\"We could live in such a world if \"},{\"_key\":\"4febdb028f84\",\"_type\":\"span\",\"marks\":[\"82ccda8569f8\"],\"text\":\"clinical metagenomic sequencing\"},{\"_key\":\"e16dffbacab8\",\"_type\":\"span\",\"marks\":[],\"text\":\" (MGS) was widely used to diagnose acute respiratory disease. However, sequencing workflows are currently prohibitively costly and labor-intensive, and MGS therefore remained confined to centralized laboratories and a few clinical pilot programs, with \"},{\"_key\":\"defd1f467103\",\"_type\":\"span\",\"marks\":[\"2f868a4d9748\"],\"text\":\"many hurdles\"},{\"_key\":\"eb9bf2a190bc\",\"_type\":\"span\",\"marks\":[],\"text\":\" to surpass before wide-scale use in a clinical setting.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"82ccda8569f8\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.nature.com/articles/s41576-019-0113-7\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"2f868a4d9748\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://erictopol.substack.com/p/a-culture-of-blood-cultures\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"545ab5a0484a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b4a4c79a6527\",\"_type\":\"span\",\"marks\":[],\"text\":\"However, sequencing technologies are diverse and nobody has given a focused shot at optimizing them as infectious disease diagnostics. In collaboration with Open Philanthropy, we partnered with experts on sequencing hardware to scan the technology landscape and answer what it would take for sequencing to become competitive with PCR as a diagnostic tool, focusing on sensitivity, time-to-answer and cost. You can read the results in our \"},{\"_key\":\"f6f621d8a202\",\"_type\":\"span\",\"marks\":[\"98db84bd09f9\"],\"text\":\"technology roadmap\"},{\"_key\":\"2f4c227124f5\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"98db84bd09f9\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://sequencing-roadmap.org/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a90e2bed1f34\",\"_type\":\"buttonBlock\",\"asset\":null,\"avatar\":null,\"buttons\":[{\"_key\":\"09e3f853119b\",\"_type\":\"button\",\"linkWithLabel\":{\"_type\":\"linkWithLabel\",\"label\":\"Download Roadmap PDF\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://sequencing-roadmap.org/roadmap.pdf\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},\"variant\":\"primary\"}],\"caption\":null,\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":null,\"muxVideo\":null},{\"_key\":\"cf19e8eef678\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0b9005240dcc\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"88afd11eaef7\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"57710970b370\",\"_type\":\"span\",\"marks\":[],\"text\":\"Abstract\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"2fba4c8c0afd\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4b2c56f4650b\",\"_type\":\"span\",\"marks\":[],\"text\":\"This technology roadmap proposes target specifications for a MGS diagnostic device to enable routine use: sensitivity comparable to polymerase chain reaction, time-to-answer under 1 hour, cost per test under $10, and a portable, affordable instrument. We estimate that throughput of 1-10 million reads per hour with modest read lengths \u003e25 base pairs and accuracy \u003e95% could robustly detect most pathogens in human respiratory samples. Existing sequencing platforms do not meet this combination of targets, so focused technology development is needed. Nanopore and single-molecule optical sequencing are highlighted as promising approaches if optimized for the proposed specifications rather than long reads and maximum accuracy. Realizing ubiquitous MGS may require push and pull incentives for innovation. A low-cost, rapid MGS diagnostic appears technically feasible and could greatly enhance pandemic preparedness.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"categories\":[{\"_createdAt\":\"2025-10-08T13:44:19Z\",\"_id\":\"46b215ba-1a6c-4b7a-a042-ec60f9813207\",\"_rev\":\"FAV00vf4xIs1yUzUzcMp5c\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-08T13:44:25Z\",\"name\":\"Roadmap\",\"slug\":{\"_type\":\"slug\",\"current\":\"roadmap\"}}],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-6262f05057b2a5c8fd01eb633a68d6bb58ceb559-750x758-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAAMBAAAAAAAAAAAAAAAAAAQGBwP/xAApEAACAQMDAwEJAAAAAAAAAAABAgMABBEFBgcSEyFhFCIjMUFRUoGR/8QAFwEAAwEAAAAAAAAAAAAAAAAAAwQFAv/EACERAAIBAwMFAAAAAAAAAAAAAAABAgQREiExkQMUM0JR/9oADAMBAAIRAxEAPwCDt/YlzcyD8T4+2KarteVLiSwCIzxr1F1Of7VnsORYL/TX9liWOR8YC+D+q53O+bCx7iR2g6yPiOxyxPrRHXdVyydtDCoIqOCvqZpcbZnSUrhj6haVYJ+VVWVgNOtWAPgscE0ppV0/i5Adil7Pgo/HtxIN0aUwI99ukj6EVO5bgSx3Eptsp3R1sM/M0pUd+RFa5ll3IxnbJNKUpxbCT3P/2Q==\"}},\"crop\":null,\"hotspot\":null},\"date\":\"2025-09-04\",\"slug\":{\"_type\":\"slug\",\"current\":\"clinical-metagenomic-sequencing-roadmap\"},\"status\":\"public\",\"subtitle\":\"W tialtechnology.blog/p/scientific-roadmapping\",\"isExternalUrl\":true,\"slug\":{\"_type\":\"slug\",\"current\":\"a-beginner-s-guide-to-scientific-roadmapping\"},\"status\":\"public\",\"subtitle\":\"Wonderful maps and how to read them\",\"title\":\"A Beginner’s Guide to Scientific Roadmapping\",\"topics\":null},{\"_createdAt\":\"2025-09-08T11:11:22Z\",\"_id\":\"72b26e39-913a-4186-a535-3230f3cf668f\",\"_rev\":\"ouiRwKup4ANFrhR4Ply0Gq\",\"_system\":{\"base\":{\"id\":\"72b26e39-913a-4186-a535-3230f3cf668f\",\"rev\":\"aGpldou8uDCYtULGTLOW9D\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-15T17:12:07Z\",\"authors\":null,\"body\":[{\"_key\":\"000300ff676a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d5c23e9a67f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Today we launched a Convergent Research substack, \"},{\"_key\":\"7dff1a7a719e\",\"_type\":\"span\",\"marks\":[\"strong\",\"24c1fbded0e4\"],\"text\":\"Essential Technology\"},{\"_key\":\"5b3f5fb22a8e\",\"_type\":\"span\",\"marks\":[],\"text\":\", because we believe scientific progress is being held back not by a lack of talent — but by missing essential technologies.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"24c1fbded0e4\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://convergentresearch.substack.com/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"535d54eeaf23\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f59be6344244\",\"_type\":\"span\",\"marks\":[],\"text\":\"Essential technologies are missing across many of the most important scientific disciplines that would unlock significant breakthroughs—tools, datasets, and platforms that empower new discovery.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"2246bf0a9f18\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b58905e772cf\",\"_type\":\"span\",\"marks\":[],\"text\":\"These are solvable bottlenecks. Consider how space telescopes, particle accelerators, and DNA sequencers reveal a deeper world to us and open new domains of discovery. What has enabled these leaps? New ways of organizing science.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"dfdf41390b9d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ad696cc19bd2\",\"_type\":\"span\",\"marks\":[],\"text\":\"University astronomy labs couldn’t have launched the Hubble Space Telescope on their own, nor would a venture-backed startup have built the Large Hadron Collider at CERN. That’s why we’re building different kind of organizations to drive outsized scientific return on investment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"38b411da3d79\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9b2a572344de\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Are you a scientist who wants to lead or join a different type of team? Are you a funder looking to accelerate science?\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"24fa8954ca46\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d33658d44a2d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"We’ll hope you’ll join us.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c3d6869872cc\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f7facf0a1634\",\"_type\":\"span\",\"marks\":[],\"text\":\"Read more about our vision for essential technology and subscribe for future perspectives from Convergent and our portfolios of FROs:\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"451f39df840b\",\"_type\":\"buttonBlock\",\"asset\":null,\"avatar\":null,\"buttons\":[{\"_key\":\"82d1a7cc6b3f\",\"_type\":\"button\",\"linkWithLabel\":{\"_type\":\"linkWithLabel\",\"label\":\"How to Build Essential Technology\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://convergentresearch.substack.com/p/how-to-build-essential-technology\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},\"variant\":\"primary\"}],\"caption\":null,\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":null,\"muxVideo\":null}],\"categories\":[\"$19:1:props:children:props:children:0:props:children:2:props:uniqueCategories:0\"],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-6c80d06aa7bc7839765df339796b31dbf34a4cf2-2448x1840-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAPABQDASIAAhEBAxEB/8QAGQAAAgMBAAAAAAAAAAAAAAAAAAgBBAYH/8QAIxAAAgEDBAIDAQAAAAAAAAAAAQIDAAQFBhESIQcUEyQyUf/EABUBAQEAAAAAAAAAAAAAAAAAAAQF/8QAHREBAAEEAwEAAAAAAAAAAAAAAQAEERIhAgMUUf/aAAwDAQACEQMRAD8AnSXivAyYSD3bR45XiHyxs37I/tczzuMtcJlrmztonht0kPBWO5Api9lt7By0rOw6VtqXnyHk4otR34cF2JA7pFOOSjCVa4AfZT+wAvrryj26IorPNqOSPZbYcIwOhRTuPchu0nea+5//2Q==\"}},\"crop\":null,\"hotspot\":null},\"date\":\"2025-02-07\",\"slug\":{\"_type\":\"slug\",\"current\":\"launching-convergent-s-substack-essential-technology\"},\"status\":\"public\",\"subtitle\":\"Today we launched a Convergent Research substack, Essential Technology, because we believe scientific progress is being held back not by a lack of talent — but by missing essential technologies.\",\"title\":\"Launching Convergent’s Substack: Essential Technology\",\"topics\":null},{\"_createdAt\":\"2025-10-15T21:21:42Z\",\"_id\":\"96af5029-4c4c-4ac7-9515-649a18653020\",\"_rev\":\"jxBWxAnb6eDtqiqpnjj2pa\",\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-15T21:22:17Z\",\"authors\":null,\"body\":null,\"categories\":[\"$19:1:props:children:props:children:0:props:children:2:props:uniqueCategories:4\"],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-9facd7023ee9d764c46b4325fcab47340eff7c65-1456x955-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAABwAGCP/EACEQAAEDBAIDAQAAAAAAAAAAAAECAwQABQYREiEHE0Ei/8QAFgEBAQEAAAAAAAAAAAAAAAAAAwEC/8QAHREBAAIABwAAAAAAAAAAAAAAAQACAxESEyExUf/aAAwDAQACEQMRAD8ACUYLfXGfYmIQSdcSdGt7hfi63qiNTMgWoP7PKOT0KUJcJuO9sFSt/D8oyyfK5kPIZsFtCPWygFJ+7NPpqGcJbPEQ4dhscVhLUaHGDY7H5FVc43TMryuc5wlrbSDoJSeqqm5XyZcJXuf/2Q==\"}},\"crop\":null,\"hotspot\":null},\"date\":\"2025-02-07\",\"externalUrl\":\"https://www.essentialtechnology.blog/p/how-to-build-essential-technology\",\"isExternalUrl\":true,\"slug\":{\"_type\":\"slug\",\"current\":\"how-to-build-essential-technology\"},\"status\":\"public\",\"subtitle\":\"A vision for accelerating R\u0026D\",\"title\":\"How to Build Essential Technology\",\"topics\":null},{\"_createdAt\":\"2025-09-08T10:55:30Z\",\"_id\":\"e65255c5-b3f1-4a7e-9ef7-b8df1bb84daa\",\"_rev\":\"jxBWxAnb6eDtqiqpnjoQ1A\",\"_system\":{\"base\":{\"id\":\"e65255c5-b3f1-4a7e-9ef7-b8df1bb84daa\",\"rev\":\"FAV00vf4xIs1yUzUzcMpkV\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-15T22:38:55Z\",\"authors\":null,\"body\":[{\"_key\":\"47f66e519094\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"685be355b08d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Light in the 200-235 nm range, or \"},{\"_key\":\"87e5962ca8b1\",\"_type\":\"span\",\"marks\":[\"0fc76fd69498\"],\"text\":\"far-UVC\"},{\"_key\":\"95248997af2e\",\"_type\":\"span\",\"marks\":[],\"text\":\", is one of the most promising tools for dramatically reducing airborne transmission from day one of almost any pandemic caused by airborne pathogens. If adopted widely, it could also have a dramatic impact on seasonal flu, colds, and endemic COVID-19.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"0fc76fd69498\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.nature.com/articles/s41598-018-21058-w\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f1c0f8f64394\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"32fda6d9d58b\",\"_type\":\"span\",\"marks\":[],\"text\":\"Unfortunately, progress on development and adoption has been much slower than one would have hoped. One bottleneck is the high cost and low efficiency of the only commercially available source at this wavelength range, 222 nm krypton chloride excimer lamps. For example, by our calculations, equipping a classroom with far-UVC would cost \u003e$10k/classroom/year in lamps alone.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8b3c7a48cdf5\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"bf85fa2a2696\",\"_type\":\"span\",\"marks\":[],\"text\":\"Last year, our roadmapping analysts \"},{\"_key\":\"c0aa0d69880a\",\"_type\":\"span\",\"marks\":[\"e380aae67542\"],\"text\":\"Jasper Götting\"},{\"_key\":\"ad8f2644bca2\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"bb40f1e65313\",\"_type\":\"span\",\"marks\":[\"0f09ea905af2\"],\"text\":\"Vivian Belenky\"},{\"_key\":\"1ab718cdd17d\",\"_type\":\"span\",\"marks\":[],\"text\":\" set out to understand what it would take to get to decrease the cost by two orders of magnitude. On June 12 and 13, 2023, they convened a workshop with top experts on solid-state UV emitters to scope out the most promising approaches in emitter development, forecast timelines with respect to relevant milestones, and list priorities for R\u0026D and broader ecosystem support. The results are summarized in the workshop report.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"e380aae67542\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.linkedin.com/in/jasper-g%C3%B6tting-792208128/)\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"0f09ea905af2\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.linkedin.com/in/j-vivian-belenky-503759165/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"1716991f4271\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b3e5da2d5622\",\"_type\":\"span\",\"marks\":[],\"text\":\"The brief technical punchline: Participants were most optimistic about \"},{\"_key\":\"a0dd1b5fa1b7\",\"_type\":\"span\",\"marks\":[\"d5e64f685250\"],\"text\":\"AlGaN\"},{\"_key\":\"8363912e7d60\",\"_type\":\"span\",\"marks\":[],\"text\":\" LEDs and \"},{\"_key\":\"d4707b624c6f\",\"_type\":\"span\",\"marks\":[\"da1debb326e9\"],\"text\":\"second-harmonic generation\"},{\"_key\":\"669504086036\",\"_type\":\"span\",\"marks\":[],\"text\":\" (SHG) with blue lasers. AlGaN LEDs benefit from an established materials platform and large research community, while SHG device developments are more uncertain but potentially faster. Cathodoluminescent devices already perform well today but are unlikely to reach the ultimate performance goals.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"d5e64f685250\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://en.wikipedia.org/wiki/Aluminium_gallium_nitride\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"da1debb326e9\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://en.wikipedia.org/wiki/Second-harmonic_generation\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a68d5eb6f5d7\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"14ff5722e010\",\"_type\":\"span\",\"marks\":[],\"text\":\"Another key take-away from the workshop is that while directly supporting solid-state far-UVC R\u0026D to accelerate availability is important, growing the far-UVC market in general and enabling greater private investment is even more critical. \"},{\"_key\":\"baf781d1a27d\",\"_type\":\"span\",\"marks\":[\"00521964e6e4\"],\"text\":\"Comprehensive safety studies\"},{\"_key\":\"ef2726c97e64\",\"_type\":\"span\",\"marks\":[],\"text\":\", real-world effectiveness trials, infrastructure technology development, public outreach and education, and support for clear, comprehensive, and sensible far-UVC standards are all needed to make ubiquitous air disinfection a reality.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"00521964e6e4\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://onlinelibrary.wiley.com/doi/full/10.1111/php.13866\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"5f415862a503\",\"_type\":\"buttonBlock\",\"asset\":null,\"avatar\":null,\"buttons\":[{\"_key\":\"436f72c4c24e\",\"_type\":\"button\",\"linkWithLabel\":{\"_type\":\"linkWithLabel\",\"label\":\"Workshop report PDF\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://cdn.sanity.io/files/mv5m7y75/production/34fbdca349bff8f7801b35d2271d9b7e3b531053.pdf\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},\"variant\":\"primary\"}],\"caption\":null,\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":null,\"muxVideo\":null},{\"_key\":\"43b2baf3edf8\",\"_type\":\"imageBlock\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"image\":{\"altText\":null,\"asset\":{\"_id\":\"image-e2f701a4210a13548ca02cc7130c25e0a54be6e8-750x500-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAMFBAj/xAAgEAACAQQCAwEAAAAAAAAAAAACAwEABAUREhMhMVFx/8QAFAEBAAAAAAAAAAAAAAAAAAAAA//EABkRAQEAAwEAAAAAAAAAAAAAAAEAAhESMv/aAAwDAQACEQMRAD8A5gQtbi4mXCftNusVdJV29ZEmfRjG4pHHRVWxGcvMWWlELFT4JTI2Mx+Upy+pseU1lRAjxRW7JuC5vWOWgECc74B6iijSJL//2Q==\"}},\"crop\":null,\"hotspot\":null},\"link\":null,\"logotype\":null,\"markDefs\":null,\"muxVideo\":null},{\"_key\":\"66646eef8118\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f445b413d4d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Report Executive Summary\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"bb18c3eadc1a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"df6f676d425c\",\"_type\":\"span\",\"marks\":[],\"text\":\"Far ultraviolet-C (far-UVC) is a promising emerging technology for air and surface disinfection as well as \"},{\"_key\":\"a4a2ac52b80b\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"in vivo \"},{\"_key\":\"222a12bdd39f\",\"_type\":\"span\",\"marks\":[],\"text\":\"inactivation of multi-drug-resistant pathogens. Currently, the only widely available far-UVC emitters are krypton-chloride excimer lamps, which lack many desired performance characteristics and scale poorly in cost. In theory, the performance and scalability of solid-state sources, like LEDs, make them ideal for all lighting applications, but uncertainties around solid-state far-UVC emission remain.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"eb4c1d833f46\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"222a12bdd39f\",\"_type\":\"span\",\"marks\":[],\"text\":\"To analyze the prospect for next-generation far-UVC sources, Convergent Research gathered representatives from academia, industry, and philanthropy to discuss development goals, approaches, and bottlenecks for solid-state far-UVC.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"1f04188bb072\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"51f73ee21a42\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Aluminum gallium nitride (AlGaN) devices\"},{\"_key\":\"d8a691d1fecb\",\"_type\":\"span\",\"marks\":[],\"text\":\"—primarily, but not exclusively, LEDs—and \"},{\"_key\":\"04eab039c80a\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"sec- ond-harmonic generation (SHG) blue laser devices \"},{\"_key\":\"9f0e33d0560c\",\"_type\":\"span\",\"marks\":[],\"text\":\"were considered the most promising approaches and were regarded as having the greatest potential to achieve the relevant target metrics. A third viable approach, \"},{\"_key\":\"046587e54f8b\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"cathodoluminescent devices\"},{\"_key\":\"f1ff38fcf956\",\"_type\":\"span\",\"marks\":[],\"text\":\", was ultimately determined to be less promising and more analogous to excimer lamps than to LEDs: a transition technology that could perform well in the short and perhaps medium term but would ultimately not be competitive with either AlGaN or SHG devices. Based on these discussions, we recommend:\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"2ba25a7556c0\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"8b0117505dc2\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Research and development priorities\"},{\"_key\":\"8415733a828c\",\"_type\":\"span\",\"marks\":[],\"text\":\": A universal priority across all approaches is in the development of far-UVC-transparent materials for p-side alloys, device encapsulants, filters, and other balance-of-system components. Another approach-agnostic priority is the development of aluminum nitride as a material platform. For any AlGaN-based approach— whether LEDs, laser diodes, or any other solid-state design—the priority is in understanding point defects, and in improving light extraction efficiency and doping. SHG device improvements—including refining blue laser diodes and their integration with nonlinear optical elements—lie along a different development path but are, in general, an R\u0026D priority due to the greater uncertainty associated with their potential.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"4fa4db9eaa2e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"2bc54d455da7\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Funding strategies: \"},{\"_key\":\"54d9cfb4b29a\",\"_type\":\"span\",\"marks\":[],\"text\":\"While allocating resources to the identified R\u0026D priorities is important, of potentially even greater importance is the funding of projects that will grow the far-UVC market and enable greater private investment into solid-state R\u0026D. These projects include comprehensive safety studies, real-world effectiveness trials, infrastructure technology development, public outreach and education, and support for clear, comprehensive, and sensible standards for far-UVC air disinfection. Identifying potential beachhead markets and considering the role of advance market commitments and prizes can stimulate demand and further R\u0026D investment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"categories\":[\"$19:1:props:children:props:children:0:props:children:2:props:uniqueCategories:3\"],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-e2f701a4210a13548ca02cc7130c25e0a54be6e8-750x500-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAMFBAj/xAAgEAACAQQCAwEAAAAAAAAAAAACAwEABAUREhMhMVFx/8QAFAEBAAAAAAAAAAAAAAAAAAAAA//EABkRAQEAAwEAAAAAAAAAAAAAAAEAAhESMv/aAAwDAQACEQMRAD8A5gQtbi4mXCftNusVdJV29ZEmfRjG4pHHRVWxGcvMWWlELFT4JTI2Mx+Upy+pseU1lRAjxRW7JuC5vWOWgECc74B6iijSJL//2Q==\"}},\"crop\":null,\"hotspot\":null},\"date\":\"2024-04-30\",\"slug\":{\"_type\":\"slug\",\"current\":\"solid-state-far-uvc-roadmapping-workshop-report\"},\"status\":\"public\",\"subtitle\":\"A workshop report on roadmap strategies for solving b cience, Technology, and Medicine\",\"topics\":null}],\"featuredPosts\":[{\"_createdAt\":\"2025-09-08T10:52:14Z\",\"_id\":\"023c7320-5596-4655-8e2f-e29acff0fd38\",\"_rev\":\"aGpldou8uDCYtULGTLYAm3\",\"_system\":{\"base\":{\"id\":\"023c7320-5596-4655-8e2f-e29acff0fd38\",\"rev\":\"FAV00vf4xIs1yUzUzcNFsG\"}},\"_type\":\"blogPost\",\"_updatedAt\":\"2025-10-08T20:06:28Z\",\"authors\":null,\"body\":[{\"_key\":\"5664bf57b176\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"65c24524cd99\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are thrilled to announce a new collaboration with the \"},{\"_key\":\"9f6e935f35c8\",\"_type\":\"span\",\"marks\":[\"6795e26ba194\"],\"text\":\"Advanced Research and Intervention Agency (ARIA)\"},{\"_key\":\"039616e29573\",\"_type\":\"span\",\"marks\":[],\"text\":\" to launch \"},{\"_key\":\"07423c6c505f\",\"_type\":\"span\",\"marks\":[\"6d263ce56013\"],\"text\":\"Focused Research Organizations\"},{\"_key\":\"7c268cf320bd\",\"_type\":\"span\",\"marks\":[],\"text\":\" (FROs) for science and technology in the UK (“FROST UK”).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"6795e26ba194\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.aria.org.uk/about-aria/\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"6d263ce56013\",\"_type\":\"internalLink\",\"additionalProperties\":null,\"advancedSettings\":false,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":{\"_type\":\"page\",\"actionType\":null,\"resourceCategory\":null,\"slug\":{\"_type\":\"slug\",\"current\":\"about-fros\"},\"title\":\"About FROs\"},\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8885a99ff785\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"89f869d3113d\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e4613abb89ef\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ebec66998a0f\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"What does this mean?\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"6a0c4df06862\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ce1f72d9f027\",\"_type\":\"span\",\"marks\":[],\"text\":\"In spring 2025, we’ll launch an open call for FRO proposals inviting visionary scientists and engineers to propose bold ideas for FROs to accelerate ARIA’s opportunity spaces. We’ll select a cohort of proposers for our inaugural Founder in Residence (FiR) program, during which they will develop their concept. Our goal is to incubate and launch at least one FRO in the UK, based on our learnings launching 10 FROs in the US over the past 3 years.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"940ca19f33bc\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"c33d3cddb006\",\"_type\":\"span\",\"marks\":[],\"text\":\"Our FiR program is intended to pilot key design elements of our FRO creation process, including how we train scientists to found a FRO. We hope to tap into the UK’s ecosystem of scientists, innovators, and engineers to galvanize transformative mid-scale systems research projects.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e2e2e56500d9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4922225c29b\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"3a5b880c4e95\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b44477f7f79d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Part of a network: ARIA’s activation partners\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"c98f000ec9cc\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"8853bc90ace8\",\"_type\":\"span\",\"marks\":[],\"text\":\"We are proud to be doing this as part of ARIA’s \"},{\"_key\":\"5f6a995958f4\",\"_type\":\"span\",\"marks\":[\"bc245127aa21\"],\"text\":\"Activation Partners\"},{\"_key\":\"0e9832384db9\",\"_type\":\"span\",\"marks\":[],\"text\":\" program, a network of organizations working to help architect scientific entrepreneurship in ARIA’s opportunity spaces.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"bc245127aa21\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.aria.org.uk/meet-our-activation-partners/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e31c76b428a1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"84c333e4edb8\",\"_type\":\"span\",\"marks\":[],\"text\":\"We will do this by working with ARIA’s Program Directors to identify bottlenecks within their opportunity spaces that could be unblocked with large-scale public goods technologies or datasets. In many ways, this will be our first time partnering with a funding agency to evaluate gaps in their areas of focus and help “create a performer” to address them. This allows us to take advantage of natural complementarity between the ARPA mechanism and the FRO mechanism we are pioneering. The FRO that is ultimately launched will be uniquely positioned to coordinate and collaborate with others in the ARIA ecosystem.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b85e0ea9283a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"19d5b149ec1f\",\"_type\":\"span\",\"marks\":[],\"text\":\"Partnering with ARIA gives us the opportunity to work within a visionary, risk-tolerant framework, created by an organization with aligned values and an equally thoughtful approach to R\u0026D. We’re excited to work together to grow our counterfactual impact – and expand it to the UK.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"29dcf50dd7db\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0229f12e9644\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e4ce351d0c60\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"1a5d33b99b73\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"What you can do\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h2\"},{\"_key\":\"4538dc0580de\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"83ef30bc5157\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you’re a scientist with a big idea – either based in the UK or willing to relocate in 2026 – we encourage you to start dreaming up your FRO. For inspiration, check out our list of \"},{\"_key\":\"2340795b4237\",\"_type\":\"span\",\"marks\":[\"975b98decc34\"],\"text\":\"FROs\"},{\"_key\":\"eff97c648933\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"975b98decc34\",\"_type\":\"internalLink\",\"additionalProperties\":null,\"advancedSettings\":false,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":{\"_type\":\"ecosystemListingPage\",\"actionType\":null,\"resourceCategory\":null,\"slug\":null,\"title\":null},\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f83803d8ca17\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"6f12cb9297f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"93f21abde546\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"20ad7eb73dc3\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"About Convergent Research\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"h3\"},{\"_key\":\"130d5436233f\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0b5c8682f0d4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Convergent Research is a non-profit science studio best known for pioneering the Focused Research Organization (FRO). We architect pivotal infrastructure that removes bottlenecks to breakthrough scientific research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"76c640f73ff3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"345930fecbd9\",\"_type\":\"span\",\"marks\":[],\"text\":\"FROs are a new operating model for science that enables a high level of team science and systems engineering for public goods creation. Convergent secures funding and provides an operational backbone for counterfactual R\u0026D, creating space for scientists to do what they do best. FRO teams are agile, creative, and risk-tolerant as a result. They make fast progress because they start and stay focused.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c4f70f724dee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"df130cf0788c\",\"_type\":\"span\",\"marks\":[],\"text\":\"We have seven successful public projects running: E11 Bio, Cultivarium, PTI, EvE Bio, Lean FRO, Forest Neurotech, and [C] Worthy. Three more are being built, and all have been instigated since 2021.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"3d259b845b6d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4dec70af867\",\"_type\":\"span\",\"marks\":[],\"text\":\"There are dozens of major bottlenecks on our list so far. If there are 20 crucial fundamental fields of science and a few bottlenecks each that can’t be solved by the existing science establishment, that’s a public goods “market size” of about 100. Our FROs replace these bottlenecks with concrete products: tools, datasets and platforms that are accessible to the world. Our mission is to remove them all.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"dab532438989\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3c702eefe232\",\"_type\":\"span\",\"marks\":[],\"text\":\"At Convergent we discover these bottlenecks through our roadmapping process, which focuses on recurring and stubborn impediments to paradigm-shifting work. Then we assemble and fund world-class teams uniquely committed and suited to each pursuit. We give them a low operational burden, combined with a high degree of freedom to operate. Milestone management and governance are handled centrally.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"beaa3d91f755\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"81fa92f41408\",\"_type\":\"span\",\"marks\":[],\"text\":\"We work closely with colleagues in academia and venture capital, who are the ultimate users of the products we create. Our work addresses specific challenges that they are not best-suited to attack.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"21a72fec8ff2\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b51d66b6792e\",\"_type\":\"span\",\"marks\":[],\"text\":\"For more information on us and our portfolio, please visit www.convergentresearch.org\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"categories\":[{\"_createdAt\":\"2025-10-08T13:41:08Z\",\"_id\":\"b3130efc-7f89-4ac1-b07f-eb5beb97701c\",\"_rev\":\"6WtiBizt6GSRcp6LvNPsLq\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-08T13:41:13Z\",\"name\":\"Announcement\",\"slug\":{\"_type\":\"slug\",\"current\":\"announcement\"}}],\"coverImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-9bfbfa8f39984d5e51be6acd9185a195c25b3e74-1444x812-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAALABQDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAACAADBv/EACMQAAIBAwMEAwAAAAAAAAAAAAIDAAEEBQcRMRI
