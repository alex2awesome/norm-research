        // SETTINGS SAVE HANDLER
        // =========================================================

        async function saveAllSettings() {
            const btn = document.getElementById('saveSettingsBtn');
            const status = document.getElementById('settingsSaveStatus');
            if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
            if (status) status.textContent = '';

            const retentionTier = document.getElementById('settingsRetentionSelect')?.value;
            const maxDownloads = parseInt(document.getElementById('settingsMaxDownloads')?.value, 10);
            const notifEnabled = document.getElementById('settingsDownloadNotif')?.checked;

            // Validate
            if (isNaN(maxDownloads) || maxDownloads < 1 || maxDownloads > 1000000000) {
                showToast('Download limit must be between 1 and 1,000,000,000.', 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'Save Settings'; }
                return;
            }

            const payload = {
                retentionTier: retentionTier,
                maxDownloadsPerFile: maxDownloads,
                downloadNotificationsEnabled: notifEnabled,
            };

            const result = await apiCall('POST', '/my-settings', payload);
            if (result) {
                appState.maxDownloadsPerFile = result.maxDownloadsPerFile ?? maxDownloads;
                appState.downloadNotificationsEnabled = result.downloadNotificationsEnabled ?? notifEnabled;
                if (result.retentionTier) appState.retentionTier = result.retentionTier;
                showToast('Settings saved.', 'success');
                if (status) status.textContent = 'Saved';
            } else {
                const errMsg = lastApiError?.error || 'Failed to save settings.';
                showToast(errMsg, 'error');
            }

            if (btn) { btn.disabled = false; btn.textContent = 'Save Settings'; }
        }

        async function updateFileDownloadCap(uploadId) {
            const input = document.getElementById(`dlcap-${uploadId}`);
            const statusEl = document.getElementById(`dlcap-status-${uploadId}`);
            if (!input) return;

            const rawVal = input.value.trim().toLowerCase();
            let payload;

            if (rawVal === '' || rawVal === 'default') {
                payload = { uploadId, maxDownloadsPerFile: 'default' };
            } else {
                const val = parseInt(rawVal, 10);
                if (isNaN(val) || val < 1 || val > 1000000000) {
                    showToast('Per-file cap must be 1–1,000,000,000, or blank for default.', 'error');
                    return;
                }
                payload = { uploadId, maxDownloadsPerFile: val };
            }

            if (statusEl) statusEl.textContent = 'Saving…';

            const result = await apiCall('POST', '/upload-settings', payload);
            if (result && result.success) {
                // Update local state
                const upload = appState.uploads.find(u => u.uploadId === uploadId);
                if (upload) {
                    upload.maxDownloadsPerFile = (rawVal === '' || rawVal === 'default') ? null : parseInt(rawVal, 10);
                }
                if (statusEl) { statusEl.textContent = 'Saved'; statusEl.className = 'text-xs text-green-400 ml-2'; }
                setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2000);
            } else {
                const errMsg = lastApiError?.error || 'Failed to update.';
                showToast(errMsg, 'error');
                if (statusEl) { statusEl.textContent = 'Error'; statusEl.className = 'text-xs text-red-400 ml-2'; }
            }
        }

        // =========================================================
        // SHARING FUNCTIONS
        // =========================================================

        function _buildShareUrl(uploadId, userId) {
            return `${window.location.origin}/#/share?userId=${encodeURIComponent(userId)}&uploadId=${uploadId}`;
        }

        function copyShareLink(uploadId, userId) {
            track('share_link_copy', { upload_id: uploadId });
            const shareUrl = _buildShareUrl(uploadId, userId);
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('Share link copied to clipboard!', 'success');
            }).catch(() => {
                // Clipboard API unavailable — show share URL in a temporary, pre-selected input
                const box = document.createElement('div');
                box.className = 'fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-sm';
                box.innerHTML = `
                    <div class="bg-gray-900 rounded-lg shadow-xl shadow-black/30 ring-1 ring-gray-800/50 p-6 max-w-md w-full mx-4" role="dialog" aria-label="Copy share link">
                        <p class="text-sm font-medium text-gray-300 mb-2">Copy your share link:</p>
                        <input id="shareLinkCopyInput" type="text" readonly value="${escapeHtml(shareUrl)}"
                               class="w-full px-3 py-2 border border-gray-700 bg-gray-800 text-gray-200 rounded text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="this.closest('.fixed').remove()" class="w-full px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 font-medium">Done</button>
                    </div>`;
                document.body.appendChild(box);
                const inp = document.getElementById('shareLinkCopyInput');
                inp.focus();
                inp.select();
            });
        }

        function emailShareLink(uploadId, userId, filename, hasAccessKey) {
            track('share_link_email', { upload_id: uploadId });
            const shareUrl = _buildShareUrl(uploadId, userId);
            const subject = encodeURIComponent(`File shared via byteshare.io: ${filename}`);
            let body = `Here's a file shared with you via byteshare.io:\n\n${filename}\n${shareUrl}`;
            if (hasAccessKey) {
                body += '\n\nNote: You will need the access key provided by the sender to download this file.';
            }
            window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;
        }

        async function nativeShare(uploadId, userId, filename) {
            const shareUrl = _buildShareUrl(uploadId, userId);
            try {
                await navigator.share({
                    title: `${filename} — byteshare.io`,
                    text: `Here's a file shared with you: ${filename}`,
                    url: shareUrl
                });
            } catch (e) {
                // User cancelled or share failed — ignore AbortError, surface others
                if (e.name !== 'AbortError') {
                    showToast('Could not share. Try copying the link instead.', 'warning');
                }
            }
        }

        // =========================================================
        // MINIMAL QR CODE GENERATOR (QR Code Model 2, ECC-L)
        // Encodes URLs up to ~150 chars as a version-6 QR code.
        // No external dependencies — keeps CSP tight.
        // =========================================================

        const QR = (() => {
            // Galois field GF(256) tables for Reed-Solomon
            const EXP = new Uint8Array(256), LOG = new Uint8Array(256);
            let x = 1;
            for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x = (x << 1) ^ (x >= 128 ? 0x11d : 0); }

            function rsMult(a, b) { return a && b ? EXP[(LOG[a] + LOG[b]) % 255] : 0; }

            function rsEncode(data, ecLen) {
                // Build generator polynomial
                const gen = new Uint8Array(ecLen + 1);
                gen[0] = 1;
                for (let i = 0; i < ecLen; i++) {
                    for (let j = ecLen; j >= 1; j--) gen[j] = gen[j - 1] ^ rsMult(gen[j], EXP[i]);
                    gen[0] = rsMult(gen[0], EXP[i]);
                }
                const msg = new Uint8Array(data.length + ecLen);
                msg.set(data);
                for (let i = 0; i < data.length; i++) {
                    const coef = msg[i];
                    if (coef) for (let j = 0; j <= ecLen; j++) msg[i + j] ^= rsMult(gen[j], coef);
                }
                return msg.slice(data.length);
            }

            // Place modules on the grid
            function createMatrix(version) {
                const size = version * 4 + 17;
                const m = Array.from({ length: size }, () => new Uint8Array(size));
                const r = Array.from({ length: size }, () => new Uint8Array(size)); // reserved mask
                // Finder patterns
                function finder(cx, cy) {
                    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
                        const x = cx + dx, y = cy + dy;
                        if (x < 0 || x >= size || y < 0 || y >= size) continue;
                        const v = Math.max(Math.abs(dx), Math.abs(dy));
                        m[y][x] = (v !== 1 && v !== 3) ? 0 : 1; // invert: dark=0 here, we'll flip later
                        m[y][x] = (v === 0 || v === 2 || v === 3) ? 1 : 0;
                        r[y][x] = 1;
                    }
                }
                finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
                // Separators
                for (let i = 0; i < 8; i++) {
                    for (const [sx, sy] of [[7, i], [i, 7], [size-8, i], [i, size-8], [7, size-1-i], [size-1-i, 7]]) {
                        if (sx >= 0 && sx < size && sy >= 0 && sy < size) { r[sy][sx] = 1; }
                    }
                }
                // Timing patterns
                for (let i = 8; i < size - 8; i++) { m[6][i] = m[i][6] = (i % 2 === 0) ? 1 : 0; r[6][i] = r[i][6] = 1; }
                // Dark module
                m[size - 8][8] = 1; r[size - 8][8] = 1;
                // Reserve format info
                for (let i = 0; i < 9; i++) { r[8][i] = 1; r[i][8] = 1; }
                for (let i = 0; i < 8; i++) { r[8][size - 1 - i] = 1; r[size - 1 - i][8] = 1; }
                // Alignment patterns for version >= 2
                if (version >= 2) {
                    const positions = alignmentPositions(version);
                    for (const cy of positions) for (const cx of positions) {
                        if (r[cy][cx]) continue; // skip if overlaps finder
                        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
                            m[cy + dy][cx + dx] = (Math.abs(dx) === 2 || Math.abs(dy) === 2 || (dx === 0 && dy === 0)) ? 1 : 0;
                            r[cy + dy][cx + dx] = 1;
                        }
                    }
                }
                // Version info for version >= 7 (not needed for our use case)
                return { m, r, size };
            }

            function alignmentPositions(version) {
                if (version === 1) return [];
                const intervals = [0, 0, 16, 18, 20, 22, 24]; // versions 1-6
                const last = version * 4 + 10;
                if (version <= 6) return [6, last];
                // For larger versions, compute alignment pattern positions
                const step = intervals[version] || Math.ceil((last - 6) / Math.ceil((last - 6) / 28));
                const positions = [6];
                for (let p = last; p > 6; p -= step) positions.unshift(p);
                positions.unshift(6);
                return [...new Set(positions)].sort((a, b) => a - b);
            }

            function placeData(matrix, bits) {
                const { m, r, size } = matrix;
                let bitIdx = 0;
                // Traverse in 2-column strips from right to left
                for (let right = size - 1; right >= 1; right -= 2) {
                    if (right === 6) right = 5; // skip timing column
                    for (let vert = 0; vert < size; vert++) {
                        for (let j = 0; j < 2; j++) {
                            const x = right - j;
                            const y = ((Math.floor((size - 1 - right) / 2)) % 2 === 0) ? (size - 1 - vert) : vert;
                            if (r[y][x]) continue;
                            if (bitIdx < bits.length) {
                                m[y][x] = bits[bitIdx] ? 1 : 0;
                            }
                            bitIdx++;
                        }
                    }
                }
            }

            function applyMask(matrix, maskId) {
                const { m, r, size } = matrix;
                const maskFns = [
                    (y, x) => (y + x) % 2 === 0,
                    (y) => y % 2 === 0,
                    (_, x) => x % 3 === 0,
                    (y, x) => (y + x) % 3 === 0,
                    (y, x) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
                    (y, x) => ((y * x) % 2 + (y * x) % 3) === 0,
                    (y, x) => ((y * x) % 2 + (y * x) % 3) % 2 === 0,
                    (y, x) => ((y + x) % 2 + (y * x) % 3) % 2 === 0,
                ];
                const fn = maskFns[maskId];
                for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                    if (!r[y][x] && fn(y, x)) m[y][x] ^= 1;
                }
            }

            function placeFormatInfo(matrix, maskId) {
                const { m, size } = matrix;
                // ECC level L = 01, mask pattern
                const formatBits = formatInfoBits(0b01, maskId);
                // Horizontal: left side then right side
                const positions = [
                    [0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]
                ];
                for (let i = 0; i < 15; i++) {
                    const [y, x] = positions[i];
                    m[y][x] = (formatBits >> (14 - i)) & 1;
                }
                // Vertical: bottom-left then top-right
                const positions2 = [
                    [8, size-1],[8, size-2],[8, size-3],[8, size-4],[8, size-5],[8, size-6],[8, size-7],[8, size-8],
                    [size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]
                ];
                for (let i = 0; i < 15; i++) {
                    const [y, x] = positions2[i];
                    m[y][x] = (formatBits >> (14 - i)) & 1;
                }
            }

            function formatInfoBits(ecLevel, mask) {
                let data = (ecLevel << 3) | mask;
                let bits = data << 10;
                // BCH(15,5) division by generator 10100110111
                for (let i = 4; i >= 0; i--) {
                    if (bits & (1 << (i + 10))) bits ^= (0b10100110111 << i);
                }
                bits = (data << 10) | bits;
                return bits ^ 0b101010000010010; // XOR mask
            }

            function penaltyScore(matrix) {
                const { m, size } = matrix;
                let score = 0;
                // Rule 1: runs of same color
                for (let y = 0; y < size; y++) {
                    let run = 1;
                    for (let x = 1; x < size; x++) {
                        if (m[y][x] === m[y][x - 1]) { run++; } else { if (run >= 5) score += run - 2; run = 1; }
                    }
                    if (run >= 5) score += run - 2;
                }
                for (let x = 0; x < size; x++) {
                    let run = 1;
                    for (let y = 1; y < size; y++) {
                        if (m[y][x] === m[y - 1][x]) { run++; } else { if (run >= 5) score += run - 2; run = 1; }
                    }
                    if (run >= 5) score += run - 2;
                }
                // Rule 3: finder-like patterns (simplified)
                // Rule 4: proportion of dark modules
                let dark = 0;
                for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) dark += m[y][x];
                const pct = dark / (size * size) * 100;
                score += Math.abs(Math.round(pct / 5) * 5 - 50) * 2;
                return score;
            }

            function encode(text) {
                // Byte-mode encoding, ECC level L
                const data = new TextEncoder().encode(text);
                const len = data.length;
                // Version table: [totalCW, ecPerBlock, numBlocks, byteCapacity]
                const VERSIONS = [
                    null,
                    { total: 26,  ecPer: 7,  blocks: 1, cap: 17  },  // V1
                    { total: 44,  ecPer: 10, blocks: 1, cap: 32  },  // V2
                    { total: 70,  ecPer: 15, blocks: 1, cap: 53  },  // V3
                    { total: 100, ecPer: 20, blocks: 1, cap: 78  },  // V4
                    { total: 134, ecPer: 26, blocks: 1, cap: 106 },  // V5
                    { total: 172, ecPer: 18, blocks: 2, cap: 134 },  // V6
                    { total: 196, ecPer: 18, blocks: 2, cap: 154 },  // V7
                ];
                const maxVersion = VERSIONS.length - 1;
                let version = 1;
                for (let v = 1; v <= maxVersion; v++) { if (len <= VERSIONS[v].cap) { version = v; break; } }
                if (len > VERSIONS[maxVersion].cap) throw new Error('Text too long for QR code (max ~154 chars)');

                const V = VERSIONS[version];
                const totalEC = V.ecPer * V.blocks;
                const dataCW = V.total - totalEC;

                // Build bit stream: mode(4) + count(8) + data + terminator + padding
                const bitStream = [];
                function pushBits(val, count) { for (let i = count - 1; i >= 0; i--) bitStream.push((val >> i) & 1); }
                pushBits(0b0100, 4); // byte mode
                pushBits(len, version >= 10 ? 16 : 8);
                for (const b of data) pushBits(b, 8);
                pushBits(0, Math.min(4, dataCW * 8 - bitStream.length)); // terminator
                while (bitStream.length % 8) bitStream.push(0); // byte-align
                const padBytes = [0xEC, 0x11];
                let padIdx = 0;
                while (bitStream.length < dataCW * 8) { pushBits(padBytes[padIdx % 2], 8); padIdx++; }

                // Convert to codeword array
                const codewords = new Uint8Array(dataCW);
                for (let i = 0; i < dataCW; i++) {
                    let byte = 0;
                    for (let b = 0; b < 8; b++) byte = (byte << 1) | bitStream[i * 8 + b];
                    codewords[i] = byte;
                }

                // Split into blocks, compute EC for each, then interleave
                const blockDataSize = Math.floor(dataCW / V.blocks);
                const dataBlocks = [];
                const ecBlocks = [];
                for (let b = 0; b < V.blocks; b++) {
                    // Last block gets any remainder codewords
                    const start = b * blockDataSize;
                    const end = (b === V.blocks - 1) ? dataCW : start + blockDataSize;
                    const block = codewords.slice(start, end);
                    dataBlocks.push(block);
                    ecBlocks.push(rsEncode(block, V.ecPer));
                }

                // Interleave data codewords across blocks, then EC codewords
                const finalBits = [];
                const maxDataLen = Math.max(...dataBlocks.map(b => b.length));
                for (let i = 0; i < maxDataLen; i++) {
                    for (const block of dataBlocks) {
                        if (i < block.length) for (let bit = 7; bit >= 0; bit--) finalBits.push((block[i] >> bit) & 1);
                    }
                }
                for (let i = 0; i < V.ecPer; i++) {
                    for (const block of ecBlocks) {
                        if (i < block.length) for (let bit = 7; bit >= 0; bit--) finalBits.push((block[i] >> bit) & 1);
                    }
                }
                // Remainder bits
                const remainderBits = version >= 2 ? 7 : 0;
                for (let i = 0; i < remainderBits; i++) finalBits.push(0);

                // Create matrix, place data, pick best mask
                const matrix = createMatrix(version);
                placeData(matrix, finalBits);

                let bestMask = 0, bestScore = Infinity;
                for (let mask = 0; mask < 8; mask++) {
                    // Deep copy matrix
                    const copy = { m: matrix.m.map(r => r.slice()), r: matrix.r.map(r => r.slice()), size: matrix.size };
                    applyMask(copy, mask);
                    placeFormatInfo(copy, mask);
                    const s = penaltyScore(copy);
                    if (s < bestScore) { bestScore = s; bestMask = mask; }
                }
                applyMask(matrix, bestMask);
                placeFormatInfo(matrix, bestMask);

                return { modules: matrix.m, size: matrix.size };
            }

            function toCanvas(qr, pixelSize = 8) {
                const quiet = 4; // quiet zone
                const totalSize = (qr.size + quiet * 2) * pixelSize;
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = totalSize;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, totalSize, totalSize);
                ctx.fillStyle = '#000000';
                for (let y = 0; y < qr.size; y++) {
                    for (let x = 0; x < qr.size; x++) {
                        if (qr.modules[y][x]) {
                            ctx.fillRect((x + quiet) * pixelSize, (y + quiet) * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
                return canvas;
            }

            return { encode, toCanvas };
        })();

        function showQrCode(btnEl, uploadId, userId) {
            // Close any existing QR popover
            document.querySelectorAll('.qr-popover').forEach(el => el.remove());

            const shareUrl = _buildShareUrl(uploadId, userId);
            const container = btnEl.closest('.relative') || btnEl.parentElement;

            try {
                const qr = QR.encode(shareUrl);
                const canvas = QR.toCanvas(qr, 6);

                const popover = document.createElement('div');
                popover.className = 'qr-popover';
                popover.setAttribute('role', 'dialog');
                popover.setAttribute('aria-label', 'QR code for share link');
                popover.innerHTML = `
                    <p class="text-xs font-medium text-gray-300 mb-2">Scan to download</p>
                `;
                popover.insertBefore(canvas, popover.firstChild.nextSibling);
                const downloadBtn = document.createElement('a');
                downloadBtn.href = canvas.toDataURL('image/png');
                downloadBtn.download = 'byteshare-qr.png';
                downloadBtn.className = 'text-xs text-indigo-600 hover:text-indigo-800 font-medium';
                downloadBtn.textContent = 'Save QR image';
                popover.appendChild(downloadBtn);

                container.appendChild(popover);

                // Close on outside click or Escape
                function close(e) {
                    if (e.type === 'keydown' && e.key !== 'Escape') return;
                    if (e.type === 'click' && popover.contains(e.target)) return;
                    popover.remove();
                    document.removeEventListener('click', close, true);
                    document.removeEventListener('keydown', close, true);
                }
                // Delay attaching so this click doesn't immediately close it
                setTimeout(() => {
                    document.addEventListener('click', close, true);
                    document.addEventListener('keydown', close, true);
                }, 10);
            } catch (err) {
                showToast('Could not generate QR code.', 'error');
            }
        }

        async function startDeposit() {
            try {
                // --- Analytics: deposit checkout initiated ---
                track('deposit_start');

                const result = await apiCall('POST', '/billing/create-deposit', {});
                if (result && result.checkout_url) {
                    track('deposit_redirect', { checkout_url: result.checkout_url });
                    window.location.href = result.checkout_url;
                } else {
                    const errMsg = lastApiError?.error || 'Could not start deposit process. Please try again.';
                    showToast(errMsg, 'error');

                showToast('Error starting deposit. Please try again.', 'error');

        let selectedFile = null;
        let currentUploadXHR = null;  // Held so cancelUpload() can abort it
        let currentMultipartAbort = null;  // Abort handle for multipart uploads ({ abort() })

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;
            // Show file preview
            const previewArea = document.getElementById('filePreviewArea');
            if (previewArea) {
                document.getElementById('filePreviewName').textContent = file.name;
                document.getElementById('filePreviewSize').textContent = formatBytes(file.size);
                previewArea.classList.remove('hidden');
            }
        }

        function cancelUpload() {
            // Immediately kill the UI — don't wait for async cleanup
            _setUploadProgress(null);
            showToast('Upload cancelled.', 'info');
            const uploadBtn = document.getElementById('uploadBtn');
            if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.textContent = 'Upload'; }

            // Abort in-flight XHRs (kills TCP connections instantly)
            if (currentUploadXHR) {
                currentUploadXHR.abort();
                currentUploadXHR = null;
            }
            if (currentMultipartAbort) {
                currentMultipartAbort.abort();
                currentMultipartAbort = null;
            }
        }

        // Upload speed / ETA tracking state
        let _uploadStartTime = 0;
        let _uploadLastLoaded = 0;
        let _uploadLastTime = 0;
        let _uploadPartInfo = null;  // { current, total } for multipart context

        function _setUploadProgress(pct, loadedBytes, totalBytes) {
            const area   = document.getElementById('uploadProgressArea');
            const bar    = document.getElementById('uploadProgressBar');
            const lbl    = document.getElementById('uploadProgressLabel');
            const detail = document.getElementById('uploadProgressDetail');
            const extra  = document.getElementById('uploadProgressExtra');
            const fname  = document.getElementById('uploadFileName');
            if (!area) return;

            if (pct === null) {
                // Hide & reset
                area.classList.add('hidden');
                if (bar) { bar.style.width = '0%'; bar.classList.remove('bg-green-500'); bar.classList.add('bg-indigo-600', 'progress-bar-active'); }
                if (detail) detail.textContent = '';
                if (extra) extra.textContent = '';
                if (fname) fname.textContent = '';
                area.setAttribute('aria-valuenow', '0');
                _uploadStartTime = 0;
                _uploadPartInfo = null;
                return;
            }

            if (pct === 0) { _uploadStartTime = Date.now(); _uploadLastLoaded = 0; _uploadLastTime = Date.now(); }

            area.classList.remove('hidden');
            if (bar) bar.style.width = `${pct}%`;
            area.setAttribute('aria-valuenow', String(pct));

            // Show file name
            if (fname && selectedFile) {
                fname.textContent = selectedFile.name;
            }

            // Compute speed, ETA, elapsed
            const now = Date.now();
            let speedText = '';
            let extraText = '';
            if (_uploadStartTime && loadedBytes && totalBytes && pct > 0 && pct < 100) {
                const elapsedSec = (now - _uploadStartTime) / 1000;

                // Elapsed time display
                const eMins = Math.floor(elapsedSec / 60);
                const eSecs = Math.round(elapsedSec % 60);
                const elapsedStr = eMins > 0 ? `${eMins}m ${eSecs}s` : `${eSecs}s`;

                // Bytes transferred
                extraText = `${formatBytes(loadedBytes)} / ${formatBytes(totalBytes)}`;
                if (elapsedSec > 0.3) extraText += ` · ${elapsedStr} elapsed`;

                // Part info for multipart
                if (_uploadPartInfo && _uploadPartInfo.total > 1) {
                    extraText += ` · Part ${_uploadPartInfo.current}/${_uploadPartInfo.total}`;
                }

                if (elapsedSec > 0.5) {
                    const speed = loadedBytes / elapsedSec;  // bytes/sec
                    const remaining = totalBytes - loadedBytes;
                    const etaSec = remaining / speed;
                    speedText = `${formatBytes(Math.round(speed))}/s`;
                    if (etaSec < 3600) {
                        const mins = Math.floor(etaSec / 60);
                        const secs = Math.round(etaSec % 60);
                        speedText += mins > 0 ? ` — about ${mins}m ${secs}s left` : ` — about ${secs}s left`;
                    }
                }
            }

            if (lbl) lbl.textContent = pct >= 100 ? 'Upload complete!' : `Uploading… ${pct}%`;
            if (detail) detail.textContent = pct >= 100 ? `${formatBytes(totalBytes || 0)} uploaded` : speedText;
            if (extra) extra.textContent = pct >= 100 ? '' : extraText;

            // Completion styling
            if (pct >= 100 && bar) {
                bar.classList.remove('bg-indigo-600', 'progress-bar-active');
                bar.classList.add('bg-green-500');
            }
        }

        // Multipart upload threshold: 10 MB.  Files larger than this use
        // S3 multipart upload with per-part presigned URLs for parallel,
        // resumable large-file transfers.  Lower threshold = more files
        // benefit from parallel upload streams.
        const MULTIPART_THRESHOLD = 10 * 1024 * 1024;

        async function uploadFile() {
            if (!selectedFile) {
                showToast('Please select a file first.', 'warning');
                return;
            }

            const retentionEl = document.getElementById('retentionSelect');
            const retention = retentionEl ? retentionEl.value : '7d';
            const uploadBtn = document.getElementById('uploadBtn');
            const originalText = uploadBtn ? uploadBtn.textContent.trim() : 'Upload';
            if (uploadBtn) { uploadBtn.disabled = true; uploadBtn.textContent = 'Preparing…'; }

            try {
                let token = getIdToken();
                if (!token || isTokenExpired(token)) {
                    const refreshed = await refreshTokens();
                    if (!refreshed) {
                        showToast('Session expired — please sign in again.', 'error');
                        return;
                    }
                    token = getIdToken();
                }

                const accessKeyInput = document.getElementById('accessKeyInput');
                const accessKey = accessKeyInput ? accessKeyInput.value.trim() : '';

                track('upload_start', {
                    file_size: selectedFile.size,
                    file_type: selectedFile.type || 'unknown',
                    retention_tier: retention,
                    has_access_key: accessKey !== '',
                    multipart: selectedFile.size > MULTIPART_THRESHOLD
                });

                // Branch: multipart for large files, single PUT for small files
                if (selectedFile.size > MULTIPART_THRESHOLD) {
                    await _doMultipartUpload(token, retention, accessKey, uploadBtn);
                } else {
                    await _doSingleUpload(token, retention, accessKey, uploadBtn);
                }
            } catch (e) {
                _setUploadProgress(null);
                showToast('Upload failed. Please check your connection and try again.', 'error');
            } finally {
                currentUploadXHR = null;
                currentMultipartAbort = null;
                if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.textContent = originalText; }
            }
        }

        /** Single presigned PUT upload (files ≤ 10 MB) — small-file fast path */
        async function _doSingleUpload(token, retention, accessKey, uploadBtn) {
            const urlResponse = await fetch(CONFIG.API_URL + '/get-upload-url', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: selectedFile.name,
                    content_type: selectedFile.type || 'application/octet-stream',
                    file_size: selectedFile.size,
                    retention_tier: retention,
                    access_key: accessKey
                })
            });

            const urlData = await urlResponse.json();
            if (_handleUploadErrors(urlResponse, urlData)) return;

            if (!urlResponse.ok || !urlData.upload_url) {
                showToast(urlData.error || 'Failed to get upload URL. Please try again.', 'error');
                return;
            }

            if (uploadBtn) uploadBtn.textContent = 'Uploading…';
            _setUploadProgress(0);

            const uploadSuccess = await new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                currentUploadXHR = xhr;

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        _setUploadProgress(Math.round((e.loaded / e.total) * 100), e.loaded, e.total);
                    }
                });

                xhr.addEventListener('load', () => { currentUploadXHR = null; resolve(xhr.status >= 200 && xhr.status < 300); });
                xhr.addEventListener('error', () => { currentUploadXHR = null; resolve(false); });
                xhr.addEventListener('abort', () => { currentUploadXHR = null; resolve(null); });

                xhr.open('PUT', urlData.upload_url);
                xhr.setRequestHeader('Content-Type', urlData.content_type || selectedFile.type || 'application/octet-stream');
                xhr.send(selectedFile);
            });

            if (uploadSuccess) {
                _setUploadProgress(100, selectedFile.size, selectedFile.size);
                await new Promise(r => setTimeout(r, 800));
            }
            _setUploadProgress(null);

            if (uploadSuccess === null) { return; }  // UI already cleared by cancelUpload()

            if (uploadSuccess) {
                _onUploadSuccess(urlData, retention);
            } else {
                track('upload_error', { file_size: selectedFile.size, retention_tier: retention, error: 'storage_put_failed' });
                showToast('Upload to storage failed. Please try again.', 'error');
            }
        }

        /** Adaptive part sizing: scales part size with file size to stay well under S3's 10,000-part limit.
         *  Small files get 10 MB parts (good granularity), large files get bigger parts (fewer round-trips). */
        function _calcPartSize(fileSize) {
            const MIN_PART = 10 * 1024 * 1024;    // 10 MB floor
            const MAX_PART = 500 * 1024 * 1024;    // 500 MB ceiling (S3 max)
            const targetParts = appState.uploadTargetParts || 1000;
            const size = Math.ceil(fileSize / targetParts);
            return Math.max(MIN_PART, Math.min(size, MAX_PART));
        }

        /** Multipart upload (files > 10 MB) — presigned URL per part with parallel upload */
        async function _doMultipartUpload(token, retention, accessKey, uploadBtn) {
            const PART_SIZE = _calcPartSize(selectedFile.size);
            // Dynamic concurrency: bump to higher value for large files (> 50 GB)
            const LARGE_FILE_THRESHOLD = 50 * 1024 * 1024 * 1024;  // 50 GB
            const baseConcurrency = appState.uploadConcurrency || 8;
            const largeConcurrency = appState.uploadLargeFileConcurrency || 12;
            const MAX_CONCURRENT = selectedFile.size > LARGE_FILE_THRESHOLD ? largeConcurrency : baseConcurrency;

            // Step 1: Initiate multipart upload
            const initResponse = await fetch(CONFIG.API_URL + '/initiate-multipart-upload', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: selectedFile.name,
                    content_type: selectedFile.type || 'application/octet-stream',
                    file_size: selectedFile.size,
                    retention_tier: retention,
                    access_key: accessKey,
                    part_size: PART_SIZE
                })
            });

            const initData = await initResponse.json();
            if (_handleUploadErrors(initResponse, initData)) return;

            if (!initResponse.ok || !initData.part_urls) {
                showToast(initData.error || 'Failed to initiate upload. Please try again.', 'error');
                return;
            }

            if (uploadBtn) uploadBtn.textContent = 'Uploading…';
            _setUploadProgress(0);

            const completedParts = [];
            let aborted = false;

            // Step 2: Upload each part via XHR (with concurrency limit and per-part progress)
            const partQueue = [...initData.part_urls];
            const fileSize = selectedFile.size;
            const partSize = initData.part_size || PART_SIZE;
            const totalParts = partQueue.length;

            // Track per-part loaded bytes for smooth progress across concurrent uploads
            const partLoaded = new Array(totalParts).fill(0);
            let completedBytes = 0;  // bytes from fully completed parts
            let partsCompleted = 0;  // incremented inside XHR load for live part counter
            const activeXHRs = [];   // track XHRs for abort

            // Abort handler: replaces AbortController for XHR-based uploads
            currentMultipartAbort = {
                abort() {
                    aborted = true;
                    activeXHRs.forEach(xhr => { try { xhr.abort(); } catch(_){} });
                }
            };

            function _updateMultipartProgress() {
                // Sum completed bytes + in-flight per-part loaded bytes
                const inFlightLoaded = partLoaded.reduce((s, v) => s + v, 0);
                const totalLoaded = completedBytes + inFlightLoaded;
                const pct = Math.min(Math.round((totalLoaded / fileSize) * 100), 99);

                // Determine which part is furthest along for the part indicator
                let maxPartIdx = 0;
                for (let i = 1; i < partLoaded.length; i++) {
                    if (partLoaded[i] > partLoaded[maxPartIdx]) maxPartIdx = i;
                }
                _uploadPartInfo = { current: Math.min(partsCompleted + 1, totalParts), total: totalParts };

                _setUploadProgress(pct, totalLoaded, fileSize);
            }

            async function uploadPart(partInfo) {
                if (aborted) return null;
                const { partNumber, url } = partInfo;
                const partIdx = partNumber - 1;
                const start = partIdx * partSize;
                const end = Math.min(start + partSize, fileSize);
                const blob = selectedFile.slice(start, end);
                const blobSize = end - start;

                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    activeXHRs.push(xhr);

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            partLoaded[partIdx] = e.loaded;
                            _updateMultipartProgress();
                        }
                    });

                    xhr.addEventListener('load', () => {
                        // Remove from active list
                        const i = activeXHRs.indexOf(xhr);
                        if (i !== -1) activeXHRs.splice(i, 1);

                        if (xhr.status >= 200 && xhr.status < 300) {
                            const etag = xhr.getResponseHeader('ETag');
                            // Move this part's bytes from in-flight to completed
                            partLoaded[partIdx] = 0;
                            completedBytes += blobSize;
                            partsCompleted++;
                            _updateMultipartProgress();
                            resolve({ partNumber, etag });
                        } else {
                            reject(new Error(`Part ${partNumber} failed: ${xhr.status}`));
                        }
                    });

                    xhr.addEventListener('error', () => {
                        const i = activeXHRs.indexOf(xhr);
                        if (i !== -1) activeXHRs.splice(i, 1);
                        reject(new Error(`Part ${partNumber} network error`));
                    });

                    xhr.addEventListener('abort', () => {
                        const i = activeXHRs.indexOf(xhr);
                        if (i !== -1) activeXHRs.splice(i, 1);
                        aborted = true;
                        resolve(null);
                    });

                    xhr.open('PUT', url);
                    xhr.send(blob);
                });
            }

            try {
                // Rolling-window concurrency: start a new part as soon as any slot frees up.
                // This keeps MAX_CONCURRENT uploads in flight at all times, eliminating the
                // stall that batch-wait causes when one slow part holds up the entire batch.
                let nextIdx = 0;
                let inFlight = 0;
                let uploadError = null;

                await new Promise((resolveAll, rejectAll) => {
                    function checkDone() {
                        if (aborted && inFlight === 0) { resolveAll(); return true; }
                        if (nextIdx >= partQueue.length && inFlight === 0 && !uploadError) { resolveAll(); return true; }
                        return false;
                    }
                    function launchNext() {
                        if (checkDone()) return;
                        while (inFlight < MAX_CONCURRENT && nextIdx < partQueue.length && !aborted && !uploadError) {
                            const part = partQueue[nextIdx++];
                            inFlight++;
                            uploadPart(part).then(result => {
                                inFlight--;
                                if (result) completedParts.push(result);
                                if (uploadError) return;
                                if (!checkDone()) launchNext();
                            }).catch(err => {
                                inFlight--;
                                uploadError = err;
                                rejectAll(err);
                            });
                        }
                        checkDone();
                    }
                    launchNext();
                });
            } catch (partErr) {
                // Abort the multipart upload on S3
                try {
                    await fetch(CONFIG.API_URL + '/abort-multipart-upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            upload_id: initData.upload_id,
                            s3_upload_id: initData.s3_upload_id,
                            s3_key: initData.s3_key
                        })
                    });
                } catch (_) {}
                _setUploadProgress(null);
                showToast('Upload failed on part ' + (completedParts.length + 1) + '. Please try again.', 'error');
                return;
            }

            if (aborted) {
                // User cancelled — UI already cleared by cancelUpload(), just clean up S3
                try {
                    await fetch(CONFIG.API_URL + '/abort-multipart-upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            upload_id: initData.upload_id,
                            s3_upload_id: initData.s3_upload_id,
                            s3_key: initData.s3_key
                        })
                    });
                } catch (_) {}
                return;
            }

            // Step 3: Complete the multipart upload
            if (uploadBtn) uploadBtn.textContent = 'Finalizing…';

            const completeResponse = await fetch(CONFIG.API_URL + '/complete-multipart-upload', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    upload_id: initData.upload_id,
                    s3_upload_id: initData.s3_upload_id,
                    s3_key: initData.s3_key,
                    parts: completedParts
                })
            });

            const completeData = await completeResponse.json();
            if (!completeResponse.ok) {
                _setUploadProgress(null);
                showToast(completeData.error || 'Failed to finalize upload.', 'error');
                return;
            }

            _setUploadProgress(100, fileSize, fileSize);
            await new Promise(r => setTimeout(r, 800));
            _setUploadProgress(null);

            _onUploadSuccess(initData, retention);
        }

        /** Handle common upload error responses (402, 413, 429, 403) */
        function _handleUploadErrors(response, data) {
            if (response.status === 402) {
                showToast(data.error || 'A deposit is required to upload.', 'warning');
                if (window.confirm(`${data.error}\n\nWould you like to make a deposit now?`)) {
                    startDeposit();
                }
                return true;
            }
            if (response.status === 413) {
                if (data.depositRequired) {
                    if (window.confirm(`${data.error}\n\nWould you like to deposit and unlock full uploads?`)) {
                        startDeposit();
                    }
                } else {
                    showToast(data.error || 'File is too large.', 'error');
                }
                return true;
            }
            if (response.status === 429) {
                showToast(data.error || 'Too many uploads. Please wait and try again.', 'warning');
                return true;
            }
            if (response.status === 403 && data.emailVerificationRequired) {
                showToast('Please verify your email address before uploading. Check your inbox.', 'warning');
                return true;
            }
            return false;
        }

        /** Success handler shared between single and multipart upload paths */
        async function _onUploadSuccess(urlData, retention) {
            track('upload_complete', {
                file_size: selectedFile.size,
                file_type: selectedFile.type || 'unknown',
                retention_tier: retention,
                is_free_upload: !!urlData.isFreeUpload
            });

            selectedFile = null;
            const fileInput = document.getElementById('fileInput');
            if (fileInput) fileInput.value = '';
            const previewArea = document.getElementById('filePreviewArea');
            if (previewArea) previewArea.classList.add('hidden');

            await loadUserData();
            renderApp();

            if (urlData.isFreeUpload) {
                showToast(`Free sample uploaded! Available for ${urlData.sampleRetentionDays || 7} days.`, 'success');
            } else {
                showToast(`Uploaded! Stored for ${TIERS[retention]?.label || retention}.`, 'success');
            }

            // The S3 event handler activates the upload (pending → active)
            // asynchronously. Poll until the record is active so the user
            // sees the status transition without a manual refresh.
            _pollUploadActivation(urlData.upload_id);
        }

        /**
         * Poll /my-uploads until the given upload reaches 'active' status.
         * Runs in the background — does not block the UI.
         */
        async function _pollUploadActivation(uploadId) {
            const MAX_POLLS = 10;
            const POLL_MS = 2000;

            for (let i = 0; i < MAX_POLLS; i++) {
                await new Promise(r => setTimeout(r, POLL_MS));
                const uploadsData = await apiCall('GET', '/my-uploads');
                if (uploadsData) {
                    appState.uploads = uploadsData.uploads || [];
                    const target = appState.uploads.find(u => u.uploadId === uploadId);
                    if (target && target.status === 'active') {
                        renderApp();
                        return;
                    }
                    // Re-render to update any other status changes
                    renderApp();
                }
            }
        }

        // =========================================================
        // APP RENDERING
        // =========================================================

        function renderApp() {
            const route = getRoute();
            const app = document.getElementById('app');

            // --- Analytics: SPA page-view on every route change ---
            const routeNames = {
                '#/login': 'Login',
                '#/dashboard': 'Dashboard',
                '#/settings': 'Settings',
                '#/share': 'Share / Download'
            };
            trackPageView(route, routeNames[route] || route);

            if (route === '#/login') {
                app.innerHTML = renderLoginView();
            } else if (route !== '#/share' && needsReConsent()) {
                // Block all authenticated views until user accepts current legal terms
                app.innerHTML = renderReConsentView();
            } else if (route === '#/dashboard') {
                app.innerHTML = renderDashboardView();
                // Set up dropzone
                const dropzone = document.getElementById('dropzone');
                if (dropzone) {
                    // Click to open file picker
                    dropzone.addEventListener('click', () => {
                        document.getElementById('fileInput').click();
                    });
                    // Keyboard: Enter or Space triggers file picker (WCAG 2.1 §2.1.1)
                    dropzone.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            document.getElementById('fileInput').click();
                        }
                    });
                    // Drag-and-drop
                    dropzone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        dropzone.classList.add('border-indigo-500', 'bg-indigo-50');
                    });
                    dropzone.addEventListener('dragleave', () => {
                        dropzone.classList.remove('border-indigo-500', 'bg-indigo-50');
                    });
                    dropzone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        dropzone.classList.remove('border-indigo-500', 'bg-indigo-50');
                        const files = e.dataTransfer.files;
                        if (files.length > 0) {
                            selectedFile = files[0];
                            // Sync preview
                            const previewArea = document.getElementById('filePreviewArea');
                            if (previewArea) {
                                document.getElementById('filePreviewName').textContent = files[0].name;
                                document.getElementById('filePreviewSize').textContent = formatBytes(files[0].size);
                                previewArea.classList.remove('hidden');
                            }
                        }
                    });
                    // Paste from clipboard (e.g. screenshots)
                    document.addEventListener('paste', (e) => {
                        const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
                        if (!items) return;
                        for (const item of items) {
                            if (item.kind === 'file') {
                                const file = item.getAsFile();
                                if (file) {
                                    selectedFile = file;
                                    const previewArea = document.getElementById('filePreviewArea');
                                    if (previewArea) {
                                        document.getElementById('filePreviewName').textContent = file.name || 'pasted-file';
                                        document.getElementById('filePreviewSize').textContent = formatBytes(file.size);
                                        previewArea.classList.remove('hidden');
                                    }
                                    showToast(`File "${file.name || 'pasted file'}" ready to upload.`, 'info');
                                }
                                break;
                            }
                        }
                    }, { once: false });
                }
            } else if (route === '#/settings') {
                app.innerHTML = renderSettingsView();
            } else if (route === '#/share') {
                app.innerHTML = renderShareView();
                loadSharePage();
            }
        }

        // =========================================================
        // INITIALIZATION
        // =========================================================

        async function init() {
            // First check for OAuth callback
            await handleOAuthCallback();

            // Then load user data if authenticated
            const idToken = getIdToken();
            if (idToken && !isTokenExpired(idToken)) {
                await loadUserData();
            }

            // Finally render the app
            renderApp();

            // If returning from a successful deposit, poll until the
            // Stripe webhook has confirmed the deposit in DynamoDB.
            // This runs after the initial render so the user sees the
            // "Verifying your deposit..." state immediately.
            if (idToken && !isTokenExpired(idToken)) {
                await waitForDepositConfirmation();
            }

            // Set up hash change listener
            window.addEventListener('hashchange', async () => {
                const idToken = getIdToken();
                if (idToken && !isTokenExpired(idToken)) {
                    await loadUserData();
                }
                renderApp();
            });
        }

        // Start the app when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
