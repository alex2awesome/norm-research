g field communication technologies. Their projects include: ASAP – Affordable Stationary Aerial Platform – an inexpensive aerostat for wireless repeaters, Three2Link – Mobile software for logging and information sharing in the field, and FirstKit – A systems integration platform oriented towards field communications.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"94b2891762b1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b3acb14079a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is also on the Board of Directors of Humanity+. Humanity+ is an international nonprofit membership organization which advocates the ethical use of technology to expand human capacities. They support the development of, and access to, new technologies that enable everyone to enjoy better minds, better bodies, and better lives. In other words, they want people to be better than well.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"556210b1244c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"44b563584471\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd has worked as a consultant for Suspended Animation and as a Field Team Member for the Alcor Life Extension Foundation. He was also a volunteer for the Methuselah Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8b940bc24cda\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"221ac63a7365\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd earned his Master’s in Computational Biosciences at Arizona State University and his Bachelor’s in Neuroscience at the California State University at Long Beach. He earned his Graduate Certificate in \"children\":[{\"_key\":\"6fb2eb727ae0\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is particularly interested in problems at the intersection of biology, hardware, and software. His background training includes electrical engineering, signal processing, synthetic and systems biology (PhD with Jim Collins), and genetics (Research Fellow with George Church).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"7a845e345733\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"c353ee4e9248\",\"_type\":\"span\",\"marks\":[],\"text\":\"Henry loves robots and he used to have a robotic dog, named Rocky.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Henry Lee\",\"role\":\"Chief Executive Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"henry-lee\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T20:19:43Z\",\"_id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"_rev\":\"XAQEqtwWGfwaiZX4sU30FL\",\"_system\":{\"base\":{\"id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"rev\":\"oc16HVx9EGsWFJ5XEE3Q1y\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:25:39Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-23fc469e39a8dcf1cda1863c2d502e56187e6916-750x750-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAcBAwQF/8QAIxAAAQQBAwQDAAAAAAAAAAAAAQACAwQRBhIhBQciMSNxkf/EABUBAQEAAAAAAAAAAAAAAAAAAAQF/8QAGxEAAwADAQEAAAAAAAAAAAAAAAECAwQRMzH/2gAMAwEAAhEDEQA/AI3HBLPNFVqtLrEx2sAXvdf0P1TTdCK7csMljfjewe25W3tw2rLraqy36dG4R848lRe7Da9TSduS21+8gMj5/EHJlpWpQ3DrzWJ2yLPjGUWY3fGzPvaESugjt0sN+p+kk5yJ k\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A predictive and standardized high-throughput culturing platform for reproducibly growing diverse and difficult-to-culture microbes in the lab. This allows laboratory study of these microbes and accelerates their use in basic science and industrial applications.\",\"title\":\"Microbial Cultivation at Scale\"},{\"_key\":\"2e102a1b820e\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Robotic systems to discover and optimize recombinant DNA delivery methods with a library of molecular parts (promoters, replicons, transposons, resistance markers) that can be combinatorially screened in a single experiment. This enables genetic engineering of non-model microbes in weeks rather than years.\",\"title\":\"Cross-species Genetic Toolkit\"},{\"_key\":\"ba8e9878e6e4\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A digital resource that indexes experimentally actionable information (i.e. strain availability, images, protocols, and molecular parts) for 170,000+ bacteria, fungi, archaea, and protists into one accessible portal. This platform accelerates the engineering of non-model organisms by aggregating both information from disparate databases and practical experimental techniques into actionable insights.\",\"title\":\"Microbe Information Hub\"} ":\"XAQEqtwWGfwaiZX4sTziDf\",\"_system\":{\"base\":{\"id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"rev\":\"XaKwKV7EhP4jfpF6WLRtTZ\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:24Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-1b2910fa64fd6097a12dfae4104cd79760af3ec1-3840x2560-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhEDEQA/AN2WwyLJdkPs+pGiOjAQ0fn4Bp7lWC4mMuRq462UblG/uPH3SFGu8vKApzbKwv8AarXJbk5aeOMvtJ3OqTgnHZFZr01O22BpHSNTHY70lakwlgA4xsKK4Lg7tMdXqAVncgHHZopeacJmT//Z\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"4730008cc6b9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"5eb54b027ef2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nikolai Slavov received undergraduate education from MIT and a doctoral degree from Princeton University for characterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:12:56Z\",\"_id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"_rev\":\"oc16HVx9EGsWFJ5XERLlDu\",\"_system\":{\"base\":{\"id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"rev\":\"XAQEqtwWGfwaiZX4sEyV9T\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:37Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-47a37bbd2787730040c98e8f81d364f7c3aed49d-3840x5120-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAbABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAUGBwL/xAAmEAABAwQBAwQDAAAAAAAAAAABAgMEAAUREgYHEyEiMTNRYXGB/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgMBBAUG/8QAIREAAgEDAwUAAAAAAAAAAAAAAQIAAxESEyFRBRQxQaH/2gAMAwEAAhEDEQA/AHVquthuscSIdskoKvIVpTdpmH8gbdOw9ScGlUK6RLfFQhlotstpJOwxg0hb6gw0zu26l3RJ9K0exrll6fm5IB2koAzbm0YSbK3IdLjDS20HxrsaKYx+Q3N5pLkOLGdZPsv7oq127e2+Q835klyyUgWWc4Fjuak4/FZVY23bhPajRZLJK1eN1Y1/dV/IFqVaJ2xJwmp/o5Hae5VJLraVlLJI2GcVpqTTQtBoJqMF5mjcfcu9ntwhuSmV6KOFIwoEH6NFdRUpS1qkAAEgD+0UpqhvG6V/Bn//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"f24b58a6c7c3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"7a018dbe9bcb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison is a Co-Founder at Parallel Squared Technology Institute, where he fosters the Institute’s ability to stay on the cutting edge of proteomics research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0cf82772ceb1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3803f77091ef\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison has been around mass spectrometers daily since 2013, happily using them to explore biology in everything from the marine environment (Ask him about tarballs!) to human disease.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f7f2ac388aea\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"40e9b6decad9\",\"_type\":\"span\",\"marks\":[],\"text\":\"After diving into the world of proteomics at the Broad Institute’s Proteomics Platform, he pursued new frontiers with Professor Nikolai Slavov at Northeastern University, where he earned a PhD in bioengineering. His doctoral work on accessible and high throughput single cell proteomics helped convince a skeptical field that single cell proteomics using mass spectrometers was robust and adoptable with common equipment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ed24a86fa072\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"73becd0a961b\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is passionate about mountain biking, nature photography, and learning to play more than one cool song on the guitar.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Harrison Specht\",\"role\":\"Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"harrison-specht\"},\"status\":\"public\"}],\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-5053da2bcef4b27ee429f044e9bf49c749a3df7a-247x60-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAFCAYAAABFA8wzAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsElEQVR4nE3QTUvCYRAE8N+lsuwk9GaWZiS9EGEnkSjool9A8RAKUtD3/wQysH/wMOzOzD7PLgO/+CtsMccVjtEunKCFoz00/mmhmbXADJ/4wgdu0MUdhlXDL3GOC/Rxj4dC+sxaYlLiCO/o4RqPeMZT+fn4thbGe8VL9UHmrDAt4w3juqBTj/PJoC7KksSRK7M0erRcnhrNPzZY4wffOMPBXk7JMAhvskwNT39YvLUDrgcN0MF2scQAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-821ff94ebfdb7910621353412e493851896a2a85-240x240-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$41\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"76ab5977468b\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"An open source software platform uniquely capable of searching data generated using standard and PTI developed multiplexing approaches. Researchers can analyze increasingly complex data from their own research applications, identifying more proteins without sacrificing quality or confidence. \",\"title\":\"Proteomics Platform Development\"},{\"_key\":\"58c45413f524\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"PTI uses novel mass tags combined with other multiplexing approaches to bring researchers the capability of analyzing greater samples of single cells faster than previously possible, unlocking research paths for groundbreaking biological discoveries and target therapies. \\n\",\"title\":\"Scaling Single-Cell Analysis\"},{\"_key\":\"1326160f605c\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":fal tbRX9QhjCb+dhRWCGZjChPcqP5RRXJG1tn/9k=\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.47841017095205174,\"y\":0.22375214385487216}},\"bio\":[{\"_key\":\"f92280fabcf1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"e83707a55aec\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad’s career vision has been to create, improve and leverage technologies for maximal impact in key scientific areas. He came to Cellarity from the Broad Institute, where he served many roles over the years. Most recently at Broad he was the founding Senior Director of the Broad Technology Labs, an internal innovation hub that he built to create powerful new capabilities in genomics and technology and to make them available to the research community. As\"},{\"_key\":\"0324d2a28713\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\" \"},{\"_key\":\"5235d9df7460\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chief Technology Officer at Cellarity, Chad is continuing this theme of fit-for-purpose data and innovative data generation processes as the engine of scientific progress. To this end, data generation is configured to propel the science forward, while technology development creates opportunities for previously unreachable scientific achievements.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"1af59e623683\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"450954df3dd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad earned his AB at Columbia University, his PhD at MIT and completed postdoctoral training at the University of California, Berkeley.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Chad Nusbaum\",\"role\":\"Governance Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"chad-nusbaum\"},\"status\":\"public\"},{\"_createdAt\":\"2025-08-13T12:03:21Z\",\"_id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"_rev\":\"DIQGglHLJ789Bk1yAgyBfB\",\"_system\":{\"base\":{\"id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"rev\":\"pF523yb6HepLTPp3dPnvhi\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-03T16:24:34Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-b42559f83aa9e114e95a72502470abcd52a2e18d-1270x1270-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$42\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.4634665109683876,\"y\":0.43715072149470346}},\"bio\":[{\"_key\":\"16cea80a920e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"21339cc69acd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is the CEO of Convergent Research. He is working with a large and growing network of collaborators and advisors to develop a strategic roadmap for future FROs.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"65718741f248\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d4729306597d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Outside of CR, he serves on the boards of several non-profits pursuing new methods of funding and organizing scientific research including Norn Group and New Science, and as an interviewer for the Hertz Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"5737aa92471b\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"134dff467e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, he was a Schmidt Futures Innovation Fellow, a Fellow with the Federation of American Scientists (FAS), a research scientist at Google DeepMind, Chief Strategy Officer of the brain-computer interface company Kernel, a research scientist at MIT, a PhD student in biophysics with George Church and colleagues at Harvard, and a theoretical physics student at Yale. He has also previously helped to start companies like BioBright, and advised foundations such as the Open Philanthropy Project.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"6c67d6ead7ee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4c155739aa55\",\"_type\":\"span\",\"marks\":[],\"text\":\"His work has been recognized with a Technology Review 35 Innovators Under 35 Award (2018), a Fannie and John Hertz Foundation Fellowship (2010) and a Goldwater Scholarship (2008).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0e90c913b107\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"39cf4d54a20a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is a fan of sweets and his cats (Tortoiseshell) Lyra and (giant orange Maine Coon) Neo.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Adam Marblestone\",\"role\":\"CEO \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"adam-marblestone\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:11:37Z\",\"_id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"_rev\":\"XAQEqtwWGfwaiZX4sTziDf\",\"_system\":{\"base\":{\"id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"rev\":\"XaKwKV7EhP4jfpF6WLRtTZ\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:24Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-1b2910fa64fd6097a12dfae4104cd79760af3ec1-3840x2560-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhEDEQA/AN2WwyLJdkPs+pGiOjAQ0fn4Bp7lWC4mMuRq462UblG/uPH3SFGu8vKApzbKwv8AarXJbk5aeOMvtJ3OqTgnHZFZr01O22BpHSNTHY70lakwlgA4xsKK4Lg7tMdXqAVncgHHZopeacJmT//Z\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"4730008cc6b9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"5eb54b027ef2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nikolai Slavov received undergraduate education from MIT and a doctoral degree from Princeton University for characterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Governance Board\"},{\"_key\":\"2c156d9a404e\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T19:40:38Z\",\"_id\":\"68bed6c1-4e14-4b1b-8751-4897c3719c96\",\"_rev\":\"oc16HVx9EGsWFJ5XERLiMa\",\"_system\":{\"base\":{\"id\":\"68bed6c1-4e14-4 \":null},\"bio\":[{\"_key\":\"b351787cd1f4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0f2fa6c4ed6d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil L. Kelleher, PhD, is the Walter and Mary E. Glass Professor of Molecular Biosciences, Professor of Chemistry in the Weinberg College of Arts and Sciences, and Professor of Medicine (Hematology \u0026 Oncology) in the Feinberg School of Medicine. His primary research interests include top-down proteomics, natural product discovery, and cancer biology. Kelleher is the Director of the \"},{\"_key\":\"d40bc0133139\",\"_type\":\"span\",\"marks\":[\"972c8cc6388f\"],\"text\":\"Chemistry of Life Processes Institute\"},{\"_key\":\"fd824de71cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\" and Director of \"},{\"_key\":\"1e31f10eddf2\",\"_type\":\"span\",\"marks\":[\"c36f42701a0c\"],\"text\":\"Northwestern Proteomics\"},{\"_key\":\"31b825115dfe\",\"_type\":\"span\",\"marks\":[],\"text\":\". He is a member of the \"},{\"_key\":\"d5c30a2cf176\",\"_type\":\"span\",\"marks\":[\"15653051feec\"],\"text\":\"Robert H. Lurie Comprehensive Cancer Center\"},{\"_key\":\"da6bc5417cc1\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"15653051feec\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cancer.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"972c8cc6388f\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.clp.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"c36f42701a0c\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://proteomics.northwestern.edu/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"856a909438c8\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4d94a38ecbc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil Kelleher’s research group is focused on top-down proteomics, chromatin biology, and natural product biosynthesis and discovery. Contributing to both technology development and application of mass spectrometry in chemistry and biology, The \"},{\"_key\":\"20244f3981be\",\"_type\":\"span\",\"marks\":[\"395a3f384dc1\"],\"text\":\"Kelleher Research Group\"},{\"_key\":\"de6fd93bbc97\",\"_type\":\"span\",\"marks\":[],\"text\":\" is interested in the biosynthesis and discovery of novel natural products with potential pharmacological activities. The lab leverages top-down proteomics—the analysis of intact proteins for precise localization of post-translational modifications — to advance and contribute to the understanding of chromatin and cancer biology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"395a3f384dc1\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.kelleher.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c165e843ecfa\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"dde71668eefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher is both a pioneer and champion of the top-down approach and the Human Proteoform Project (HPfP), a global research initiative to weigh every protein in the human body—250,000 proteoforms in 4,000 different cell types. HPfP will enable dramatic increases in the speed and efficiency by which investigators can identify higher-value protein-based markers of disease and spur game-changing advances in biomedical research, drug development and human health.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"44904b4903b6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9b5d42720bde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher received a B.S. and B.A. from Pacific Lutheran University in 1992, a Fulbright Fellowship the following year, and a Ph.D. from Cornell University in 1997 completing his joint graduate work with Tadhg Begley and Fred McLafferty. In 1999, after a NIH Postdoctoral Fellowship at Harvard Medical School with Chris Walsh, Kelleher joined the faculty at University of Illinois at Urbana-Champaign where he established his research program in proteomics. In 2010, he joined the faculty at Northwestern University.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b8ce691310c9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ddf312a43a7d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Throughout his career, Kelleher has received many honors, including the Arthur P. Sloan Foundation Fellowship, Packard Fellowship, Dreyfus Award for New Investigators, Camille Dreyfus Teacher-Scholar Award, Lilly Analytical Chemistry Award and National Institutes of Health Career Transition Award. He also was a Burroughs Wellcome Fund Young Investigator and a Searle Scholar. In 2004, he received the Presidential Early Career Award for Scientists and Engineers, the nation’s highest honor for professionals at the outset of their independent research careers. Kelleher also co-founded several successful startups, including \"},{\"_key\":\"2028f6bcd12f\",\"_type\":\"span\",\"marks\":[\"ef9f67d78e99\"],\"text\":\"MicroMGx\"},{\"_key\":\"eb63326b2420\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"45cf1b0b5bfd\",\"_type\":\"span\",\"marks\":[\"59e9aa20e543\"],\"text\":\"Integrated Protein Technologies\"},{\"_key\":\"282f5fd9c058\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"59e9aa20e543\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.iptinc.com\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"ef9f67d78e99\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.micromgx.com\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e35c31a86994\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"54ecb6f588ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher has written more than 300 publications. The ProSight software suite developed by Kelleher is used by more than 1,000 labs around the world. An international leader in his field, Kelleher is the founder and president of the \"},{\"_key\":\"a17659d18fa5\",\"_type\":\"span\",\"marks\":[\"7d771654acff\"],\"text\":\"Consortium for Top-Down Proteomics\"},{\"_key\":\"0196db301661\",\"_type\":\"span\",\"marks\":[],\"text\":\", a 350-member organization with global reach.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"7d771654acff\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.topdownproteomics.org/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Neil Kelleher\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"neil-kelleher\"},\"status\":\"public\"}],\"title\":\"Scientific Advisory Board\"},{\"_key\":\"d770b38fe50c\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T20:33:41Z\",\"_id\":\"76466bde-35a2-448c-bc4e-217e58bfb515\",\"_rev\":\"FAV00vf4xIs1yUzUzbI21o\",\"_system\":{\"base\":{\"id\":\"76466bde-35a2-448c-bc4e-217e58bfb515\",\"rev\":\"XAQEqtwWGfwaiZX4sU3VUl\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T02:58:30Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image ishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Impact Board\"}],\"title\":\"Parallel Squared Technology Institute\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:12Z\",\"_id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"_rev\":\"FAV00vf4xIs1yUzUzcaDyD\",\"_system\":{\"base\":{\"id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"rev\":\"XAQEqtwWGfwaiZX4sTvkAB\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-08T17:45:33Z\",\"name\":\"Biology\",\"slug\":{\"_type\":\"slug\",\"current\":\"biology\"}}],\"websiteUrl\":\"https://www.parallelsq.org/\"},\"slug\":{\"_type\":\"slug\",\"current\":\"plexdia\"},\"subtitle\":\"A multiplexing method that increases proteomics throughput from tiny samples without losing accuracy, enabling fast, high-coverage analysis - even at the single-cell level\",\"title\":\"plexDIA\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:12Z\",\"_id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"_rev\":\"FAV00vf4xIs1yUzUzcaDyD\",\"_system\":{\"base\":{\"id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"rev\":\"XAQEqtwWGfwaiZX4sTvkAB\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-08T17:45:33Z\",\"name\":\"Biology\",\"slug\":{\"_type\":\"slug\",\"current\":\"biology\"}}]},{\"_createdAt\":\"2025-09-18T20:32:23Z\",\"_id\":\"71ce2115-2aa6-4f2e-b8eb-2909232f0c48\",\"_rev\":\"38Q15EITlD75vYdEQtpaDM\",\"_system\":{\"base\":{\"id\":\"71ce2115-2aa6-4f2e-b8eb-2909232f0c48\",\"rev\":\"6WtiBizt6GSRcp6LvNVUw2\"}},\"_type\":\"resource\",\"_updatedAt\":\"2025-11-14T19:27:54Z\",\"categories\":[{\"_createdAt\":\"2025-09-18T20:33:45Z\",\"_id\":\"1c332506-4836-468d-8afd-f365cb2ca20e\",\"_rev\":\"oc16H r and the Director of Genomics at Pandemic Response Labs, a high-throughput diagnostic and genome biosurveillance COVID-19 facility established for New York City. He has advised and/or co-founded startups ranging from DNA data storage, synthetic biology and the microbiome.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"039620b8e2f2\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"6fb2eb727ae0\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is particularly interested in problems at the intersection of biology, hardware, and software. His background training includes electrical engineering, signal processing, synthetic and systems biology (PhD with Jim Collins), and genetics (Research Fellow with George Church).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"7a845e345733\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"c353ee4e9248\",\"_type\":\"span\",\"marks\":[],\"text\":\"Henry loves robots and he used to have a robotic dog, named Rocky.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Henry Lee\",\"role\":\"Chief Executive Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"henry-lee\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T20:19:43Z\",\"_id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"_rev\":\"XAQEqtwWGfwaiZX4sU30FL\",\"_system\":{\"base\":{\"id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"rev\":\"oc16HVx9EGsWFJ5XEE3Q1y\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:25:39Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-23fc469e39a8dcf1cda1863c2d502e56187e6916-750x750-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQY g from the Bill and Melinda Gates Foundation to use baker’s yeast as an environmental sensor. Her research interests span protein engineering, nanomaterials, metabolic engineering and environmental microbiology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a937d38670b4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d549ff169cde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is an avid science communicator passionate about making science more open and accessible.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nili Ostrov\",\"role\":\"Chief Scientific Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"nili-ostrov\"},\"status\":\"public\"}],\"leverTeam\":\"Cultivarium\",\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-3963273dbe4b7c41821fa38666dc6e78dd26eeef-800x121-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAADCAYAAACTWi8uAAAACXBIWXMAACE4AAAhOAFFljFgAAAApElEQVR4nDWOuwoCUQxEU9zNTHK38FYqur7xgYWgqCiCYiHa+v8fI4G1CEMSZuZISuns7h8ATwBzEenknLtmNjSzgbv3Q0spI5L/GQOYApiQbEopTewiMhUAj7quv+7+VtVNmHPOWzM7mlmU7d195+4HMzvFjeQtAEjeSV5IXiMnpXSX1vCKABHpBWFQqOoyCkJbkqCaAVio6rqqqm37X7Uas/4BZLkPfknay6MAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-b5fc569fcef1e4794848897504e3b4c9c40b1718-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAAIDAAAAAAAAAAAAAAAAAAIEBgcI/8QAIxAAAQQCAgEFAQAAAAAAAAAAAQACAxEEBQYSMRMhIkFRYf/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwDp7ZbDH10Hq5Tw1t0qeJyDCyZhG1/Vxqr+7VTl+rydhiEwTNaGC+rhdrF+OcZysqGWcTGB7ZPgXNIJ/qDZSKEDHRwsY93ZwABP6iCZ9/KAAeBSIgIiIP/Z\"}},\"crop\":null,\"hotspot\":null},\"metaPage\":{\"metaPageTitle\":\"Cultivarium\"},\"researchAreas\":[{\"_key\":\"3ba5735a6c33\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A predictive and standardized high-throughput culturing platform for reproducibly growing diverse and difficult-to-culture microbes in the lab. This allows laboratory study of these microbes and accelerates their use in basic science and industrial applications.\",\"title\":\"Microbial Cultivation at Scale\"},{\"_key\":\"2e102a1b820e\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Robotic systems to discover and optimize recombinant DNA delivery methods with a library of molecular parts (promoters, replicons, transposons, resistance markers) that can be combinatorially screened in a single experiment. This enables genetic engineering of non-model microbes in weeks rather than years.\",\"title\":\"Cross-species Genetic Toolkit\"},{\"_key\":\"ba8e9878e6e4\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A digital resource that indexes experimentally actionable information (i.e. strain availability, images, protocols, and molecular parts) for 170,000+ bacteria, fungi, archaea, and protists into one accessible portal. This platform accelerates the engineering of non-model organisms by aggregating both information from disparate databases and practical experimental techniques into actionable insights.\",\"title\":\"Microbe Information Hub\"},{\"_key\":\"7fd7a2ebae93\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Integration of foundation models with robotic lab infrastructure to synthesize published knowledge, assist hypothesis generation, and automate laboratory experimentation. This capability searches a large experimental parameter space to discover and improve enabling methods with high reproducibility and throughput.\",\"title\":\"AI-Driven Discovery\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"cultivarium\"},\"socialLinks\":[{\"_key\":\"414b0fb1b1e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.cultivarium.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"93bd724916168418d6bd0ba850ff786a\",\"_type\":\"linkWithLabel\",\"label\":\"Substack\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://blog.cultivarium.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryPar a253ffda44\",\"rev\":\"XAQEqtwWGfwaiZX4sEyV9T\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:37Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-47a37bbd2787730040c98e8f81d364f7c3aed49d-3840x5120-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAbABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAUGBwL/xAAmEAABAwQBAwQDAAAAAAAAAAABAgMEAAUREgYHEyEiMTNRYXGB/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgMBBAUG/8QAIREAAgEDAwUAAAAAAAAAAAAAAQIAAxESEyFRBRQxQaH/2gAMAwEAAhEDEQA/AHVquthuscSIdskoKvIVpTdpmH8gbdOw9ScGlUK6RLfFQhlotstpJOwxg0hb6gw0zu26l3RJ9K0exrll6fm5IB2koAzbm0YSbK3IdLjDS20HxrsaKYx+Q3N5pLkOLGdZPsv7oq127e2+Q835klyyUgWWc4Fjuak4/FZVY23bhPajRZLJK1eN1Y1/dV/IFqVaJ2xJwmp/o5Hae5VJLraVlLJI2GcVpqTTQtBoJqMF5mjcfcu9ntwhuSmV6KOFIwoEH6NFdRUpS1qkAAEgD+0UpqhvG6V/Bn//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"f24b58a6c7c3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"7a018dbe9bcb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison is a Co-Founder at Parallel Squared Technology Institute, where he fosters the Institute’s ability to stay on the cutting edge of proteomics research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0cf82772ceb1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3803f77091ef\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison has been around mass spectrometers daily since 2013, happily using them to explore biology in everything from the marine environment (Ask him about tarballs!) to human disease.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f7f2ac388aea\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"40e9b6decad9\",\"_type\":\"span\",\"marks\":[],\"text\":\"After diving into the world of proteomics at the Broad Institute’s Proteomics Platform, he pursued new frontiers with Professor Nikolai Slavov at Northeastern University, where he earned a PhD in bioengineering. His doctoral work on accessible and high throughput single cell proteomics helped convince a skeptical field that single cell proteomics using mass spectrometers was robust and adoptable with common equipment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ed24a86fa072\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"73becd0a961b\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is passionate about mountain biking, nature photography, and learning to play more than one cool song on the guitar.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Harrison Specht\",\"role\":\"Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"harrison-specht\"},\"status\":\"public\"}],\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-5053da2bcef4b27ee429f044e9bf49c749a3df7a-247x60-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAFCAYAAABFA8wzAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsElEQVR4nE3QTUvCYRAE8N+lsuwk9GaWZiS9EGEnkSjool9A8RAKUtD3/wQysH/wMOzOzD7PLgO/+CtsMccVjtEunKCFoz00/mmhmbXADJ/4wgdu0MUdhlXDL3GOC/Rxj4dC+sxaYlLiCO/o4RqPeMZT+fn4thbGe8VL9UHmrDAt4w3juqBTj/PJoC7KksSRK7M0erRcnhrNPzZY4wffOMPBXk7JMAhvskwNT39YvLUDrgcN0MF2scQAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-821ff94ebfdb7910621353412e493851896a2a85-240x240-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$46\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"76ab5977468b\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"An open source software platform uniquely capable of searching data generated using standard and PTI developed multiplexing approaches. Researchers can analyze increasingly complex data from their own research applications, identifying more proteins without sacrificing quality or confidence. \",\"title\":\"Proteomics Platform Development\"},{\"_key\":\"58c45413f524\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"PTI uses novel mass tags combined with other multiplexing approaches to bring researchers the capability of analyzing greater samples of single cells faster than previously possible, unlocking research paths for groundbreaking biological discoveries and target therapies. \\n\",\"title\":\"Scaling Single-Cell Analysis\"},{\"_key\":\"1326160f605c\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Developing tools for the scientific community to study proteomics pathways is fundamental to understanding and preventing protein dysfunctions across neurodegenerative, metabolic, and other complex diseases. We created protocols to isolate single neurons from human brain tissue to study protein dysfunctions in Alzheimer’s disease, and optimized sample preparation by developing methods to isolate and tag individual immune cells to identify genetic differences in protein turnover. \",\"title\":\"Decoding Disease Mechanisms\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"pti\"},\"socialLinks\":[{\"_key\":\"91d5bff745e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.parallelsq.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"eeddae1f6dc0\",\"_type\":\"linkWithLabel\",\"label\":\"X/Twitter\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://x.com/ParallelSqTech\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"6d8a3cd2726f\",\"_type\":\"linkWithLabel\",\"label\":\"BlueSky\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://bsky.app/profile/parallelsq.bsky.social\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"5be9f312e8ef\",\"_type\":\"linkWithLabel\",\"label\":\"LinkedIn\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.linkedin.com/company/parallelsqtech/posts/?feedView=all\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"f96c73135aff\",\"_type\":\"linkWithLabel\",\"label\":\"YouTube\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.youtube.com/@ParallelSquared\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}}],\"status\":\"public\",\"supportedBy\":[\"Eric and Wendy Schmidt\",\"Ken Griffin\"],\"teamSections\":[{\"_key\":\"4d2bb78dd2f5\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T19:39:33Z\",\"_id\":\"dc152c15-58cd-499f-b176-d0137a058826\",\"_rev\":\"6WtiBizt6GSRcp6LvN4MuY\",\"_system\":{\"base\":{\"id\":\"dc152c15-58cd-499f-b176-d0137a058826\",\"rev\":\"XaKwKV7EhP4jfpF6WZWKgd\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T03:00:14Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-6367b2719d479c61afc9b87b3af741405a7b3c72-3840x5628-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAdABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAcIBAX/xAAnEAACAQMDAwMFAAAAAAAAAAABAgMABAUGESEHMVESE2EUFjKRsf/EABcBAAMBAAAAAAAAAAAAAAAAAAIDBAX/xAAdEQEAAgICAwAAAAAAAAAAAAABABECAwQSITFR/9oADAMBAAIRAxEAPwCgLi4aK1maIbyKhKj52rnaHyN3kbSWS8YtzxvtuD4padY9ZXeH+nsMdcew86kySDuBS+w+tsnjJ7Nosg2yMAyA8Nz3NIV7DNHRw3ZrX76lZ0Vgxt8t5j7a5U7iWMN+xRTbkCU0ycOt0LRy2+WcRyWyD2nR/mlrgJospn7PHwGKFrmQIrEfiKYPX2VvtVRvwZhuKR+lZnh1Fi5EYhxOhB8c0GOA+ZXhy89ePUl64mMWGMtbRX9QhjCb+dhRWCGZjChPcqP5RRXJG1tn/9k=\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.47841017095205174,\"y\":0.22375214385487216}},\"bio\":[{\"_key\":\"f92280fabcf1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"e83707a55aec\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad’s career vision has been to create, improve and leverage technologies for maximal impact in key scientific areas. He came to Cellarity from the Broad Institute, where he served many roles over the years. Most recently at Broad he was the founding Senior Director of the Broad Technology Labs, an internal innovation hub that he built to create powerful new capabilities in genomics and technology and to make them available to the research community. As\"},{\"_key\":\"0324d2a28713\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\" \"},{\"_key\":\"5235d9df7460\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chief Technology Officer at Cellarity, Chad is continuing this theme of fit-for-purpose data and innovative data generation processes as the engine of scientific progress. To this end, data generation is configured to propel the science forward, while technology development creates opportunities for previously unreachable scientific achievements.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"1af59e623683\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"450954df3dd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad earned his AB at Columbia University, his PhD at MIT and completed postdoctoral training at the University of California, Berkeley.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Chad Nusbaum\",\"role\":\"Governance Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"chad-nusbaum\"},\"status\":\"public\"},{\"_createdAt\":\"2025-08-13T12:03:21Z\",\"_id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"_rev\":\"DIQGglHLJ789Bk1yAgyBfB\",\"_system\":{\"base\":{\"id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"rev\":\"pF523yb6HepLTPp3dPnvhi\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-03T16:24:34Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-b42559f83aa9e114e95a72502470abcd52a2e18d-1270x1270-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$47\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.4634665109683876,\"y\":0.43715072149470346}},\"bio\":[{\"_key\":\"16cea80a920e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"21339cc69acd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is the CEO of Convergent Research. He is working with a large and growing network of collaborators and advisors to develop a strategic roadmap for future FROs.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"65718741f248\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d4729306597d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Outside of CR, he serves on the boards of several non-profits pursuing new methods of funding and organizing scientific research including Norn Group and New Science, and as an interviewer for the Hertz Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"5737aa92471b\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"134dff467e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, he was a Schmidt Futures Innovation Fellow, a Fellow with the Federation of American Scientists (FAS), a research scientist at Google DeepMind, Chief Strategy Officer of the brain-computer interface company Kernel, a research scientist at MIT, a PhD student in biophysics with George Church and colleagues at Harvard, and a theoretical physics student at Yale. He has also previously helped to start companies like BioBright, and advised foundations such as the Open Philanthropy Project.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"6c67d6ead7ee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4c155739aa55\",\"_type\":\"span\",\"marks\":[],\"text\":\"His work has been recognized with a Technology Review 35 Innovators Under 35 Award (2018), a Fannie and John Hertz Foundation Fellowship (2010) and a Goldwater Scholarship (2008).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0e90c913b107\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"39cf4d54a20a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is a fan of sweets and his cats (Tortoiseshell) Lyra and (giant orange Maine Coon) Neo.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Adam Marblestone\",\"role\":\"CEO \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"adam-marblestone\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:11:37Z\",\"_id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"_rev\":\"XAQEqtwWGfwaiZX4sTziDf\",\"_system\":{\"base\":{\"id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"rev\":\"XaKwKV7EhP4jfpF6WLRtTZ\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:24Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-1b2910fa64fd6097a12dfae4104cd79760af3ec1-3840x2560-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhE of Arts and Sciences, and Professor of Medicine (Hematology \u0026 Oncology) in the Feinberg School of Medicine. His primary research interests include top-down proteomics, natural product discovery, and cancer biology. Kelleher is the Director of the \"},{\"_key\":\"d40bc0133139\",\"_type\":\"span\",\"marks\":[\"972c8cc6388f\"],\"text\":\"Chemistry of Life Processes Institute\"},{\"_key\":\"fd824de71cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\" and Director of \"},{\"_key\":\"1e31f10eddf2\",\"_type\":\"span\",\"marks\":[\"c36f42701a0c\"],\"text\":\"Northwestern Proteomics\"},{\"_key\":\"31b825115dfe\",\"_type\":\"span\",\"marks\":[],\"text\":\". He is a member of the \"},{\"_key\":\"d5c30a2cf176\",\"_type\":\"span\",\"marks\":[\"15653051feec\"],\"text\":\"Robert H. Lurie Comprehensive Cancer Center\"},{\"_key\":\"da6bc5417cc1\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"15653051feec\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cancer.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"972c8cc6388f\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.clp.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"c36f42701a0c\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://proteomics.northwestern.edu/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"856a909438c8\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4d94a38ecbc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil Kelleher’s research group is focused on top-down proteomics, chromatin biology, and natural product biosynthesis and discovery. Contributing to both technology development and application of mass spectrometry in chemistry and biology, The \"},{\"_key\":\"20244f3981be\",\"_type\":\"span\",\"marks\":[\"395a3f384dc1\"],\"text\":\"Kelleher Research Group\"},{\"_key\":\"de6fd93bbc97\",\"_type\":\"span\",\"marks\":[],\"text\":\" is interested in the biosynthesis and discovery of novel natural products with potential pharmacological activities. The lab leverages top-down proteomics—the analysis of intact proteins for precise localization of post-translational modifications — to advance and contribute to the understanding of chromatin and cancer biology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"395a3f384dc1\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.kelleher.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c165e843ecfa\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"dde71668eefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher is both a pioneer and champion of the top-down approach and the Human Proteoform Project (HPfP), a global research initiative to weigh every protein in the human body—250,000 proteoforms in 4,000 different cell types. HPfP will enable dramatic increases in the speed and efficiency by which investigators can identify higher-value protein-based markers of disease and spur game-changing advances in biomedical research, drug development and human health.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"44904b4903b6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9b5d42720bde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher received a B.S. and B.A. from Pacific Lutheran University in 1992, a Fulbright Fellowship the following year, and a Ph.D. from Cornell University in 1997 completing his joint graduate work with Tadhg Begley and Fred McLafferty. In 1999, after a NIH Postdoctoral Fellowship at Harvard Medical School with Chris Walsh, Kelleher joined the faculty at University of Illinois at Urbana-Champaign where he established his research program in proteomics. In 2010, he joined the faculty at Northwestern University.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b8ce691310c9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ddf312a43a7d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Throughout his career, Kelleher has received many honors, including the Arthur P. Sloan Foundation Fellowship, Packard Fellowship, Dreyfus Award for New Investigators, Camille Dreyfus Teacher-Scholar Award, Lilly Analytical Chemistry Award and National Institutes of Health Career Transition Award. He also was a Burroughs Wellcome Fund Young Investigator and a Searle Scholar. In 2004, he received the Presidential Early Career Award for Scientists and Engineers, the nation’s highest honor for professionals at the outset of their independent research careers. Kelleher also co-founded several successful startups, including \"},{\"_key\":\"2028f6bcd12f\",\"_type\":\"span\",\"marks\":[\"ef9f67d78e99\"],\"text\":\"MicroMGx\"},{\"_key\":\"eb63326b2420\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"45cf1b0b5bfd\",\"_type\":\"span\",\"marks\":[\"59e9aa20e543\"],\"text\":\"Integrated Protein Technologies\"},{\"_key\":\"282f5fd9c058\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"59e9aa20e543\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.iptinc.com\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"ef9f67d78e99\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.micromgx.com\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e35c31a86994\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"54ecb6f588ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher has written more than 300 publications. The ProSight software suite developed by Kelleher is used by more than 1,000 labs around the world. An international leader in his field, Kelleher is the founder and president of the \"},{\"_key\":\"a17659d18fa5\",\"_type\":\"span\",\"marks\":[\"7d771654acff\"],\"text\":\"Consortium for Top-Down Proteomics\"},{\"_key\":\"0196db301661\",\"_type\":\"span\",\"marks\":[],\"text\":\", a 350-member organization with global reach.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"7d771654acff\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.topdownproteomics.org/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Neil Kelleher\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"neil-kelleher\"},\"status\":\"public\"}],\"title\":\"Scientific Advisory Board\"},{\"_key\":\"d770b38fe50c\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T20:33:41Z\",\"_id\":\"76466bde-35a2-448c-bc4e-217e58bfb515\",\"_rev\":\"FAV00vf4xIs1yUzUzbI21o\",\"_system\":{\"base\":{\"id\":\"76466bde-35a2-448c-bc4e-217e58bfb515\",\"rev\":\"XAQEqtwWGfwaiZX4sU3VUl\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T02:58:30Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-6802fc93d96bb7a6814fdd5851e879efeb4f507b-1920x1920-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAU KgUrRky4lSo+EVcLEjx/JqavA/RD6bh7OhOL4AAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"leadershipTeam\":[{\"_createdAt\":\"2025-09-18T21:02:59Z\",\"_id\":\"b5e63a5b-0a89-4db2-823b-3517a4ef0342\",\"_rev\":\"XaKwKV7EhP4jfpF6WZZIxl\",\"_system\":{\"base\":{\"id\":\"b5e63a5b-0a89-4db2-823b-3517a4ef0342\",\"rev\":\"XaKwKV7EhP4jfpF6WKjHKD\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:26:28Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-0ff01afa76d119cb00fea46ddc6b010cdde60e8c-800x800-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$4a\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"fe66fb5729e6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a54380296f65\",\"_type\":\"span\",\"marks\":[],\"text\":\"Dr. Andrew Payne is a scientist and engineer with a decade of experience inventing and building technologies for precisely mapping biological systems in genomics and neuroscience. As founder and CEO at E11 Bio, he is currently leading a moonshot research program to develop breakthrough technology for precisely mapping brain circuits at the scale of mammalian brains. Previously at MIT, Andrew invented and developed technologies unifying DNA sequencing and microscopic imaging, including methods for spatially precise genome sequencing within intact cells and embryos (\"},{\"_key\":\"5da81b3a8768\",\"_type\":\"span\",\"marks\":[\"17b8dc4154ef\"],\"text\":\"Payne et al, Science 2021\"},{\"_key\":\"fe96a56a689d\",\"_type\":\"span\",\"marks\":[],\"text\":\"). Andrew maintains an active interest in metascience, including the design and implementation of new organizational models for practicing science, such as Focused Research Organizations. Andrew received his PhD from MIT, and received his BASc in Engineering Science from the University of Toronto.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"17b8dc4154ef\",\"_type\":\" ional Institutes of Health Center of Excellence in Genomic Science. He has received numerous awards including the 2011 Bower Award and Prize for Achievement in Science from the Franklin Institute and election to the National Academy of Sciences and Engineering.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"George Church\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"george-church\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T21:04:59Z\",\"_id\":\"effe4ebf-a1d2-4877-8a4b-84d4fb9dee27\",\"_rev\":\"XAQEqtwWGfwaiZX4sU0c5X\",\"_system\":{\"base\":{\"id\":\"effe4ebf-a1d2-4877-8a4b-84d4fb9dee27\",\"rev\":\"XAQEqtwWGfwaiZX4sEBhZ1\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:47:03Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-fe6afe630a99bbe253696868b84be62a444901c6-512x512-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAQEBAQAAAAAAAAAAAAAAAAcFBAb/xAApEAACAQQBAgMJAAAAAAAAAAABAgMABAURBhMhBwhBEhQVIiMxMlFx/8QAGAEAAgMAAAAAAAAAAAAAAAAAAgMAAQT/xAAbEQACAwADAAAAAAAAAAAAAAAAAQIDEhEyQf/aAAwDAQACEQMRAD8A2OTYdL28bqRmEuxLDWxseoqeTY24tMvD7ldSleqBKrfYg1WuVZEQ2rgyRi5LfTUnue9TzkN18CkGSyKs1tMyjS/kf3qgti9JobTKOHybhsypIGjSu7jviJw6PGgTMSxYkdVfm1SqywdHiDczX+XikunLsZVH871oeYdukuIgQARewW1r1pSti6xE+sjBYr2GtUpSiIf/2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"a7e6a66110a6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f2531e1cf052\",\"_type\":\"span\",\"marks\":[],\"text\":\"David A. Markowitz is a scientist and engineer with a decade of experience leading applied research in biotechnology and artificial intelligence.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"509cb7044e1d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0daeb757aed6\",\"_type\":\"span\",\"marks\":[],\"text\":\"David is Chief Scientist at STR, an advanced technology R\u0026D services company. He founded and leads a business unit that bridges biology with information science to accelerate discovery and deliver new capabilities. Since launching this effort in 2023, he has raised $30M in public and private capital from customers including government (ARPA-H, DARPA, and other DoD/IC elements) and philanthropy (Bill \u0026 Melinda Gates Foundation), and he has forged partnerships with a broad range of industry partners working in the health, agriculture, manufacturing, and national security domains.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"264c2de5dbbe\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3bb17cc0b91a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, as an IARPA Program Manager, David Led “moonshot” applied research programs the bridged biology, engineering, and computing. He managed a $200M+ portfolio and contracted work by 500+ staff at 30+ organizations. Through this work, David delivered breakthrough technologies and capabilities for national security, and made key contributions to several emerging science and technology domains, including synthetic biology, connectomics, bioelectronics, and robotics. David also led the U.S. government’s development of computational and experimental tools for detecting engineered biological systems. In January 2020, he coordinated the U.S. national security community’s initial analysis of the SARS-CoV-2 genome.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\": n\",\"marks\":[],\"text\":\"He is also on the Board of Directors of Humanity+. Humanity+ is an international nonprofit membership organization which advocates the ethical use of technology to expand human capacities. They support the development of, and access to, new technologies that enable everyone to enjoy better minds, better bodies, and better lives. In other words, they want people to be better than well.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"556210b1244c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"44b563584471\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd has worked as a consultant for Suspended Animation and as a Field Team Member for the Alcor Life Extension Foundation. He was also a volunteer for the Methuselah Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8b940bc24cda\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"221ac63a7365\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd earned his Master’s in Computational Biosciences at Arizona State University and his Bachelor’s in Neuroscience at the California State University at Long Beach. He earned his Graduate Certificate in Entrepreneurship and Innovation Studies at Nanyang Technical University, Singapore.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Todd Huffman\",\"role\":\"Senior Advisor \u0026 Co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"todd-huffman\"},\"status\":\"public\"}],\"title\":\"Advisors\"}],\"title\":\"E11 Bio\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:29Z\",\"_id\":\"fa40bb6f-8aab-44a0-952c-eb8ba2f76fcf\",\"_rev\":\"DIQGglHLJ789Bk1yAgySEx\",\"_system\":{\"base\":{\"id\":\"fa40bb6f-8aab-44a0-952c-eb8ba2 aHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhEDEQA/AN2WwyLJdkPs+pGiOjAQ0fn4Bp7lWC4mMuRq462UblG/uPH3SFGu8vKApzbKwv8AarXJbk5aeOMvtJ3OqTgnHZFZr01O22BpHSNTHY70lakwlgA4xsKK4Lg7tMdXqAVncgHHZopeacJmT//Z\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"4730008cc6b9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"5eb54b027ef2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nikolai Slavov received undergraduate education from MIT and a doctoral degree from Princeton University for characterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:12:56Z\",\"_id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"_rev\":\"oc16HVx9EGsWFJ5XERLlDu\",\"_system\":{\"base\":{\"id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"rev\":\"XAQEqtwWGfwaiZX4sEyV9T\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:37Z\",\
