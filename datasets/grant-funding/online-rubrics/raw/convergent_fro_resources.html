"altText\":null,\"asset\":{\"_id\":\"image-447372e0d7f65c0aa258c94ea17a4747c58c82d6-3840x4800-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$2f\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"b351787cd1f4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0f2fa6c4ed6d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil L. Kelleher, PhD, is the Walter and Mary E. Glass Professor of Molecular Biosciences, Professor of Chemistry in the Weinberg College of Arts and Sciences, and Professor of Medicine (Hematology \u0026 Oncology) in the Feinberg School of Medicine. His primary research interests include top-down proteomics, natural product discovery, and cancer biology. Kelleher is the Director of the \"},{\"_key\":\"d40bc0133139\",\"_type\":\"span\",\"marks\":[\"972c8cc6388f\"],\"text\":\"Chemistry of Life Processes Institute\"},{\"_key\":\"fd824de71cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\" and Director of \"},{\"_key\":\"1e31f10eddf2\",\"_type\":\"span\",\"marks\":[\"c36f42701a0c\"],\"text\":\"Northwestern Proteomics\"},{\"_key\":\"31b825115dfe\",\"_type\":\"span\",\"marks\":[],\"text\":\". He is a member of the \"},{\"_key\":\"d5c30a2cf176\",\"_type\":\"span\",\"marks\":[\"15653051feec\"],\"text\":\"Robert H. Lurie Comprehensive Cancer Center\"},{\"_key\":\"da6bc5417cc1\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"15653051feec\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cancer.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"972c8cc6388f\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.clp.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"c36f42701a0c\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://proteomics.northwestern.edu/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"856a909438c8\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4d94a38ecbc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil Kelleher’s research group is focused on top-down proteomics, chromatin biology, and natural product biosynthesis and discovery. Contributing to both technology development and application of mass spectrometry in chemistry and biology, The \"},{\"_key\":\"20244f3981be\",\"_type\":\"span\",\"marks\":[\"395a3f384dc1\"],\"text\":\"Kelleher Research Group\"},{\"_key\":\"de6fd93bbc97\",\"_type\":\"span\",\"marks\":[],\"text\":\" is interested in the biosynthesis and discovery of novel natural products with potential pharmacological activities. The lab leverages top-down proteomics—the analysis of intact proteins for precise localization of post-translational modifications — to advance and contribute to the understanding of chromatin and cancer biology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"395a3f384dc1\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.kelleher.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c165e843ecfa\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"dde71668eefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher is both a pioneer and champion of the top-down approach and the Human Proteoform Project (HPfP), a global research initiative to weigh every protein in the human body—250,000 proteoforms in 4,000 different cell types. HPfP will enable dramatic increases in the speed and efficiency by which investigators can identify higher-value protein-based markers of disease and spur game-changing advances in biomedical research, drug development and human health.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"44904b4903b6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9b5d42720bde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher received a B.S. and B.A. from Pacific Lutheran University in 1992, a Fulbright Fellowship the following year, and a Ph.D. from Cornell University in 1997 completing his joint graduate work with Tadhg Begley and Fred McLafferty. In 1999, after a NIH Postdoctoral Fellowship at Harvard Medical School with Chris Walsh, Kelleher joined the faculty at University of Illinois at Urbana-Champaign where he established his research program in proteomics. In 2010, he joined the faculty at Northwestern University.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b8ce691310c9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ddf312a43a7d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Throughout his career, Kelleher has received many honors, including the Arthur P. Sloan Foundation Fellowship, Packard Fellowship, Dreyfus Award for New Investigators, Camille Dreyfus Teacher-Scholar Award, Lilly Analytical Chemistry Award and National Institutes of Health Career Transition Award. He also was a Burroughs Wellcome Fund Young Investigator and a Searle Scholar. In 2004, he received the Presidential Early Career Award for Scientists and Engineers, the nation’s highest honor for professionals at the outset of their independent research careers. Kelleher also co-founded several successful startups, including \"},{\"_key\":\"2028f6bcd12f\",\"_type\":\"span\",\"marks\":[\"ef9f67d78e99\"],\"text\":\"MicroMGx\"},{\"_key\":\"eb63326b2420\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"45cf1b0b5bfd\",\"_type\":\"span\",\"marks\":[\"59e9aa20e543\"],\"text\":\"Integrated Protein Technologies\"},{\"_key\":\"282f5fd9c058\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"59e9aa20e543\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.iptinc.com\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"ef9f67d78e99\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.micromgx.com\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e35c31a86994\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"54ecb6f588ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher has written more than 300 publications. The ProSight software suite developed by Kelleher is used by more than 1,000 labs around the world. An international leader in his field, Kelleher is the founder and president of the \"},{\"_key\":\"a17659d18fa5\",\"_type\":\"span\",\"marks\":[\"7d771654acff\"],\"text\":\"Consortium for Top-Down Proteomics\"},{\"_key\":\"0196db301661\",\"_type\":\"span\",\"marks\":[],\"text\":\", a 350-member organization with global reach.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"7d771654acff\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.topdownproteomics.org/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Neil Kelleher\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"neil-kelleher\"},\"status\":\"public\"}],\"title\":\"Scientific Advisory Board\"},{\"_key\":\"d770b38fe50c\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T20:33:41Z\",\"_id\":\"76466bde-35a2-448c-bc4e-217e58bfb515\",\"_rev\":\"FAV00vf4xIs1yUzUzbI21o\",\"_system\":{\"bas 6, leading the Corporate and Business development function, and now he is the company’s Chief Strategy Officer.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Spike Willcocks\",\"role\":\"Impact Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"spike-willcocks\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:11:37Z\",\"_id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"_rev\":\"XAQEqtwWGfwaiZX4sTziDf\",\"_system\":{\"base\":{\"id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"rev\":\"XaKwKV7EhP4jfpF6WLRtTZ\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:24Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-1b2910fa64fd6097a12dfae4104cd79760af3ec1-3840x2560-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhEDEQA/AN2WwyLJdkPs+pGiOjAQ0fn4Bp7lWC4mMuRq462UblG/uPH3SFGu8vKApzbKwv8AarXJbk5aeOMvtJ3OqTgnHZFZr01O22BpHSNTHY70lakwlgA4xsKK4Lg7tMdXqAVncgHHZopeacJmT//Z\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"4730008cc6b9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"5eb54b027ef2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nikolai Slavov received undergraduate education from MIT and a doctoral degree from Princeton University for characterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Impact Board\"}],\"title\":\"Parallel Squared Technology Institute\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:12Z\",\"_id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"_rev\":\"FAV00vf4xIs1yUzUzcaDyD\",\"_system\":{\"base\":{\"id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"rev\":\"XAQEqtwWGfwaiZX4sTvkAB\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-08T17:45:33Z\",\"name\":\"Biology\",\"slug\":{\"_type\":\"slug\",\"current\":\"biology\"}}],\"websiteUrl\":\"https://www.parallelsq.org/\"}]}],[\"$\",\"$L30\",null,{\"uniqueCategories\":[{\"_createdAt\":\"2025-09-18T20:33:45Z\",\"_id\":\"1c332506-4836-468d-8afd-f365cb2ca20e\",\"_rev\":\"oc16HVx9EGsWFJ5XEE4TYy\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-09-18T20:33:48Z\",\"name\":\"Platform\",\"slug\":{\"_type\":\"slug\",\"current\":\"platform\"}},{\"_createdAt\":\"2025-10-08T13:40:42Z\",\"_id\":\"d844ae09-3418-4a32-a6e8-cd4b52a87536\",\"_rev\":\"aGpldou8uDCYtULGTLOEOJ\",\"_type\":\"froCategory\",\"_updatedAt\":\"2025-10-08T13:41:03Z\",\"name\":\"Press\",\"slug\":{\"_type\":\"slug\",\"current\":\"press\"}},{\"_createdAt\":\"2025-09-18T20:52:49Z\",\"_id\":\"b04186a0-7b0e-45ef-8bc6-14c6d89e518b\",\"_rev\":\"XAQEqtwWGfwaiZX4sECR15\",\"_system\":{\"base\":{\"id\":\"b04186a0-7b0e-45ef-8bc6-14c6d89e518b\",\"rev\":\"XAQEqtwWGfwaiZX4sEAaMh\"}},\"_type\":\"froCategory\",\"_updatedAt\":\"2025 :[{\"_key\":\"7de157a12757\",\"_type\":\"span\",\"marks\":[],\"text\":\"Elaine Houskeeper (née McVey) is a co-founder of EvE Bio. She holds a B.A. in Neuroscience from Amherst College and Master of Statistics from North Carolina State University. She spent her early career as a scientist in protein folding and cell biology labs, after which she served at Becton Dickinson's R\u0026D center as a data scientist, working across cell therapy, diabetes technology, and smart device programs, contributing to several publications and patents. Most recently she built and led data science teams at a number of early-stage startups, helping grow them from pre-Series A to successful exits. Outside of the data world, she keeps busy camping, mountain biking, trail running, and trying to keep up with her two sons.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Elaine McVey Houskeeper\",\"role\":\"CEO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"elaine-mcvey-houskeeper\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T15:20:35Z\",\"_id\":\"8802cea5-bc77-4f6e-bbe1-414a70347795\",\"_rev\":\"HiUjQBQ9ExUpexm6nDuxsU\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T15:21:04Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-f1c59fc2fd48633cddfd517bcdc6cb9a783938d3-400x400-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAAAAUEBv/EACMQAAEEAQMEAwAAAAAAAAAAAAEAAgMRBAUSIQYUMVETJEH/xAAYAQADAQEAAAAAAAAAAAAAAAABBAYCBf/EABoRAAIDAQEAAAAAAAAAAAAAAAABAgMRBEH/2gAMAwEAAhEDEQA/AMvRum4HbSZ+cWnY6g0/g9qlrzNIzsT6xiEpaXRkcXSi9NP2QzslA+N/ALvC1au2PHwnOaYjQ2s2kHz6SEjoxryvX6cDmR3kPNWi0Ojsknm0QFcOr1hxjxCIzsB44U9kLOzx3myXA3Z4RECp6IpySwlagwRZJaywKREWiasWTaR//9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"046cdbff7cf7\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9c5c89e66a30\",\"_type\":\"span\",\"marks\":[],\"text\":\"William Busa is a co-founder of EvE Bio. He holds a PhD in biological science from the University of California, Davis, where he elucidated a mechanism underlying certain animal embryos ability to survive profound and prolonged dormancy - work leading to his election as a Fellow of the AAAS. Following a first career in academia at The Johns Hopkins University studying signal transduction biology, Bill served as the founding Chief Scientific Officer of the biotech tools company, Cellomics, the originator of high content screening technology for pharmaceutical drug discovery. Bill next built and led a cell and tissue technologies product development organization at Becton Dickinson, and later became an independent business and product development consultant to the biotechnology tools industry. In his spare time Bill facilitates the conversion of sunlight and tempests into fleet-footed steeds on his farm in Durham County.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"William Busa\",\"role\":\"CSO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"william-busa\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T15:21:55Z\",\"_id\":\"8ac63e3c-b4b2-4a66-bfd2-7c50e2eab830\",\"_rev\":\"tZc8S6vheHYlC8jlhNe8hU\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T15:22:26Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-6c86cf38e1c59c8310d703c3ededed0b14d93134-400x400-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgo p\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"bb4927afb79e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"2771024afefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Dr. Sumner L. Norman works at the intersection of neuroscience, engineering, and impact-driven entrepreneurship. His research in ultrasonic brain-computer interfaces (BCIs) is forging new paths in neurotechnology to improve our understanding and treatment of neurological injuries and diseases. In 2023, Sumner co-founded Forest Neurotech, a nonprofit focused research organization based on his research at Caltech introducing ultrasonic BCIs – a high-performance technique that offers a minimally invasive approach to monitoring and stimulating brain-wide function. In addition to research, Sumner has been active in state and federal government advocacy for scientific research, education, and innovation.‍\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Sumner Norman\",\"role\":\"CEO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"sumner-norman\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T16:37:00Z\",\"_id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"_rev\":\"Eiw57G9wlN7pMt4O6ff4l3\",\"_system\":{\"base\":{\"id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"rev\":\"tZc8S6vheHYlC8jlhNfpLE\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T16:38:15Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-cc7cbccb3b3fa2f2bf679e1f75cc90d021f10297-500x500-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAQBAgUD/8QAIhAAAgEDBAIDAAAAAAAAAAAAAQIDAAQRBRIhMRMUBkGS/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgQBAwUG/8QAHREAAgICAwEAAAAAAAAAAAAAAAECAxMxERJBUf/aAAwDAQACEQMRAD8A8tElRbtfflkS2AyxV93X1xXY1TVNPmkCacZ+ByQCBzXC0W+f3fGoScDO4LFjFWXUjQbnkDBJcA7l6rIdfp0NVi6tExlkUkGVv2KVhLSOZA1v6jx9ZYHOaUWNC+WX02tLl2t9IeNUhe5B8rRDBarPn0r2cdrPC5EmB3yOaUq+xcyQpS2q5k97ptrEtr449u+BXbDHknulKVEdAPZ//9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"0e389d2bf73c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4333e27f9045\",\"_type\":\"span\",\"marks\":[],\"text\":\"I am the co-founder and Chief Scientific Officer of Forest Neurotech. I've spent over a decade developing implantable neural technologies to help individuals with neurological diseases. At Forest, we are creating a new generation of neurotechnology that can interface with the entire human brain, without touching the brain.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Tyson Aflalo\",\"role\":\"CSO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"tyson-aflalo\"},\"status\":\"public\"}],\"location\":\"California\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-205bbb2852f7476495965375daf46924afce177f-588x66-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAACCAYAAABYBvyLAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAV0lEQVR4nC3LTQqCUBgF0DN3IroDMTSQIDJBEDEFE5o4af9bkQff4HL/ocATD9SoAk1kE164o0OLW/jEafcOzqDEiA0rFsyBProdJ/744YMD39DpOyC/AC9QB+Zqh3+pAAAAAElFTkSuQmCC\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-528cdbe27c80980c01b29f879c7dba34241d000a-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAAMBAAAAAAAAAAAAAAAAAAIEBgj/xAAiEAABAwQBBQEAAAAAAAAAAAAAAQIDBAUREjEGITJBUWH/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A6n3Zvpsm3zPckZu6WCqqblPV0tYsD3ta1MJxjkqt6du6Mc114kVyp5fuQNcCpaqaSkt8EE0iyyMbhXr7AFsAAAAB/9k=\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"34d37b94caa3\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"There is currently no method to both sense and actuate brain function at brain-wide scale. This capability would unlock everything from fundamental science in brain (dys)function and the nature of consciousness to myriad brain diagnostics, monitoring, and therapeutic applications. \\n\",\"title\":\"Whole-Brain IO\"},{\"_key\":\"70ac1519b689\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"The ability to interact with brain function without ever damaging (or even touching) a single neuron has major downstream impact. A minimally-invasive hardware interface that supports “brain apps”: observing and modulating networks linked to additional indications via software updates and algorithms. This is a paradigm shift in neurotechnology: it unlocks software as a medical device \\\"SaMD\\\" pathways where new use cases ship as software, not new implants.\\n\",\"title\":\" A Platform for \\\"Brain Apps\\\"\"},{\"_key\":\"a580036aea71\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Along the way to Whole-Brain IO, Forest Neurotech will need to solve data standards, algorithm improvements, user data privacy concerns, and large scale data modeling. Forest plans to share its ever-growing toolbox with the neuroscience and medical communities.\\n\",\"title\":\"Open Neuroscience Infrastructure\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"forest\"},\"socialLinks\":[{\"_key\":\"c47a78efc83b\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://forestneurotech.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"4420ce1e721d\",\"_type\":\"linkWithLabel\",\"label\":\"LinkedIn\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.linkedin.com/company/forest-neurotech/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}}],\"status\":\"public\",\"supportedBy\":[\"Eric and Wendy Schmidt   \",\"Griffin Catalyst\",\"Riley \u0026 Susan Bechtel Foundation  \",\"James Fickel\"],\"teamSections\":null,\"title\":\"Forest Neurotech\",\"topics\":[{\"_createdAt\":\"2025-09-24T16:32:29Z\",\"_id\":\"809b01b4-0f8a-4e06-88d5-dd3a7016ef3b\",\"_rev\":\"Eiw57G9wlN7pMt4O6febq7\",\"_type\":\"topic\",\"_updatedAt\":\"2025-09-24T16:32:32Z\",\"name\":\"Neuroscience\",\"slug\":{\"_type\":\"slug\",\"current\":\"neuroscience\"}}],\"websiteUrl\":\"https://forestneurotech.org/\"},\"slug\":{\"_type\":\"slug\",\"current\":\"fusi-bids-pydantic\"},\"subtitle\":\"Pyda lee\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T20:19:43Z\",\"_id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"_rev\":\"XAQEqtwWGfwaiZX4sU30FL\",\"_system\":{\"base\":{\"id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"rev\":\"oc16HVx9EGsWFJ5XEE3Q1y\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:25:39Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-23fc469e39a8dcf1cda1863c2d502e56187e6916-750x750-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAcBAwQF/8QAIxAAAQQBAwQDAAAAAAAAAAAAAQACAwQRBhIhBQciMSNxkf/EABUBAQEAAAAAAAAAAAAAAAAAAAQF/8QAGxEAAwADAQEAAAAAAAAAAAAAAAECAwQRMzH/2gAMAwEAAhEDEQA/AI3HBLPNFVqtLrEx2sAXvdf0P1TTdCK7csMljfjewe25W3tw2rLraqy36dG4R848lRe7Da9TSduS21+8gMj5/EHJlpWpQ3DrzWJ2yLPjGUWY3fGzPvaESugjt0sN+p+kk5yJ24IVP7/Es05TA5D5PLP0iIex6SP1vOiCtuztaAHcBERUJS4gFfWf/9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"c1b8f65103d0\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f09b4f6b8bc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is the CSO of Cultivarium.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"dff5be0390e1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9d7e9a1feccc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, she was a core member and the Director of Molecular Diagnostics at Pandemic Response Lab, a high-throughput diagnostic and genome biosurveillance COVID-19 facility established for New York City.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"35b73165de80\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"bedd4d0f7fc4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Trained in Microbiology (MS), Chemistry (PhD) and Genetics (Postdoctoral Fellow), Nili has led several technology development projects in the field of synthetic biology. As a fellow at Harvard, she spearheaded construction of synthetic chromosomes, and established genome-scale engineering methods for non-model microbes. As a graduate student, she received funding from the Bill and Melinda Gates Foundation to use baker’s yeast as an environmental sensor. Her research interests span protein engineering, nanomaterials, metabolic engineering and environmental microbiology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a937d38670b4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d549ff169cde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is an avid science communicator passionate about making science more open and accessible.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nili Ostrov\",\"role\":\"Chief Scientific Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"nili-ostrov\"},\"status\":\"public\"}],\"leverTeam\":\"Cultivarium\",\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-3963273dbe4b7c41821fa38666dc6e78dd26eeef-800x121-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAADCAYAAACTWi8uAAAACXBIWXMAACE4AAAhOAFFljFgAAAApElEQVR4nDWOuwoCUQxEU9zNTHK38FYqur7xgYWgqCiCYiHa+v8fI4G1CEMSZuZISuns7h8ATwBzEenknLtmNjSzgbv3Q0spI5L/GQOYApiQbEopTewiMhUAj7quv+7+VtVNmHPOWzM7mlmU7d195+4HMzvFjeQtAEjeSV5IXiMnpXSX1vCKABHpBWFQqOoyCkJbkqCaAVio6rqqqm37X7Uas/4BZLkPfknay6MAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-b5fc569fcef1e4794848897504e3b4c9c40b1718-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAAIDAAAAAAAAAAAAAAAAAAIEBgcI/8QAIxAAAQQCAgEFAQAAAAAAAAAAAQACAxEEBQYSMRMhIkFRYf/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwDp7ZbDH10Hq5Tw1t0qeJyDCyZhG1/Vxqr+7VTl+rydhiEwTNaGC+rhdrF+OcZysqGWcTGB7ZPgXNIJ/qDZSKEDHRwsY93ZwABP6iCZ9/KAAeBSIgIiIP/Z\"}},\"crop\":null,\"hotspot\":null},\"metaPage\":{\"metaPageTitle\":\"Cultivarium\"},\"researchAreas\":[{\"_key\":\"3ba5735a6c33\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A predictive and standardized high-throughput culturing platform for reproducibly growing diverse and difficult-to-culture microbes in the lab. This allows laboratory study of these microbes and accelerates their use in basic science and industrial applications.\",\"title\":\"Microbial Cultivation at Scale\"},{\"_key\":\"2e102a1b820e\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Robotic systems to discover and optimize recombinant DNA delivery methods with a library of molecular parts (promoters, replicons, transposons, resistance markers) that can be combinatorially screened in a single experiment. This enables genetic engineering of non-model microbes in weeks rather than years.\",\"title\":\"Cross-species Genetic Toolkit\"},{\"_key\":\"ba8e9878e6e4\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A digital resource that indexes experimentally actionable information (i.e. strain availability, images, protocols, and molecular parts) for 170,000+ bacteria, fungi, archaea, and protists into one accessible portal. This platform accelerates the engineering of non-model organisms by aggregating both information from disparate databases and practical experimental techniques into actionable insights.\",\"title\":\"Microbe Information Hub\"},{\"_key\":\"7fd7a2ebae93\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Integration of foundation models with robotic lab infrastructure to synthesize published knowledge, assist hypothesis generation, and automate laboratory experimentation. This capability searches a large experimental parameter space to discover and improve enabling methods with high reproducibility and throughput.\",\"title\":\"AI-Driven Discovery\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"cultivarium\"},\"socialLinks\":[{\"_key\":\"414b0fb1b1e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\": l,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Sumner Norman\",\"role\":\"CEO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"sumner-norman\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T16:37:00Z\",\"_id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"_rev\":\"Eiw57G9wlN7pMt4O6ff4l3\",\"_system\":{\"base\":{\"id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"rev\":\"tZc8S6vheHYlC8jlhNfpLE\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T16:38:15Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-cc7cbccb3b3fa2f2bf679e1f75cc90d021f10297-500x500-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAQBAgUD/8QAIhAAAgEDBAIDAAAAAAAAAAAAAQIDAAQRBRIhMRMUBkGS/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgQBAwUG/8QAHREAAgICAwEAAAAAAAAAAAAAAAECAxMxERJBUf/aAAwDAQACEQMRAD8A8tElRbtfflkS2AyxV93X1xXY1TVNPmkCacZ+ByQCBzXC0W+f3fGoScDO4LFjFWXUjQbnkDBJcA7l6rIdfp0NVi6tExlkUkGVv2KVhLSOZA1v6jx9ZYHOaUWNC+WX02tLl2t9IeNUhe5B8rRDBarPn0r2cdrPC5EmB3yOaUq+xcyQpS2q5k97ptrEtr449u+BXbDHknulKVEdAPZ//9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"0e389d2bf73c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4333e27f9045\",\"_type\":\"span\",\"marks\":[],\"text\":\"I am the co-founder and Chief Scientific Officer of Forest Neurotech. I've spent over a decade developing implantable neural technologies to help individuals with neurological diseases. At Forest, we are creating a new generation of neurotechnology that can interface with the entire human brain, without touching the brain.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Tyson Aflalo\",\"role\":\"CSO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"tyson-aflalo\"},\"status\":\"public\"}],\"location\":\"California\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-205bbb2852f7476495965375daf46924afce177f-588x66-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAACCAYAAABYBvyLAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAV0lEQVR4nC3LTQqCUBgF0DN3IroDMTSQIDJBEDEFE5o4af9bkQff4HL/ocATD9SoAk1kE164o0OLW/jEafcOzqDEiA0rFsyBProdJ/744YMD39DpOyC/AC9QB+Zqh3+pAAAAAElFTkSuQmCC\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-528cdbe27c80980c01b29f879c7dba34241d000a-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAAMBAAAAAAAAAAAAAAAAAAIEBgj/xAAiEAABAwQBBQEAAAAAAAAAAAAAAQIDBAUREjEGITJBUWH/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A6n3Zvpsm3zPckZu6WCqqblPV0tYsD3ta1MJxjkqt6du6Mc114kVyp5fuQNcCpaqaSkt8EE0iyyMbhXr7AFsAAAAB/9k=\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"34d37b94caa3\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"There is currently no method to both sense and actuate brain function at brain-wide scale. This capability would unlock everything from fundamental science in brain (dys)function and the nature of consciousness to myriad brain diagnostics, monitoring, and therapeutic applications. \\n\",\"title\":\"Whole-Brain IO\"},{\"_key\":\"70ac1519b689\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"The ability to interact with brain function without ever damaging (or even touching) a single neuron has major downstream impact. A minimally-invasive hardware interface that supports “brain apps”: observing and modulating networks linked to additional indications via software updates and algorithms. This is a paradigm shift in neurotechnology: it unlocks software as a medical device \\\"SaMD\\\" pathways where new use cases ship as software, not new implants.\\n\",\"title\":\" A Platform for \\\"Brain Apps\\\"\"},{\"_key\":\"a580036aea71\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Along the way to Whole-Brain IO, Forest Neurotech will need to solve data standards, algorithm improvements, user data privacy concerns, and large scale data modeling. Forest plans to share its ever-growing toolbox with the neuroscience and medical communities.\\n\",\"title\":\"Open Neuroscience Infrastructure\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"forest\"},\"socialLinks\":[{\"_key\":\"c47a78efc83b\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://forestneurotech.org/\",\"internalReference\":null,\"linkType\":\"external\", unctional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:12:56Z\",\"_id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"_rev\":\"oc16HVx9EGsWFJ5XERLlDu\",\"_system\":{\"base\":{\"id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"rev\":\"XAQEqtwWGfwaiZX4sEyV9T\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:37Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-47a37bbd2787730040c98e8f81d364f7c3aed49d-3840x5120-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAbABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAUGBwL/xAAmEAABAwQBAwQDAAAAAAAAAAABAgMEAAUREgYHEyEiMTNRYXGB/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgMBBAUG/8QAIREAAgEDAwUAAAAAAAAAAAAAAQIAAxESEyFRBRQxQaH/2gAMAwEAAhEDEQA/AHVquthuscSIdskoKvIVpTdpmH8gbdOw9ScGlUK6RLfFQhlotstpJOwxg0hb6gw0zu26l3RJ9K0exrll6fm5IB2koAzbm0YSbK3IdLjDS20HxrsaKYx+Q3N5pLkOLGdZPsv7oq127e2+Q835klyyUgWWc4Fjuak4/FZVY23bhPajRZLJK1eN1Y1/dV/IFqVaJ2xJwmp/o5Hae5VJLraVlLJI2GcVpqTTQtBoJqMF5mjcfcu9ntwhuSmV6KOFIwoEH6NFdRUpS1qkAAEgD+0UpqhvG6V/Bn//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"f24b58a6c7c3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"7a018dbe9bcb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison is a Co-Founder at Parallel Squared Technology Institute, where he fosters the Institute’s ability to stay on the cutting edge of proteomics research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0cf82772ceb1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3803f77091ef\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison has been around mass spectrometers daily since 2013, happily using them to explore biology in everything from the marine environment (Ask him about tarballs!) to human disease.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f7f2ac388aea\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"40e9b6decad9\",\"_type\":\"span\",\"marks\":[],\"text\":\"After diving into the world of proteomics at the Broad Institute’s Proteomics Platform, he pursued new frontiers with Professor Nikolai Slavov at Northeastern University, where he earned a PhD in bioengineering. His doctoral work on accessible and high throughput single cell proteomics helped convince a skeptical field that single cell proteomics using mass spectrometers was robust and adoptable with common equipment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ed24a86fa072\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"73becd0a961b\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is passionate about mountain biking, nature photography, and learning to play more than one cool song on the guitar.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Harrison Specht\",\"role\":\"Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"harrison-specht\"},\"status\":\"public\"}],\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-5053da2bcef4b27ee429f044e9bf49c749a3df7a-247x60-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAFCAYAAABFA8wzAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsElEQVR4nE3QTUvCYRAE8N+lsuwk9GaWZiS9EGEnkSjool9A8RAKUtD3/wQysH/wMOzOzD7PLgO/+CtsMccVjtEunKCFoz00/mmhmbXADJ/4wgdu0MUdhlXDL3GOC/Rxj4dC+sxaYlLiCO/o4RqPeMZT+fn4thbGe8VL9UHmrDAt4w3juqBTj/PJoC7KksSRK7M0erRcnhrNPzZY4wffOMPBXk7JMAhvskwNT39YvLUDrgcN0MF2scQAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-821ff94ebfdb7910621353412e493851896a2a85-240x240-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$36\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"76ab5977468b\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"An open source software platform uniquely capable of searching data generated using standard and PTI developed multiplexing approaches. Researchers can analyze increasingly complex data from their own research applications, identifying more proteins without sacrificing quality or confidence. \",\"title\":\"Proteomics Platform Development\"},{\"_key\":\"58c45413f524\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"PTI uses novel mass tags combined with other multiplexing approaches to bring researchers the capability of analyzing greater samples of single cells faster than previously possible, unlocking research paths for groundbreaking biological discoveries and target therapies. \\n\",\"title\":\"Scaling Single-Cell Analysis\"},{\"_key\":\"1326160f605c\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Developing tools for the scientific community to study proteomics pathways is fundamental to understanding and preventing protein dysfunctions across neurodegenerative, metabolic, and other complex diseases. We created protocols to isolate single neurons from human brain tissue to study protein dysfunctions in Alzheimer’s disease, and optimized sample preparation by developing methods to isolate and tag individual immune cells to identify genetic differences in protein turnover. \",\"title\":\"Decoding Disease Mechanisms\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"pti\"},\"socialLinks\":[{\"_key\":\"91d5bff745e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.parallelsq.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"eeddae1f6dc0\",\"_type\":\"linkWithLabel\",\"label\":\"X/Twitter\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://x.com/ParallelSqTech\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":n aption\":null,\"children\":[{\"_key\":\"450954df3dd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad earned his AB at Columbia University, his PhD at MIT and completed postdoctoral training at the University of California, Berkeley.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Chad Nusbaum\",\"role\":\"Governance Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"chad-nusbaum\"},\"status\":\"public\"},{\"_createdAt\":\"2025-08-13T12:03:21Z\",\"_id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"_rev\":\"DIQGglHLJ789Bk1yAgyBfB\",\"_system\":{\"base\":{\"id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"rev\":\"pF523yb6HepLTPp3dPnvhi\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-03T16:24:34Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-b42559f83aa9e114e95a72502470abcd52a2e18d-1270x1270-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$37\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.4634665109683876,\"y\":0.43715072149470346}},\"bio\":[{\"_key\":\"16cea80a920e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"21339cc69acd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is the CEO of Convergent Research. He is working with a large and growing network of collaborators and advisors to develop a strategic roadmap for future FROs.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"65718741f248\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d4729306597d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Outside of CR, he serves on the boards of several non-profits pursuing new methods of funding and organizing scientific research including Norn Group and New Science, and as an interviewer for the Hertz Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"5737aa92471b\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"134dff467e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, he was a Schmidt Futures Innovation Fellow, a Fellow with the Federation of American Scientists (FAS), a research scientist at Google DeepMind, Chief Strategy Officer of the brain-computer interface company Kernel, a research scientist at MIT, a PhD student in biophysics with George Church and colleagues at Harvard, and a theoretical physics student at Yale. He has also previously helped to start companies like BioBright, and advised foundations such as the Open Philanthropy Project.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"6c67d6ead7ee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4c155739aa55\",\"_type\":\"span\",\"marks\":[],\"text\":\"His work has been recognized with a Technology Review 35 Innovators Under 35 Award (2018), a Fannie and John Hertz Foundation Fellowship (2010) and a Goldwater Scholarship (2008).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0e90c913b107\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"39cf4d54a20a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is a fan of sweets and his cats (Tortoiseshell) Lyra and (giant orange Maine Coon) Neo.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Adam Marblestone\",\"role\":\"CEO \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"adam-marblestone\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:11:37Z\",\"_id\":\"7e249972-1fac-4954-bdd4-f markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Governance Board\"},{\"_key\":\"2c156d9a404e\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T19:40:38Z\",\"_id\":\"68bed6c1-4e14-4b1b-8751-4897c3719c96\",\"_rev\":\"oc16HVx9EGsWFJ5XERLiMa\",\"_system\":{\"base\":{\"id\":\"68bed6c1-4e14-4b1b-8751-4897c3719c96\",\"rev\":\"XaKwKV7EhP4jfpF6WZWEOD\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:42:25Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-d97296efa1895781f8f895fc56443fe5f3bb5f03-3840x5520-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAdABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHCAL/xAAlEAACAgIBBAICAwAAAAAAAAABAwIEABEGBQchMRJBExQmMmH/xAAWAQEBAQAAAAAAAAAAAAAAAAAEAwL/xAAcEQACAwADAQAAAAAAAAAAAAABAgADERNBUYH/2gAMAwEAAhEDEQA/AGuvyarxjp1xz4Sc5tj4KTD+0zrGDiHKVcgDlzrMqWlaMlM96P2MhvX+oxtdxlVISDVqiZRET6lj727tV381un9kRetAWVSl5kfe9ZNHIIWJeleM2d7K5r/MM52fs4ZeDmJ+vWWUuXXXU5SVITI3E+RjT2ktNZzxLXSMmSgdykfOJPIz/ILUhsfKWz5xz7dgVuvvbAbnBII39byb4K/kUuvZg9mqvzqjBe3fImIJ0Rhk6qpkyuuZczchv3hmhBEsDk//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"e832b614c7f4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a5d957a3202b\",\"_type\":\"span\",\"marks\":[],\"text\":\"$38\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Karen Nelson\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"karen-nelson\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-22T20:31:38Z\",\"_id\":\"46f505fa-9d46-4409-950a-84e4a84aee80\",\"_rev\":\"FAV00vf4xIs1yUzUzbI0lB\",\"_system\":{\"base\":{\"id\":\"46f505fa-9d46-4409-950a-84e4a84aee80\",\"rev\":\"XaKwKV7EhP4jfpF6WZa6iV\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T02:57:37Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-447372e0d7f65c0aa258c94ea17a4747c58c82d6-3840x4800-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$39\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"b351787cd1f4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0f2fa6c4ed6d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil L. Kelleher, PhD, is the Walter and Mary E. Glass Professor of Molecular Biosciences, Professor of Chemistry in the Weinberg College of Arts and Sciences, and Professor of Medicine (Hematology \u0026 Oncology) in the Feinberg School of Medicine. His primary research interests include top-down proteomics, natural product discovery, and cancer biology. Kelleher is the Director of the \"},{\"_key\":\"d40bc0133139\",\"_type\":\"span\",\"marks\":[\"972c8cc6388f\"],\"text\":\"Chemistry of Life Processes Institute\"},{\"_key\":\"fd824de71cd1\",\"_type\":\"span\",\"marks\":[],\"text\":\" and Director of \"},{\"_key\":\"1e31f10eddf2\",\"_type\":\"span\",\"marks\":[\"c36f42701a0c\"],\"text\":\"Northwestern Proteomics\"},{\"_key\":\"31b825115dfe\",\"_type\":\"span\",\"marks\":[],\"text\":\". He is a member of the \"},{\"_key\":\"d5c30a2cf176\",\"_type\":\"span\",\"marks\":[\"15653051feec\"],\"text\":\"Robert H. Lurie Comprehensive Cancer Center\"},{\"_key\":\"da6bc5417cc1\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"15653051feec\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.cancer.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"972c8cc6388f\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.clp.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"c36f42701a0c\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://proteomics.northwestern.edu/)\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"856a909438c8\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a4d94a38ecbc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Neil Kelleher’s research group is focused on top-down proteomics, chromatin biology, and natural product biosynthesis and discovery. Contributing to both technology development and application of mass spectrometry in chemistry and biology, The \"},{\"_key\":\"20244f3981be\",\"_type\":\"span\",\"marks\":[\"395a3f384dc1\"],\"text\":\"Kelleher Research Group\"},{\"_key\":\"de6fd93bbc97\",\"_type\":\"span\",\"marks\":[],\"text\":\" is interested in the biosynthesis and discovery of novel natural products with potential pharmacological activities. The lab leverages top-down proteomics—the analysis of intact proteins for precise localization of post-translational modifications — to advance and contribute to the understanding of chromatin and cancer biology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"395a3f384dc1\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.kelleher.northwestern.edu\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"c165e843ecfa\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"dde71668eefe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher is both a pioneer and champion of the top-down approach and the Human Proteoform Project (HPfP), a global research initiative to weigh every protein in the human body—250,000 proteoforms in 4,000 different cell types. HPfP will enable dramatic increases in the speed and efficiency by which investigators can identify higher-value protein-based markers of disease and spur game-changing advances in biomedical research, drug development and human health.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"44904b4903b6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9b5d42720bde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher received a B.S. and B.A. from Pacific Lutheran University in 1992, a Fulbright Fellowship the following year, and a Ph.D. from Cornell University in 1997 completing his joint graduate work with Tadhg Begley and Fred McLafferty. In 1999, after a NIH Postdoctoral Fellowship at Harvard Medical School with Chris Walsh, Kelleher joined the faculty at University of Illinois at Urbana-Champaign where he established his research program in proteomics. In 2010, he joined the faculty at Northwestern University.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"b8ce691310c9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"ddf312a43a7d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Throughout his career, Kelleher has received many honors, including the Arthur P. Sloan Foundation Fellowship, Packard Fellowship, Dreyfus Award for New Investigators, Camille Dreyfus Teacher-Scholar Award, Lilly Analytical Chemistry Award and National Institutes of Health Career Transition Award. He also was a Burroughs Wellcome Fund Young Investigator and a Searle Scholar. In 2004, he received the Presidential Early Career Award for Scientists and Engineers, the nation’s highest honor for professionals at the outset of their independent research careers. Kelleher also co-founded several successful startups, including \"},{\"_key\":\"2028f6bcd12f\",\"_type\":\"span\",\"marks\":[\"ef9f67d78e99\"],\"text\":\"MicroMGx\"},{\"_key\":\"eb63326b2420\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"45cf1b0b5bfd\",\"_type\":\"span\",\"marks\":[\"59e9aa20e543\"],\"text\":\"Integrated Protein Technologies\"},{\"_key\":\"282f5fd9c058\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"59e9aa20e543\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.iptinc.com\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"ef9f67d78e99\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.micromgx.com\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"e35c31a86994\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"54ecb6f588ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kelleher has written more than 300 publications. The ProSight software suite developed by Kelleher is used by more than 1,000 labs around the world. An international leader in his field, Kelleher is the founder and president of the \"},{\"_key\":\"a17659d18fa5\",\"_type\":\"span\",\"marks\":[\"7d771654acff\"],\"text\":\"Consortium for Top-Down Proteomics\"},{\"_key\":\"0196db301661\",\"_type\":\"span\",\"marks\":[],\"text\":\", a 350-member organization with global reach.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"7d771654acff\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://www.topdownproteomics.org/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Neil Kelleher\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"neil-kelleher\"},\"status\":\"public\ acterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Impact Board\"}],\"title\":\"Parallel Squared Technology Institute\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:12Z\",\"_id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"_rev\":\"FAV00vf4xIs1yUzUzcaDyD\",\"_system\":{\"base\":{\"id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"rev\":\"XAQEqtwWGfwaiZX4sTvkAB\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-08T17:45:33Z\",\"name\":\"Biology\",\"slug\":{\"_type\":\"slug\",\"current\":\"biology\"}}],\"websiteUrl\":\"https://www.parallelsq.org/\"},\"slug\":{\"_type\":\"slug\",\"current\":\"how-to-design-1000-plex-mass-tags-using-the-differential-mass-defect\"},\"subtitle\":\"A proteomics roadmap from PTI\",\"title\":\"How to design 1000-plex mass tags using the differential mass defect\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:12Z\",\"_id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"_rev\":\"FAV00vf4xIs1yUzUzcaDyD\",\"_system\":{\"base\":{\"id\":\"df8c1b0d-ccfe-4940-98a4-7ea2b4ea694d\",\"rev\":\"XAQEqtwWGfwaiZX4sTvkAB\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-08T17:45:33Z\",\"name\":\"Biology\",\"slug\":{\"_type\":\"slug\",\"current\ ":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"04475b1f19b1\",\"_type\":\"span\",\"marks\":[],\"text\":\"Prior, he was a core member and the Director of Genomics at Pandemic Response Labs, a high-throughput diagnostic and genome biosurveillance COVID-19 facility established for New York City. He has advised and/or co-founded startups ranging from DNA data storage, synthetic biology and the microbiome.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"039620b8e2f2\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"6fb2eb727ae0\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is particularly interested in problems at the intersection of biology, hardware, and software. His background training includes electrical engineering, signal processing, synthetic and systems biology (PhD with Jim Collins), and genetics (Research Fellow with George Church).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"7a845e345733\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"c353ee4e9248\",\"_type\":\"span\",\"marks\":[],\"text\":\"Henry loves robots and he used to have a robotic dog, named Rocky.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Henry Lee\",\"role\":\"Chief Executive Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"henry-lee\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T20:19:43Z\",\"_id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"_rev\":\"XAQEqtwWGfwaiZX4sU30FL\",\"_system\":{\"base\":{\"id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"rev\":\"oc16HVx9EGsWFJ5XEE3Q1y\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:25:39Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-23fc469e3  spearheaded construction of synthetic chromosomes, and established genome-scale engineering methods for non-model microbes. As a graduate student, she received funding from the Bill and Melinda Gates Foundation to use baker’s yeast as an environmental sensor. Her research interests span protein engineering, nanomaterials, metabolic engineering and environmental microbiology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a937d38670b4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d549ff169cde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is an avid science communicator passionate about making science more open and accessible.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nili Ostrov\",\"role\":\"Chief Scientific Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"nili-ostrov\"},\"status\":\"public\"}],\"leverTeam\":\"Cultivarium\",\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-3963273dbe4b7c41821fa38666dc6e78dd26eeef-800x121-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAADCAYAAACTWi8uAAAACXBIWXMAACE4AAAhOAFFljFgAAAApElEQVR4nDWOuwoCUQxEU9zNTHK38FYqur7xgYWgqCiCYiHa+v8fI4G1CEMSZuZISuns7h8ATwBzEenknLtmNjSzgbv3Q0spI5L/GQOYApiQbEopTewiMhUAj7quv+7+VtVNmHPOWzM7mlmU7d195+4HMzvFjeQtAEjeSV5IXiMnpXSX1vCKABHpBWFQqOoyCkJbkqCaAVio6rqqqm37X7Uas/4BZLkPfknay6MAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-b5fc569fcef1e4794848897504e3b4c9c40b1718-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAAIDAAAAAAAAAAAAAAAAAAIEBgcI/8QAIxAAAQQCAgEFAQAAAAAAAAAAAQACAxEEBQYSMRMhIkFRYf/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwDp7ZbDH10Hq5Tw1t0qeJyDCyZhG1/Vxqr+7VTl+rydhiEwTNaGC+rhdrF+OcZysqGWcTGB7ZPgXNIJ/qDZSKEDHRwsY93ZwABP6iCZ9/KAAeBSIgIiIP/Z\"}},\"crop\":null,\"hotspot\":null},\"metaPage\":{\"metaPageTitle\":\"Cultivarium\"},\"researchAreas\":[{\"_key\":\"3ba5735a6c33\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A predictive and standardized high-throughput culturing platform for reproducibly growing diverse and difficult-to-culture microbes in the lab. This allows laboratory study of these microbes and accelerates their use in basic science and industrial applications.\",\"title\":\"Microbial Cultivation at Scale\"},{\"_key\":\"2e102a1b820e\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Robotic systems to discover and optimize recombinant DNA delivery methods with a library of molecular parts (promoters, replicons, transposons, resistance markers) that can be combinatorially screened in a single experiment. This enables genetic engineering of non-model microbes in weeks rather than years.\",\"title\":\"Cross-species Genetic Toolkit\"},{\"_key\":\"ba8e9878e6e4\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A digital resource that indexes experimentally actionable information (i.e. strain availability, images, protocols, and molecular parts) for 170,000+ bacteria, fungi, archaea, and protists into one accessible portal. This platform accelerates the engineering of non-model organisms by aggregating both information from disparate databases and practical experimental techniques into actionable insights.\",\"title\":\"Microbe Information Hub\"},{\"_key\":\"7fd7a2ebae93\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Integration of foundation models with robotic lab infrastructure to synthesize published knowledge, assist hypothesis generation, and automate laboratory experimentation. This capability searches a large experimental parameter space to discover and improve enabling methods with high reproducibility and throughput.\",\"title\":\"AI-Driven Discovery\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"cultivarium\"},\"socialLinks\":[{\"_key\":\"414b0fb1b1e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.cultivarium.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"93bd724916168418d6bd0ba850ff786a\",\"_type\":\"linkWithLabel\",\"label\":\"Substack\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":tr  (\"},{\"_key\":\"5da81b3a8768\",\"_type\":\"span\",\"marks\":[\"17b8dc4154ef\"],\"text\":\"Payne et al, Science 2021\"},{\"_key\":\"fe96a56a689d\",\"_type\":\"span\",\"marks\":[],\"text\":\"). Andrew maintains an active interest in metascience, including the design and implementation of new organizational models for practicing science, such as Focused Research Organizations. Andrew received his PhD from MIT, and received his BASc in Engineering Science from the University of Toronto.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"17b8dc4154ef\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.science.org/doi/10.1126/science.aay3446\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ab5a8ee3ad8f\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"433ecaa4b6ce\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Andrew Payne\",\"role\":\"Co-founder \u0026 CEO\",\"slug\":{\"_type\":\"slug\",\"current\":\"andrew-payne\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T21:03:19Z\",\"_id\":\"72e9f624-9329-43db-9928-ab85a5911021\",\"_rev\":\"oc16HVx9EGsWFJ5XEROn3N\",\"_system\":{\"base\":{\"id\":\"72e9f624-9329-43db-9928-ab85a5911021\",\"rev\":\"XAQEqtwWGfwaiZX4sEBcgR\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:27:06Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-05b96354402168b011b7dd8b82282bad89ad9e44-1000x1000-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$3c\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"c5b324c5848e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"23d91f976eb4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Jun Axup is Chief Operating Officer at E11 Bio, where she runs day-to-day operations and helps direct strategies to amplify E11's work in the world.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f89e1492974a\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4bcd5192c76e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, she was Chief Science Officer \u0026 Partner at \"},{\"_key\":\"7bb168d0a39d\",\"_type\":\"span\",\"marks\":[\"b323b7d73893\"],\"text\":\"IndieBio\"},{\"_key\":\"227f3e211d1d\",\"_type\":\"span\",\"marks\":[],\"text\":\", a leading life science accelerator, where she had funded and advised over 160 companies working on improving human and planetary health.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"b323b7d73893\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://indiebio.co/\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"3b0954a61067\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"1f1c8eeb2dde\",\"_type\":\"span\",\"marks\":[],\"text\":\"She holds a PhD in chemical biology from the Scripps Research Institute, where she developed targeted immuno-oncology drugs using unnatural amino acids (\"},{\"_key\":\"188a7e030387\",\"_type\":\"span\",\"marks\":[\"76b555de01ca\"],\"text\":\"Axup et al., PNAS 2012\"},{\"_key\":\"30e6d86a2f0a\",\"_type\":\"span\",\"marks\":[],\"text\":\"). She worked at several startups in the fields of immuno-oncology, protein engineering, lab automation robotics, and CRISPR. She was also a founder of a multiplex proteomics biotech company and a science toy company.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"76b555de01ca\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\" n\",\"marks\":[],\"text\":\"$3d\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f2fa1f40e5d1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"76f1de0cc5f6\",\"_type\":\"span\",\"marks\":[],\"text\":\"George is Professor of Genetics at Harvard Medical School and Professor of Health Sciences and Technology at Harvard and the Massachusetts Institute of Technology (MIT). He is Director of the U.S. Department of Energy Technology Center and Director of the National Institutes of Health Center of Excellence in Genomic Science. He has received numerous awards including the 2011 Bower Award and Prize for Achievement in Science from the Franklin Institute and election to the National Academy of Sciences and Engineering.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"George Church\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"george-church\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T21:04:59Z\",\"_id\":\"effe4ebf-a1d2-4877-8a4b-84d4fb9dee27\",\"_rev\":\"XAQEqtwWGfwaiZX4sU0c5X\",\"_system\":{\"base\":{\"id\":\"effe4ebf-a1d2-4877-8a4b-84d4fb9dee27\",\"rev\":\"XAQEqtwWGfwaiZX4sEBhZ1\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:47:03Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-fe6afe630a99bbe253696868b84be62a444901c6-512x512-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAQEBAQAAAAAAAAAAAAAAAAcFBAb/xAApEAACAQQBAgMJAAAAAAAAAAABAgMABAURBhMhBwhBEhQVIiMxMlFx/8QAGAEAAgMAAAAAAAAAAAAAAAAAAgMAAQT/xAAbEQACAwADAAAAAAAAAAAAAAAAAQIDEhEyQf/aAAwDAQACEQMRAD8A2OTYdL28bqRmEuxLDWxseoqeTY24tMvD7ldSleqBKrfYg1WuVZEQ2rgyRi5LfTUnue9TzkN18CkGSyKs1tMyjS/kf3qgti9JobTKOHybhsypIGjSu7jviJw6PGgTMSxYkdVfm1SqywdHiDczX+XikunLsZVH871oeYdukuIgQARewW1r1pSti6xE+sjBYr2GtUpSiIf/2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"a7e6a66110a6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f2531e1cf052\",\"_type\":\"span\",\"marks\":[],\"text\":\"David A. Markowitz is a scientist and engineer with a decade of experience leading applied research in biotechnology and artificial intelligence.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"509cb7044e1d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0daeb757aed6\",\"_type\":\"span\",\"marks\":[],\"text\":\"David is Chief Scientist at STR, an advanced technology R\u0026D services company. He founded and leads a business unit that bridges biology with information science to accelerate discovery and deliver new capabilities. Since launching this effort in 2023, he has raised $30M in public and private capital from customers including government (ARPA-H, DARPA, and other DoD/IC elements) and philanthropy (Bill \u0026 Melinda Gates Foundation), and he has forged partnerships with a broad range of industry partners working in the health, agriculture, manufacturing, and national security domains.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"264c2de5dbbe\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3bb17cc0b91a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, as an IARPA Program Manager, David Led “moonshot” applied research programs the bridged biology, engineering, and computing. He managed a $200M+ portfolio and contracted work by 500+ staff at 30+ organizations. Through this work, David delivered breakthrough technologies and capabilities for national security, and made key contributions to several emerging science and technology domains, including synthetic biology, connectomics, bioelectronics, and robotics. David also led the U.S. government’s development of computational and experimental tools for detecting engineered biological systems. In January 2020, he coordinated the U.S. national security community’s initial analysis of the SARS-CoV-2 genome.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"d7a020ec936d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"287a31d9ee62\",\"_type\":\"span\",\"marks\":[],\"text\":\"After concluding his public service in December 2022, David has served in advisory roles to funding elements of the United States Government (Department of Energy, Department of Defense, National Science Foundation), Government of Canada, and Government of United Kingdom; as well as Simons Foundation, Convergent Research, and Center for a New American Security (CNAS).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"David A. Markowitz\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"david-a-markowitz\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T21:05:13Z\",\"_id\":\"e361e0c9-f669-42d8-8428-126485ee5cb1\",\"_rev\":\"aGpldou8uDCYtULGTL18o7\",\"_system\":{\"base\":{\"id\":\"e361e0c9-f669-42d8-8428-126485ee5cb1\",\"rev\":\"aGpldou8uDCYtULGTL18MF\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T02:55:08Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-e86e57ca56e86892ec96d11adb057bb81b697aff-685x685-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBw
