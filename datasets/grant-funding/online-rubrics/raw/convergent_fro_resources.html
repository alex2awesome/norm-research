([1,", biology, materials, and energy. Hemai was a member of the Board of Directors of Phylagen and a Board Observer for several Breakout portfolio companies including Opus 12, C2Sense, Curie Co, and Napigen. Earlier in her career, Hemai specialized in scientific publishing and communications, first as North American Editor for Nature, where she oversaw the Washington, DC bureau and evaluated research articles for publication, with a focus on neuroscience. Later, as a founding editor of PLOS and Managing Editor of PLOS Biology, Hemai led an international team that selected and published outstanding research articles and magazine content across all areas of the biological sciences. Hemai is a member of the Journal of Emerging Investigators Board of Directors, the Activate Leadership Council, the CZI Imaging Advisory Board, the Hello Tomorrow Global Challenge jury, and the Moore Inventor Fellows advisory panel. She has a Ph.D. in Brain and Cognitive Sciences from the Massachusetts Institute of Technology and a B.A. in Biophysics and Russian from The Johns Hopkins University.2a:T903,"])</script><script>self.__next_f.push([1,"Now enjoying emeritus status, Prof. Stephen Smith remains active with work in computational neuroscience microscopy and genomic data science. His recent explorations have unearthed transcriptomic evidence for a previous unrecognized ubiquity of local neuropeptide signaling and possible involvement of same in memory engram formation. Smith led an active Stanford laboratory (1990-2014) that explored brain development, structure, function, and disease progression. The lab’s experimental approach typically began with invention of a new imaging method followed by applications of that method to attack previously intractable experimental challenges. Early on, Smith invented a novel fiber-optic spectrometer for calcium sensing that enabled the first detection and measurement of calcium transients in vertebrate neurons, the first quantitative measurements of presynaptic Ca transients, and the extraordinarily significant discovery of Ca influx through NMDA receptor channels. Later inventions led to numerous significant neuroscience discoveries, including retrograde actin flow within neuronal growth cones, intracellular Ca waves in astrocytes, the active role of dendritic filopodia in synaptogenesis, and the packeted delivery of synaptic protein components during synaptogenesis, and to the first optical measurements of single synaptic vesicle release, the first in vivo imaging of synaptotropic dendrite growth, and the first in vivo functional imaging measurements of visual receptive field development in a vertebrate animal. Smith’s laboratory also invented a unique and now widely used high-resolution proteomic imaging method called “Array Tomography” and applied the method to explore the molecular architecture of cortical microcircuits in mouse and human. Smith went emeritus and closed his Stanford laboratory in 2014, taking an exciting new position as Senior Investigator at the Allen Institute for Brain Science in his hometown of Seattle, Washington. At the Allen Institute he freshened up his data science proficiencies, driven by that Institutes prodigious production of extremely high-quality neuroscience data. He is now an Allen Institute Investigator Emeritus and an Allen Neural Dynamics Fellow and plans a return to California and Stanford campus life in Spring 2024."])</script><script>self.__next_f.push([1,"2b:T516,data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAACXBIWXMAABYlAAAWJQFJUiTwAAADcklEQVR4nFWU2Su2XRTG7xO9pJBIkbHIEJlDMss8z9PzPIZkKJKpkOGAZEgOFEJJyRRnDojk2P90ff1W3/1+n4N1773vtda1rjXs7ZSUlKi8vFxVVVWqq6tTU1OTWltbTerr61VUVKSUlBQlJSUpOztblZWVamlpUVtbm60NDQ2qqakxf3AcF6y2ttbA2tvbTThnZmYqKipKoaGhJpGRkUpOTlZxcbHZdnR0WOD/gzrV1dXGrLm52Qy6u7ttn5ubq4iICAUEBMjf31+BgYEKCQlRWFiY4uLiVFpaqs7OTnV1dRloY2Oj4Tik5TLr6ekxwLKyMksRx4SEBCUmJpqwDw8PN7awx6evr+8XqAMY9QCov7/fjAoKClRYWGgBZmZmtLS0pPn5eY2MjIiax8TEKDU11Wo4 ord laboratory (1990-2014) that explored brain development, structure, function, and disease progression. The lab’s experimental approach typically began with invention of a new imaging method followed by applications of that method to attack previously intractable experimental challenges. Early on, Smith invented a novel fiber-optic spectrometer for calcium sensing that enabled the first detection and measurement of calcium transients in vertebrate neurons, the first quantitative measurements of presynaptic Ca transients, and the extraordinarily significant discovery of Ca influx through NMDA receptor channels. Later inventions led to numerous significant neuroscience discoveries, including retrograde actin flow within neuronal growth cones, intracellular Ca waves in astrocytes, the active role of dendritic filopodia in synaptogenesis, and the packeted delivery of synaptic protein components during synaptogenesis, and to the first optical measurements of single synaptic vesicle release, the first in vivo imaging of synaptotropic dendrite growth, and the first in vivo functional imaging measurements of visual receptive field development in a vertebrate animal. Smith’s laboratory also invented a unique and now widely used high-resolution proteomic imaging method called “Array Tomography” and applied the method to explore the molecular architecture of cortical microcircuits in mouse and human. Smith went emeritus and closed his Stanford laboratory in 2014, taking an exciting new position as Senior Investigator at the Allen Institute for Brain Science in his hometown of Seattle, Washington. At the Allen Institute he freshened up his data science proficiencies, driven by that Institutes prodigious production of extremely high-quality neuroscience data. He is now an Allen Institute Investigator Emeritus and an Allen Neural Dynamics Fellow and plans a return to California and Stanford campus life in Spring 2024."])</script><script>self.__next_f.push([1,"40:T468,George lea esizing whole genes, and engineering whole genomes, far faster, more accurate, and less costly than current methods. George is widely recognized for his innovative contributions to genomic science and his many pioneering contributions to chemistry and biomedicine. In 1984, he developed the first direct genomic sequencing method, which resulted in the first genome sequence (the human pathogen, H. pylori). He helped initiate the Human Genome Project in 1984 and the Personal Genome Project in 2005. George invented "])</script><script>self.__next_f.push([1,"the broadly applied concepts of molecular multiplexing and tags, homologous recombination methods, and array DNA synthesizers. His many innovations have been the basis for a number of companies including Editas (Gene therapy); Gen9bio (Synthetic DNA); and Veritas Genetics (full human genome sequencing).4d:T486,, which backs deep-technology companies at the intersections of technology, biology, materials, and energy. Hemai was a member of the Board of Directors of Phylagen and a Board Observer for several Breakout portfolio companies including Opus 12, C2Sense, Curie Co, and Napigen. Earlier in her career, Hemai specialized in scientific publishing and communications, first as North American Editor for Nature, where she oversaw the Washington, DC bureau and evaluated research articles for publication, with a focus on neuroscience. Later, as a founding editor of PLOS and Managing Editor of PLOS Biology, Hemai led an international team that selected and published outstanding research articles and magazine content across all areas of the biological sciences. Hemai is a member of the Journal of Emerging Investigators Board of Directors, the Activate Leadership Council, the CZI Imaging Advisory Board, the Hello Tomorrow Global Challenge jury, and the Moore Inventor Fellows advisory panel. She has a Ph.D. in Brain and Cognitive Sciences from the Massachusetts Institute of Technology and a B.A. in Biophysics and Russian from The Johns Hopkins University.4e:T903,"])</script><script>self.__next_f.push([1,"Now enjoying emeritus status, Prof. Stephen Smith remains active with work in computational neuroscience microscopy and genomic data science. His recent explorations have unearthed transcriptomic evidence for a previous unrecognized ubiquity of local neuropeptide signaling and possible involvement of same in memory engram formation. Smith led an active Stanford laboratory (1990-2014) that explored brain development, structure, function, and disease progression. The lab’s experimental approach typically began with invention of a new imaging method followed by applications of that method to attack previously intractable experimental challenges. Early on, Smith invented a novel fiber-optic spectrometer for calcium sensing that enabled the first detection and measurement of calcium transients in vertebrate neurons, the first quantitative measurements of presynaptic Ca transients, and the extraordinarily significant discovery of Ca influx through NMDA receptor channels. Later inventions led to numerous significant neuroscience discoveries, including retrograde actin flow within neuronal growth cones, intracellular Ca waves in astrocytes, the active role of dendritic filopodia in synaptogenesis, and the packeted delivery of synaptic protein components during synaptogenesis, and to the first optical measurements of single synaptic vesicle release, the first in vivo imaging of synaptotropic dendrite growth, and the first in vivo functional imaging measurements of visual receptive field development in a vertebrate animal. Smith’s laboratory also invented a unique and now widely used high-resolution proteomic imaging method called “Array Tomography” and applied the method to explore the molecular architecture of cortical microcircuits in mouse and human. Smith went emeritus and closed his Stanford laboratory in 2014, taking an exciting new position as Senior Investigator at the Allen Institute for Brain Science in his hometown of Seattle, Washington. At the Allen Institute he freshened up his data science proficiencies, driven by that Institutes prodigious production of extremely high-quality neuroscience data. He is now an Allen Institute Investigator Emeritus and an Allen Neural Dynamics Fellow and plans a return to California and Stanford campus life in Spring 2024."])</script><script>self.__next_f.push([1,"4f:T506,data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAACXBIWXMAACE4AAAhOAFFljFgAAADZUlEQVR4nI2V208bRxTGx7RRK1WNBKrUihCgKMK7sw4X22DsUIwvXNb2+oIh5mpje+3d9ZVLSSCQPATl78ljmn+oeUDqOxLxV53xNiEJSXn4tLuzZ346c+bMN4xxPsicfJfJ/C2T+D9M4u8dEodDVm6j9w6aI/O/mJMXBYs5XUUm8ddMUt4xp3xJsB6njJ5R6XZyypcOmf8tGMRikvKGyQoNXDGJd77nLvS6vbjn8+O+P4CBmZtF/yimz+3t3OGuqy5DecOYzC+YpFwSzOGU0euZRiC3Ds0wEdOrWC7rWC5XPpMOVa8iaViY3dhE3/RMRzCIdT2zPu80vOks9NMzlJ6/QLrVhlZvItn4VDSmGiZWWm2sNNu4Px8GMQRL1GxUQu+kB4HH68g/PUH9/BW2j0/syQ0BSNQbQvSd3TtAslbHYklHwrQwFI4SsCvaLQL2+/zQqiZSjSam1nIYS2XgSqagJDS4tBRcybTQw2Qaj7Z2oFYNREtlqFUTg+EoHJ8DqdAxvYLgTh48kYQ7u4rxVAYPoouQ1BimHq8jsLmNsfQKeFyDd3UNc/kCVMMSwC8yHPAHRMGpNplWG7nDI6ztHSBhWIjkC9g+eoL6y3OoegXe7Brm87uIlMuImdbXMyRgqtlC/uQZNo6eIHf4J1YaTXjiGpbyBewcHMKtxqAsq4ibNcQtywZGbgD6PwKLZ8+xe3oGzarBk87gtykfPKkM4noVQ4FZ/B4K28DaN4B2hjERWEdgYxPDwRDujk/ip4fjUGIJBLd20E/NPhdEMF/Agoj/BlAtVxAtV8Qu98/N4w53iWNIz19mAhgMhvDzxCTuuj0YDkVEnGqYX9kUG0htsFSpwpfbwMjCkuix4cgCRqKLeLCwhBH7natxhAtFpJutm/vwI9CAVqtjdf8AiVpdtAUt67pW9/ZROj1D4eQUy1UDvz764xPgVc+o1LlnNzYdJ6qNaloCSIX/oFpX28fHsF6eI7xbwkAwhB/GJq4dPVm5IAvqnfR0Zje3kG3vI2FRZuYXmQlZFjLttlgJwb6TFRtG5qBcMCZ37YssqM/n7/xXM9q5m0T/h8IRscwfxybgkJRuZrLLti9hsMpr4WdOYWOiBW6jbt1ojvJOMITBdq+AorBx+wr4UOD/F8XSFfBWXCOcD/4LK2mQxEvQZTgAAAAASUVORK5CYII=50:T7e6,data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAACXBIWXMAAAsTAAALEwEAmpwYAAAFjElEQVR4nBXDe0zTBwLA8d//lzsnespJptuMzlOcZCJzDAWZvIpjaAF5FQoDK7Q8qowKfUCBVkoLthRa9BCUQx5aQJ0cKA7BxsEUhihI5TE3YWa45bZ/bskuS76X+yQf4bf5Dn7/7gb/fTXMHz9P8Mcvs/znp2mWnw3ysN/OF+eLaTNmc ted evolution of molecules, polymers, and whole genomes to create new tools with applications in regenerative medicine and bio-production of chemicals. Among his recent work at the Wyss is development of a technology for synthesizing whole genes, and engineering whole genomes, far faster, more accurate, and less costly than current methods. George is widely recognized for his innovative contributions to genomic science and his many pioneering contributions to chemistry and biomedicine. In 1984, he developed the first direct genomic sequencing method, which resulted in the first genome sequence (the human pathogen, H. pylori). He helped initiate the Human Genome Project in 1984 and the Personal Genome Project in 2005. George invented the broadly applied concepts of molecular multiplexing and tags, homologous recombination methods, and array DNA synthesizers. His many innovations have been the basis for a number of companies including Editas (Gene therapy); Gen9bio (Synthetic DNA); and Veritas Genetics (full human genome sequencing).59:T486,, which backs deep-technology companies at the intersections of technology, biology, materials, and energy. Hemai was a member of the Board of Directors of Phylagen and a Board Observer for several Breakout portfolio companies including Opus 12, C2Sense, Curie Co, and Napigen. Earlier in her career, Hemai specialized in scientific publishing and communications, first as North American Editor for Nature, where she oversaw the Washington, DC bureau and evaluated research articles for publication, with a focus on neuroscience. Later, as a founding editor of PLOS and Managing Editor of PLOS Biology, Hemai led an international team that selected and published outstanding research articles and magazine content across all areas of the biological sciences. Hemai is a member of the Journal of Emerging Investigators Board of Directors, "])</script><script>self.__next_f.push([1,"the Activate Leadership Council, the CZI Imaging Advisory Board, the Hello Tomorrow Global Challenge jury, and the Moore Inventor Fellows advisory panel. She has a Ph.D. in Brain and Cognitive Sciences from the Massachusetts Institute of Technology and a B.A. in Biophysics and Russian from The Johns Hopkins University.5a:T903,"])</script><script>self.__next_f.push([1,"Now enjoying emeritus status, Prof. Stephen Smith remains active with work in computational neuroscience microscopy and genomic data science. His recent explorations have unearthed transcriptomic evidence for a previous unrecognized ubiquity of local neuropeptide signaling and possible involvement of same in memory engram formation. Smith led an active Stanford laboratory (1990-2014) that explored brain development, structure, function, and disease progression. The lab’s experimental approach typically began with invention of a new imaging method followed by applications of that method to attack previously intractable experimental challenges. Early on, Smith invented a novel fiber-optic spectrometer for calcium sensing that enabled the first detection and measurement of calcium transients in vertebrate neurons, the first quantitative measurements of presynaptic Ca transients, and the extraordinarily significant discovery of Ca influx through NMDA receptor channels. Later inventions led to numerous significant neuroscience discoveries, including retrograde actin flow within neuronal growth cones, intracellular Ca waves in astrocytes, the active role of dendritic filopodia in synaptogenesis, and the packeted delivery of synaptic protein components during synaptogenesis, and to the first optical measurements of single synaptic vesicle release, the first in vivo imaging of synaptotropic dendrite growth, and the first in vivo functional imaging measurements of visual receptive field development in a vertebrate animal. Smith’s laboratory also invented a unique and now widely used high-resolution proteomic imaging method called “Array Tomography” and applied the method to explore the molecular architecture of cortical microcircuits in mouse and human. Smith went emeritus and closed his Stanford laboratory in 2014, taking an exciting new position as Senior Investigator at the Allen Institute for Brain Science in his hometown of Seattle, Washington. At the Allen Institute he freshened up his data science proficiencies, driven by that Institutes prodigious production of extremely high-quality neuroscience data. He is now an Allen Institute Investigator Emeritus and an Allen Neural Dynamics Fellow and plans a return to California and Stanford campus life in Spring 2024."])</script><script>self.__next_f.push([1,"5b:T61e,data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAACXBIWXMAAAPoAAAD6AG1e1JrAAAENklEQVR4nJXSa0xTZwAG4FJvJDCNTkWnRBmjIAzQVfBW5oyY+IMtLgHdRadOR2MVUEop0MCB3k5prUClwOntnFpK21MLvWCTKjB1EC8jE0P8wRjeNmMWt2k252Wo77JpTMy2ZH2T7++T9/vej8P5jwCcGMvnH7xGlWxJpkoLcoz7CnK0n21OFm/fFMfhcGI40YYliuLZ2t3rQ2oheYIUBrx1O4JUyRaVYke+4AUaXVyK4uS+Jgk56tSMT/Q0P7zM1D/0y/eO64sLGiUfv5sSNRjSV+ZetKlCP/RaHv026MWdiBVDxqo/jpYWRsq35a2N9toxkfbadeds2oFvu6knt086cStM46JFDotk+yDx6cb3CILgRtXwK1q/+jxz5ORol3Hyqt+Ga0EaIw79ZEBZ1mc++Mk6ANENM2TT5Vyg9cFLtP7RmLsNEz7TX+BPJ/VVlKNamM6JNl5NZUaAlNj6dNW/DBrqcdpAIKipuNJVJ/rCfGjPnKhBrahogaF0p7izRjjurjsAW7XwmUm692KHtPh9mtgZGzVYJBLFa8SirZRs/zeW2pJnDqUYIWPDmMt8uGo3acjmS6lZnP8zDJ8aniZoCc/L07C5Jbp2uaO9aaL/WCuGfDaEffb7RIdtZKPc2p4ls29bJbcvy9ews4pYdsq/YumtbDz/SPCd1U1B4Qqtj1mv6bwibbM/oF1umLzdOGRhsbHRMZlZ7/gxk3AOrlB0NfOV7qKVClfieuLLqf9olkmy/OU6f1O2LjCSqun5OVHumkxtcCCHdGKl1oM0ksWbChZvyT3gKdyPeQr3bZ7SE0lXunZlEcfmvwKmqbtfz1Ad35Oh8V9K1wae8HRBJB/uBa85/PdJ1IWwUN2DRHUPktTdWKL0YZHci0UN7ntJ9U5PuswuSCfY6S9BnoxNSlGyZArpu7VM34tV1AAKu0dQfvoqJGcm8KF3GGktESzWBLGY9GOBwofZhAezZc6n82XHriTVMAdeaZkgbnt7cQ3NLFV47mYZItgaGAV56Q7Ya7/Df+M+FOdvYo31LBY2hjBX1YOZdW7EVjKYUWFDnJS5kyCljUvKqbTnGkFw55Ub1yZUmMNv1DoeZbWewp7+6zCO3Ufo5gMc/+5XVJ+9Dr7pDOaoehBHeDBdQoN7oA0xB82YIWEezpbaAgmV5tzngxRT05KqrPlLKqgzi6SWJyn6XhSGx6G4fA8to3exf+AmculhzFUHESvrwtRKO7gl7eAIW8ApM worthy, science-backed tools for Monitoring, Reporting, and Verification (MRV). We’re adapting advanced oceanographic models to provide scientifically credible methods for quantifying carbon removal and assessing ecosystem impacts from CDR deployments. These capabilities are delivered through our open-source software platform, C-Star, which is designed to ensure standardization, auditability, and transparency—foundational elements of a high-integrity CDR market. We work closely with commercial CDR companies, registries, and buyers to provide tools that meet requirements for site characterization, deployment design, and robust MRV. In parallel, we partner with the academic community to advance the science of CDR quantification an"])</script><script>self.__next_f.push([1,"d integrate cutting-edge capabilities into C-Star. We aim to establish a new community of practice that fosters continuous research and development, supports tools that track the best available science and technology, and drives capacity-building initiatives that promote inclusive access and broad participation in the future of ocean-based CDR.62:T722,data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAATCAYAAACQjC21AAAACXBIWXMAABYlAAAWJQFJUiTwAAAE+0lEQVR4nE3P6U/TBwDG8d9/tCzZMpdlc25MnVgVoS2gpVDachSQFgpWKNQWQWgtVRChHCrYcpRLLhkoDAtONq544jHQoSKCKKAcpea7YNzii0++757kEaYX19ky9Zm/X6/xcOE949PztF8f41RZLVkFpZxzt9MzMsn4zFvuvVr/6O6rde7MrXHr5SoTs6sIM2832PLP/3w8mlvBO/EQV2MXBSfspCjjORIRTab2KA6Hk6aeG4xOz/NwYf2jB/Pr3H+1yu3ZZYTZJR+fe760wejkU6qq3OSnZWBVKbHLJBQrDlGaEIdNp6cgt5D2/mEezC0z/Wbj46v7LxcZfngPYeGdny3zn/rizXv6rw/jMJooVERwIToMT9wh2nVKuo5pqc1Ix5p+jMqLddyefsGzJR/TC+8YezzJFW8TwpvVD/zn7eoHZheX6e3u5UzKEUojQ6hXSelIiqAnVUVvZjKdlgwqTEaqnBVMTE4xt+xjau41g+P9eNoKEFbW/GxZ/tSXC4v0tLVReCQWm3QPzvBAWtRiOhMP0aCRUZMSS1V2Oi5nKbfuPGB+eY3Hz5/SN1RHrScDYd3nZ23Dz+qGn/frPmaeTtFWXY4tTo5x/w7Mu7dRKf0Zj0JESdhOHJFBVBoS8BTbuf3nX8y+mmP8rpfWDjsXagwIPv8HfJv+j1beL3FvvJ8Gm4GzMeE4wvZgP7CdqrBdtGpCqY2V4E6W02pJpfusjQc3Bnnx4gkjEz20dRZz4dJxhE2/n03/Jr7NTV6 adata\":{\"lqip\":\"$24\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"abf533041683\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"16780fcf753f\",\"_type\":\"span\",\"marks\":[],\"text\":\"Alicia Karspeck, Ph.D., is a co-founder at [C]Worthy and the CTO. She was formerly the Director of Earth Information Program at SilverLining—with a focus on accelerating the accessibility of Earth system data and models. She spent over 10 years at NCAR leading the global ocean and coupled data assimilation efforts for the CESM model and has held technical leadership roles at multiple private risk analytics firms.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Alicia Karspeck\",\"role\":\"CTO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"alicia-karspeck\"},\"status\":\"public\"}],\"location\":\"Boulder, CO\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-b77903336d8416b789ea5f37f3ca78b821881fb1-1053x250-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAFCAYAAABFA8wzAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWklEQVR4nEWQzS8DURTFu5DGwkeakghBJBZSbOjQee9OJxi0pu/e99RILEiFlR2Jhf+zW5FK6byPUn8BeRKxOMnNOcnvnpyClvxpcMr2bCtcsyLc1whnDqHynsGsS2sLb6145ksGZYtssptVil7+tsjm31rbS/2DoPwSL49/x/FYt1IpFqxkj1rBtSF2YgUjI+HCqmh/KHnTIb8yGKXuFJJBG3Zzqm3mzdqmRVa1iqElkFpy8L4vNBB8vWAUuzfEb7RkR5rC45xAOoREU9QxCA+a4M4pfqWJdSzBnSW4tMTFUEW3jviNEfzcZxrh2mCY/TeU0NLE2h5oVT34kBBbZHtDBQ3/zCjIHLGOE/zQqGjLYJiOEBIneC2XcDHwcAzrhb8NeyJYzxESDxyJeLWXQuk5Sab7Mii/N2C2T9XFIUWLoxRKOosn9Ekw97tzY2fqVYUbueKHn1m08gMCP6g/Nz8I/QAAAABJRU5ErkJggg==\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-0d277ab4107771ad9e5a0e91dadc507e61883695-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGgABAAIDAQAAAAAAAAAAAAAAAAMEAQIGCP/EACYQAAMAAgIABQQDAAAAAAAAAAECAwAEBREGEyExURIUMjVBYXP/xAAYAQADAQEAAAAAAAAAAAAAAAABBAUAAv/EAB4RAAICAgIDAAAAAAAAAAAAAAABAiEDERJBUXHB/9oADAMBAAIRAxEAPwD0ZyXL11eYWBMk1Ul5tHf36/rINvxIlNen2IK3VS6iyFQ4HxlLxHJr880p+WatrgolPZiG76zbk97Zvpv53HjWlOTB6V67B69lxWU5bdlWGDG1B6v387Om47YbZ0YXcANRAxAxkPB/p9P/ACGMZjaRNyJKbS8lmmtClkq8kai/ixHqMzsQlsT+i81onww7GMZtIHJ1ZIiqihUACj0AH8YxjCcn/9k=\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"9e181e1ba4e2\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Our flagship product, C-Star, standardizes and eases the process of running oceanographic models to provide scientifically credible MRV. It integrates open-source physical and biogeochemical models within software infrastructure that ensures ease-of-use, transparency, reproducibility, and auditability of carbon removal claims.\",\"title\":\"C-Star\"},{\"_key\":\"a4afa2370315\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A curated collection of standard datasets describing regional and global variations in CDR efficiency and other metrics. The Atlas supports deployment design, technoeconomic analysis, policy development—and low-cost MRV calculations. \",\"title\":\"Ocean CDR Atlas\"},{\"_key\":\"b32dd0749e9a\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A growing constellation of regional ocean modeling domains adhering to common standards and serving both research and carbon crediting needs. C-SON supports globally consistent carbon accounting, provides infrastructure for pilot project design and quantification, and fosters international collaboration to advance consensus on scientific and technical methods. Key goals include establishing global coverage with refined domains in areas of high interest to ocean-based CDR market actors and researchers (with an eye on supporting Global South ocean-based CDR initiatives), and generating new high-resolution datasets for the Ocean CDR Atlas.\",\"title\":\"C-Star Ocean Network\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"cworthy\"},\"socialLinks\":[{\"_key\":\"425fac713dac\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.cworthy.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"ffa15c040b64\",\"_type\":\"linkWithLabel\",\"label\":\"LinkedIn\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.linkedin.com/company/cworthy/posts/?feedView=all\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"ab93598aa649\",\"_type\":\"linkWithLabel\",\"label\":\"X/Twitter\",\"link\":{\"_type\":\"universalLink\",\"additionalPropert 8T20:19:43Z\",\"_id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"_rev\":\"XAQEqtwWGfwaiZX4sU30FL\",\"_system\":{\"base\":{\"id\":\"54b7cb5f-75d5-49f4-bf1a-a9db2eed3ae7\",\"rev\":\"oc16HVx9EGsWFJ5XEE3Q1y\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T20:25:39Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-23fc469e39a8dcf1cda1863c2d502e56187e6916-750x750-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAcBAwQF/8QAIxAAAQQBAwQDAAAAAAAAAAAAAQACAwQRBhIhBQciMSNxkf/EABUBAQEAAAAAAAAAAAAAAAAAAAQF/8QAGxEAAwADAQEAAAAAAAAAAAAAAAECAwQRMzH/2gAMAwEAAhEDEQA/AI3HBLPNFVqtLrEx2sAXvdf0P1TTdCK7csMljfjewe25W3tw2rLraqy36dG4R848lRe7Da9TSduS21+8gMj5/EHJlpWpQ3DrzWJ2yLPjGUWY3fGzPvaESugjt0sN+p+kk5yJ24IVP7/Es05TA5D5PLP0iIex6SP1vOiCtuztaAHcBERUJS4gFfWf/9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"c1b8f65103d0\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"f09b4f6b8bc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is the CSO of Cultivarium.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"dff5be0390e1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"9d7e9a1feccc\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, she was a core member and the Director of Molecular Diagnostics at Pandemic Response Lab, a high-throughput diagnostic and genome biosurveillance COVID-19 facility established for New York City.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"35b73165de80\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"bedd4d0f7fc4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Trained in Microbiology (MS), Chemistry (PhD) and Genetics (Postdoctoral Fellow), Nili has led several technology development projects in the field of synthetic biology. As a fellow at Harvard, she spearheaded construction of synthetic chromosomes, and established genome-scale engineering methods for non-model microbes. As a graduate student, she received funding from the Bill and Melinda Gates Foundation to use baker’s yeast as an environmental sensor. Her research interests span protein engineering, nanomaterials, metabolic engineering and environmental microbiology.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"a937d38670b4\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d549ff169cde\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nili is an avid science communicator passionate about making science more open and accessible.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nili Ostrov\",\"role\":\"Chief Scientific Officer\",\"slug\":{\"_type\":\"slug\",\"current\":\"nili-ostrov\"},\"status\":\"public\"}],\"leverTeam\":\"Cultivarium\",\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-3963273dbe4b7c41821fa38666dc6e78dd26eeef-800x121-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAADCAYAAACTWi8uAAAACXBIWXMAACE4AAAhOAFFljFgAAAApElEQVR4nDWOuwoCUQxEU9zNTHK38FYqur7xgYWgqCiCYiHa+v8fI4G1CEMSZuZISuns7h8ATwBzEenknLtmNjSzgbv3Q0spI5L/GQOYApiQbEopTewiMhUAj7quv+7+VtVNmHPOWzM7mlmU7d195+4HMzvFjeQtAEjeSV5IXiMnpXSX1vCKABHpBWFQqOoyCkJbkqCaAVio6rqqqm37X7Uas/4BZLkPfknay6MAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotype at can be combinatorially screened in a single experiment. This enables genetic engineering of non-model microbes in weeks rather than years.\",\"title\":\"Cross-species Genetic Toolkit\"},{\"_key\":\"ba8e9878e6e4\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"A digital resource that indexes experimentally actionable information (i.e. strain availability, images, protocols, and molecular parts) for 170,000+ bacteria, fungi, archaea, and protists into one accessible portal. This platform accelerates the engineering of non-model organisms by aggregating both information from disparate databases and practical experimental techniques into actionable insights.\",\"title\":\"Microbe Information Hub\"},{\"_key\":\"7fd7a2ebae93\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Integration of foundation models with robotic lab infrastructure to synthesize published knowledge, assist hypothesis generation, and automate laboratory experimentation. This capability searches a large experimental parameter space to discover and improve enabling methods with high reproducibility and throughput.\",\"title\":\"AI-Driven Discovery\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"cultivarium\"},\"socialLinks\":[{\"_key\":\"414b0fb1b1e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":true,\"externalLink\":null,\"handled\":tru fea46ddc6b010cdde60e8c-800x800-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$26\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"fe66fb5729e6\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"a54380296f65\",\"_type\":\"span\",\"marks\":[],\"text\":\"Dr. Andrew Payne is a scientist and engineer with a decade of experience inventing and building technologies for precisely mapping biological systems in genomics and neuroscience. As founder and CEO at E11 Bio, he is currently leading a moonshot research program to develop breakthrough technology for precisely mapping brain circuits at the scale of mammalian brains. Previously at MIT, Andrew invented and developed technologies unifying DNA sequencing and microscopic imaging, including methods for spatially precise genome sequencing within intact cells and embryos (\"},{\"_key\":\"5da81b3a8768\",\"_type\":\"span\",\"marks\":[\"17b8dc4154ef\"],\"text\":\"Payne et al, Science 2021\"},{\"_key\":\"fe96a56a689d\",\"_type\":\"span\",\"marks\":[],\"text\":\"). Andrew maintains an active interest in metascience, including the design and implementation of new organizational models for practicing science, such as Focused Research Organizations. Andrew received his PhD from MIT, and received his BASc in Engineering Science from the University of Toronto.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"17b8dc4154ef\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":true,\"href\":\"https://www.science.org/doi/10.1126/science.aay3446\",\"linkType\":\"external\",\"mediaItem\":null}],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ab5a8ee3ad8f\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"433ecaa4b6ce\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVi to accelerate discovery and deliver new capabilities. Since launching this effort in 2023, he has raised $30M in public and private capital from customers including government (ARPA-H, DARPA, and other DoD/IC elements) and philanthropy (Bill \u0026 Melinda Gates Foundation), and he has forged partnerships with a broad range of industry partners working in the health, agriculture, manufacturing, and national security domains.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"264c2de5dbbe\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3bb17cc0b91a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, as an IARPA Program Manager, David Led “moonshot” applied research programs the bridged biology, engineering, and computing. He managed a $200M+ portfolio and contracted work by 500+ staff at 30+ organizations. Through this work, David delivered breakthrough technologies and capabilities for national security, and made key contributions to several emerging science and technology domains, including synthetic biology, connectomics, bioelectronics, and robotics. David also led the U.S. government’s development of computational and experimental tools for detecting engineered biological systems. In January 2020, he coordinated the U.S. national security community’s initial analysis of the SARS-CoV-2 genome.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"d7a020ec936d\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"287a31d9ee62\",\"_type\":\"span\",\"marks\":[],\"text\":\"After concluding his public service in December 2022, David has served in advisory roles to funding elements of the United States Government (Department of Energy, Department of Defense, National Science Foundation), Government of Canada, and Government of United Kingdom; as well as Simons Foundation, Convergent Research, and Center for a New American Security (CNAS).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"David A. Markowitz\",\"role\":\"Scientific Advisory Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"david-a-markowitz\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T21:05:13Z\",\"_id\":\"e361e0c9-f669-42d8-8428-126485ee5cb1\",\"_rev\":\"aGpldou8uDCYtULGTL18o7\",\"_system\":{\"base\":{\"id\":\"e361e0c9-f669-42d8-8428-126485ee5cb1\",\"rev\":\"aGpldou8uDCYtULGTL18MF\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T02:55:08Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-e86e57ca56e86892ec96d11adb057bb81b697aff-685x685-webp\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQEAAwAAAAAAAAAAAAAAAAcFBAYI/8QAJRAAAQQCAgEDBQAAAAAAAAAAAgABAwQFBhESMQcTFCEiQWGB/8QAGAEAAgMAAAAAAAAAAAAAAAAAAwYAAQX/xAAfEQACAgEEAwAAAAAAAAAAAAABAgADBRIycbETNDX/2gAMAwEAAhEDEQA/ALJvuwyYKlVGswvZtytDG5eB/axNU26SzsFjBZOUZbYh7scoh1Yh/LLJ9Z4bV/JYEaUox/Hm9wyfwzLoAWcjifVSDJnG1ir16cgfP0fy6niuLqVUlSIQPSKmDEahPQpv9zouJWtx2oQmhLsBNyzorgpN99sSvmujk/Vmd2ZT3YbMsGLKWIuJO/HP9RE04z544bszDyHvHlehKjoFmU9bhcjd37EiIlNNojDbvM//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"154bab3b8487\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"0d78fa2ced13\",\"_type\":\"span\",\"marks\":[],\"text\":\"Hemai Parthasarathy leads a team at \"},{\"_key\":\"d922cffdc1f5\",\"_type\":\"span\",\"marks\":[\"26e77d0cfff1\"],\"text\":\"X, the Moonshot Factory\"},{\"_key\":\"e5f238d5139d\",\"_type\":\"span\",\"marks\":[],\"text\":\", w D8yTV85DvPLS4oJUQMYxjYTnqz//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"3a5f5b27dd8b\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"77fafb933b35\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd Huffman, MSc is cofounder of the BIL Conference. The BIL Conference is trying to make the world a better place through bold vision and action. Todd arranges a lot of the basic infrastructure for the conference, as well as coordinates the various teams in the open culture community.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"bad5c2195323\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"1394ac8320d6\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd is also Chief Scientist for Sofcoast, a company producing field communication technologies. Their projects include: ASAP – Affordable Stationary Aerial Platform – an inexpensive aerostat for wireless repeaters, Three2Link – Mobile software for logging and information sharing in the field, and FirstKit – A systems integration platform oriented towards field communications.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"94b2891762b1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"b3acb14079a0\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is also on the Board of Directors of Humanity+. Humanity+ is an international nonprofit membership organization which advocates the ethical use of technology to expand human capacities. They support the development of, and access to, new technologies that enable everyone to enjoy better minds, better bodies, and better lives. In other words, they want people to be better than well.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"556210b1244c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"44b563584471\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd has worked as a consultant for Suspended Animation and as a Field Team Member for the Alcor Life Extension Foundation. He was also a volunteer for the Methuselah Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"8b940bc24cda\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"221ac63a7365\",\"_type\":\"span\",\"marks\":[],\"text\":\"Todd earned his Master’s in Computational Biosciences at Arizona State University and his Bachelor’s in Neuroscience at the California State University at Long Beach. He earned his Graduate Certificate in Entrepreneurship and Innovation Studies at Nanyang Technical University, Singapore.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Todd Huffman\",\"role\":\"Senior Advisor \u0026 Co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"todd-huffman\"},\"status\":\"public\"}],\"title\":\"Advisors\"}],\"title\":\"E11 Bio\",\"topics\":[{\"_createdAt\":\"2025-09-08T10:29:29Z\",\"_id\":\"fa40bb6f-8aab-44a0-952c-eb8ba2f76fcf\",\"_rev\":\"DIQGglHLJ789Bk1yAgySEx\",\"_system\":{\"base\":{\"id\":\"fa40bb6f-8aab-44a0-952c-eb8ba2f76fcf\",\"rev\":\"XaKwKV7EhP4jfpF6WKmNQ9\"}},\"_type\":\"topic\",\"_updatedAt\":\"2025-10-03T16:29:56Z\",\"name\":\"Artificial Intelligence\",\"slug\":{\"_type\":\"slug\",\"current\":\"ai\"}}],\"websiteUrl\":\"https://e11.bio/\"},{\"_createdAt\":\"2025-09-22T20:40:10Z\",\"_id\":\"dd24281a-2a9d-42ce-9749-657f764acecb\",\"_rev\":\"Mo7ZMz1r1V9cW36tATu8Wf\",\"_system\":{\"base\":{\"id\":\"dd24281a-2a9d-42ce-9749-657f764acecb\",\"rev\":\"x40W3zaTSGk0CSwuiH09aW\"}},\"_type\":\"fro\",\"_updatedAt\":\"2025-12-11T21:25:14Z\",\"about\":[{\"_key\":\"4e370b8ee993\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"aa6e924f6ea6\",\"_type\":\"span\",\"marks\":[],\"text\":\"EvE Bio’s five-year mission is to actualize a new biomedical discipline: mapping the pharmome. Pharmome mapping identifies all the unintended targets (“off-targets”) of small-molecule pharmaceutical drugs, because no drug is perfect; no drug acts at only its single intended target in the human body. Yet today pharmaceutical developers consider only a relative handful of ‘bad actors’ in their efforts to identify their drugs’ off-targets, leaving the vast extent of the druggable genome mostly unconsidered.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"backgroundImage\":{\"altText\":null,\"asset\":{\"_id\":\"image-84735b43109d40b2aeb228cf0b4b5e75575d3488-2732x4096-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAeABQDASIAAhEBAxEB/8QAGQAAAwADAAAAAAAAAAAAAAAAAAQFAgMG/8QAJBAAAQQCAQMFAQAAAAAAAAAAAQACAxEEIRIFE1EHMTJBYXH/xAAVAQEBAAAAAAAAAAAAAAAAAAABAP/EABYRAQEBAAAAAAAAAAAAAAAAAAARAf/aAAwDAQACEQMRAD8AkZ/pPBldUfnR5roiXBwaB7Uu/wAXpuXDBHGDE6gGlx+1nj5nIEAiwUw2SQ77hA/iJipV/Rch7rd2rQnjJOTfcQmCouKeLuXCh5pPSycoiWm62oM2Y+Blusj8VmECTFEgJ+N0UwVvbIKGjvekKZFlujZxcS7xpCIbj//Z\"}},\"crop\":null,\"hotspot\":null},\"categories\":null,\"description\":\"Mapping the pharmome\",\"established\":\"2023-09-24\",\"icon\":{\"altText\":null,\"asset\":{\"_id\":\"image-4f0480d8fd042775bf453230e82cab2ee227432d-893x894-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAY 9:44Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-00aced45a2a9d339403d18d86b1cc58a6ba68ae8-400x400-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAUCAwYE/8QAIRAAAQMEAgMBAAAAAAAAAAAAAQACAwQFERIhMRMiYbH/xAAXAQEAAwAAAAAAAAAAAAAAAAAEAgMF/8QAGxEBAQACAwEAAAAAAAAAAAAAAQACMQMSITL/2gAMAwEAAhEDEQA/AOZpmxMic+c+z3asH1U7jYoqWg8rKoSyYyWk/inV1OyKK3TT8tB2IzwQq92qYYrds2GJmzdGEd8oDlttDDjOvtyc0LS/o9Ispi8PIRSi3vuk76iGBsmNWsGAFrv48UNvDOAfbH3CIqnbMPkpcNQ+Zpe/GckcBERISDf/2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"6081482e63d5\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"7de157a12757\",\"_type\":\"span\",\"marks\":[],\"text\":\"Elaine Houskeeper (née McVey) is a co-founder of EvE Bio. She holds a B.A. in Neuroscience from Amherst College and Master of Statistics from North Carolina State University. She spent her early career as a scientist in protein folding and cell biology labs, after which she served at Becton Dickinson's R\u0026D center as a data scientist, working across cell therapy, diabetes technology, and smart device programs, contributing to several publications and patents. Most recently she built and led data science teams at a number of early-stage startups, helping grow them from pre-Series A to successful exits. Outside of the data world, she keeps busy camping, mountain biking, trail running, and trying to keep up with her two sons.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Elaine McVey Houskeeper\",\"role\":\"CEO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"elaine-mcvey-houskeeper\"},\"stat  tools industry. In his spare time Bill facilitates the conversion of sunlight and tempests into fleet-footed steeds on his farm in Durham County.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"William Busa\",\"role\":\"CSO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"william-busa\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T15:21:55Z\",\"_id\":\"8ac63e3c-b4b2-4a66-bfd2-7c50e2eab830\",\"_rev\":\"tZc8S6vheHYlC8jlhNe8hU\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T15:22:26Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-6c86cf38e1c59c8310d703c3ededed0b14d93134-400x400-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGgABAAIDAQAAAAAAAAAAAAAAAAUGAQMHBP/EACAQAAICAgIDAQEAAAAAAAAAAAEDAAIEEQUxBhMhMlH/xAAWAQEBAQAAAAAAAAAAAAAAAAACAwT/xAAbEQADAAIDAAAAAAAAAAAAAAAAAQIDEhMhM//aAAwDAQACEQMRAD8Ao2dk+uwsmlmX70B2J5uRz89dFuZiJsth6X+gJZuCylpyLmyKsJB/Q+TfkPJo2j8PHpUjVCu2zMnK0tUapwy52bIVRHrqSNbG9fyJi2ifn2JMB2BvjfG8f4cWoSS1hBtex2TOeZuGlC2FddEDfcRHk6tFo8mRNaVIJ12YiICJ/9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"a7e8c53af517\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"092150164799\",\"_type\":\"span\",\"marks\":[],\"text\":\"Jeff DiBerto is a co-founder of EvE Bio. He is a recent PhD recipient from the lab of Bryan Roth at the University of North Carolina at Chapel Hill, where he studied the pharmacology of G protein-coupled receptors, with a focus on opioid and serotonin receptors. He is a co-author of research publications in leading journals including \"},{\"_key\":\"afe82ae9ca28\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Cell\"},{\"_key\":\"45e63eea7ee1\",\"_type\":\"span\",\"marks\":[],\"text\":\", \"},{\"_key\":\"3a922f4ea5a0\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Nature\"},{\"_key\":\"beee85ea73e9\",\"_type\":\"span\",\"marks\":[],\"text\":\", and \"},{\"_key\":\"883a9d3789b2\",\"_type\":\"span\",\"marks\":[\"em\"],\"text\":\"Nature Chemical Biology\"},{\"_key\":\"02cb923dfdd1\",\"_type\":\"span\",\"marks\":[],\"text\":\" on topics including the structure of the hallucinogen-activated Gq-coupled 5-HT2a receptor, structure-based design of selective bitopic ligands for the μ-opioid receptor, and structure genomics of the human opioid receptor system. He is a co-inventor of the TRUPATH open-source biosensor platform for interrogating the GPCR transducerome. Jeff lives in Durham with his cat, Bokonon.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Jeff DiBerto\",\"role\":\"Director of Assay Development and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"jeff-diberto\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T15:22:30Z\",\"_id\":\"4312f3da-2a5b-46bc-bed2-00a2b4378aa2\",\"_rev\":\"HiUjQBQ9ExUpexm6nDvVfG\",\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T15:26:36Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-2b667a174dac282241db5f8ef0cdebe85c74c3a0-400x400-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAAMBAAAAAAAAAAAAAAAAAAMFBgL/xAAkEAACAgIBAwQDAAAAAAAAAAABAwIEAAUREiExBgcUYSIyQf/EABYBAQEBAAAAAAAAAAAAAAAAAAQBAv/EABsRAAICAwEAAAAAAAAAAAAAAAABAhEDEiNR/9oADAMBAAIRAxEAPwDr0vSq3dgyewkFrV3ESeOTlrvtfr2pmak4GcB5gczurbH5LBNa5mXHT1+OcuLNxNOm4uilc+kkmGCm6Y/FBPGzKyWCf15+yMZPVmXJDIH8ZdxjIGM/tLbjtEVhLpUZx547E98g  of neuroscience, engineering, and impact-driven entrepreneurship. His research in ultrasonic brain-computer interfaces (BCIs) is forging new paths in neurotechnology to improve our understanding and treatment of neurological injuries and diseases. In 2023, Sumner co-founded Forest Neurotech, a nonprofit focused research organization based on his research at Caltech introducing ultrasonic BCIs – a high-performance technique that offers a minimally invasive approach to monitoring and stimulating brain-wide function. In addition to research, Sumner has been active in state and federal government advocacy for scientific research, education, and innovation.‍\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Sumner Norman\",\"role\":\"CEO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"sumner-norman\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-24T16:37:00Z\",\"_id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"_rev\":\"Eiw57G9wlN7pMt4O6ff4l3\",\"_system\":{\"base\":{\"id\":\"7e319be8-2e07-49c3-a413-d0a388a98fd6\",\"rev\":\"tZc8S6vheHYlC8jlhNfpLE\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-24T16:38:15Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-cc7cbccb3b3fa2f2bf679e1f75cc90d021f10297-500x500-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAQBAgUD/8QAIhAAAgEDBAIDAAAAAAAAAAAAAQIDAAQRBRIhMRMUBkGS/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgQBAwUG/8QAHREAAgICAwEAAAAAAAAAAAAAAAECAxMxERJBUf/aAAwDAQACEQMRAD8A8tElRbtfflkS2AyxV93X1xXY1TVNPmkCacZ+ByQCBzXC0W+f3fGoScDO4LFjFWXUjQbnkDBJcA7l6rIdfp0NVi6tExlkUkGVv2KVhLSOZA1v6jx9ZYHOaUWNC+WX02tLl2t9IeNUhe5B8rRDBarPn0r2cdrPC5EmB3yOaUq+xcyQpS2q5k97ptrEtr449u+BXbDHknulKVEdAPZ//9k=\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"0e389d2bf73c\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4333e27f9045\",\"_type\":\"span\",\"marks\":[],\"text\":\"I am the co-founder and Chief Scientific Officer of Forest Neurotech. I've spent over a decade developing implantable neural technologies to help individuals with neurological diseases. At Forest, we are creating a new generation of neurotechnology that can interface with the entire human brain, without touching the brain.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Tyson Aflalo\",\"role\":\"CSO and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"tyson-aflalo\"},\"status\":\"public\"}],\"location\":\"California\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-205bbb2852f7476495965375daf46924afce177f-588x66-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAACCAYAAABYBvyLAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAV0lEQVR4nC3LTQqCUBgF0DN3IroDMTSQIDJBEDEFE5o4af9bkQff4HL/ocATD9SoAk1kE164o0OLW/jEafcOzqDEiA0rFsyBProdJ/744YMD39DpOyC/AC9QB+Zqh3+pAAAAAElFTkSuQmCC\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-528cdbe27c80980c01b29f879c7dba34241d000a-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGAABAAMBAAAAAAAAAAAAAAAAAAIEBgj/xAAiEAABAwQBBQEAAAAAAAAAAAAAAQIDBAUREjEGITJBUWH/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A6n3Zvpsm3zPckZu6WCqqblPV0tYsD3ta1MJxjkqt6du6Mc114kVyp5fuQNcCpaqaSkt8EE0iyyMbhXr7AFsAAAAB/9k=\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"34d37b94caa3\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"There is currently no method to both sense and actuate brain function at brain-wide scale. This capability would unlock everything from fundamental science in brain (dys)function and the nature of consciousness to myriad brain diagnostics, monitoring, and therapeutic applications. \\n\",\"title\":\"Whole-Brain IO\"},{\"_key\":\"70ac1519b689\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"The ability to interact with brain function without ever damaging (or even touching) a single neuron has major downstream impact. A minimally-invasive hardware interface that supports “brain apps”: observing and modulating networks linked to additional indications via software updates and algorithms. This is a paradigm shift in neurotechnology: it unlocks software as a medical device \\\"SaMD\\\" pathways where new use cases ship as software, not new implants.\\n\",\"title\":\" A Platform for \\\"Brain Apps\\\"\"},{\"_key\":\"a580036aea71\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Along the way to Whole-Brain IO, Forest Neurotech will need to solve data standards, algorithm improvements, user data privacy concerns, and large scale data modeling. Forest plans to share its ever-growing toolbox with the neuroscience and medical communities.\\n\",\"title\":\"Open Neuroscience Infrastructure\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"forest\"},\"socialLinks\":[{\"_key\":\"c47a78efc83b\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://forestneurotech.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"4420ce1e721d\",\"_type\":\"linkWithLabel\",\"label\":\"LinkedIn\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.linkedin.com/company/forest-neurotech/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}}],\"status\":\"public\",\"supportedBy\":[\"Eric and Wendy Schmidt   \",\"Griffin Catalyst\",\"Riley \u0026 Susan Bechtel Foundation  \",\"James Fickel\"],\"teamSections\":null,\"title\":\"Forest Neurotech\",\"topics\":[{\"_createdAt\":\"2025-09-24T16:32:29Z\",\"_id\":\"809b01b4-0f8a-4e06-88d5-dd3a7016ef3b\",\"_rev\":\"Eiw57G9wlN7pMt4O6febq7\",\"_type\":\"topic\",\"_updatedAt\":\"2025-09-24T16:32:32Z\",\"name\":\"Neuroscience\",\"slug\":{\"_type\":\"slug\",\"current\":\"neuroscience\"}}],\"websiteUrl\":\"https://forestneurotech.org/\"},{\"_createdAt\":\"2025-09-24T15:27:17Z\",\"_id\":\"d3df13b3-2bfc-45b9-adf7-0f08a5e2c615\",\"_rev\":\"x40W3zaTSGk0CSwuiGznXC\",\"_system\":{\"base\":{\"id\":\"d3df13b3-2bfc-45b9-adf7-0f08a5e2c615\",\"rev\":\"FAV00vf4xIs1yUzUzcTur1\"}},\"_type\":\"fro\",\"_updatedAt\":\"2025-10-14T18:20:46Z\",\"about\":[{\"_key\":\"21c480237aaa\",\"_type\":\"block\",\"asset\":nu nior Principal Researcher in the RiSE group at \"},{\"_key\":\"f12079735292\",\"_type\":\"span\",\"marks\":[\"ee6a57f45677\"],\"text\":\"Microsoft Research\"},{\"_key\":\"b656adf0baad\",\"_type\":\"span\",\"marks\":[],\"text\":\", where he worked for 17 years starting in 2006. Prior to that, he worked as a Computer Scientist at \"},{\"_key\":\"c234ec509cf8\",\"_type\":\"span\",\"marks\":[\"0390ac316b4c\"],\"text\":\"SRI International\"},{\"_key\":\"d6be3845684d\",\"_type\":\"span\",\"marks\":[],\"text\":\". His research areas are automated reasoning, theorem proving, decision procedures, SAT and SMT. He is the main architect of several automated reasoning tools: Lean, Z3, Yices 1.0 and SAL. Leo’s work in automated reasoning has been acknowledged with a series of prestigious awards, including the CAV, Haifa, and Herbrand awards, as well as the ACM SIGPLAN Programming Languages Software Award twice for Z3 and Lean. Leo’s work has also been reported in the New York Times and many popular science magazines such as Wired, Quanta, Nature News, and Scientific American.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[{\"_key\":\"dfdf04a5fa63\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://aws.amazon.com\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"032a4eb0f3be\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://lean-fro.org/\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"d9b9fc0b0d87\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"https://www.linkedin.com/in/sebastian-ullrich-901b33267/\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"ee6a57f45677\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"href\":\"http://research.microsoft.com/\",\"linkType\":\"external\",\"mediaItem\":null},{\"_key\":\"0390ac316b4c\",\"_type\":\"internalLink\",\"advancedSettings\":false,\"blank\":false,\"h  Lean FRO, which he co-founded together with Leonardo de Moura, creator of Lean, in 2023. A Lean contributor since 2015, Sebastian was drawn to the project by its focus on general language design as well as user interaction. He wrote his PhD thesis on the design and extensibility of the user-facing “frontend” of Lean 4, the current version of Lean. He is the main author of Lean 4’s macro system Lean’s notational flexibility is based on.\\n\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Sebastian Ullrich\",\"role\":\"Head of Engineering and co-founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"sebastian-ullrich\"},\"status\":\"public\"}],\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-cb124ac885f912fb98a9a77d244d8c3262c3e8c5-1761x603-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAHCAYAAAAIy204AAAACXBIWXMAAAsTAAALEwEAmpwYAAAA9UlEQVR4nIXSXUtCQRDG8R+ds+doZZZRpL0YZJZphvbeRRddFER3ff/vEmMbhBe1MOyy+/CfZ2ZWYoKW71WjW3FacVZyV/CCIxRZs4J+wRumaOb71oKVuEL7l7iBNazjsOQJF1jNmngfFbyW3GKXwGgvWInZH8BeyX3JTZyzrpu4LnnAsOYYHWwvWEvAyNRp0muyXzHMLmaJy4pR7JgnxtiJBA360ZZI9J/D6Oc5TgIWpWfQoGaAzaw9wKTkWcljLicAy7EYEPbyYMY1J3GfSw0jYWIjBlLwoeI9MY+pLkdiGhH9yf2M8sPNVk7w8zviB/QrPr8ApO0Q+vpe8YAAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-f94cbbe6f541a8b37adc770b2c4bc682d2177524-240x240-jpg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAUABQDASIAAhEBAxEB/8QAGQABAAIDAAAAAAAAAAAAAAAAAAMEAQUI/8QAHxAAAgIBBAMAAAAAAAAAAAAAAQIAAxEEEiExBRNS/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AOp3sRASzAAdzAurIUh1w3A5 (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:12:56Z\",\"_id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"_rev\":\"oc16HVx9EGsWFJ5XERLlDu\",\"_system\":{\"base\":{\"id\":\"34838607-a17c-4d02-9f50-74a253ffda44\",\"rev\":\"XAQEqtwWGfwaiZX4sEyV9T\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:37Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-47a37bbd2787730040c98e8f81d364f7c3aed49d-3840x5120-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAbABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAUGBwL/xAAmEAABAwQBAwQDAAAAAAAAAAABAgMEAAUREgYHEyEiMTNRYXGB/8QAGQEAAgMBAAAAAAAAAAAAAAAAAgMBBAUG/8QAIREAAgEDAwUAAAAAAAAAAAAAAQIAAxESEyFRBRQxQaH/2gAMAwEAAhEDEQA/AHVquthuscSIdskoKvIVpTdpmH8gbdOw9ScGlUK6RLfFQhlotstpJOwxg0hb6gw0zu26l3RJ9K0exrll6fm5IB2koAzbm0YSbK3IdLjDS20HxrsaKYx+Q3N5pLkOLGdZPsv7oq127e2+Q835klyyUgWWc4Fjuak4/FZVY23bhPajRZLJK1eN1Y1/dV/IFqVaJ2xJwmp/o5Hae5VJLraVlLJI2GcVpqTTQtBoJqMF5mjcfcu9ntwhuSmV6KOFIwoEH6NFdRUpS1qkAAEgD+0UpqhvG6V/Bn//2Q==\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"f24b58a6c7c3\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"7a018dbe9bcb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison is a Co-Founder at Parallel Squared Technology Institute, where he fosters the Institute’s ability to stay on the cutting edge of proteomics research.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0cf82772ceb1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"3803f77091ef\",\"_type\":\"span\",\"marks\":[],\"text\":\"Harrison has been around mass spectrometers daily since 2013, happily using them to explore biology in everything from the marine environment (Ask him about tarballs!) to human disease.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"f7f2ac388aea\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"40e9b6decad9\",\"_type\":\"span\",\"marks\":[],\"text\":\"After diving into the world of proteomics at the Broad Institute’s Proteomics Platform, he pursued new frontiers with Professor Nikolai Slavov at Northeastern University, where he earned a PhD in bioengineering. His doctoral work on accessible and high throughput single cell proteomics helped convince a skeptical field that single cell proteomics using mass spectrometers was robust and adoptable with common equipment.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"ed24a86fa072\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"73becd0a961b\",\"_type\":\"span\",\"marks\":[],\"text\":\"He is passionate about mountain biking, nature photography, and learning to play more than one cool song on the guitar.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Harrison Specht\",\"role\":\"Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"harrison-specht\"},\"status\":\"public\"}],\"location\":\"Watertown, MA\",\"logo\":{\"altText\":null,\"asset\":{\"_id\":\"image-5053da2bcef4b27ee429f044e9bf49c749a3df7a-247x60-svg\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAFCAYAAABFA8wzAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsElEQVR4nE3QTUvCYRAE8N+lsuwk9GaWZiS9EGEnkSjool9A8RAKUtD3/wQysH/wMOzOzD7PLgO/+CtsMccVjtEunKCFoz00/mmhmbXADJ/4wgdu0MUdhlXDL3GOC/Rxj4dC+sxaYlLiCO/o4RqPeMZT+fn4thbGe8VL9UHmrDAt4w3juqBTj/PJoC7KksSRK7M0erRcnhrNPzZY4wffOMPBXk7JMAhvskwNT39YvLUDrgcN0MF2scQAAAAASUVORK5CYII=\"}},\"crop\":null,\"hotspot\":null},\"logotypeIcon\":{\"altText\":null,\"asset\":{\"_id\":\"image-821ff94ebfdb7910621353412e493851896a2a85-240x240-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$2c\"}},\"crop\":null,\"hotspot\":null},\"researchAreas\":[{\"_key\":\"76ab5977468b\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"An open source software platform uniquely capable of searching data generated using standard and PTI developed multiplexing approaches. Researchers can analyze increasingly complex data from their own research applications, identifying more proteins without sacrificing quality or confidence. \",\"title\":\"Proteomics Platform Development\"},{\"_key\":\"58c45413f524\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"PTI uses novel mass tags combined with other multiplexing approaches to bring researchers the capability of analyzing greater samples of single cells faster than previously possible, unlocking research paths for groundbreaking biological discoveries and target therapies. \\n\",\"title\":\"Scaling Single-Cell Analysis\"},{\"_key\":\"1326160f605c\",\"_type\":\"card\",\"link\":{\"_type\":\"linkWithEnable\",\"enable\":false,\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":null,\"internalReference\":null,\"linkType\":\"internal\",\"mediaItem\":null,\"queryParams\":null}},\"text\":\"Developing tools for the scientific community to study proteomics pathways is fundamental to understanding and preventing protein dysfunctions across neurodegenerative, metabolic, and other complex diseases. We created protocols to isolate single neurons from human brain tissue to study protein dysfunctions in Alzheimer’s disease, and optimized sample preparation by developing methods to isolate and tag individual immune cells to identify genetic differences in protein turnover. \",\"title\":\"Decoding Disease Mechanisms\"}],\"slug\":{\"_type\":\"slug\",\"current\":\"pti\"},\"socialLinks\":[{\"_key\":\"91d5bff745e1\",\"_type\":\"linkWithLabel\",\"label\":\"Learn more\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.parallelsq.org/\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"eeddae1f6dc0\",\"_type\":\"linkWithLabel\",\"label\":\"X/Twitter\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://x.com/ParallelSqTech\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"6d8a3cd2726f\",\"_type\":\"linkWithLabel\",\"label\":\"BlueSky\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://bsky.app/profile/parallelsq.bsky.social\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"5be9f312e8ef\",\"_type\":\"linkWithLabel\",\"label\":\"LinkedIn\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.linkedin.com/company/parallelsqtech/posts/?feedView=all\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}},{\"_key\":\"f96c73135aff\",\"_type\":\"linkWithLabel\",\"label\":\"YouTube\",\"link\":{\"_type\":\"universalLink\",\"additionalProperties\":null,\"anchor\":null,\"blank\":false,\"externalLink\":null,\"handled\":true,\"href\":\"https://www.youtube.com/@ParallelSquared\",\"internalReference\":null,\"linkType\":\"external\",\"mediaItem\":null,\"queryParams\":null}}],\"status\":\"public\",\"supportedBy\":[\"Eric and Wendy Schmidt\",\"Ken Griffin\"],\"teamSections\":[{\"_key\":\"4d2bb78dd2f5\",\"_type\":\"section\",\"members\":[{\"_createdAt\":\"2025-09-22T19:39:33Z\",\"_id\":\"dc152c15-58cd-499f-b176-d0137a058826\",\"_rev\":\"6WtiBizt6GSRcp6LvN4MuY\",\"_system\":{\"base\":{\"id\":\"dc152c15-58cd-499f-b176-d0137a058826\",\"rev\":\"XaKwKV7EhP4jfpF6WZWKgd\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-08T03:00:14Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-6367b2719d479c61afc9b87b3af741405a7b3c72-3840x5628-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAdABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAcIBAX/xAAnEAACAQMDAwMFAAAAAAAAAAABAgMABAUGESEHMVESE2EUFjKRsf/EABcBAAMBAAAAAAAAAAAAAAAAAAIDBAX/xAAdEQEAAgICAwAAAAAAAAAAAAABABECAwQSITFR/9oADAMBAAIRAxEAPwCgLi4aK1maIbyKhKj52rnaHyN3kbSWS8YtzxvtuD4padY9ZXeH+nsMdcew86kySDuBS+w+tsnjJ7Nosg2yMAyA8Nz3NIV7DNHRw3ZrX76lZ0Vgxt8t5j7a5U7iWMN+xRTbkCU0ycOt0LRy2+WcRyWyD2nR/mlrgJospn7PHwGKFrmQIrEfiKYPX2VvtVRvwZhuKR+lZnh1Fi5EYhxOhB8c0GOA+ZXhy89ePUl64mMWGMtbRX9QhjCb+dhRWCGZjChPcqP5RRXJG1tn/9k=\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.47841017095205174,\"y\":0.22375214385487216}},\"bio\":[{\"_key\":\"f92280fabcf1\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"e83707a55aec\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad’s career vision has been to create, improve and leverage technologies for maximal impact in key scientific areas. He came to Cellarity from the Broad Institute, where he served many roles over the years. Most recently at Broad he was the founding Senior Director of the Broad Technology Labs, an internal innovation hub that he built to create powerful new capabilities in genomics and technology and to make them available to the research community. As\"},{\"_key\":\"0324d2a28713\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\" \"},{\"_key\":\"5235d9df7460\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chief Technology Officer at Cellarity, Chad is continuing this theme of fit-for-purpose data and innovative data generation processes as the engine of scientific progress. To this end, data generation is configured to propel the science forward, while technology development creates opportunities for previously unreachable scientific achievements.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"1af59e623683\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"450954df3dd8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Chad earned his AB at Columbia University, his PhD at MIT and completed postdoctoral training at the University of California, Berkeley.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Chad Nusbaum\",\"role\":\"Governance Board\",\"slug\":{\"_type\":\"slug\",\"current\":\"chad-nusbaum\"},\"status\":\"public\"},{\"_createdAt\":\"2025-08-13T12:03:21Z\",\"_id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"_rev\":\"DIQGglHLJ789Bk1yAgyBfB\",\"_system\":{\"base\":{\"id\":\"ad408832-66f3-47b7-96d2-8571da15a43f\",\"rev\":\"pF523yb6HepLTPp3dPnvhi\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-10-03T16:24:34Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-b42559f83aa9e114e95a72502470abcd52a2e18d-1270x1270-png\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"$2d\"}},\"crop\":{\"bottom\":0,\"left\":0,\"right\":0,\"top\":0},\"hotspot\":{\"x\":0.4634665109683876,\"y\":0.43715072149470346}},\"bio\":[{\"_key\":\"16cea80a920e\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"21339cc69acd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is the CEO of Convergent Research. He is working with a large and growing network of collaborators and advisors to develop a strategic roadmap for future FROs.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"65718741f248\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"d4729306597d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Outside of CR, he serves on the boards of several non-profits pursuing new methods of funding and organizing scientific research including Norn Group and New Science, and as an interviewer for the Hertz Foundation.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"5737aa92471b\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"134dff467e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Previously, he was a Schmidt Futures Innovation Fellow, a Fellow with the Federation of American Scientists (FAS), a research scientist at Google DeepMind, Chief Strategy Officer of the brain-computer interface company Kernel, a research scientist at MIT, a PhD student in biophysics with George Church and colleagues at Harvard, and a theoretical physics student at Yale. He has also previously helped to start companies like BioBright, and advised foundations such as the Open Philanthropy Project.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"6c67d6ead7ee\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"4c155739aa55\",\"_type\":\"span\",\"marks\":[],\"text\":\"His work has been recognized with a Technology Review 35 Innovators Under 35 Award (2018), a Fannie and John Hertz Foundation Fellowship (2010) and a Goldwater Scholarship (2008).\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"},{\"_key\":\"0e90c913b107\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"39cf4d54a20a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Adam is a fan of sweets and his cats (Tortoiseshell) Lyra and (giant orange Maine Coon) Neo.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Adam Marblestone\",\"role\":\"CEO \u0026 Co-Founder\",\"slug\":{\"_type\":\"slug\",\"current\":\"adam-marblestone\"},\"status\":\"public\"},{\"_createdAt\":\"2025-09-18T23:11:37Z\",\"_id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"_rev\":\"XAQEqtwWGfwaiZX4sTziDf\",\"_system\":{\"base\":{\"id\":\"7e249972-1fac-4954-bdd4-f553e7601c1f\",\"rev\":\"XaKwKV7EhP4jfpF6WLRtTZ\"}},\"_type\":\"person\",\"_updatedAt\":\"2025-09-22T19:43:24Z\",\"avatar\":{\"altText\":null,\"asset\":{\"_id\":\"image-1b2910fa64fd6097a12dfae4104cd79760af3ec1-3840x2560-heif\",\"_type\":\"sanity.imageAsset\",\"altText\":null,\"metadata\":{\"lqip\":\"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAANABQDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAYHAgT/xAAjEAABAwQCAQUAAAAAAAAAAAABAgMEAAUREgYhURMxMnGB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAgEF/8QAGxEAAgIDAQAAAAAAAAAAAAAAAAIBAxESURP/2gAMAwEAAhEDEQA/AN2WwyLJdkPs+pGiOjAQ0fn4Bp7lWC4mMuRq462UblG/uPH3SFGu8vKApzbKwv8AarXJbk5aeOMvtJ3OqTgnHZFZr01O22BpHSNTHY70lakwlgA4xsKK4Lg7tMdXqAVncgHHZopeacJmT//Z\"}},\"crop\":null,\"hotspot\":null},\"bio\":[{\"_key\":\"4730008cc6b9\",\"_type\":\"block\",\"asset\":null,\"avatar\":null,\"buttons\":null,\"caption\":null,\"children\":[{\"_key\":\"5eb54b027ef2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Nikolai Slavov received undergraduate education from MIT and a doctoral degree from Princeton University for characterizing the coordination of cellular growth with gene expression and metabolism. The Slavov laboratory pioneered experimental and computational methods for single-cell proteomics and used them to connect protein covariation across single cells to functional phenotypes, including macrophage polarization, emergence of drug resistance priming, early mammalian development, and stem cell differentiation. These technologies provided a foundation for establishing Parallel Squared Technology Institute (PTI). Prof. Slavov organizes the annual single-cell proteomics conference and contributes to organizing other leading conferences.\"}],\"image\":null,\"link\":null,\"logotype\":null,\"markDefs\":[],\"muxVideo\":null,\"style\":\"normal\"}],\"name\":\"Nikolai Slavov\",\"role\":\"Director\",\"slug\":{\"_type\":\"slug\",\"current\":\"nikolai-slavov\"},\"status\":\"public\"}],\"title\":\"Governance Board\"},{\"_key\":\"2c156d9a404e\",\"
