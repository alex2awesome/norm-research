icably, Woori wakes up back in high school, right beside Subin who has no idea that he just killed his deskmate. Trapped in a deadly time loop where almost every timeline ends with his death at Subin’s hands, Woori becomes desperate to escape his fate. After multiple resets, Woori finally comes to the conclusion that the only path to survival may be ensuring Subin’s happiness. With just one life left, Woori sets out to give Subin the happiest life possible.","synopsisHtml":"Woori Nam has always been the golden boy—wealthy, carefree, and untouchably lucky. But on the leap day of 2028, his 7th real birthday, everything changes. A seemingly harmless reunion with an old classmate, Subin Shin, ends in a brutal murder. And then, inexplicably, Woori wakes up back in high school, right beside Subin who has no idea that he just killed his deskmate. Trapped in a deadly time loop where almost every timeline ends with his death at Subin’s hands, Woori becomes desperate to escape his fate. After multiple resets, Woori finally comes to the conclusion that the only path to survival may be ensuring Subin’s happiness. With just one life left, Woori sets out to give Subin the happiest life possible.","followsTotal":3426,"ratedAvg":9.5,"ratedCount":222,"contentRating":"safe","links":{"al":"https://anilist.co/manga/186961/","mal":"https://myanimelist.net/manga/178403/","mu":"https://www.mangaupdates.com/series/alhw73j/","md":"https://mangadex.org/title/f4701df1-d681-439a-88ea-e18d5e11b884/","mb":"https://mangabaka.org/116614/"},"url":"https://comix.to/title/l2jz-the-law-of-immutability","uploadUrl":"https://comix.to/user/upload/l2jz","editUrl":"https://comix.to/user/manga/l2jz/edit"},{"id":50327,"hid":"gxgm9","title":"Barbarian\u0027s Adventure in a Fantasy World","type":"manhwa","status":"releasing","originalLanguage":"ko","poster":{"medium":"https://static.comix.to/c639/i/f/d6/68e0ce08effd5@280.jpg","large":"https://static.comix.to/c639/i/f/d6/68e0ce08effd5.jpg"},"latestChapter":55," -freedom","uploadUrl":"https://comix.to/user/upload/rm7l","editUrl":"https://comix.to/user/manga/rm7l/edit"},{"id":84763,"hid":"y0vvn","title":"I Wish My Husband Were Dead","type":"manhwa","status":"releasing","originalLanguage":"ko","poster":{"medium":"https://static.comix.to/a772/i/5/da/68e7834f18ca9@280.jpg","large":"https://static.comix.to/a772/i/5/da/68e7834f18ca9.jpg"},"latestChapter":54,"finalChapter":0,"finalVolume":0,"hasChapters":true,"chapterUpdatedAtFormatted":"2d ago","createdAtFormatted":"7mos ago","updatedAtFormatted":"7mos ago","startDate":"2025","endDate":"?","year":2025,"rank":163,"synopsis":"Cordelia Vasquez, the eldest daughter of Vasquez, one of the eight sacred founding families is sold off to the Abram family for money. \n\nWhat awaits her is a constant cycle of mistreatment by her new life. One day, her unfaithful husband gets into an accident and loses all his memories. \n\nBut his body is now possessed by none other than the legendary sorcerer, Leonard Atrey, who was supposed to be dead. Seeing this as her golden chance at freedom, Cordelia immediately shoves divorce papers at Leonard. However, he refuses, saying, \u0022If you want my signature, you have to do what I say.\u0022 \n\nFeeling the deal is unfairly stacked against her, Cordelia counters by saying that she’ll keep his secret if he agrees to become her mentor. Leonard repeatedly tries to refuse, but her pitiable situation finally breaks his resolve. They forge a contract as master and apprentice. but while her husband’s memories are gone, Cordelia’s scheming mother-in-law and her brother make their move to seize control of the family. \n\nTo stop their schemes and to take revenge on Maximilian, the man who murdered Leonard…both of them decided to set off together fulfilling that goal.\n\n**Official Translations:**  \n[Japanese](https://mechacomic.jp/books/230060)","synopsisHtml":"Cordelia Vasquez, the eldest daughter of Vasquez, one of the eight sacred founding families is sold of d":10483,"hid":"q2qr","title":"Saving My Sweetheart","type":"manhwa","status":"releasing","originalLanguage":"ko","poster":{"medium":"https://static.comix.to/5c88/i/5/d5/68de89b7e722f@280.jpg","large":"https://static.comix.to/5c88/i/5/d5/68de89b7e722f.jpg"},"latestChapter":169,"finalChapter":0,"finalVolume":0,"hasChapters":true,"chapterUpdatedAtFormatted":"11h ago","createdAtFormatted":"7mos ago","updatedAtFormatted":"7mos ago","startDate":"2021","endDate":"?","year":2021,"rank":765,"synopsis":"Finally, it was their first night.\n\nLeticia whispered, leaning her forehead against his chest, \u0022As expected, is it too far? Should I get closer?\u0022\n\nDietrian barely swallowed a groan. His hand grasping Leticia\u0027s shoulder was shaking with a sweet faze, but she didn\u0027t notice.\n\n\u0022I know that you\u0027re uncomfortable. But please bear with me until my mother comes.\u0022\n\nDietrian hated Leticia. It was natural as Leticia\u0027s mother killed his family. She had never doubted the fact. So she didn\u0027t know, how badly his face was distorted by her words.\n\n\u0022You just have to put up with me for half a year. Then, I will divorce you as you wish.\u0022\n\nAt the word \u0027divorce,\u0027 he grit his teeth.\n\n---\nDespite being the daughter of the Holy Empire’s most revered divine leader, Leticia is rumored to be a ruthless, bloodthirsty tyrant. The thing is… none of the rumors are true! After years of living as her vindictive mother’s scapegoat, Leticia is ultimately cursed to die if she doesn’t kill her beloved husband, King Ditrian, with her own two hands. But when the clock miraculously resets to mere days before their wedding, she gets a second chance to save not only Ditrian, but his entire kingdom. This time, will the world recognize the real Leticia before it’s too late, or is history doomed to repeat itself?\n\n---\n**Original Webtoon:** [Daum](https://webtoon.kakao.com/content/%EB%8B%A4%EC%A0%95%ED%95%9C-%EA%B7%B8%EB%8C%80%EB%A5%BC-%EC%A pite being the daughter of the Holy Empire’s most revered divine leader, Leticia is rumored to be a ruthless, bloodthirsty tyrant. The thing is… none of the rumors are true! After years of living as her vindictive mother’s scapegoat, Leticia is ultimately cursed to die if she doesn’t kill her beloved husband, King Ditrian, with her own two hands. But when the clock miraculously resets to mere days before their wedding, she gets a second chance to save not only Ditrian, but his entire kingdom. This time, will the world recognize the real Leticia before it’s too late, or is history doomed to repeat itself?\u003Cbr\u003E\n\u003Cbr\u003E\n---\u003Cbr\u003E\n\u003Cb\u003EOriginal Webtoon:\u003C/b\u003E \u003Ca href=\u0022https://webtoon.kakao.com/content/%EB%8B%A4%EC%A0%95%ED%95%9C-%EA%B7%B8%EB%8C%80%EB%A5%BC-%EC%A7%80%ED%82%A4%EB%8A%94-%EB%B0%A9%EB%B2%95/2485\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003EDaum\u003C/a\u003E, \u003Ca href=\u0022https://page.kakao.com/home/56704518\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003EKakaoPage\u003C/a\u003E\u003Cbr\u003E\n\u003Cbr\u003E\n\u003Cb\u003EOfficial Translations:\u003C/b\u003E\u003Cbr\u003E\n* English: \u003Ca href=\u0022https://radishfiction.com/stories/17978\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003ERadish\u003C/a\u003E, \u003Ca href=\u0022https://tapas.io/series/saving-my-sweetheart/info\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003ETapas\u003C/a\u003E\u003Cbr\u003E\n* \u003Ca href=\u0022https://www.podoteng.com/\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003EChinese (Simplified) / 汉语\u003C/a\u003E\u003Cbr\u003E\n* \u003Ca href=\u0022https://tw.kakaowebtoon.com/content/%E5%8F%AA%E6%83%B3%E5%AE%88%E8%AD%B7%E6%BA%AB%E6%9F%94%E7%9A%84%E4%BD%A0/171\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003EChinese (Traditional) / 漢語\u003C/a\u003E\u003Cbr\u003E\n* \u003Ca
