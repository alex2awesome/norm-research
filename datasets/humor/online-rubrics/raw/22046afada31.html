rative and friendly space, open to anyone, hosted by Dan French. \n\nWhat Happens Each Week\n3:00 PM — Doors open\nAsk specific questions about the comedy industry, get career advice.\n\n3:30–5:00 PM — Workshop\nEach week features a rotating theme or skill: joke structure, late-night monologue jokes, roasts, brand writing, writing for other comics, punch-up practice, topical jokes, voice, delivery, and more.\n\nWe usually:\n\nlearn or discuss a writing technique or format\n\ndo guided writing exercises\n\nget on stage to share material\n\ngive and receive supportive feedback and tags\n\nIt’s not a mic. It’s not a show.\n\nIt’s a development space — collaborative, fun, and fast-moving.\n\nWhat You’ll Get Out of It\nnew jokes every week\n\nstronger punchlines and structure\n\npractice writing in different formats\nclear insight into the business side of comedy\n\nhow to earn money writing jokes\na consistent weekly writing routine\n\na supportive community of comedy-nerds\n\nA working session to map your fastest path to paid work in comedy\n\nPractical direction on what you do best and where it pays (standup, acting, writing, digital)\n\nComics, writers, storytellers, speakers who want real income, not just stage time\n\nTalent with pieces in place but no clear plan to monetize\n\n \nWho Teaches It\nThe workshop is led by Dan French — Emmy-nominated late-night comedy writer, standup comedian, speaker, and ex-professor. His career includes:\n\nstaff writer for The Late Late Show, Dennis Miller, and The Best Damn Sports Show Period\n\nwriter for George Lopez, Wanda Sykes, and David Letterman\n\n3,000+ standup performances -- clubs, cruises, corporate, etc, etc\n\nPh.D. in Rhetoric\n\nformer professor at UT Austin, Cal State Fullerton, and University of Louisville\n\nDan brings a rare combination of writing expertise, industry experience, and teaching ability. Connect with Dan on Instagram @comedyaccelerator. You can join the Facebook group and sign up for the newsletter at https://linktr.ee/comedyaccelerator"])</script><script>self.__next_f.push([1,"1b:T6db,Jay Larson is a high-energy stand-up comedian, actor, and writer known for explosive storytelling, fearless honesty, and unforgettable live performances. A true road comic with years of national touring under his belt, Larson delivers stand-up that is raw, personal, and relentlessly funny—blending anxiety, relationships, and everyday chaos into massive, crowd-shaking laughs. \n\nHe has released multiple stand-up specials, including Sounds Like Bruce, Me Being Me, Here We Go Again, and a Don’t Tell Comedy special, each capturing his signature intensity and emotional punch. Larson has also been featured on Comedy Central’s This Is Not Happening, where his ability to build real-life stories into jaw-dropping comedic moments set him apart. \n\nLarson is most widely known for his iconic “wrong number” bit, originally performed on Conan. The clip became an instant classic and remains one of the most beloved stand-up moments of its era, perfectly showcasing his animated delivery and gift for turning a simple situation into a full-blown comedic explosion. \n\nOnstage, Jay Larson is electric. His shows are fast, loud, honest, and deeply relatable, pulling audiences in from the first line and never letting up. Whether performing in an intimate comedy club or a packed theater, Larson creates an atmosphere that feels urgent, unpredictable, and completely alive. \n\nHe is also the co-creator and former co-host of the cult-favorite podcast The CrabFeast, which built a fiercely loyal fanbase and helped shape the early comedy podcast landscape. \n\nJay Larson continues to tour nationwide, selling out venues with a live show that leaves audiences buzzing, hoarse from laughter, and telling everyone they know not to miss him when he comes back.1c:T4b9,{\"@context\":\"https://schema.org\",\"@type\":\"ComedyClub\",\"name\":\"The Creek and The Cave\",\"url\":\"https://www.creekandcave.com\",\"descri ve the open mic circuit a try. Come see The Creek’s weekly open mics and find out for yourself.\\n\\nAustin open mics are also often frequented by both local legends and some of stand-ups biggest superstars who are looking to work on new material, or just treat fans to a surprise set. You’ll laugh, you’ll cry. You’ll see some bombs.\\n\\nAustin Open Mics: Wanna Give it a Shot?\\nFriends think you’re funny? Always get laughs at company happy hour? Do a good Ronald Regan impression? Who knows, you might be the next big thing. Our mics have been the underground proving ground for comics since 2009.\",\"title\":\"Open Mics\"},{\"id\":36,\"created_at\":\"2026-04-29T21:12:59.568113+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"label\":\"Upcoming Headliners\",\"path\":\"upcoming-headliners\",\"body\":\"Upcoming Headliners\\n\",\"title\":\"Upcoming Headliners\"},{\"id\":37,\"created_at\":\"2026-04-29T21:13:23.834826+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"label\":\"Free Shows\",\"path\":\"free-shows\",\"body\":\"Lookin’ for Free Things to do in Austin?\\nLast minute plans are some of the best. Free last minute plans are even better. The list of free things to do in Austin felt a little short, so we’ve been steadily adding new weekly shows to our calendar that cost nothing, zilch, nada. Free. The city might be expensive, but the comedy doesn’t have to be.\\n\\nThere aren’t a lot of Austin comedy clubs that have free weekly shows hosting some of the biggest names in stand-up. If you just paid rent and still wanna make date night memorable, swing by The Creek for one of our many free shows.\",\"title\":\"Free Shows\"},{\"id\":35,\"created_at\":\"2026-04-29T21:10:52.244937+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"label\":\"Shows Tonight\",\"path\":\"shows-tonight\",\"body\":\"Comedy Shows in Austin Tonight\\n\\nLookin’ for a last minute date night that is sure to bring the laughs? The Creek and the a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Is there an age restriction?\",\"answer\":\"Yes, all shows are 21+, unless specified otherwise in the event description. A valid ID is required for entry.\"},{\"id\":94,\"created_at\":\"2025-12-17T18:12:44.950859+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"What time do doors open?\",\"answer\":\"Doors will open 30 minutes before all shows. If you are attending a late show, you may arrive up to one hour before showtime and enjoy our patio bar before seating begins.\"},{\"id\":95,\"created_at\":\"2025-12-17T18:12:58.479185+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"What is your late policy?\",\"answer\":\"We kindly ask you to arrive on time to the show, as we strive to minimize disruptions. We allow a 10 minute grace period. If you are more than 10 minutes late to a show, you will forfeit your tickets.\"},{\"id\":96,\"created_at\":\"2025-12-17T18:13:11.511553+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"What does VIP get me?\",\"answer\":\"All tickets labeled \\\"VIP\\\" will guarantee you a seating assignment within the first two rows unless otherwise specified in the event description.\"},{\"id\":97,\"created_at\":\"2025-12-17T18:13:20.765181+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"How does seating work?\",\"answer\":\"Seating will always be first come first serve, so come early to get a good spot! Our seats are arranged around small tables, which typically seat 2-4 people. If you have a large party you will be sat at tables next to each other. If your party size is less than 4, you may be sat at a table with another group. Purchasing 4 tickets will not guarantee a table to yourself. \"},{\"id\":98,\"created_at\":\"2025-12-17T18:13:42.127782+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Is there a minimum purchase?\",\"answer\":\"No! We simply want you to come and enjoy the show. However, we have amazing food and drinks, some come hungry and thirsty, and ready to have a good time!\"},{\"id\":113,\"created_at\":\"2026-01-30T21:22:47.808225+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Where do I purchase tickets?\",\"answer\":\"Tickets may only be purchased here on our official website, or at the door! We recommend purchasing ahead of time online, as there will be an additional $5 fee at the door (if the show is not sold out). Please note that tickets are non-transferable. Tickets purchased from reseller sites will not be accepted.\"},{\"id\":114,\"created_at\":\"2026-01-30T21:23:18.30897+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Do you take reservations?\",\"answer\":\"Typically, no. If you have a large party, we will do our best to seat you together, however, all members of your party must be present at check in. Keep in mind seating is assigned on a first come, first served basis. \\n‍\\nExceptions:\\n- If you have a party of 16 or more guests, you may email help@creekandcave.com to request a reserved section. \\n- If you or someone in your party needs a more accessible seat, please email us and we will reserve an aisle seat for you.\"},{\"id\":115,\"created_at\":\"2026-01-30T21:23:39.246472+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Do you sell gift cards?\",\"answer\":\"Yes! Our gift cards can be used toward comedy show tickets as well as any food or beverage purchase. You may purchase e-gift cards here on our website.\"},{\"id\":116,\"created_at\":\"2026-01-30T21:24:02.196318+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"How can I get an open mic?\",\"answer\":\"We have open mics Sunday-Thursday. Please check out our Open Mic page for more information!\"},{\"id\":117,\"created_at\":\"2026-01-30T21:24:14.345181+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Where are you located?\",\"answer\":\"611 East 7th St, Austin, TX 78701\"},{\"id\":118,\"created_at\":\"2026-01-30T21:24:32.595575+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Where can I park?\",\"answer\":\"We have nearby street parking as well as a few paid lots within walking distance of the venue. Street parking is free on Sundays! Free parking may also be found in the I-35 lot just east of our venue.\"},{\"id\":119,\"created_at\":\"2026-01-30T21:24:43.241448+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"How long do the shows last?\",\"answer\":\"Shows are dependent on the artist(s), but typically last between 75-90 minutes.\"},{\"id\":120,\"created_at\":\"2026-01-30T21:24:53.950905+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Are you handicap accessible?\",\"answer\":\"Yes! We are happy to reserve an aisle seat if needed, and there are no areas of the venue that require stair access. \"},{\"id\":121,\"created_at\":\"2026-01-30T21:25:12.689536+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Do you have automatic gratuity?\",\"answer\":\"We apply an automatic gratuity of 20% on parties of 6 or more. We also will apply a 20% gratuity to any tabs left open.\"},{\"id\":122,\"created_at\":\"2026-01-30T21:25:28.780931+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"What payment methods do you accept?\",\"answer\":\"We accept all credit cards, Apple pay, and cash. We also have an ATM on site.\"},{\"id\":123,\"created_at\":\"2026-01-30T21:25:41.00334+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Are you available for private events?\",\"answer\":\"Yes! Please send all inquiries to help@creekandcave.com.\"},{\"id\":124,\"created_at\":\"2026-01-30T21:25:56.510871+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"Is your podcast studio available to rent?\",\"answer\":\"Yes! Please send inquiries to podcast@creekandcave.com.\"},{\"id\":125,\"created_at\":\"2026-01-30T21:26:08.066562+00:00\",\"venue_page_id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"question\":\"How do I be a good audience member?\",\"answer\":\"Thank you for asking! Please do not heckle, or talk during shows. We do not permit any recording or flash photography. \"}],\"dataUpdateCount\":1,\"dataUpdatedAt\":1778409037281,\"error\":null,\"errorUpdateCount\":0,\"errorUpdatedAt\":0,\"fetchFailureCount\":0,\"fetchFailureReason\":null,\"fetchMeta\":null,\"isInvalidated\":false,\"status\":\"success\",\"fetchStatus\":\"idle\"},\"queryKey\":[\"venue-page-faqs\",\"5a78dea7-66c6-4756-82c7-f160a629cbcc\"],\"queryHash\":\"[\\\"venue-page-faqs\\\",\\\"5a78dea7-66c6-4756-82c7-f160a629cbcc\\\"]\"}]},\"children\":[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1c\"}}],[\"$\",\"$L1d\",null,{\"venueId\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\"}],[\"$\",\"$L1e\",null,{\"venueId\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\"}],[\"$\",\"$L1f\",null,{\"venueId\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-col\",\"children\":[[\"$\",\"$L20\",null,{\"venuePage\":{\"id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"created_at\":\"2025-09-25T21:34:08.512806+00:00\",\"published_at\":\"2025-09-25T21:34:08.512806+00:00\",\"is_live\":true,\"is_location_hidden\":false,\"slug\":\"creekandcave\",\"name\":\"The Creek and The Cave\",\"logo_img\":\"6d9d640e-b158-4e90-5da9-60a0304b1800\",\"city_state\":\"Austin, TX\",\"location_ids\":[\"5dc840a3-14c4-4425-b3c2-371305fda4e7\"],\"info_tags\":[{\"key\":\"21+\",\"icon\":\"users\",\"value\":\"Valid ID is required for entry\"},{\"key\":\"Arrive early\",\"icon\":\"doorOpen\",\"value\":\"Doors open 30 minutes before all shows\"},{\"key\":\"Seating is first come, first se at\n\ndo guided writing exercises\n\nget on stage to share material\n\ngive and receive supportive feedback and tags\n\nIt’s not a mic. It’s not a show.\n\nIt’s a development space — collaborative, fun, and fast-moving.\n\nWhat You’ll Get Out of It\nnew jokes every week\n\nstronger punchlines and structure\n\npractice writing in different formats\nclear insight into the business side of comedy\n\nhow to earn money writing jokes\na consistent weekly writing routine\n\na supportive community of comedy-nerds\n\nA working session to map your fastest path to paid work in comedy\n\nPractical direction on what you do best and where it pays (standup, acting, writing, digital)\n\nComics, writers, storytellers, speakers who want real income, not just stage time\n\nTalent with pieces in place but no clear plan to monetize\n\n \nWho Teaches It\nThe workshop is led by Dan French — Emmy-nominated late-night comedy writer, standup comedian, speaker, and ex-professor. His career includes:\n\nstaff writer for The Late Late Show, Dennis Miller, and The Best Damn Sports Show Period\n\nwriter for George Lopez, Wanda Sykes, and David Letterman\n\n3,000+ standup performances -- clubs, cruises, corporate, etc, etc\n\nPh.D. in Rhetoric\n\nformer professor at UT Austin, Cal State Fullerton, and University of Louisville\n\nDan brings a rare combination of writing expertise, industry experience, and teaching ability. Connect with Dan on Instagram @comedyaccelerator. You can join the Facebook group and sign up for the newsletter at https://linktr.ee/comedyaccelerator"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L3e\",null,{\"venue\":{\"id\":\"5a78dea7-66c6-4756-82c7-f160a629cbcc\",\"created_at\":\"2025-09-25T21:34:08.512806+00:00\",\"published_at\":\"2025-09-25T21:34:08.512806+00:00\",\"is_live\":true,\"is_location_hidden\":false,\"slug\":\"creekandcave\",\"name\":\"The Creek and The Cave\",\"logo_img\":\"6d9d640e-b158-4e90-5da9-60a0304b1800\",\"city_state\":\"Austin, TX\",\"location_
