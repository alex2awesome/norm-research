      @font-face { font-family: "Sky Text"; font-weight: normal; font-display: swap; src: url("https://static.skyassets.com/fonts/sky-regular.woff2") format("woff"); }

      body {
        color: #333;
        flex-direction: column;
        display: flex;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        padding: 0;
      }
      :root {
        --baseFont: "Sky Text";
        --gradient-spectrum: linear-gradient(to right, #FF8C00 0%, #F80032 20%, #FF00A0 40%, #8C28FF 60%, #0023FF 80%, #19A0FF 100%);
        --logo-original-height: 245px;
        --logo-original-width: 400px;
        font-family: "Sky Text", sans-serif;
      }
      .masthead {
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: center;
        padding: 12px 4px 10px;
      }
      .masthead::before {
        background: var(--gradient-spectrum);
        content: "";
        top: 0;
        left: 0;
        display: block;
        position: absolute;
        width: 100%;
        height: 3px;
      }
      .masthead-logo {
        --logo-scale: calc(25 / 245);
        display: block;
        height: 25px !important;
        margin: 1px;
        width: calc(var(--logo-scale) * var(--logo-original-width)) !important;
      }
      footer .masthead-logo {
        background-repeat: no-repeat;
        margin: 2px 1px 2px 1px;

        @media (min-width: 75em) {
          --logo-scale: calc(33 / 245);
          height: 33px !important;
          margin: 0;
          width: calc(var(--logo-scale) * var(--logo-original-width)) !important;
        }
      }
      .noscript {
        padding: 12px 24px;
        text-align: center;
      }
      .noscript h1 {
        background: var(--gradient-spectrum);
        font-weight: normal;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @media (min-width: 700px) {
        .noscript {
          padding: 48px;
        }
      }
