News and Society\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eChapter Eleven: Law, Democracy, and News\u003c/p\u003e\u003cp\u003eChapter Twelve: News Revolutions, Digital and Global\u003c/p\u003e\u003c/div\u003e","contentType":""}}},"id":"sk-1558983141-727506"}]}]}]},{"label":"Highlights","id":"highlights","url":"highlights","rows":[{"columns":[{"components":[{"moduleType":"rich-text","rich-text":{"style":{},"copy":"\u003cdiv\u003e\u003cdiv\u003e\u003ch2\u003eThe only sociological introduction to the news\u003c/h2\u003e\u003cp\u003e\u003cp\u003e\u0026nbsp;Schudson synthesizes research from sociology, political science, economics, journalism studies, and communications in this brief, authoritative introduction to the news media's role in society. \u003cem\u003eThe Sociology of News\u003c/em\u003e makes a seminal contribution to the sociological understanding of the role that news institutions play in the formation of modern public consciousness.\u003c/p\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003eCompletely updated, including a new chapter on the news industry in the age of the Internet and globalization\u003c/h2\u003e\u003cp\u003e\u003cp\u003eWhen the First Edition of \u003cem\u003eThe Sociology of News\u003c/em\u003e was published in 2003, Craigslist, Facebook, Google, online-only news organizations, and TV shows like \u003cem\u003eThe Daily Show\u003c/em\u003e either did not exist or were in their earliest stages. In the new edition of his book, Michael Schudson accounts for the transformative impact these things have had on the news industry. He also includes a new chapter, \"News Revolutions, Digital and Global,\" which explores the sharp contraction of the news business since 2007.\u0026nbsp;\u003c/p\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e","contentType":""},"id":"sk-1558983141-727686"}]}]}]},{"label":"Product Details","id":"product-details","url":"product-details","rows":[{"columns":[{"components":[{"moduleType":"book-format-li
