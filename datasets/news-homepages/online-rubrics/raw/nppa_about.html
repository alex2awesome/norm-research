nefit from a job bank, a mentoring program, and a variety of competitions. Join us to become part of a community that promotes the vital public service of visual journalism and fosters the emerging generation of visual storytellers.","Indexable":true,"mongoid":"\"63d31df192852c94eb24bedd\"","shareImage":null},"PageContent":[{"__component":"custom-pages-components.spacer","id":955,"Size":"LARGE","mongoid":"\"63d31df292852c94eb24bf55\"","Columns":null},{"__component":"custom-pages-components.section-options","id":712,"MembersOnly":null,"MaxWidth":"Small_768px","FramePadding":"Large","WrapperPadding":"Padded","mongoid":"\"63d31df292852c94eb24bf54\"","CollapsibleSection":null,"Background":{"id":105,"CreditCaption":null,"CreditLink":null,"VideoLink":null,"CreditUserLink":null,"BgColor":"None","AddBorder":false,"CreditUserName":null,"TranslucentOverlay":"None","mongoid":"\"64ca0e92ab7b5be4aa92b27c\"","File":null}},{"__component":"custom-pages-components.title","id":19,"Title":"National Press Photographers Association","Tagline":"About","Subtitle":null,"PublishDate":null,"WrapperPadding":"None","Border":false,"mongoid":"\"64206f90d501d4a5eecd01b3\"","Background":[],"Button":null,"TextPlacement":null,"Height":null},{"__component":"custom-pages-components.section-options","id":868,"MembersOnly":null,"MaxWidth":"Small_768px","FramePadding":"Small","WrapperPadding":"None","mongoid":"\"64ca0e92ab7b5be4aa92b27b\"","CollapsibleSection":null,"Background":null},{"__component":"custom-pages-components.rich-text","id":167,"Content":"##### The National Press Photographers Association is dedicated to the advancement of visual journalism – its creation, practice, training, editing and distribution – in all news media and works to promote its role as a vital public service.\n\nSince 1947, the NPPA has been the leading voice advocating for the work of visual journalists. Our organization fights for working news photographers, videographers and multimedia journalists. Our [Code of Ethics](https://nppa.org/resources/code-ethics) stands for the highest integrity in visual storytelling. Our advocacy efforts put NPPA in the center of today’s thorniest issues of journalists’ rights to do their work — and to earn a living from their craft. Our ongoing education initiatives seek to equip our members and prepare the emerging generation of visual journalists in the face of an ever-changing media landscape.\n\nWe promote the highest standards in visual journalism, and the credibility of our profession is the responsibility of every member of NPPA. Accuracy in our work and integrity in our relationships with the public we serve are essential qualities for all professional visual journalists. Members sign and adhere to the [NPPA Code of Ethics](https://nppa.org/resources/code-ethics), demonstrating to employers that they are committed to the utmost integrity. Because ethical issues can sometimes be complex, we encourage you to explore these resources further and discuss them with your colleagues.\n\nThe NPPA vigorously promotes freedom of the press in all its forms. We work tirelessly advocating to protect the First Amendment, as well as visual journalists' rights to earn a living from their work. Professional members turn to the [Advocacy](https://nppa.org/info/advocacy) committee for support and advice when problems arise.\n\nTo succeed in the independent marketplace, you need more than just talent. Strong business skills are essential. Our [Business Practices Resources](https://nppa.org/resources/business-practices), including our [Cost of Doing Business Calculator](https://nppa.org/business-cost-calculator), offer a set of standards for conducting business transactions for visual journalists and those who hire them.\n\nWe offer a number of competitions throughout the year; some are held on a monthly or quarterly basis. Designed for visual journalists by visual journalists, The [Best of Photojournalism](https://bop.nppa.org/2023/) contest attracts tens of thousands of entries each year and is open to members and non-members alike. Other contests, such as the [Quarterly Clip Contest](https://tv.nppa.org/) for television photographers, [Monthly Still Clip Contest](https://competitions.nppa.org/monthly-news-clip-contest/) and [Quarterly Multimedia Contest](https://competitions.nppa.org/quarterly-multimedia-contest/) are available for members only.\n\nThe Find a Visual Journalist service matches freelance professionals with individuals and companies looking for photographic talent. To be listed, you must be a member, but the public may view the talent bank. Prospective employers can search for visual journalists by camera format, photographic specialties, and location.\n\nCurrent members may use the [Mentoring Program](https://nppa.org/info/nppa-mentorship-program) to establish a relationship between a mentor and a mentee. Mentors are carefully screened and are excited to pass along lessons learned and perpetuate the highest standards in visual journalism. Applications are welcome for mentors and mentees.\n\nEmbracing our mission, we have established a series of [educational events](https://nppa.org/events) available to all those interested in promoting the art of storytelling with pictures. Internationally recognized professionals donate their time and expertise to teach this craft and to make these educational experiences meaningful for all involved.\n\n","mongoid":"\"64207034d501d4a5eecd01f0\"","Columns":null},{"__component":"custom-pages-components.button","id":34,"Alignment":"Left","mongoid":"\"649c7d651b78edf45ea341fa\"","ButtonSettings":{"id":69,"buttonStyle":"SolidBlue","ButtonText":"JOIN","ShowButton":true,"LinkType":"URL_NewTab","URL":"https://nppa.org/user/purchase-membership","CustomPageLink":null,"CheckoutFormLink":null,"buttonSize":"Large","mongoid":"\"649c7d651b78edf45ea341fb\"","FileDownload":null}},{"__component":"custom-pages-components.button","id":35,"Alignment":"Left","mongoid":"\"649c7dfd1b78edf45ea34217\"","ButtonSettings":{"id":70,"buttonStyle":"SolidBlue","ButtonText":"DONATE","ShowButton":true,"LinkType":"URL_NewTab","URL":"https://nppf.org/donations/","CustomPageLink":null,"CheckoutFormLink":null,"buttonSize":"Large","mongoid":"\"649c7dfd1b78edf45ea34218\"","FileDownload":null}},{"__component":"custom-pages-components.spacer","id":1281,"Size":"SMALL","mongoid":"\"649c7f4f1b78edf45ea3423b\"","Columns":null}],"SecondaryNavigation":null,"BackgroundImage":null},"checkMembership":false,"hideHeaderFooter":false,"isTransparentNav":false,"checkAuth":false,"SecondaryNavigation":{},"seo":{"id":1088,"metaTitle":"About NPPA","metaDescription":"The National Press Photographers Association is the leading advocate for visual journalists and sets the highest standards for integrity in the profession. Since 1947, we have offered a variety of resources to promote the advancement of visual journalism, including a code of ethics, advocacy efforts to protect First Amendment rights, business practices resources, and educational events. Members benefit from a job bank, a mentoring program, and a variety of competitions. Join us to become part of a community that promotes the vital public service of visual journalism and fosters the emerging generation of visual storytellers.","Indexable":true,"mongoid":"\"63d31df192852c94eb24bedd\"","shareImage":null}},"__N_SSP":true},"page":"/[urlpath]/[slug]","query":{"urlpath":"info","slug":"about"},"buildId":"uP497OKcOGlITVZYUK7ZC","isFallback":false,"gssp":true,"scriptLoader":[]}</script></body></html>
