er-inner\"\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"constrain\"\u003e \u003cdiv class=\"field field-name-body field-type-text-with-summary field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cp class=\"firstparagraph\"\u003eThe National Press Photographers Association, a professional society that promotes the highest standards in visual journalism, acknowledges concern for every person's need both to be fully informed about public events and to be recognized as part of the world in which we live.\u003c/p\u003e\u003cp\u003eThe credibility of our profession is the responsibility of every member of NPPA. Accuracy in our work and integrity in our relationships with the public we serve are essential qualities for all photojournalists. This Code of Ethics attempts to foster the spirit of honesty in all aspects of our professional lives.\u003c/p\u003e\u003cp\u003eRead the full \u003ca href=\"/code_of_ethics\" target=\"_self\"\u003eNPPA Code of Ethics\u003c/a\u003e»\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"field field-name-field-content field-type-field-collection field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cdiv class=\"ds-1col entity entity-field-collection-item field-collection-item-field-content view-mode-full clearfix\"\u003e \u003cdiv class=\"field field-name-field-paragraphs field-type-field-collection field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cdiv\u003e \u003cdiv class=\"content\"\u003e \u003cdiv class=\"field field-name-field-paragraph field-type-text-long field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cblockquote\u003e\u003cp class=\"firstparagraph\"\u003e \u003c/p\u003e\u003c/blockquote\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e \u003c/div\u003e \u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e\u003cdiv class=\"field-item odd\"\u003e\u003cdiv class=\"ds-1col entity entity-field-collection-item field-collection-item-field-content view-mode-full clearfix\"\u003e \u003cdiv class=\"field field-name-field-section-title field-type-text field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003ca id='section_10066'\u003eVisual Journalism Ethics Resources\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"field field-name-field-paragraphs field-type-field-collection field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cdiv\u003e \u003cdiv class=\"content\"\u003e \u003cdiv class=\"field field-name-field-paragraph field-type-text-long field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cp\u003eNPPA promotes a common Code of Ethics for visual journalists. However, ethical issues can be complex. We encourage all visual journalists to go beyond just reading our \u003ca href=\"/code_of_ethics\"\u003eCode of Ethics\u003c/a\u003e, and to discuss and explore ethical questions on your own and with your coworkers, so you are prepared when issues arise.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003ca href=\"/node/5167\"\u003eNPPA Statement of Principle\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA strong admonition aimed directly at the practice of digital manipulation, which also sums up the NPPA Code of Ethics in a matter of a few sentences. Adopted 1991 by the NPPA Board of Directors.\u003c/p\u003e\u003cdl\u003e\u003cdd\u003e\u003c/dd\u003e\u003c/dl\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003ca href=\"/node/8480\"\u003eEthics Matters columns\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThe NPPA Ethics Committee has compiled a collection of “Ethics Matters” columns that replacely appeared in News Photographer Magazine. It is hoped that this compilation will be a resource for students and professionals alike.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\"/node/5208\"\u003eEthics News Articles\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eStories and discussions about visual journalism ethics from across the web.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\"/node/5127\"\u003eEthics in the Age of Digital Photography\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTranscript of the instructional video by former NPPA Ethics chair John Long. Long offers suggestions for dealing with image manipulation in an ethical way, in the context of visual journalism.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e \u003c/div\u003e \u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e\u003cdiv class=\"field-item even\"\u003e\u003cdiv class=\"ds-1col entity entity-field-collection-item field-collection-item-field-content view-mode-full clearfix\"\u003e \u003cdiv class=\"field field-name-field-section-title field-type-text field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003ca id='section_170587'\u003eNPPA Ethics Committee\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"field field-name-field-lists field-type-field-collection field-label-hidden\"\u003e\u003cdiv class=\"field-items\"\u003e\u003cdiv class=\"field-item even\"\u003e\u003cdiv class=\"ds-2col-stacked-fluid entity entity-field-collection-item field-collection-item-field-lists view-mode-full group-one-column clearfix\"\u003e \u003cdiv class=\"group-header\"\u003e \u003c/div\u003e \u003cdiv class=\"group-right page-list list-area\"\u003e \u003cdiv class=\"field field-name-field-list-title field-type-link-field
