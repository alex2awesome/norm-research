\",\"name\":\"Pressens samfunnsrolle\"}},{\"_key\":\"19b125dbd85d\",\"_type\":\"vvpPointGroupContent\",\"title\":{\"id\":\"2\",\"name\":\"Integritet og troverdighet\"}},{\"_key\":\"43659fd4020e\",\"_type\":\"vvpPointGroupContent\",\"title\":{\"id\":\"3\",\"name\":\"Journalistisk atferd og forholdet til kildene\"}},{\"_key\":\"9b6fdcc3a351\",\"_type\":\"vvpPointGroupContent\",\"title\":{\"id\":\"4\",\"name\":\"Publiseringsregler\"}},{\"_key\":\"cc12907c-ecdc-4dd8-98a3-6b296e1153ab\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"4335ce6a435f\",\"_type\":\"block\",\"children\":[{\"_key\":\"3cdfac1575ba0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Ytringsfrihet, informasjonsfrihet og trykkefrihet er grunnelementer i et demokrati. En fri, uavhengig og sannhetssøkende presse er blant de viktigste institusjoner i demokratiske samfunn.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"1.1\",\"name\":\"Ytringsfrihet og pressefrihet\"}},{\"_key\":\"1d10e026-ff68-458d-9c7d-47576c79a2af\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"3a4be1bcea27\",\"_type\":\"block\",\"children\":[{\"_key\":\"770e5a795d480\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pressen ivaretar viktige oppgaver som informasjon, debatt og samfunnskritikk. Pressen har et spesielt ansvar for at ulike syn kommer til uttrykk.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"1.2\",\"name\":\"Debatt og samfunnskritikk\"}},{\"_key\":\"e936549d-cf0b-4ab1-b175-d7f0de8acf0b\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"b77810293fa4\",\"_type\":\"block\",\"children\":[{\"_key\":\"fee0eeaa0ddb0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pressen skal verne om ytringsfriheten, trykkefriheten og offentlighetsprinsippet. Den kan ikke gi etter for press fra noen som vil hindre åpen debatt, fri informasjonsformidling og fri adgang til kildene. Avtaler om eksklusiv formidling av arrangementer skal ikke være til hinder for fri nyhetsformidling.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"1.3\",\"name\":\"Uavhengig presse\"}},{\"_key\":\"556c5bb1-c4ff-4e61-81ae-3a9a9b2e88e3\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"a217764ca68b\",\"_type\":\"block\",\"children\":[{\"_key\":\"76f84c7bfff90\",\"_type\":\"span\",\"marks\":[],\"text\":\"Det er pressens rett å informere om det som skjer i samfunnet og avdekke kritikkverdige forhold. Det er pressens plikt å sette et kritisk søkelys på hvordan mediene selv fyller sin samfunnsrolle.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"1.4\",\"name\":\"Kritisk presse\"}},{\"_key\":\"9ff937e3-c9cc-4f23-87cc-252c65d7a47e\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"d695706abed4\",\"_type\":\"block\",\"children\":[{\"_key\":\"7b22579318d4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Det er pressens oppgave å beskytte enkeltmennesker og grupper mot overgrep eller forsømmelser fra offentlige myndigheter og institusjoner, private foretak eller andre.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"1.5\",\"name\":\"Beskytte enkeltmennesker\"}},{\"_key\":\"f6f4df91-b6bd-4704-b12d-4a742fbfee23\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"c97459621e6c\",\"_type\":\"block\",\"children\":[{\"_key\":\"11222a6d339e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Den ansvarlige redaktør har det personlige og fulle ansvar for mediets innhold og avgjør med endelig virkning spørsmål om redaksjonelt innhold, finansiering, presentasjon og publisering. Redaktøren skal opptre fritt og uavhengig overfor personer eller grupper som av ideologiske, økonomiske eller andre grunner vil øve innflytelse på det redaksjonelle innholdet. Redaktøren skal verne om redaksjonens produksjon av fri og uavhengig journalistikk.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.1\",\"name\":\"Redaktøransvaret\"}},{\"_key\":\"9aa615d1-561f-4f9f-b9e4-6d58ab8246b0\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"d59e77df8c4a\",\"_type\":\"block\",\"children\":[{\"_key\":\"9ef4e80344400\",\"_type\":\"span\",\"marks\":[],\"text\":\"Redaktøren og den enkelte redaksjonelle medarbeider skal verne om sin uavhengighet, integritet og troverdighet. Unngå dobbeltroller, verv, oppdrag eller bindinger som kan skape interessekonflikter eller føre til spekulasjoner om inhabilitet.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.2\",\"name\":\"Uavhengighet, integritet og troverdighet\"}},{\"_key\":\"37a34173-c5c9-4bfa-9fc0-35cf0e374c0d\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"a97c39858b4e\",\"_type\":\"block\",\"children\":[{\"_key\":\"a354c75c942f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vis åpenhet om bakenforliggende forhold som kan være relevante for publikums oppfatning av det journalistiske innholdet.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.3\",\"name\":\"Åpenhet om bakenforliggende forhold\"}},{\"_key\":\"e42ced2b-6db7-4f7a-93cf-7243443fdb5f\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"e65b2416084f\",\"_type\":\"block\",\"children\":[{\"_key\":\"a6dbc0c5ec460\",\"_type\":\"span\",\"marks\":[],\"text\":\"Redaksjonelle medarbeidere må ikke utnytte sin stilling til å oppnå private fordeler, herunder motta penger, varer eller tjenester, som kan oppfattes å være kompensasjon fra utenforstående for redaksjonelle ytelser.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.4\",\"name\":\"Utnytte egen stilling\"}},{\"_key\":\"6e806c6c-c087-4946-a96b-7ee034c5c2ed\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"204accfcf08f\",\"_type\":\"block\",\"children\":[{\"_key\":\"ad5903c45ae80\",\"_type\":\"span\",\"marks\":[],\"text\":\"En redaksjonell medarbeider kan ikke pålegges å gjøre noe som strider mot egen overbevisning.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.5\",\"name\":\"Egen overbevisning\"}},{\"_key\":\"b3e14204-2468-4a8b-9798-9f52e8840825\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"48b2b57a895d\",\"_type\":\"block\",\"children\":[{\"_key\":\"050e9e5bda0e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Svekk aldri det klare skillet mellom journalistikk og reklame. Det skal være åpenbart for publikum hva som er kommersielt innhold. Skillet skal være tydelig også ved lenking eller andre koblinger. Avvis kommersielt innhold som kan forveksles med det enkelte mediums journalistiske presentasjon.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.6\",\"name\":\"Skille journalistikk og reklame\"}},{\"_key\":\"03c2fe1b-d255-4243-bdaf-0b2c0f4558a9\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"3a8392cf6616\",\"_type\":\"block\",\"children\":[{\"_key\":\"d82a66be875d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Journalistisk omtale av produkter, tjenester, merkenavn og kommersielle interesser, også mediets egne, skal være journalistisk motivert og ikke fremstå som reklame. Oppretthold et klart skille mellom markedsaktiviteter og redaksjonelt arbeid. Gi aldri tilsagn om journalistiske motytelser for reklame. Unngå ukritisk videreformidling av PR-stoff.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.7\",\"name\":\"PR-stoff og reklame\"}},{\"_key\":\"4f77d892-6a55-41de-8157-564c711379a3\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"977ab0748206\",\"_type\":\"block\",\"children\":[{\"_key\":\"d74ac529a47f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Eksterne finansieringskilder skal ikke ha innflytelse på noen del av mediets journalistiske virksomhet. Unngå ekstern finansiering og avtaler som bidrar til at publikum kan reise tvil om redaksjonens troverdighet. Vær særlig varsom ved ekstern finansiering av nyhetsjournalistikk. Ekstern finansiering av journalistikk rettet mot barn må ivareta barns særlige behov for vern. Skjult reklame er uforenlig med god presseskikk. Vis åpenhet om avtaler og hvordan journalistikken er finansiert. Dersom journalistisk innhold er eksternt finansiert, skal dette være åpenbart for publikum.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.8\",\"name\":\"Ekstern finansiering\"}},{\"_key\":\"bd7e9bb9-ffdf-4514-bc78-c252e98ab0cf\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"ac4e9bf24ff9\",\"_type\":\"block\",\"children\":[{\"_key\":\"7dc96274684b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Redaksjonelle medarbeidere må ikke motta pålegg om oppdrag fra andre enn den redaksjonelle ledelsen.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"2.9\",\"name\":\"Redaksjonelle oppdrag\"}},{\"_key\":\"5e6e4fbd-cc7f-4ea6-855e-f24cb78f34f8\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"b6ee06513b67\",\"_type\":\"block\",\"children\":[{\"_key\":\"48fa308e41db0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kilden for informasjon skal som hovedregel identifiseres, med mindre det er i konflikt med kildevernet eller hensynet til tredjeperson. Kilder bør som hovedregel ikke få fremsette negative personkarakteristikker anonymt.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.1\",\"name\":\"Anonyme kilder\"}},{\"_key\":\"954f0210-77b5-47be-a558-5476c42a8418\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"006770994f55\",\"_type\":\"block\",\"children\":[{\"_key\":\"25a947cc3dc50\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vær kritisk i valg av kilder, og kontroller at opplysninger som gis er korrekte. Det er god presseskikk å tilstrebe bredde og relevans i valg av kilder. Vær spesielt aktsom ved behandling av informasjon fra anonyme kilder, informasjon fra kilder som tilbyr eksklusivitet, og informasjon som er gitt fra kilder mot betaling.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.2\",\"name\":\"Faktasjekk, kildebredde og kildekritikk\"}},{\"_key\":\"e69a03ad-5cf1-4b50-b0e1-8979daf40212\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"ccf4191a2061\",\"_type\":\"block\",\"children\":[{\"_key\":\"4658483f8edb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Det er god presseskikk å klargjøre premissene i kontakten med kilder. Hvis det inngås avtale om sitatsjekk, bør det gjøres klart hva avtalen omfatter og hvilke frister som gjelder. Redaksjonen selv avgjør hva som endelig publiseres.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cd0cc11b3bb7\",\"_type\":\"block\",\"children\":[{\"_key\":\"83106203de6a\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f52a4108daee\",\"_type\":\"block\",\"children\":[{\"_key\":\"8555ffc40ab1\",\"_type\":\"span\",\"marks\":[],\"text\":\"\\n\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.3\",\"name\":\"Premisser og avtaler\"}},{\"_key\":\"4880ef0e-9972-4a7d-9306-049cbdfa9cf9\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"1550ddf2ce57\",\"_type\":\"block\",\"children\":[{\"_key\":\"c1faae8c32aa0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vern om pressens kilder. Kildevernet er et grunnleggende prinsipp i et fritt samfunn og er en forutsetning for at pressen skal kunne fylle sin samfunnsoppgave og sikre tilgangen på vesentlig informasjon.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.4\",\"name\":\"Kildevern\"}},{\"_key\":\"dff071b3-9c28-4246-8252-1628b862dbdb\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"2b9497786d68\",\"_type\":\"block\",\"children\":[{\"_key\":\"1faea46c8f9c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Oppgi ikke navn på kilde for opplysninger som er gitt i fortrolighet, hvis dette ikke er uttrykkelig avtalt med vedkommende.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.5\",\"name\":\"Kildevern\"}},{\"_key\":\"f9302b72-d7c7-4869-9f0b-ddc2b0888d9f\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"af496ac91364\",\"_type\":\"block\",\"children\":[{\"_key\":\"9db6f719ed0f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Av hensyn til kildene og pressens uavhengighet har ingen rett til å få utlevert upublisert materiale.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.6\",\"name\":\"Upublisert materiale\"}},{\"_key\":\"210696ee-cbde-4cb9-8f97-8e79c71457e1\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"9be2937265cc\",\"_type\":\"block\",\"children\":[{\"_key\":\"fbdb9ea0051e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Kilder skal gjengis korrekt. Pressen har plikt til å gjengi meningsinnholdet i det som brukes av intervjuobjektets uttalelser. Ingen kilder har krav på å bli gjengitt i sin helhet.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.7\",\"name\":\"Korrekte sitater\"}},{\"_key\":\"5bd4e28d-38a7-4eb4-a7a4-627aee89ae9f\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"77bf5410e320\",\"_type\":\"block\",\"children\":[{\"_key\":\"2ae052cac60e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Hvis det er avtalt sitatsjekk, skal denne primært bidra til å sikre at kilden er gjengitt korrekt og til korrigering av faktiske feil. Ingen uten redaksjonell myndighet kan gripe inn i redigering og presentasjon av redaksjonelt materiale.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.8\",\"name\":\"Sitatsjekk\"}},{\"_key\":\"c8ce57d7-f48f-46cb-9009-076d3593042e\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"ed373afe43c6\",\"_type\":\"block\",\"children\":[{\"_key\":\"4eb8d0a2a2f20\",\"_type\":\"span\",\"marks\":[],\"text\":\"Opptre hensynsfullt i det journalistiske arbeidet. Misbruk ikke andres følelser, manglende medieerfaring, uvitenhet eller sviktende dømmekraft. Husk at mennesker i sjokk eller sorg er mer sårbare enn andre.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.9\",\"name\":\"Hensynsfull arbeidsprosess\"}},{\"_key\":\"47d702ef-0391-473c-b4c6-5a55a0b74105\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"48acd9e2b8cb\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b2aa175339f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Skjult kamera/mikrofon eller falsk identitet skal bare brukes i unntakstilfeller. Forutsetningen må være at dette er eneste mulighet til å avdekke forhold av vesentlig samfunnsmessig betydning.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.10\",\"name\":\"Skjulte metoder\"}},{\"_key\":\"bcaf4d75-ef9b-4975-beac-b352a4c671ea\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"0ff043e253e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"775f026507850\",\"_type\":\"span\",\"marks\":[],\"text\":\"Pressen skal som hovedregel ikke betale kilder og intervjuobjekter for informasjon. Vis moderasjon ved honorering for nyhetstips. Det er uforenlig med god presseskikk å ha betalingsordninger som er egnet til å friste mennesker til uberettiget å trå innenfor andres privatsfære eller gi fra seg personsensitiv informasjon.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"3.11\",\"name\":\"Betaling av kilder\"}},{\"_key\":\"218e1fd5-bdab-490d-a7d3-c47bf0a50a7d\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"faf1035e35e3\",\"_type\":\"block\",\"children\":[{\"_key\":\"efedb0766b0e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Legg vekt på saklighet og omtanke i innhold og presentasjon.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.1\",\"name\":\"Saklighet og omtanke\"}},{\"_key\":\"5af1e961-31ab-476a-bade-5082ed2827d5\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"252eeb3a8484\",\"_type\":\"block\",\"children\":[{\"_key\":\"d30f531cf1b50\",\"_type\":\"span\",\"marks\":[],\"text\":\"Gjør klart hva som er faktiske opplysninger og hva som er kommentarer.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.2\",\"name\":\"Skille kommentar og fakta\"}},{\"_key\":\"0f10e8dd-b8f6-40e8-a239-1a342937f9d3\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"d2ad415ce99c\",\"_type\":\"block\",\"children\":[{\"_key\":\"b852ec6282080\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vis respekt for menneskers egenart og identitet, privatliv, etnisitet, nasjonalitet og livssyn. Vær varsom ved bruk av begreper som kan virke stigmatiserende. Fremhev ikke personlige og private forhold når dette er saken uvedkommende.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.3\",\"name\":\"Stigmatisering og privatliv\"}},{\"_key\":\"ac4ea8ca-b9b4-4ac6-aecd-c85645be83ef\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"d78eaa9cc0a3\",\"_type\":\"block\",\"children\":[{\"_key\":\"5b8bf05e94d60\",\"_type\":\"span\",\"marks\":[],\"text\":\"Sørg for at overskrifter, henvisninger, ingresser og inn- og utannonseringer ikke går lenger enn det er dekning for i stoffet. Det er god presseskikk å oppgi kilden når opplysninger er hentet fra andre medier.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.4\",\"name\":\"Dekning for vinkling\"}},{\"_key\":\"50c05d52-5c34-4c9e-ac19-497aabc90454\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"f8ec5ea23bc1\",\"_type\":\"block\",\"children\":[{\"_key\":\"f37a66efebf60\",\"_type\":\"span\",\"marks\":[],\"text\":\"Unngå forhåndsdømming i kriminal- og rettsreportasje. Gjør det klart at skyldspørsmålet for en mistenkt, anmeldt, siktet eller tiltalt først er avgjort ved rettskraftig dom. Det er god presseskikk å omtale en rettskraftig avgjørelse i saker som har vært omtalt tidligere.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.5\",\"name\":\"Forhåndsdømming\"}},{\"_key\":\"83d87594-1979-4d58-91e9-3bef1934e59f\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"1896bfafbc61\",\"_type\":\"block\",\"children\":[{\"_key\":\"f993a76e836f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Ta hensyn til hvordan omtale av ulykker og kriminalsaker kan virke på ofre og pårørende. Identifiser ikke omkomne eller savnede personer uten at de nærmeste pårørende er underrettet. Vis hensyn overfor mennesker i sorg eller ubalanse.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.6\",\"name\":\"Hensyn til ofre og pårørende\"}},{\"_key\":\"8d2bf46f-06f2-47fb-8284-3cf1b4128d37\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"605437f1fff5\",\"_type\":\"block\",\"children\":[{\"_key\":\"664deabca6df0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vær varsom med bruk av navn og bilde og andre klare identifikasjonstegn på personer som omtales i forbindelse med klanderverdige eller straffbare forhold. Vis særlig varsomhet ved omtale av saker på tidlig stadium av etterforskning, i saker som gjelder unge lovovertredere, og der identifiserende omtale kan føre til urimelig belastning for tredjeperson. Identifisering må begrunnes i et berettiget informasjonsbehov. Det kan eksempelvis være berettiget å identifisere ved overhengende fare for overgrep mot forsvarsløse personer, ved alvorlige og gjentatte kriminelle handlinger, når omtaltes identitet eller samfunnsrolle har klar relevans for de forhold som omtales, eller der identifisering hindrer at uskyldige blir utsatt for uberettiget mistanke.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.7\",\"name\":\"Identifisering\"}},{\"_key\":\"80e2ef9e-6e52-4886-92be-8bc4f31bfa7d\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"938c5d21611c\",\"_type\":\"block\",\"children\":[{\"_key\":\"d3465418e39e0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Når barn omtales, er det god presseskikk å ta hensyn til hvilke konsekvenser medieomtalen kan få for barnet. Dette gjelder også når foresatte har gitt sitt samtykke til eksponering. Barns identitet skal som hovedregel ikke røpes i familietvister, barnevernssaker eller rettssaker.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.8\",\"name\":\"Omtale av barn\"}},{\"_key\":\"e1619481-ebc0-4235-bccb-b222f91a060b\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"0fdc6b8fa47c\",\"_type\":\"block\",\"children\":[{\"_key\":\"859a8b2ec0600\",\"_type\":\"span\",\"marks\":[],\"text\":\"Ved omtale av selvmord og selvmordsforsøk er det god presseskikk å vektlegge en nøktern fremstilling. Vis hensyn til dem som er direkte berørt. Vær varsom ved omtale på et tidlig tidspunkt. Det kreves høy aktsomhet ved beskrivelse av metode og det spesifikke stedet for handlingen.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.9\",\"name\":\"Selvmord og selvmordsforsøk\"}},{\"_key\":\"3138ae67-db47-4439-8256-fbfb24a6eacd\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"a1ebc7b57827\",\"_type\":\"block\",\"children\":[{\"_key\":\"14f09f78821d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vær varsom med bruk av bilder i annen sammenheng enn den opprinnelige.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.10\",\"name\":\"Bilder i annen sammenheng\"}},{\"_key\":\"eda53ea0-e189-4d1a-a7e3-805ae0b9174c\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"02bad6828af8\",\"_type\":\"block\",\"children\":[{\"_key\":\"84e1ece6fb5f0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vern om det journalistiske fotografiets troverdighet. Bilder som brukes som dokumentasjon må ikke endres slik at de skaper et falskt inntrykk. Manipulerte bilder kan bare aksepteres som illustrasjon når det tydelig fremgår at det dreier seg om en montasje.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.11\",\"name\":\"Bildemanipulasjon\"}},{\"_key\":\"69fc0d65-1206-457f-9701-4f2566247382\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"37c187111cb5\",\"_type\":\"block\",\"children\":[{\"_key\":\"5ca38245dc8b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"For bruk av bilder gjelder de samme aktsomhetskrav som for skriftlig og muntlig fremstilling.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.12\",\"name\":\"Bilder generelt\"}},{\"_key\":\"e6611742-9954-4ffc-b5a8-9473801296fe\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"539d95c8fff9\",\"_type\":\"block\",\"children\":[{\"_key\":\"c85da136f1020\",\"_type\":\"span\",\"marks\":[],\"text\":\"Feilaktige opplysninger skal rettes og eventuelt beklages snarest mulig.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.13\",\"name\":\"Rettelse og beklagelse\"}},{\"_key\":\"aa4a4d59-055f-4951-b946-7474a301cffc\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"d6a21744bda5\",\"_type\":\"block\",\"children\":[{\"_key\":\"d01238b8c92b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"De som utsettes for sterke beskyldninger skal så vidt mulig ha adgang til samtidig imøtegåelse av faktiske opplysninger. Debatt, kritikk og nyhetsformidling må ikke hindres ved at parter ikke er villig til å uttale seg eller medvirke til debatt.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.14\",\"name\":\"Samtidig imøtegåelse\"}},{\"_key\":\"4424044a-ac52-4ec9-9f28-ff0ad0ac7768\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"5d5723b63291\",\"_type\":\"block\",\"children\":[{\"_key\":\"75e058800fde0\",\"_type\":\"span\",\"marks\":[],\"text\":\"De som er blitt utsatt for angrep skal snarest mulig få adgang til tilsvar, med mindre angrep og kritikk inngår som ledd i en løpende meningsutveksling. Ha som krav at tilsvaret er av rimelig omfang, holder seg til saken og har en anstendig form. Tilsvar kan nektes dersom den berørte part, uten saklig grunn, har avvist tilbud om samtidig imøtegåelse i samme spørsmål. Tilsvar og debattinnlegg skal ikke utstyres med redaksjonell, polemisk replikk.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.15\",\"name\":\"Tilsvarsrett\"}},{\"_key\":\"d39309c0-8489-4091-a756-88cc65f7083e\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"f27c6300378c\",\"_type\":\"block\",\"children\":[{\"_key\":\"778f3fa93ff80\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vær varsom med å lenke fra digitale utgaver til innhold som bryter med god presseskikk. Sørg for at lenker til andre medier eller publikasjoner er tydelig merket. Det er god presseskikk å informere brukere av interaktive tjenester om hvordan publikasjonen registrerer og eventuelt utnytter bruken av tjenestene.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.16\",\"name\":\"Lenking\"}},{\"_key\":\"9ae754e3-3e48-46f4-ad44-67f3006559c5\",\"_type\":\"vvpPointContent\",\"content\":[{\"_key\":\"c5438de3d871\",\"_type\":\"block\",\"children\":[{\"_key\":\"8ff9a251e6ce0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Dersom redaksjonen velger ikke å forhåndsredigere digitale meningsutvekslinger, må dette bekjentgjøres på en tydelig måte for de som har adgang til disse. Redaksjonen har et selvstendig ansvar for så snart som mulig å fjerne innlegg som bryter med god presseskikk.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"title\":{\"id\":\"4.17\",\"name\":\"Kommentarfelt\"}}],\"format\":\"structured\",\"languages\":[{\"id\":\"no\",\"isActive\":true},{\"id\":\"nb\",\"isActive\":false},{\"id\":\"uk\",\"isActive\":false}],\"slogan\":[{\"_key\":\"62ab9e0c1fa6\",\"_type\":\"block\",\"children\":[{\"_key\":\"e36fd6ddd925\",\"_type\":\"span\",\"marks\":[],\"text\":\"Ord og bilder er mektige våpen.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"7aba26756258\",\"_type\":\"block\",\"children\":[{\"_key\":\"572005973c11\",\"_type\":\"span\",\"marks\":[],\"text\":\"Misbruk dem ikke!\"}],\"markDefs\":[],\"style\":\"normal\"}],\"year\":\"2024\",\"printVersionPdfUrl\":\"https://cdn.sanity.io/files/nqbq1dru/production/c7cff556fc2e31b8e06b28aa309cfbac174d1301.pdf\",\"className\":\"grow\"}]\n"])</script><script>self.__next_f.push([1,"24:[\"$\",\"$L28\",null,{\"content\":\"$21:props:content\",\"format\":\"structured\",\"languages\":\"$21:props:languages\",\"slogan\":\"$21:props:slogan\",\"year\":\"2024\",\"printVersionPdfUrl\":\"https://cdn.sanity.io/files/nqbq1dru/production/c7cff556fc2e31b8e06b28aa309cfbac174d1301.pdf\",\"className\":\"sidebar-filters:hidden pt-1x print:hidden [\u0026+section]:!my-0 -mt-3x\"}]\n22:[\"$\",\"$L18\",null,{\"linkType\":\"download\",\"url\":\"https://cdn.sanity.io/files/nqbq1dru/production/c7cff556fc2e31b8e06b28aa309cfbac174d1301.pdf\",\"icon\":\"arrow-down-
