  <script>
    window.JOURNAL = {"id":520,"name":"Discrete Analysis","description":"Discrete Analysis is a mathematical journal that aims to publish articles that are analytical in flavour but that also have an impact on the study of discrete structures. The areas covered include (all or parts of) harmonic analysis, ergodic theory, topological dynamics, growth in groups, analytic number theory, additive combinatorics, combinatorial number theory, extremal and probabilistic combinatorics, combinatorial geometry, convexity, metric geometry, and theoretical computer science. As a rough guideline, we are looking for papers that are likely to be of genuine interest to the editors of the journal.\n\n\u003cdiv class='panel'\u003e \n  Discrete Analysis is grateful for financial support from Cambridge University and the Stanhill Foundation.\n\u003c/div\u003e\n\n \u003cdiv class='panel'\u003ePublished by Alliance of Diamond Open Access Journals\u003cbr\u003e Wilberforce Road, Cambridge, CB3 OWA\u003c/div\u003e\n \n\n ![Free Journal Network logo](https://i.imgur.com/KKhqos2.png) \u0026emsp; A member of the [Free Journal Network](https://freejournals.org/).","short_description":"Discrete Analysis is a mathematical journal with an emphasis on areas of mathematics that are broadly related to additive combinatorics.","editorial_board":"An email address of the form abcd@efg.hij.kl will be listed below as abcd//efg/hij/kl. After each editor is a list of areas in which he or she would feel particularly comfortable in handling papers.\n\n**Boris Bukh** (Carnegie Mellon University, bbukh//math/cmu/edu) Discrete geometry, additive combinatorics, discrepancy theory.\n\n**Zeev Dvir** (Princeton University,  zdvir//princeton/edu) Computational complexity, coding theory, pseudorandomness, combinatorics.\n\n**Sean Eberhard** (University of Warwick, Sean/Eberhard//warwick/ac/uk) Probabilistic and asymptotic group theory, growth in finite and infinite groups, algebraic combinatorics, additive combinatorics, additive number theory, Ramsey theory.\n\n**Nikos Frantzikinakis** (University of Crete, frantzikinakis//gmail/com) Dynamical systems, additive combinatorics.\n\n**Ben Green** (University of Oxford, Ben.Green//maths/ox/ac/uk) Analytic number theory, additive combinatorics, growth in groups.\n\n**Timothy Gowers** (University of Cambridge, wtg10//dpmms/cam/ac/uk) Additive combinatorics, Fourier methods, extremal and probabilistic combinatorics, mathematical aspects of theoretical computer science.\n\n**Gil Kalai** (Hebrew University of Jerusalem, kalai//math/huji/ac/il)   Fourier methods in extremal and probabilistic combinatorics, convexity, combinatorial geometry.\n\n**Izabella Laba** (University of British Columbia, ilaba//math/ubc/ca) Harmonic analysis, additive combinatorics, geometric measure theory.\n\n**Sarah Peluse** (University of Stanford, speluse//stanford/edu) Arithmetic combinatorics, additive number theory.\n\n**Lillian Pierce** (Duke University, pierce//math/duke/edu) Harmonic analysis, analytic number theory.\n\n**Tom Sanders** (University of Oxford, tom.sanders//maths/ox/ac/uk) Fourier methods, additive combinatorics, growth in groups.\n\n**Kannan Soundararajan** (University of Stanford, ksound//math/stanford/edu), Number theory, especially L-functions and multiplicative number theory.\n\n**Hong Wang** (NYU Courant, hw3639//nyu/edu) Fourier analysis, geometric measure theory.\n\n**Tamar Ziegler** (Hebrew University of Jerusalem, tamar.ziegler//mail/huji/ac/il) Ergodic theory, Fourier analysis, additive combinatorics.","submission_guidelines":"Discrete Analysis is an arXiv overlay journal. This means that while we have a conventional editorial board and refereeing process, we do not host the articles we accept or offer a formatting and copy-editing service. Instead, we simply link to preprints that are posted on the arXiv, which we believe amply meets the needs of our readers. As a result, the cost of running the journal, while not quite zero, is extremely low. Therefore, there are no charges for authors (and obviously none for readers, since the accepted papers are on the arXiv).   \n\n####Submitting an article\n  \nTo submit an article to the journal, you should first post it on the arXiv. When asked which licence you wish to use, you should select CC-BY. (If your article is already posted with a more restricted licence it is not a major problem, since you can give a different licence to the published version.) When the article has appeared on the arXiv, click on the \"Submit a manuscript\" button above and you will be taken through the very short submission process. \n\nYou also have the option of nominating a handling editor, though we do not guarantee that your article will be handled by the editor you nominate.  This will need to be done with a covering letter. For now that will have to be submitted as a \"supporting file\", but in due course a feature should be added to allow a covering letter to be entered directly.\n\nIf for some reason you have difficulty with the submission process, you can email an editor instead, who will be able to enter the paper into the system on your behalf. \n\n####The publication process\n  \nIf your article is accepted, we will send you the comments of the referees. Once you have made appropriate changes, you should reformat your article using [the following style files](https://drive.google.com/drive/folders/0B0bJshRLl13VUzdoamZxMzNXTlU?resourcekey=0-Yk7pQBnkLAUzXMY9BGS92A\u0026usp=sharing) and then send the formatted file to us. We will add important metadata (including the year and number of the article) and send it back to you so that you can post the final version to the arXiv. Meanwhile, we will add the article to the journal. What the reader will see is a list of article titles with links to the arXiv and also short descriptions of each article, which we call Editorial Introductions. These are to make it possible for readers to browse the journal without having to click back and forth form the journal webpage to the arXiv. They are written by us, but we show them to the authors before posting them.  \n  \nWe require submitted articles to have the features normally expected of a mathematics journal article. For example, your article should have an abstract and a bibliography. It should give appropriate credit to ideas and results that are derived from other sources. It should be of a reasonable standard of English (or, exceptionally, another language). It should not have been submitted elsewhere, nor should it be submitted elsewhere while it is being considered by Discrete Analysis. Because we do not do copy-editing, we ask authors to take particular care with proofreading their articles before submitting their final version. \n  \nAlthough the journal website will have a permanent link to the published version of the article, which will be considered the version of record, we encourage authors to post updated versions on the arXiv if they discover ways in which their papers can be improved. If notified about these, we will draw attention to them on the journal website. It will be helpful for the purposes of later citation if pagination and theorem numbering are changed as little as possible.\n\nArticles in Discrete Analysis are published under a [Creative Commons CC-BY licence](https://creativecommons.org/licenses/by/4.0/) and will be free to read in perpetuity. Authors retain copyright to their articles.\n\n####Author name changes\n\nBecause Discrete Analysis is an electronic journal, it is in principle straightforward to update articles. If an update is substantial, then we will normally post a link to the update while keeping the original version as the version of record. However, should an author wish to change their name after publication without making any other changes (beyond any that are consequential on the name change), then we are ready to change the version of record. In this situation, authors are requested to blished_articles_count":1,"active":true},{"id":11,"journal_id":520,"name":"Metric Geometry","slug":"11-metric-geometry","published_articles_count":6,"active":true},{"id":1,"journal_id":520,"name":"Number Theory","slug":"1-number-theory","published_articles_count":20,"active":true},{"id":969,"journal_id":520,"name":"Partial Differential Equations","slug":"969-partial-differential-equations","published_articles_count":2,"active":true},{"id":7,"journal_id":520,"name":"Probabilistic Combinatorics","slug":"7-probabilistic-combinatorics","published_articles_count":5,"active":true},{"id":9,"journal_id":520,"name":"Probability","slug":"9-probability","published_articles_count":11,"active":true}],"custom_pages":[{"id":1044,"slug":"1044-policies","page_title":"Discrete Analysis Journal Policies","nav_item_title":"Policies","body":"## Copyright information\n\nArticles in Discrete Analysis are published under a [Creative Commons CC-BY licence](https://creativecommons.org/licenses/by/4.0/) and will be free to read in perpetuity. Authors retain copyright to their articles.\n\n## Publication Ethics and Publication Malpractice Statement\n\n#### Duties of Editors\n\nArticles will be evaluated exclusively on the basis of their mathematical interest and importance and their relevance to the scope of the journal.\n\nArticles under consideration will already be in the public domain, since it is a requirement of the journal that they should be posted to arXiv. However, the information that they have been submitted to Discrete Analysis will be kept confidential: that is, it will not be disclosed to anyone other than those involved in the evaluation process and in the administration of the journal.\n\nEditors may submit papers to the journal, but if they do so, then all information about the processing of those papers will be hidden from their view and they will have no part in the decision process. Moreover, it is the policy of Discrete Analysis to set a slightly higher bar for acceptance for papers submitted by editors.\n\nEditors who have a significant conflict of interest connected with a paper will declare it to the other editors and will avoid participating in the decision process.\n\nSubmitted manuscripts will undergo the following process.\n\n1. All articles will be subject to a quick initial screening by the editors. If the editors feel that the article is inappropriate for the journal for a reason that can be quickly ascertained, such as the subject matter being too far from the scope of the journal, the authors will normally be informed within 1-2 weeks of submission.\n2. For all other submissions, we will first seek to gauge the level of interest that the paper will have, on the assumption that it is correct and well written. This will normally mean sending the paper out to at least two experts for \"quick opinions\", after which its suitability will be discussed by the editors.\n3. If at this stage, the paper is thought to be potentially suitable for Discrete Analysis, then it will be sent to a referee for a fuller and more technical evaluation.\n4. The final decision concerning a paper is taken by the entire editorial board. The handling editor will make a recommendation -- sometimes a tentative one -- and this will be discussed. In cases of doubt, more quick opinions will usually be sought.\n5. Some stages of the above process may occasionally be bypassed if a paper is so close to the expertise of one or more of the editors that extra external information is clearly not necessary for a fair decision to be made.\n6. If additional information comes to light after publication that would have affected the decision (for example, if a serious error in a paper is discovered), the decision will not be changed, but the information will be prominently displayed in the editorial introduction that appears on the journal website.\n\n#### Duties of Reviewers\n\nReviewers asked for quick opinions are expected to be objective and to provide them promptly. Should they have a conflict of interest, or should they lack the expertise to make a judgment with confidence, they should make this clear to the editors and should decline to review the paper.\n\nMore detailed reports take longer to provide. For such reports, an initial deadline will be set by the handling editor: if it is felt by a reviewer to be unrealistic, then he or she should agree an alternative with the editor. Since a paper that reaches this stage of the reviewing process will normally have been judged to be interesting enough to publish, the focus of the more detailed report should be the correctness of the paper and the quality of its writing. However, opinions about its quality and interest are also welcomed.\n\nReviewers are expected to keep confidential the information that the paper has been submitted to Discrete Analysis, except that if the paper is rejected and the reviewer receives it again to evaluate for another journal, then the information that the paper has been rejected by Discrete Analysis may be shared (confidentially) with the editorial board of the other journal.\n\nIn some cases, it is not reasonable to expect a reviewer to check the correctness of a paper down to the last detail. In such cases, editors may be satisfied with indirect evidence that a paper is likely to be correct. (For example, it may be that the general outline of the argument is convincing, but that the technical details involved in converting the outline into a complete proof are very complicated.) Thus, publication in Discrete Analysis should not be considered an absolute guarantee of correctness, just as in practice it is not a guarantee for any other journal. Readers who discover important errors in Discrete Analysis papers are strongly encouraged to report them to the journal: as stated above, if we are made aware of an error, we will add a prominent notification of the error to the editorial introduction to the paper.\n\nIf an author subsequently corrects an error and posts a revised version of the paper to the arXiv, the version of record of the paper will remain as the previously accepted version. However, a prominent link to the corrected version will be added to the editorial introduction.\n\nDiscrete Analysis does not normally copy-edit articles. We therefore ask our reviewers to point out minor errors such as spelling mistakes as well as more important mathematical slips. Should these be very numerous, then a more general statement to the effect that the paper should be thoroughly checked for small errors will be sufficient.\n\n#### Duties of Authors\n\nAuthors should submit original work only (except if it this is clearly not the intention of the article -- as might be the case, for example, with a survey paper). Any results that are not due to the authors should be clearly cited. Copying or paraphrasing substantial parts of another paper without attribution is unacceptable, as is any other form of plagiarism.\n\nNo paper should be submitted to Discrete Analysis that is already published elsewhere or is being considered for publication by another journal.\n\nThose named as authors of a paper should have made a substantial contribution to the paper, or to a more general project of which the paper is a part, and anybody who has made such a contribution should be offered authorship.\n\nAuthors who discover important errors in their articles, whether published or under consideration for publication, should notify the journal promptly.\n\n#### Duties of the Publisher\n\nDiscrete Analysis is committed to the permanent availability and preservation of scholarly research and ensures accessibility by partnering with organizations and maintaining our own digital archive.\n\nDiscrete Analysis adheres to the fair open access principles as set out at https://fairopenaccess.org/\n","banner_style":"image","banner_color":"#59A5D8","banner":{"id":1044,"name":"photo-1564189218077-da13d6c81f25","size":1996159,"content_type":"image/jpeg","url":"https://s3.amazonaws.com/production.scholastica/custom_page/1044/original/photo-1564189218077-da13d6c81f25?1764923396","thumb":"https://s3.amazonaws.com/production.scholastica/custom_page/1044/thumb/photo-1564189218077-da13d6c81f25?1764923396","small":"https://s3.amazonaws.com/production.scholastica/custom_page/1044/small/photo-1564189218077-da13d6c81f25?1764923396","medium":"https://s3.amazonaws.com/production.scholastica/custom_page/1044/medium/photo-1564189218077-da13d6c81f25?1764923396","large":"https://s3.amazonaws.com/production.scholastica/custom_page/1044/large/photo-1564189218077-da13d6c81f25?1764923396","source":"Unsplash","user_id":"UiFwQtXTHtg","username":"einfachlaurenz","last_name":"Heymann","first_name":"Laurenz"},"journal_id":520,"image_metadatum":{"id":169571,"cover_metadata":{"source":"Unsplash","user_id":"UiFwQtXTHtg","username":"einfachlaurenz","last_name":"Heymann","first_name":"Laurenz"},"imageable_id":1044,"imageable_type":"CustomPage","created_at":"2025-12-05T08:30:04.313Z","updated_at":"2025-12-05T08:30:04.313Z"}}]}
