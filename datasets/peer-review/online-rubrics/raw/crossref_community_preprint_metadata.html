        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_2800&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:5122,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-11T14:15:55.290Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOur Preprint Advisory Group was assembled last year to support Crossref to collect and improve the quality of metadata for preprints. The group has \\u003ca href=\\\&quot;https://doi.org/10.13003/psk3h6qey4\\\&quot;\\u003edeveloped recommendations\\u003c/a\\u003e in four key areas of the preprint metadata schema. These are:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003ePreprint withdrawal and removal\\u003c/li\\u003e\\n\\u003cli\\u003ePreprints as an article type (rather than a subtype)\\u003c/li\\u003e\\n\\u003cli\\u003eVersioning of preprints\\u003c/li\\u003e\\n\\u003cli\\u003ePreprint relationship metadata\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eWe invite your feedback\\u003c/strong\\u003e on these before we start on implementation later this year. We appreciate all comments on this initial set of recommendations \\u003cstrong\\u003eby the end of September 2022\\u003c/strong\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003ePlease add your comments here and join the discussion (if you’re not sure how, please take a look at our guidelines and ‘how to’ instruction \\u003ca href=\\\&quot;https://community.crossref.org/t/about-the-welcome-to-the-crossref-community-forum-category/1026\\\&quot;\\u003ehere\\u003c/a\\u003e).\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-25T16:20:13.799Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3814,\&quot;reads\&quot;:106,\&quot;readers_count\&quot;:105,\&quot;score\&quot;:19291.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://doi.org/10.13003/psk3h6qey4\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:80},{\&quot;url\&quot;:\&quot;https://community.crossref.org/t/about-the-welcome-to-the-crossref-community-forum-category/1026\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;About the Welcome to the Crossref Community Forum! category\&quot;,\&quot;clicks\&quot;:26}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:9}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:166,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/1\&quot;,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:5146,\&quot;name\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;username\&quot;:\&quot;mccurley\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-13T17:22:58.086Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI’ve seen many different reasons for withdrawal. In one case the authors claimed the results of the paper are valid, whereas the editors have been convinced of the opposite. I’ve seen other cases in which conflict of interest were violated, or there were other code of conduct violations. The action to withdraw a paper may therefore come from an author (and this may be disputed even by multiple authors), or by an institution associated to the publication (e.g., employer or sponsoring agency), an editor, or the board of directors of a sponsoring society. It is actually difficult to imagine all of the possible social failure modes, because humans are creative. \\u003cimg src=\\\&quot;https://emoji.discourse-cdn.com/twitter/confused.png?v=12\\\&quot; title=\\\&quot;:confused:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:confused:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e  For this reason, when a withdrawal is initiated, it seems useful for the scholarly record that the organization or person who initiates the withdrawal should be identified. This could of course be encoded into the free-text field for reason, or it might be easier to just use a boolean field to distinguish author-initiated vs non-author-initiated withdrawals. My reasoning is that the scholarly record is a social construct, and disagreements are part of the process. We don’t need to insist on surfacing all of the ugly details behind the controversy, but there is a pretty big difference between an author-initiated withdrawal and a non-author initiated withdrawal.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-13T17:22:58.086Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:5,\&quot;reads\&quot;:99,\&quot;readers_count\&quot;:98,\&quot;score\&quot;:144.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:4}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:922,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/2\&quot;},{\&quot;id\&quot;:5148,\&quot;name\&quot;:\&quot;Estabraq Talib Abdullah\&quot;,\&quot;username\&quot;:\&quot;Estabraq\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/e/ccd318/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-14T09:00:01.000Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eDear Crossref,\\u003cbr\\u003e\\nI totally agree with you in distinguishing the author who initiated withdrawal. but is it possible to make a specific formula to distinguish the researcher who has withdrawn from the rest of the researchers for the same paper?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-14T09:00:16.322Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:82,\&quot;readers_count\&quot;:81,\&quot;score\&quot;:56.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Estabraq Talib Abdullah\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:922,\&quot;username\&quot;:\&quot;mccurley\&quot;,\&quot;name\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:153,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;via_email\&quot;:true,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/3\&quot;},{\&quot;id\&quot;:5149,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-14T09:22:43.106Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eYes, it’s very complex, and preprint servers usually don’t have the resources to investigate to the same extent as a journal publisher would. Some kind of broad taxonomy of reasons for withdrawal is an idea that could work, and the origin of the withdrawal could be a part of it. Publishers usually note whether the authors (and sometimes which authors) agreed with a retraction. Formalizing that could be helpful. Getting it widely adopted would a whole other problem.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-14T09:22:43.106Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:79,\&quot;readers_count\&quot;:78,\&quot;score\&quot;:85.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;ca tps://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-14T10:22:16.218Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/zarnigor2006\\\&quot;\\u003e@zarnigor2006\\u003c/a\\u003e This is a general discussion on a public forum. You probably received the message because of your notification settings, there is nothing specific to your research. If you have questions about the forum, see \\u003ca href=\\\&quot;https://community.crossref.org/t/about-the-welcome-to-the-crossref-community-forum-category/1026\\\&quot;\\u003ehere\\u003c/a\\u003e.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-14T10:22:33.084Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:6,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:8,\&quot;reads\&quot;:69,\&quot;readers_count\&quot;:68,\&quot;score\&quot;:68.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://community.crossref.org/t/about-the-welcome-to-the-crossref-community-forum-category/1026\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;About the Welcome to the Crossref Community Forum! category\&quot;,\&quot;clicks\&quot;:4}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:779,\&quot;username\&quot;:\&quot;zarnigor2006\&quot;,\&quot;name\&quot;:\&quot;Каримов Хусниддин Нагимович\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/z/6f9a4e/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:166,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/7\&quot;},{\&quot;id\&quot;:5153,\&quot;name\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;username\&quot;:\&quot;mccurley\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-14T17:13:14.775Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eMost of my experience has been with eprint iacr org and arXiv. I was reluctant to define a whole taxonomy of reasons, because I think a text field is best suited to the nuance of describing it. In most of the cases I have seen, it’s because there was a flaw in mathematical reasoning, and that is best described in text. In other fields it might be experimental failure or realization that a model is not descriptive enough. There are probably reasons of plagiarism or outright exaggeration or slander or every other kind of human misbehavior. I was mostly focused on who made the decision to withdraw. I don’t see a need to identify the individual, since for example it may have been a vote among the editors or the board or an ethics committee (IACR has had both in the 25 years of eprint).\\u003c/p\\u003e\\n\\u003cp\\u003eOne failure mode I had not anticipated is when an author wishes to withdraw their name from a multi-authored paper, or an affiliation wishes to disclaim the work. I assume this is properly classified as a revision to the paper rather than a withdrawal, but it might not be strong enough given that the previous versions still have the author or affiliation name on them. It’s more like a half-withdrawal. Is that within the scope of the recommendations?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-14T17:13:14.775Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:65,\&quot;readers_count\&quot;:64,\&quot;score\&quot;:33.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:166,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:922,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/8\&quot;},{\&quot;id\&quot;:5158,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-07-15T13:58:20.197Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOne author removing permission is a really interesting case, and frustratingly common in preprints in my experience when not all authors are consulted about posting a preprint. Formally, the paper should be withdrawn but there might be legitimate reasons to just remove an author (if they were added by mistake) and every case has its own nuances. With regards to how to capture this in the metadata, a text explanation would be helpful, and obviously an update to the author list.\\u003c/p\\u003e\\n\\u003cp\\u003eI seem to recall that when we discussed terms for withdrawal and removal in the AG there was one preprint server which used a different term internally for author-initiated removals. These are much more straightforward to handle and perhaps it is useful to distinguish them. My only counter-argument would be that if there’s a legitimate reason to withdraw, it isn’t affected by who initiated the withdrawal request. On the other hand there’s no harm in having more information about the process. Definitely a useful topic to explore, thanks for bringing it up.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-07-15T13:58:20.197Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:59,\&quot;readers_count\&quot;:58,\&quot;score\&quot;:76.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:922,\&quot;username\&quot;:\&quot;mccurley\&quot;,\&quot;name\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:166,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/9\&quot;},{\&quot;id\&quot;:5289,\&quot;name\&quot;:\&quot;Mario Malicki\&quot;,\&quot;username\&quot;:\&quot;MarioMalicki\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-12T16:30:33.120Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSuggestion 1: Please consider adding a new relationship relation - that would describe when a preprint (version) is the same as manuscript version that was submitted to a journal/conference proceeding. Preprints can be posted in various times to a server, and sometimes they do not equate the version submitted to a journal - but for those that are - it is important to be able to identify the version that was submitted to a journal - to better understand the role of peer review and changes that occur due to peer review and journal edits. With some journals or preprint servers automatically allowing submission of a preprint to a journal and vice a versa this should not be difficult - and might prove invaluable in the studies of role of peer review and scholarly communication.\\u003cbr\\u003e\\nSuggestion 1: Please consider introducing metadata fields that capture description of changes that occurred from the previous version - see more on that here  www.scholcommlab.ca/2020/04/08/preprint-recommendations/. Some servers or F1000 have different formats how they capture this - but this information could be an important part of the meta-data.\\u003c/p\\u003e\\n\\u003cp\\u003eKind regards,\\u003cbr\\u003e\\nMario Malicki\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-12T16:30:33.120Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:49,\&quot;readers_count\&quot;:48,\&quot;score\&quot;:34.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Mario Malicki\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1029,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/10\&quot;},{\&quot;id\&quot;:5292,\&quot;name\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;username\&quot;:\&quot;mccurley\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-12T17:22:35.791Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIn my experience, the preprint version can vary from the “official published version” in several ways:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003ethe preprint might be an early version\\u003c/li\\u003e\\n\\u003cli\\u003ethe preprint might be essentially the same except for the footnote with a link to the official version\\u003c/li\\u003e\\n\\u003cli\\u003ethe preprint might be identical to the official version\\u003c/li\\u003e\\n\\u003cli\\u003ethe preprint might be an expanded version. This happens for us sometimes if the official version has a page limit, in which case the preprint version ends up containing full proofs for mathematical results that are omitted in the “official version”.\\u003c/li\\u003e\\n\\u003cli\\u003ethe preprint might be an updated version posted after the official version, with errata to the official version.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eNote that what actually gets posted may not be in compliance with what the publisher of the official version wants. We don’t police that. Maybe I am overlooking other ways in which the preprint could differ from the official version.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-12T17:22:35.791Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:10,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:51,\&quot;readers_count\&quot;:50,\&quot;score\&quot;:55.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Kevin McCurley\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1029,\&quot;username\&quot;:\&quot;MarioMalicki\&quot;,\&quot;name\&quot;:\&quot;Mario Malicki\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:922,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/12\&quot;},{\&quot;id\&quot;:5323,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-24T09:32:10.306Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eMario, thank you for the suggestion. We have in our schema a relation of ‘is-identical-to’ that we use in some specific cases. An issue is that identical could mean subtly different things: exactly the same document, the same content reformatted (e.g. PDF vs XML vs Word manuscript), or some minor typographical changes that wouldn’t need a version change.\\u003c/p\\u003e\\n\\u003cp\\u003eI think the suggestion of a field to describe changes between versions is an excellent one and something that we’re considering to add as metadata.\\u003c/p\\u003e\\n\\u003cp\\u003eAnother question is who determines whether something is identical? I don’t think platforms would take the time to see if something (such as a conference paper) is exactly the same or simply similar to a previous work (such as a preprint). If they do, then they could use the is-identical-to relationship. The best pragmatic solution is to have links to the full text so that downstream users and services could make a comparison.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:13,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-24T09:32:10.306Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:10,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:47,\&quot;readers_count\&quot;:46,\&quot;score\&quot;:59.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1029,\&quot;username\&quot;:\&quot;MarioMalicki\&quot;,\&quot;name\&quot;:\&quot;Mario Malicki\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:166,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/13\&quot;},{\&quot;id\&quot;:5326,\&quot;name\&quot;:\&quot;Mario Malicki\&quot;,\&quot;username\&quot;:\&quot;MarioMalicki\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-24T16:50:23.806Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThank you for considering the suggestions and working on them.\\u003c/p\\u003e\\n\\u003cp\\u003eJust to clarify, is identical to - is linkage to another document, what I suggested is that there is a filed which would specify this is THE Version submitted to the journal, not a connection it to any other document/paper/proceeding. For example,  if you look at Springer Natures - In Review platform for my journal (link below for an example), the preprint can be the exact manuscript version that was submitted to my journal, i.e. authors opted that that version is also shared as a preprint during journal submission time - and instead of “just” classifying these as preprints, I hope you will have a field that will show this is the “journal submitted version”. So the meta fields could be either:\\u003cbr\\u003e\\nvenue-submitted: Yes.\\u003cbr\\u003e\\nand then you would have details for the venue:\\u003cbr\\u003e\\ne.g. journal-title: Name\\u003cbr\\u003e\\ndate-submitted, and so on.\\u003cbr\\u003e\\nAnd then as we have published review reports for them, you could link those reviews to the preprint itself. Perhaps that is another option - through which researchers could identify it being the submitted version - if the reviews come from a journal - but a field would be helpful to be able to filter based on that field, rather than on reviews - as some journals might share the information on the submitted version but not shared reviews.\\u003c/p\\u003e\\n\\u003cp\\u003eExample:\\u003cbr\\u003e\\nManuscript version - preprint-  posted on In-review during journal submission process: researchsquare /article/rs-582546/v1\\u003cbr\\u003e\\nNote: On in review - you can see the whole review process timeline in the right box of the page\\u003c/p\\u003e\\n\\u003cp\\u003eManuscript published (VoR): esearchintegrityjournal.biomedcentral  /articles/10.1186/s41073-021-00116-4\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:14,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-24T16:50:23.806Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:46,\&quot;readers_count\&quot;:45,\&quot;score\&quot;:14.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Mario Malicki\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1029,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/14\&quot;},{\&quot;id\&quot;:5333,\&quot;name\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;username\&quot;:\&quot;mrittman\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-25T09:58:48.075Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/mariomalicki\\\&quot;\\u003e@MarioMalicki\\u003c/a\\u003e Thanks for the clarification, this is a bit different from what I thought before. It seems like a good topic to discuss with our preprint advisory group. I have questions about how it would be implemented, and who would be responsible for updating the metadata when the state changes in the editorial process. On the other hand, I think there would be an interest in having this data publicly available via metadata.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-25T09:59:20.297Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:14,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:38,\&quot;readers_count\&quot;:37,\&quot;score\&quot;:7.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1029,\&quot;username\&quot;:\&quot;MarioMalicki\&quot;,\&quot;name\&quot;:\&quot;Mario Malicki\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/e47774/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quo ;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/m/aca169/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-29T06:31:13.311Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/eric\\\&quot;\\u003e@Eric\\u003c/a\\u003e Thanks for noting this, I’m not aware of any recent (or forthcoming) output from this group, but it would be interesting to know. The context around preprints has changed significantly since the group was formed.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/mccurley\\\&quot;\\u003e@mccurley\\u003c/a\\u003e The paper cited on the NISO page seems to be \\u003ca href=\\\&quot;https://doi.org/10.1087/095315103322110941\\\&quot;\\u003ehttps://doi.org/10.1087/095315103322110941\\u003c/a\\u003e (PDF available from \\u003ca href=\\\&quot;https://onlinelibrary.wiley.com/doi/pdf/10.1087/095315103322110941\\\&quot;\\u003eWiley\\u003c/a\\u003e), but it’s hard to tell without a more specific reference.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-29T06:31:13.311Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:16,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:39,\&quot;readers_count\&quot;:38,\&quot;score\&quot;:17.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;fl t;:\&quot;\\u003cp\\u003eGood to hear that there is ongoing work on JAV. There are several people on both that committee and our preprints advisory group (including my colleague Patricia) so it’s more than like that there’s been a crossover of ideas. CORREC is also one we’ll be keeping a close eye on.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:20,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-08-31T13:35:12.695Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:19,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:43,\&quot;readers_count\&quot;:42,\&quot;score\&quot;:8.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;Martyn Rittman\&quot;,\&quot;primary_group_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_name\&quot;:\&quot;Crossref-team\&quot;,\&quot;flair_url\&quot;:\&quot;https://us1.discourse-cdn.com/flex020/uploads/crossref/original/1X/79e13ad0b4ed7ba938e66780a2b95cd7b16f93f8.png\&quot;,\&quot;flair_bg_color\&quot;:\&quot;ffffff\&quot;,\&quot;flair_color\&quot;:\&quot;\&quot;,\&quot;flair_group_id\&quot;:42,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Crossref team\&quot;,\&quot;title_is_group\&quot;:true,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:392,\&quot;username\&quot;:\&quot;vincent\&quot;,\&quot;name\&quot;:\&quot;Vincent Lizzi\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/community.crossref.org/vincent/{size}/374_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:166,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/20\&quot;},{\&quot;id\&quot;:5451,\&quot;name\&quot;:\&quot;International Science Council Steering Group on the Future of Scientific Publishing\&quot;,\&quot;username\&quot;:\&quot;ISC_SG_SciPub\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/i/c37758/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-30T13:03:53.661Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cstrong\\u003eResponse by the International Science Council’s Steering Group on the Future of Scientific Publishing\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eThe International Science Council’s Open Science and Future of Scientific Publishing Project has been advocating the increased use of preprints as a recognized and effective route for the dissemination of research findings and for these to become an integral part of the record of science. (e.g.\\u003ca\\u003ehttps://council.science/publications/normalization-preprints/\\u003c/a\\u003e)\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eFor such a system to be effectively implemented requires appropriate metadata targeted to facilitating functionality. We support and welcome the changes being proposed, specifically in:\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eRecognizing preprints as a mainstream publication type in their own right\\u003c/li\\u003e\\n\\u003cli\\u003eImproving two-way connections between different versions of preprints\\u003c/li\\u003e\\n\\u003cli\\u003eAllowing for withdrawal/correction of a preprint\\u003c/li\\u003e\\n\\u003cli\\u003eImproving connectivity between reviews of a specific pre-prints with the preprint itself\\u003c/li\\u003e\\n\\u003cli\\u003eImproving relationships between the preprint and associated data/programs etc\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003col start=\\\&quot;3\\\&quot;\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eOur primary concern with the approaches proposed is in not sufficiently allowing for interoperability between different platforms and DOI registration entities. Allowing integration and discoverability of the scholarly content published globally is of fundamental importance to the ISC. It is a vital to be able to integrate research from different geographic regions. Whilst your report notes that enabling such interoperability is difficult and responsibility for undertaking this is hard to assign, any possibility for successful interoperability requires metadata which recognises alternative systems  - and we believe this should be a particularly important consideration for the metadata schema most commonly adopted within the western scholarly publishing community. We believe that the evolution of common standards that are governed by the global scientific community are essential to the future of scientific publishing.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIn many cases this will be achieved via the various relationship entities within the CrossRef schema - but presently the scope for inclusion of alternative platforms within these tags is limited and not always fully functional. This, for example, has recently been highlighted by the difficulties faced in relating a review to an article posted on arXiv: \\u003ca\\u003ehttps://crossref.atlassian.net/browse/CR-777\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe would encourage relationship entities to include as diverse a range of alternative platforms and identifiers as possible, to enable the eventual development of effective and inclusive cross-platform discovery processes either by CrossRef or other entities.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\&quot;,\&quot;post_number\&quot;:22,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:24,\&quot;updated_at\&quot;:\&quot;2022-09-30T13:03:53.661Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:248,\&quot;reads\&quot;:42,\&quot;readers_count\&quot;:41,\&quot;score\&quot;:1273.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:2800,\&quot;topic_slug\&quot;:\&quot;share-your-thoughts-on-preprint-metadata\&quot;,\&quot;display_username\&quot;:\&quot;International Science Council Steering Group on the Future of Scientific Publishing\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1093,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/share-your-thoughts-on-preprint-metadata/2800/22\&quot;}],\&quot;stream\&quot;:[5122,5146,5148,5149,5150,5151,5152,5153,5158,5289,5292,5323,5326,5333,5334,5341,5344,5345,5352,5451,5557,5791,5795,5797]},\&quot;timeline_lookup\&quot;:[[1,1399],[2,1397],[3,1396],[9,1395],[10,1367],[12,1355],[14,1354],[16,1353],[17,1350],[           <div id='post_1'  class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mrittman'><span itemprop="name">mrittman</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/mrittman'>
                
              </span>

                <link itemprop="mainEntityOfPage" href="https://community.crossref.org/t/share-your-thoughts-on-preprint-metadata/2800">


              <span class="crawler-post-infos">
                  <time  datetime='2022-07-11T14:15:55Z' class='post-time'>
                    11 July 2022 14:15
                  </time>
                  <meta itemprop='dateModified' content='2022-07-25T16:20:13Z'>
              <span itemprop="position">1</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Our Preprint Advisory Group was assembled last year to support Crossref to collect and improve the quality of metadata for preprints. The group has <a href="https://doi.org/10.13003/psk3h6qey4">developed recommendations</a> in four key areas of the preprint metadata schema. These are:</p>
<ul>
<li>Preprint withdrawal and removal</li>
<li>Preprints as an article type (rather than a subtype)</li>
<li>Versioning of preprints</li>
<li>Preprint relationship metadata</li>
</ul>
<p><strong>We invite your feedback</strong> on these before we start on implementation later this year. We appreciate all comments on this initial set of recommendations <strong>by the end of September 2022</strong>.</p>
<p>Please add your comments here and join the discussion (if you’re not sure how, please take a look at our guidelines and ‘how to’ instruction <a href="https://community.crossref.org/t/about-the-welcome-to-the-crossref-community-forum-category/1026">here</a>).</p>
            </div>

              <div itemprop="interactionStatistic" itemscope="itemscope" itemtype="http://schema.org/InteractionCounter">
                  <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
                  <meta itemprop="userInteractionCount" content="9" />
                <span class='post-likes'>9 Likes</span>
              </div>


            


          </div>
          <div id='post_2' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mccurley'><span itemprop="name">mccurley</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/mccurley'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-07-13T17:22:58Z' class='post-time'>
                    13 July 2022 17:22
                  </time>
                  <meta itemprop='dateModified' content='2022-07-13T17:22:58Z'>
              <span itemprop="position">2</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>I’ve seen many different reasons for withdrawal. In one case the authors claimed the results of the paper are valid, whereas the editors have been convinced of the opposite. I’ve seen other cases in which conflict of interest were violated, or there were other code of conduct violations. The action to withdraw a paper may therefore come from an author (and this may be disputed even by multiple authors), or by an institution associated to the publication (e.g., employer or sponsoring agency), an editor, or the board of directors of a sponsoring society. It is actually difficult to imagine all of the possible social failure modes, because humans are creative. <img src="https://emoji.discourse-cdn.com/twitter/confused.png?v=12" title=":confused:" class="emoji" alt=":confused:" loading="lazy" width="20" height="20">  For this reason, when a withdrawal is initiated, it seems useful for the scholarly record that the organization or person who initiates the withdrawal should be identified. This could of course be encoded into the free-text field for reason, or it might be easier to just use a boolean field to distinguish author-initiated vs non-author-initiated withdrawals. My reasoning is that the scholarly record is a social construct, and disagreements are part of the process. We don’t need to insist on surfacing all of the ugly details behind the controversy, but there is a pretty big difference between an author-initiated withdrawal and a non-author initiated withdrawal.</p>
            </div>

              <div itemprop="interactionStatistic" itemscope="itemscope" itemtype="http://schema.org/InteractionCounter">
                  <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
                  <meta itemprop="userInteractionCount" content="4" />
                <span class='post-likes'>4 Likes</span>
              </div>


            


          </div>
          <div id='post_3' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/Estabraq'><span itemprop="name">Estabraq</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/Estabraq'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-07-14T09:00:01Z' class='post-time'>
                    14 July 2022 09:00
                  </time>
                  <meta itemprop='dateModified' content='2022-07-14T09:00:01Z'>
              <span itemprop="position">3</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Dear Crossref,<br>
I totally agree with you in distinguishing the author who initiated withdrawal. but is it possible to make a specific formula to distinguish the researcher who has withdrawn from the rest of the researchers for the same paper?</p>
            </div>

              <div itemprop="interactionStatistic" itemscope="itemscope" itemtype="http://schema.org/InteractionCounter">
                  <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
                  <meta itemprop="userInteractionCount" content="2" />
                <span class='post-likes'>2 Likes</span>
              </div>


            


          </div>
          <div id='post_4' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mrittman'><span itemprop="name">mrittman</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/mrittman'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-07-14T09:22:43Z' class='post-time'>
                    14 July 2022 09:22
                  </time>
                  <meta itemprop='dateModified' content='2022-07-14T09:22:43Z'>
              <span itemprop="position">4</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Yes, it’s very complex, and preprint servers usually don’t have the resources to investigate to the same extent as a journal publisher would. Some kind of broad taxonomy of reasons for withdrawal is an idea that could work, and the origin of the withdrawal could be a part of it. Publishers usually note whether the authors (and sometimes which authors) agreed with a retraction. Formalizing that could be helpful. Getting it widely adopted would a whole other problem.</p>
            </div>

              <div itemprop="interactionStatistic" itemscope="itemscope" itemtype="http://schema.org/InteractionCounter">

          </div>
          <div id='post_5' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/zarnigor2006'><span itemprop="name">zarnigor2006</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/zarnigor2006'>
                
              </span>

          <div id='post_8' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mccurley'><span itemprop="name">mccurley</span></a>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-07-14T17:13:14Z' class='post-time'>

            <div class='post' itemprop="text">
              <p>Most of my experience has been with eprint iacr org and arXiv. I was reluctant to define a whole taxonomy of reasons, because I think a text field is best suited to the nuance of describing it. In most of the cases I have seen, it’s because there was a flaw in mathematical reasoning, and that is best described in text. In other fields it might be experimental failure or realization that a model is not descriptive enough. There are probably reasons of plagiarism or outright exaggeration or slander or every other kind of human misbehavior. I was mostly focused on who made the decision to withdraw. I don’t see a need to identify the individual, since for example it may have been a vote among the editors or the board or an ethics committee (IACR has had both in the 25 years of eprint).</p>
<p>One failure mode I had not anticipated is when an author wishes to withdraw their name from a multi-authored paper, or an affiliation wishes to disclaim the work. I assume this is properly classified as a revision to the paper rather than a withdrawal, but it might not be strong enough given that the previous versions still have the author or affiliation name on them. It’s more like a half-withdrawal. Is that within the scope of the recommendations?</p>
            </div>

          <div id='post_9' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mrittman'><span itemprop="name">mrittman</span></a>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-07-15T13:58:20Z' class='post-time'>
                    15 July 2022 13:58
                  </time>
                  <meta itemprop='dateModified' content='2022-07-15T13:58:20Z'>
              <span itemprop="position">9</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>One author removing permission is a really interesting case, and frustratingly common in preprints in my experience when not all authors are consulted about posting a preprint. Formally, the paper should be withdrawn but there might be legitimate reasons to just remove an author (if they were added by mistake) and every case has its own nuances. With regards to how to capture this in the metadata, a text explanation would be helpful, and obviously an update to the author list.</p>
<p>I seem to recall that when we discussed terms for withdrawal and removal in the AG there was one preprint server which used a different term internally for author-initiated removals. These are much more straightforward to handle and perhaps it is useful to distinguish them. My only counter-argument would be that if there’s a legitimate reason to withdraw, it isn’t affected by who initiated the withdrawal request. On the other hand there’s no harm in having more information about the process. Definitely a useful topic to explore, thanks for bringing it up.</p>
            </div>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/MarioMalicki'><span itemprop="name">MarioMalicki</span></a>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-08-12T16:30:33Z' class='post-time'>

                  </time>
                  <meta itemprop='dateModified' content='2022-08-12T16:30:33Z'>
              <span itemprop="position">10</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Suggestion 1: Please consider adding a new relationship relation - that would describe when a preprint (version) is the same as manuscript version that was submitted to a journal/conference proceeding. Preprints can be posted in various times to a server, and sometimes they do not equate the version submitted to a journal - but for those that are - it is important to be able to identify the version that was submitted to a journal - to better understand the role of peer review and changes that occur due to peer review and journal edits. With some journals or preprint servers automatically allowing submission of a preprint to a journal and vice a versa this should not be difficult - and might prove invaluable in the studies of role of peer review and scholarly communication.<br>
Suggestion 1: Please consider introducing metadata fields that capture description of changes that occurred from the previous version - see more on that here  www.scholcommlab.ca/2020/04/08/preprint-recommendations/. Some servers or F1000 have different formats how they capture this - but this information could be an important part of the meta-data.</p>
<p>Kind regards,<br>
Mario Malicki</p>
            </div>

              <span class="crawler-post-infos">

              <span itemprop="position">12</span>
              </span>

            <div class='post' itemprop="text">
              <p>In my experience, the preprint version can vary from the “official published version” in several ways:</p>
<ol>
<li>the preprint might be an early version</li>
<li>the preprint might be essentially the same except for the footnote with a link to the official version</li>
<li>the preprint might be identical to the official version</li>
<li>the preprint might be an expanded version. This happens for us sometimes if the official version has a page limit, in which case the preprint version ends up containing full proofs for mathematical results that are omitted in the “official version”.</li>
<li>the preprint might be an updated version posted after the official version, with errata to the official version.</li>
</ol>
<p>Note that what actually gets posted may not be in compliance with what the publisher of the official version wants. We don’t police that. Maybe I am overlooking other ways in which the preprint could differ from the official version.</p>
            </div>

              </span>

            <div class='post' itemprop="text">
              <p>Mario, thank you for the suggestion. We have in our schema a relation of ‘is-identical-to’ that we use in some specific cases. An issue is that identical could mean subtly different things: exactly the same document, the same content reformatted (e.g. PDF vs XML vs Word manuscript), or some minor typographical changes that wouldn’t need a version change.</p>
<p>I think the suggestion of a field to describe changes between versions is an excellent one and something that we’re considering to add as metadata.</p>
<p>Another question is who determines whether something is identical? I don’t think platforms would take the time to see if something (such as a conference paper) is exactly the same or simply similar to a previous work (such as a preprint). If they do, then they could use the is-identical-to relationship. The best pragmatic solution is to have links to the full text so that downstream users and services could make a comparison.</p>
            </div>

            <div class='post' itemprop="text">
              <p>Thank you for considering the suggestions and working on them.</p>
<p>Just to clarify, is identical to - is linkage to another document, what I suggested is that there is a filed which would specify this is THE Version submitted to the journal, not a connection it to any other document/paper/proceeding. For example,  if you look at Springer Natures - In Review platform for my journal (link below for an example), the preprint can be the exact manuscript version that was submitted to my journal, i.e. authors opted that that version is also shared as a preprint during journal submission time - and instead of “just” classifying these as preprints, I hope you will have a field that will show this is the “journal submitted version”. So the meta fields could be either:<br>
venue-submitted: Yes.<br>
and then you would have details for the venue:<br>
e.g. journal-title: Name<br>
date-submitted, and so on.<br>
And then as we have published review reports for them, you could link those reviews to the preprint itself. Perhaps that is another option - through which researchers could identify it being the submitted version - if the reviews come from a journal - but a field would be helpful to be able to filter based on that field, rather than on reviews - as some journals might share the information on the submitted version but not shared reviews.</p>
<p>Example:<br>
Manuscript version - preprint-  posted on In-review during journal submission process: researchsquare /article/rs-582546/v1<br>

</blockquote>
</aside>
<p>The NISO JAV working group is actively working on revising and updating JAV. Some information about this working group is at <a href="https://www.niso.org/standards-committees/jav-revision" rel="noopener nofollow ugc">https://www.niso.org/standards-committees/jav-revision</a>. There two representatives from Crossref involved (I’m also a member of this working group). Preprints are among the versioning scenarios that have been brought up for discussion in the JAV working group.</p>
<p>This recommendation for preprint metadata also addresses withdrawals and removals for preprints. This may relate to NISO CORREC (<a href="https://www.niso.org/standards-committees/correc" rel="noopener nofollow ugc">https://www.niso.org/standards-committees/correc</a>), which is a new recommended practice that is being developed by an active working group.</p>
            </div>

          <div id='post_20' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/mrittman'><span itemprop="name">mrittman</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/mrittman'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-08-31T13:35:12Z' class='post-time'>
                    31 August 2022 13:35
                  </time>
                  <meta itemprop='dateModified' content='2022-08-31T13:35:12Z'>
              <span itemprop="position">20</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Good to hear that there is ongoing work on JAV. There are several people on both that committee and our preprints advisory group (including my colleague Patricia) so it’s more than like that there’s been a crossover of ideas. CORREC is also one we’ll be keeping a close eye on.</p>
            </div>

          <div id='post_22' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.crossref.org/u/ISC_SG_SciPub'><span itemprop="name">ISC_SG_SciPub</span></a>
                  <meta itemprop='url' content='https://community.crossref.org/u/ISC_SG_SciPub'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2022-09-30T13:03:53Z' class='post-time'>
                    30 September 2022 13:03
                  </time>
                  <meta itemprop='dateModified' content='2022-09-30T13:03:53Z'>
              <span itemprop="position">22</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p><strong>Response by the International Science Council’s Steering Group on the Future of Scientific Publishing</strong></p>
<ol>
<li>
<p>The International Science Council’s Open Science and Future of Scientific Publishing Project has been advocating the increased use of preprints as a recognized and effective route for the dissemination of research findings and for these to become an integral part of the record of science. (e.g.<a>https://council.science/publications/normalization-preprints/</a>)</p>
</li>
<li>
<p>For such a system to be effectively implemented requires appropriate metadata targeted to facilitating functionality. We support and welcome the changes being proposed, specifically in:</p>
</li>
</ol>
<ul>
<li>Recognizing preprints as a mainstream publication type in their own right</li>
<li>Improving two-way connections between different versions of preprints</li>
<li>Allowing for withdrawal/correction of a preprint</li>
<li>Improving connectivity between reviews of a specific pre-prints with the preprint itself</li>
<li>Improving relationships between the preprint and associated data/programs etc</li>
</ul>
<ol start="3">
<li>
<p>Our primary concern with the approaches proposed is in not sufficiently allowing for interoperability between different platforms and DOI registration entities. Allowing integration and discoverability of the scholarly content published globally is of fundamental importance to the ISC. It is a vital to be able to integrate research from different geographic regions. Whilst your report notes that enabling such interoperability is difficult and responsibility for undertaking this is hard to assign, any possibility for successful interoperability requires metadata which recognises alternative systems  - and we believe this should be a particularly important consideration for the metadata schema most commonly adopted within the western scholarly publishing community. We believe that the evolution of common standards that are governed by the global scientific community are essential to the future of scientific publishing.</p>
</li>
<li>
<p>In many cases this will be achieved via the various relationship entities within the CrossRef schema - but presently the scope for inclusion of alternative platforms within these tags is limited and not always fully functional. This, for example, has recently been highlighted by the difficulties faced in relating a review to an article posted on arXiv: <a>https://crossref.atlassian.net/browse/CR-777</a>.</p>
</li>
<li>
<p>We would encourage relationship entities to include as diverse a range of alternative platforms and identifiers as possible, to enable the eventual development of effective and inclusive cross-platform discovery processes either by CrossRef or other entities.</p>
</li>
</ol>
            </div>
