creen and (min-width: 48em){.css-nqc9up >:not(figure):not(.theseusx-image-gallery){-webkit-padding-start:25px;padding-inline-start:25px;-webkit-padding-end:25px;padding-inline-end:25px;}}</style><div class="css-nqc9up"><style data-emotion="css 13immke">.css-13immke{font-style:italic;width:100%;margin-top:40px;margin-bottom:40px;}.css-13immke img{max-width:100vw;}</style><figure class="css-13immke"><img alt="This description is placeholder" loading="lazy" width="1920" height="1080" decoding="async" data-nimg="1" style="color:transparent;width:100%;height:auto;object-fit:cover;object-position:50% 50%" sizes="100vw" srcSet="https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-300.webp 300w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-400.webp 384w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-400.webp 400w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-600.webp 600w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-800.webp 800w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-1500.webp 1500w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-2000.webp 2000w, https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-2500.webp 2500w" src="https://www.pbs.org/wgbh/masterpiece/media/images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.width-2500.webp"/></figure><p>Murder mysteries are <em>killing</em> it, according to recent book sales and TV ratings. The genre is one of America’s most popular and the so-called sub-category of “cozy mystery” has especially “seen a boom in recent years,” according to <em><a href="https://www.usatoday.com/story/entertainment/books/2024/05/22/best-cozy-mystery-books/73209595007/">USA Today</a></em>, in that it “combines crime with comfort.” Leaning into that appeal, MASTERPIECE has two new cozy titles on its <a href="https://www.pbs.org/wgbh/masterpiece/schedule/">fall schedule</a>.</p><p>So, bone up now on the conventions of the cozy mystery, its storied history, splinter themes, and more. For sport, download our <strong><a href="https://www.pbs.org/wgbh/masterpiece/specialfeatures/cozy-mystery-bingo-card/">Cozy Mystery Bingo Card</a></strong> and flag cozy tropes while watching <em><a href="https://www.pbs.org/wgbh/masterpiece/specialfeatures/moonflower-murders-trailer-air-date-cast-plot-more/">Moonflower Murders</a></em> Sunday nights through October 20th and <em><a href="https://www.pbs.org/wgbh/masterpiece/shows/the-marlow-murder-club/">The Marlow Murder Club</a></em>, premiering October 27th, both at 9/8c.</p><style data-emotion="css 1v85li">.css-1v85li{list-style-type:initial;-webkit-margin-start:1em;margin-inline-start:1em;margin:3em auto 0;counter-reset:listicle;clear:both;padding-top:1em;border-top:2px solid rgb(229.5, 229.5, 229.5);}</style><ul role="list" class="css-1v85li"><style data-emotion="css 19m7rfi">.css-19m7rfi{list-style:none;margin:0 auto 30px auto;}</style><li class="css-19m7rfi"><style data-emotion="css 3lhqxt">.css-3lhqxt{font-size:28px;line-height:1.2;font-weight:900;color:var(--chakra-colors-gray-600);font-family:'Lato','Lato Fallback',sans-serif;margin-bottom:10px;}@media screen and (min-width: 48em){.css-3lhqxt{font-size:36px;}}.css-3lhqxt::before{top:var(--chakra-space-3);counter-increment:listicle;content:counter(listicle) ". ";color:var(--chakra-colors-gold-500);font-size:75px;line-height:1;font-family:'Playfair Display','Playfair Display Fallback',serif;font-weight:700;font-style:italic;margin-left:0px;all:unset;}@media screen and (min-width: 62em){.css-3lhqxt::before{margin-left:-1em;}}</style><h2 class="chakra-heading css-3lhqxt">What is a Cozy Mystery?</h2><style data-emotion="css e4hgu6">.css-e4hgu6{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column-reverse;-ms-flex-direction:column-reverse;flex-direction:column-reverse;--chakra-space-y-reverse:1;--chakra-divide-y-reverse:1;gap:15px;margin-bottom:10px;}</style><div class="css-e4hgu6"><style data-emotion="css 48cqwz">.css-48cqwz{overflow:auto;}.css-48cqwz >*{margin-bottom:1em;}.css-48cqwz >:last-child{margin-bottom:0px;}</style><div class="css-48cqwz"><p>There’s no strict definition for the cozy mystery, though the main rule of thumb seems to be that the story contains no graphic violence and generally, no swearing or sex. These are more lighthearted crime narratives—you won’t be so disturbed that you need to sleep with lights on. A focus on plot and character development ensures a predictable and reassuring experience offering escapism without being too heavy.Importantly, the cozy mystery’s protagonist is an <em>amateur</em> sleuth who uses intellect and life experience to solve a case. Think Agatha Christie’s Miss Marple. These affable amateur detectives typically have an emotional investment behind their probing. They also know their neighbor’s quirks and habits, elicit confidences, and ultimately work out the solution before law enforcement does.</p></div></div></li><li class="css-19m7rfi"><h2 class="chakra-heading css-3lhqxt">What are the Characteristics of a Cozy Mystery?</h2><div class="css-e4hgu6"><div class="css-48cqwz"><p>Besides a crime-solving amateur sleuth, cozy mysteries enjoy other appealing conventions. The stories have humor, idiosyncratic secondary characters, and closeknit communities where everyone knows each other. The victim is generally unlikeable. While the amateur detective may have some “in” on the police force, officers find them meddlesome. And there’s often a quaint or charming element—an animal sidekick, for example. Cozies are usually fast-paced and involve at least one unexpected turn of events and red herrings to distract us. And we can count on things being put right again by story’s end.</p></div></div></li><li class="css-19m7rfi"><h2 class="chakra-heading css-3lhqxt">How did Cozy Mysteries Evolve?</h2><div class="css-e4hgu6"><div class="css-48cqwz"><p>Cozies harken back to a literary era between World Wars known as the Golden Age of Detective Fiction when writers (often British) like Agatha Christie, Dorothy L. Sayers, G.K. Chesterton, and Ellery Queen published classic “whodunnit” detective novels. Their work playfully misleads readers while simultaneously encouraging them to solve the crime alongside the protagonist. Remote settings like an English country house or an abandoned island were featured, as well as a short-list of suspects from distinctive upper-class professions, and bodies discovered in unlikely places.Agatha Christie is now considered the ‘Mother of Cozy Mysteries,’ though the cozy term wasn’t coined until the late 20th century. <a href="https://selfpublishingadvice.org/national-cozy-mystery-day/">National Cozy Mystery Day</a> is observed on her September 15 birthday.</p></div></div></li><li class="css-19m7rfi"><h2 class="chakra-heading css-3lhqxt">What are Some Cozy Mystery Themes?</h2><div class="css-e4hgu6"><div class="css-48cqwz"><p>The cozy sub-category of crime stories runs wide and deep, from historical cozy mysteries to romance and paranormal cozies. Cozy book series feature professions ranging from beauticians and bookstore owners to teachers; share themes like pets, cooking, and holidays; and showcase hobbies such as genealogy, knitting, and travel. There’s sure to be a niche cozy mystery series that includes <em>whatever</em> you’re interested in—besides murder, of course.</p></div></div></li><li class="css-19m7rfi"><h2 class="chakra-heading css-3lhqxt">Stream Cozy Mysteries with PBS Passport</h2><div class="css-e4hgu6"><div class="css-48cqwz"><p>An on-demand library of cozy MASTERPIECE <em>Mystery!</em> favorites is available with <a href="https://help.pbs.org/support/solutions/articles/12000043556-what-is-pbs-passport-">PBS Passport</a>, an added benefit to local station members. Check out these titles (in alphabetical order):<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/arthur-and-george/episodes/">Arthur &amp; George</a></em> stars Matin Clunes (<em>Doc Martin</em>) as Sir Arthur Conan Doyle in a three-part miniseries telling the true tale of the famous author’s pursuit of a miscarriage of justice at the turn of the 19th century.<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/death-comes-to-pemberley/episodes/">Death Comes to Pemberley</a></em> picks up with Jane Austen’s <em>Pride and Prejudice</em> characters six years later in a whodunnit based on P.D. James’ bestseller. Matthew Rhys (<em>Perry Mason, The Americans</em>) and Anna Maxwell Martin (<em>Philomena, The Bletchley Circle</em>) lead the cast.<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/elizabeth-is-missing/episodes/">Elizabeth is Missing</a></em> stars two-time Academy Award®–winner Glenda Jackson as an older woman determined to find her missing friend before her own dementia erases all clues. Jackson earned both 2020’s International Emmy Award and 2020’s British Academy of Film and Television Arts Award for her performance in this adaptation of Emma Healey’s acclaimed novel.<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/grantchester/">Grantchester</a></em> is a beloved period crime drama with nine seasons already under its belt. In this seemingly quiet 1950s Cambridgeshire village, police detective Geordie Keating (Robson Green) and the resident vicar-turned-sleuth (James Norton, Tom Brittney, and Rishi Nair, respectively) are always on the case.<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/magpie-murders/">Magpie Murders</a></em> offers a beguiling mystery-within-a-mystery and novelist Anthony Horowitz adapted his bestseller for the small screen himself. The miniseries stars Lesley Manville (<em><a href="https://www.pbs.org/wgbh/masterpiece/shows/world-on-fire/">World on Fire</a></em>, <em>Phantom Thread</em>, <em>Mrs. Harris Goes to Paris</em>) as editor turned amateur sleuth Susan Ryeland and Tim McMullan (<em>Patrick Melrose</em>, <em>Foyle’s War</em>) as world-famous fictional detective Atticus Pünd. (The upcoming <em><a href="https://www.pbs.org/wgbh/masterpiece/shows/moonflower-murders/">Moonflower Murders</a></em> is a sequel.)</p></div></div></li></ul></div><div class="css-0"><style data-emotion="css g4sk3b">.css-g4sk3b{max-width:800px;margin:0 auto;padding-top:0px;padding-bottom:0px;-webkit-padding-start:20px;padding-inline-start:20px;-webkit-padding-end:20px;padding-inline-end:20px;}@media screen and (min-width: 30em){.css-g4sk3b{-webkit-padding-start:5%;padding-inline-start:5%;-webkit-padding-end:5%;padding-inline-end:5%;}}@media screen and (min-width: 48em){.css-g4sk3b{-webkit-padding-start:25px;padding-inline-start:25px;-webkit-padding-end:25px;padding-inline-end:25px;}}@media screen and (min-width: 96em){.css-g4sk3b{-webkit-padding-start:0px;padding-inline-start:0px;-webkit-padding-end:0px;padding-inline-end:0px;}}</style><div class="css-g4sk3b"><style data-emotion="css 1xaekgw">.css-1xaekgw{margin-top:20px;}</style><div class="css-1xaekgw"><style data-emotion="css 19u3qr5">.css-19u3qr5{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;-webkit-appearance:none;-moz-appearance:none;-ms-appearance:none;appearance:none;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:relative;white-space:nowrap;vertical-align:middle;outline:2px solid transparent;outline-offset:2px;line-height:1.2;borde  already under its belt. In this seemingly quiet 1950s Cambridgeshire village, police detective Geordie Keating (Robson Green) and the resident vicar-turned-sleuth (James Norton, Tom Brittney, and Rishi Nair, respectively) are always on the case.Magpie Murders offers a beguiling mystery-within-a-mystery and novelist Anthony Horowitz adapted his bestseller for the small screen himself. The miniseries stars Lesley Manville (World on Fire, Phantom Thread, Mrs. Harris Goes to Paris) as editor turned amateur sleuth Susan Ryeland and Tim McMullan (Patrick Melrose, Foyle’s War) as world-famous fictional detective Atticus Pünd. (The upcoming Moonflower Murders is a sequel.)"])</script><script>self.__next_f.push([1,"5:[[\"$\",\"$L14\",null,{\"data\":{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"The Cozy Mystery Explained\",\"datePublished\":\"2024-10-07T00:00:00\",\"dateModified\":\"2025-11-13T00:00:00\",\"author\":\"$2:props:children:0:props:children:4:props:data\",\"abstract\":\"Learn why the cozy mystery genre is trending, what exactly makes a murder mystery \\\"cozy,\\\" and how they evolved.\",\"image\":\"https://www.pbs.org/wgbh/masterpiece/media/original_images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.jpg\"},\"id\":\"article-data\"}],[\"$\",\"main\",null,{\"children\":[\"$undefined\",[\"$\",\"$L2b\",null,{\"level\":1,\"textStyle\":\"h1\",\"textAlign\":\"center\",\"mt\":\"1em\",\"marginX\":\"auto\",\"maxW\":\"750px\",\"p\":0,\"children\":\"The Cozy Mystery Explained\"}],[\"$\",\"$L2f\",null,{\"body\":[{\"width\":1920,\"height\":1080,\"mime_type\":\"image/jpeg\",\"alt_text\":\"This description is placeholder\",\"src\":\"https://www.pbs.org/wgbh/masterpiece/media/original_images/cozy_mysteries_explained_icon_1920x1080-2_Wc9y4cG.jpg\",\"justification\":\"center\",\"bleed\":false,\"contentType\":\"application/vnd.theseus+image\"},{\"content\":\"Murder mysteries are killing it, according to recent book sales and TV ratings. The genre is one of America’s most popular and the so-called sub-category of “cozy mystery” has especially “seen a boom in recent years,” according to USA Today, in that it “combines crime with comfort.” Leaning into that appeal, MASTERPIECE has two new cozy titles on its fall schedule.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":367,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":21,\"end\":28,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":231,\"end\":240,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":231,\"end\":240,\"attributes\":{\"-offset-url\":\"https://www.usatoday.com/story/entertainment/books/2024/05/22/best-cozy-mystery-books/73209595007/\"}},{\"type\":\"-offset-link\",\"start\":353,\"end\":366,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/schedule/\"}}],\"contentType\":\"application/vnd.atjson+offset\"},{\"content\":\"So, bone up now on the conventions of the cozy mystery, its storied history, splinter themes, and more. For sport, download our Cozy Mystery Bingo Card and flag cozy tropes while watching Moonflower Murders Sunday nights through October 20th and The Marlow Murder Club, premiering October 27th, both at 9/8c.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":308,\"attributes\":{}},{\"type\":\"-offset-bold\",\"start\":128,\"end\":151,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":128,\"end\":151,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/specialfeatures/cozy-mystery-bingo-card/\"}},{\"type\":\"-offset-italic\",\"start\":188,\"end\":206,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":188,\"end\":206,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/specialfeatures/moonflower-murders-trailer-air-date-cast-plot-more/\"}},{\"type\":\"-offset-italic\",\"start\":246,\"end\":268,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":246,\"end\":268,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/shows/the-marlow-murder-club/\"}}],\"contentType\":\"application/vnd.atjson+offset\"},{\"ordered\":false,\"items\":[{\"title\":\"What is a Cozy Mystery?\",\"text\":{\"content\":\"There’s no strict definition for the cozy mystery, though the main rule of thumb seems to be that the story contains no graphic violence and generally, no swearing or sex. These are more lighthearted crime narratives—you won’t be so disturbed that you need to sleep with lights on. A focus on plot and character development ensures a predictable and reassuring experience offering escapism without being too heavy.Importantly, the cozy mystery’s protagonist is an amateur sleuth who uses intellect and life experience to solve a case. Think Agatha Christie’s Miss Marple. These affable amateur detectives typically have an emotional investment behind their probing. They also know their neighbor’s quirks and habits, elicit confidences, and ultimately work out the solution before law enforcement does.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":802,\"attributes\":{}},{\"type\":\"-offset-line-break\",\"start\":414,\"end\":414,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":464,\"end\":471,\"attributes\":{}}],\"contentType\":\"application/vnd.atjson+offset\"},\"contentType\":\"application/vnd.theseus+listicle_item\"},{\"title\":\"What are the Characteristics of a Cozy Mystery?\",\"text\":{\"content\":\"Besides a crime-solving amateur sleuth, cozy mysteries enjoy other appealing conventions. The stories have humor, idiosyncratic secondary characters, and closeknit communities where everyone knows each other. The victim is generally unlikeable. While the amateur detective may have some “in” on the police force, officers find them meddlesome. And there’s often a quaint or charming element—an animal sidekick, for example. Cozies are usually fast-paced and involve at least one unexpected turn of events and red herrings to distract us. And we can count on things being put right again by story’s end.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":602,\"attributes\":{}}],\"contentType\":\"application/vnd.atjson+offset\"},\"contentType\":\"application/vnd.theseus+listicle_item\"},{\"title\":\"How did Cozy Mysteries Evolve?\",\"text\":{\"content\":\"Cozies harken back to a literary era between World Wars known as the Golden Age of Detective Fiction when writers (often British) like Agatha Christie, Dorothy L. Sayers, G.K. Chesterton, and Ellery Queen published classic “whodunnit” detective novels. Their work playfully misleads readers while simultaneously encouraging them to solve the crime alongside the protagonist. Remote settings like an English country house or an abandoned island were featured, as well as a short-list of suspects from distinctive upper-class professions, and bodies discovered in unlikely places.Agatha Christie is now considered the ‘Mother of Cozy Mysteries,’ though the cozy term wasn’t coined until the late 20th century. National Cozy Mystery Day is observed on her September 15 birthday.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":775,\"attributes\":{}},{\"type\":\"-offset-line-break\",\"start\":578,\"end\":578,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":708,\"end\":733,\"attributes\":{\"-offset-url\":\"https://selfpublishingadvice.org/national-cozy-mystery-day/\"}}],\"contentType\":\"application/vnd.atjson+offset\"},\"contentType\":\"application/vnd.theseus+listicle_item\"},{\"title\":\"What are Some Cozy Mystery Themes?\",\"text\":{\"content\":\"The cozy sub-category of crime stories runs wide and deep, from historical cozy mysteries to romance and paranormal cozies. Cozy book series feature professions ranging from beauticians and bookstore owners to teachers; share themes like pets, cooking, and holidays; and showcase hobbies such as genealogy, knitting, and travel. There’s sure to be a niche cozy mystery series that includes whatever you’re interested in—besides murder, of course.\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":446,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":390,\"end\":398,\"attributes\":{}}],\"contentType\":\"application/vnd.atjson+offset\"},\"contentType\":\"application/vnd.theseus+listicle_item\"},{\"title\":\"Stream Cozy Mysteries with PBS Passport\",\"text\":{\"content\":\"$31\",\"annotations\":[{\"type\":\"-offset-paragraph\",\"start\":0,\"end\":1750,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":41,\"end\":49,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":78,\"end\":90,\"attributes\":{\"-offset-url\":\"https://help.pbs.org/support/solutions/articles/12000043556-what-is-pbs-passport-\"}},{\"type\":\"-offset-italic\",\"start\":182,\"end\":197,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":182,\"end\":197,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/shows/arthur-and-george/episodes/\"}},{\"type\":\"-offset-line-break\",\"start\":182,\"end\":182,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":218,\"end\":228,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":396,\"end\":420,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":396,\"end\":420,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/shows/death-comes-to-pemberley/episodes/\"}},{\"type\":\"-offset-line-break\",\"start\":396,\"end\":396,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":449,\"end\":468,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":558,\"end\":584,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":611,\"end\":642,\"attributes\":{}},{\"type\":\"-offset-italic\",\"start\":658,\"end\":678,\"attributes\":{}},{\"type\":\"-offset-link\",\"start\":658,\"end\":678,\"attributes\":{\"-offset-url\":\"https://www.pbs.org/wgbh/masterpiece/shows/elizabeth-is-missing/episodes/\"}},{\"type\":\"-offset-line-break\",\"start\":658,\"end\":658,\"attributes\"
