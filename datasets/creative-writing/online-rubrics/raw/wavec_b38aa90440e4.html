-radius:0;outline-offset:2px;font:inherit;color:inherit;cursor:pointer" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_1255_3248)"><path d="M9.99821 23.8675C4.33309 22.8696 0 17.9335 0 12.0005C0 5.40002 5.40003 0 12.0005 0C18.6009 0 24 5.40002 24 12.0005C24 17.9335 19.6669 22.8677 13.9999 23.8675L13.3334 23.3363H10.6666L9.99821 23.8675Z" fill="#0062E0"></path><path d="M16.6668 15.334L17.1998 12.0007H14V9.66705C14 8.7336 14.3332 7.99991 15.7997 7.99991H17.3333V4.93351C16.4661 4.80003 15.5336 4.66748 14.6655 4.66748C11.9324 4.66748 9.99825 6.33463 9.99825 9.33474V12.0016H7V15.335H9.99825V23.8033C11.3182 24.0699 12.6781 24.0699 13.9981 23.8033V15.3368L16.6668 15.334Z" fill="white"></path></g><defs><clipPath id="clip0_1255_3248"><rect width="24" height="24" fill="white"></rect></clipPath></defs></svg></button><button aria-label="Share on X" class="react-share__ShareButton Demo__some-network__share-button" style="background-color:transparent;border:none;padding:0;display:inline-flex;border-radius:0;outline-offset:2px;font:inherit;color:inherit;cursor:pointer" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" viewBox="0 0 25 25"><path fill="#00acee" fill-opacity="1" d="M7.862 22.814c9.434 0 14.594-7.816 14.594-14.594 0-.222 0-.444-.015-.662A10.434 10.434 0 0025 4.9c-.936.415-1.93.687-2.946.808a5.148 5.148 0 002.255-2.838 10.28 10.28 0 01-3.257 1.245 5.134 5.134 0 00-8.74 4.679A14.562 14.562 0 011.74 3.435a5.132 5.132 0 001.587 6.846A5.091 5.091 0 011 9.641v.065a5.132 5.132 0 004.115 5.028 5.119 5.119 0 01-2.316.087 5.134 5.134 0 004.792 3.563A10.291 10.291 0 010 20.509a14.52 14.52 0 007.862 2.3"></path></svg></button></div></div><div class="text-block blog-post mb-12"><div class="rc"><p><em>We asked Curtis Brown literary agents for their submission tips for new writers planning to send in their books. Here is a selection of their responses:</em></p><ul><li>Good writing is the best way to grab our attention. We are not interested in tricks, gimmicks or marketing ideas. If you write well, you will stand out.</li><li>We don&#x27;t take kindly to grammatical and spelling mistakes. Make sure you proofread your work before submitting it.</li><li>Pitch your book concisely, elegantly, punchily. Avoid too many adverbs.</li><li>Keep your synopsis short and to the point. We want a glimpse into your story and an idea of the plot and characters, not a five-page blow-by-blow account of each chapter and scene. That is what the novel itself is for.</li><li>Don&#x27;t confuse a synopsis with a blurb. A synopsis is an outline of the book&#x27;s themes and plot. A blurb is written by the publisher to attract readers to the book. A blurb will feature words like ‘exhilarating’ and ‘exquisite’. One shouldn&#x27;t find them in a synopsis.</li><li>Avoid disingenuous self-deprecation in a covering letter (‘I know you won’t have the time for a lowly writer like me...’). We want to work with writers who value their work and are not embarrassed to say so.</li><li>Show knowledge of the agent&#x27;s existing list – and spell their authors’ names correctly.</li><li>Avoid pitching your book as something meets something else as you might send the agent down the wrong path.</li><li>Your pitch/cover letter should be no longer than a page.</li><li>It is not wise to brag. Let the agent be the judge of the quality of the material. But do highlight in your covering letter why you think your book is distinctive and special.</li><li>Think carefully about who your target audience is and what books your work would sit alongside – don&#x27;t just randomly pick an author we represent in an attempt to flatter us.</li><li>Please don&#x27;t attempt to fashion your own book jacket cover or marketing material: a team of professionals will address that when your work is published.</li><li>Think about whether your book idea is suited to be a novel; it might work better as a blog or an article.</li><li>Only send through relevant CV information. We do not need to know about your A-level results, no matter how brilliant.</li><li>If you have been referred to a Curtis Brown agent by a contact at a publishing house please let us know in your letter.</li><li>Please do mention if you have submitted to or been in touch with one of our agents before.</li><li>If your work is rejected then please do not reply pointing out that we have made a mistake. Reading is subjective and there are all kinds of reasons for agents turning down proposals. Don&#x27;t be down heartened. Other agents might feel differently.</li><li>Target people who would be appropriate for your work rather than submitting to all agents at Curtis Brown or selecting somebody at random.</li><li>Do not address a submission to Mr Curtis Brown. He died some time ago. When researching who to submit to, you should have discovered that.</li></ul><p><em>As well as expert teaching from published authors, all our novel-writing courses offer dedicated modules on submitting your novel to literary agents – and include sessions on writing a synopsis and preparing a covering letter. Click for more information or to apply for our <a href="https://www.curtisbrowncreative.co.uk/creative-writing-courses" target="_blank" rel="noopener noreferrer" class="">creative writing courses</a>.</em></p></div></div><h5 class="mb-1 text-[16px]">RELATED ARTICLES</h5><div class="grid grid-cols-2 gap-4 "><a class="max-w-[190px]" href="/blog/how-to-write-your-elevator-pitch"><div class="mb-4"><figure class="rounded-standard border-0 outline-none"><div class="ar"><picture><img width="160" sizes="(min-width: 940px) 50vw, 100vw" decoding="async" alt="Jonny Geller, CEO of The Curtis Brown Group" class="object-cover rounded-standard border-0 outline-none"/></picture><div class="hidden"><div class="ar--placeholder"><img alt="" role="presentation"/></div></div></div></figure></div><h5 class="font-bold leading-tight">How to write your elevator pitch</h5></a><a class="max-w-[190px]" href="/blog/how-to-write-the-perfect-pitch-letter-to-an-agent"><div class="mb-4"><figure class="rounded-standard border-0 outline-none"><div class="ar"><picture><img width="160" sizes="(min-width: 940px) 50vw, 100vw" decoding="async" alt="Anna Davis, CBC&#x27;s Founder &amp; Director" class="object-cover rounded-standard border-0 outline-none"/></picture><div class="hidden"><div class="ar--placeholder"><img alt="" role="presentation"/></div></div></div></figure></div><h5 class="font-bold leading-tight">How to write the perfect pitch letter to an agent</h5></a></div></div></section></div></main><footer class="rounded-standard  m-6 mt-24 border-2 border-black p-6 text-left text-gray-600 md:p-8"><div class="flex items-center justify-center border-b border-gray-300 pb-6 lg:justify-between"><div class="mr-12 text-sm md:text-base"><span>Find us on social</span></div><div class="flex justify-center"><a href="https://www.facebook.com/CurtisBrownCreative/" target="_blank" rel="noopener noreferrer" class="mr-6 text-gray-600"><svg aria-hidden="true" focusable="false" data-prefix="fab" data-icon="facebook-f" class="w-4" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" aria-label="Facebook"><path fill="#4267B2" d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"></path></svg></a><a href="https://www.instagram.com/curtisbrowncreative/" class="mr-6 text-gray-600" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" aria-label="Instagram" focusable="false" data-prefix="fab" data-icon="instagram" class="w-6" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="#e95950" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 your story – from first idea to final draft.</p></div><div class="col-span-2"><h6 class="mb-4 flex font-semibold uppercase  md:justify-start">Useful links</h6><p class="mb-2 columns-2"><a class="btn btn-green mb-2 block" href="/creative-writing-courses">Courses</a><a class="mb-2 block text-gray-600" href="/about">About Us</a><a class="mb-2 block text-gray-600" href="/tutors-and-editors">Tutors &amp; Editors</a><a class="mb-2 block text-gray-600" href="/our-team">Our Team</a><a class="btn btn-green mb-2 block" href="/faqs">Help</a><a class="mb-2 block text-gray-600" href="/student-stories">Testimonials</a><a class="mb-2 block text-gray-600" href="/blog">Blog</a><a class="mb-2 block text-gray-600" href="/breakthrough-writers-programme">Scholarships</a></p></div><div class="col-span-2"><h6 class="mb-4 flex font-semibold uppercase md:justify-start">subscribe to our Newsletter</h6><div class="col-span-2"><form class="form"><div class="col-span-2"><p>Enter your email to receive weekly advice from industry insiders and the latest news about our courses and events.</p><div class="mt-2 flex gap-0 text-sm sm:gap-2"><div class="relative"><input placeholder="Enter your email" class="min-w-[190px] rounded-[.25rem] bg-gray-100 px-3 py-2" id="email-footer" type="email" inputMode="email" autoComplete="email" name="email"/></div><button type="submit" class="btn btn-green is-disabled cursor-not-allowed focus:outline-none" disabled="">Sign Up</button></div><div><div class=" mt-2 text-sm text-gray-400"><label for="acceptTerms-footer" class="form-control"><input id="acceptTerms-footer" type="checkbox" name="acceptTerms"/> <span>Check to confirm you&#x27;ve read our<!-- --> <a class="underline" href="/privacy-policy">privacy policy.</a></span></label></div></div></div></form></div></div></div></div><div class="items-center justify-between gap-4 text-right text-sm text-gray-400 md:flex"><div>© 2023 Copyright Curtis Brown Creative  <a class="underline" href="#">Manage cookie preferences</a> <a href="https://www.curtisbrowncreative.co.uk/privacy-policy" rel="noreferrer" class="underline" target="_blank">Privacy Policy</a> <!-- --> <a rel="noreferrer" href="https://curtisbrowncreative.co.uk/terms-conditions" class="underline" target="_blank">Terms &amp; Conditions</a></div></div></footer></div><section class="Toastify" aria-live="polite" aria-atomic="false" aria-relevant="additions text" aria-label="Notifications Alt+T"></section></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"preview":false,"previewToken":"","data":{"post":{"_id":"post-497","author":{"name":"Jack Hadley","picture":null},"body":[{"_key":"7638abeff36d","_type":"block","children":[{"_key":"7638abeff36d0","_type":"span","marks":["em"],"text":"We asked Curtis Brown literary agents for their submission tips for new writers planning to send in their books. Here is a selection of their responses:"}],"markDefs":[],"style":"normal"},{"_key":"5217cb9cc020","_type":"block","children":[{"_key":"5217cb9cc0200","_type":"span","marks":[],"text":"Good writing is the best way to grab our attention. We are not interested in tricks, gimmicks or marketing ideas. If you write well, you will stand out."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"81e53ed43c85","_type":"block","children":[{"_key":"81e53ed43c850","_type":"span","marks":[],"text":"We don't take kindly to grammatical and spelling mistakes. Make sure you proofread your work before submitting it."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"5554f2db358c","_type":"block","children":[{"_key":"5554f2db358c0","_type":"span","marks":[],"text":"Pitch your book concisely, elegantly, punchily. Avoid too many adverbs."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"6f104fd0d43f","_type":"block","children":[{"_key":"6f104fd0d43f0","_type":"span","marks":[],"text":"Keep your synopsis short and to the point. We want a glimpse into your story and an idea of the plot and characters, not a five-page blow-by-blow account of each chapter and scene. That is what the novel itself is for."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"5e39bc0e2e7b","_type":"block","children":[{"_key":"5e39bc0e2e7b0","_type":"span","marks":[],"text":"Don't confuse a synopsis with a blurb. A synopsis is an outline of the book's themes and plot. A blurb is written by the publisher to attract readers to the book. A blurb will feature words like ‘exhilarating’ and ‘exquisite’. One shouldn't find them in a synopsis."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"8fa597dc5192","_type":"block","children":[{"_key":"8fa597dc51920","_type":"span","marks":[],"text":"Avoid disingenuous self-deprecation in a covering letter (‘I know you won’t have the time for a lowly writer like me...’). We want to work with writers who value their work and are not embarrassed to say so."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"bb3781d18458","_type":"block","children":[{"_key":"bb3781d184580","_type":"span","marks":[],"text":"Show knowledge of the agent's existing list – and spell their authors’ names correctly."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"10d9b45415b6","_type":"block","children":[{"_key":"10d9b45415b60","_type":"span","marks":[],"text":"Avoid pitching your book as something meets something else as you might send the agent down the wrong path."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"ab29a796ccd7","_type":"block","children":[{"_key":"ab29a796ccd70","_type":"span","marks":[],"text":"Your pitch/cover letter should be no longer than a page."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"231164d9b9fb","_type":"block","children":[{"_key":"231164d9b9fb0","_type":"span","marks":[],"text":"It is not wise to brag. Let the agent be the judge of the quality of the material. But do highlight in your covering letter why you think your book is distinctive and special."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"136dbe2efd68","_type":"block","children":[{"_key":"136dbe2efd680","_type":"span","marks":[],"text":"Think carefully about who your target audience is and what books your work would sit alongside – don't just randomly pick an author we represent in an attempt to flatter us."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"b09ecbd63d49","_type":"block","children":[{"_key":"b09ecbd63d490","_type":"span","marks":[],"text":"Please don't attempt to fashion your own book jacket cover or marketing material: a team of professionals will address that when your work is published."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"9cdc776d9e7d","_type":"block","children":[{"_key":"9cdc776d9e7d0","_type":"span","marks":[],"text":"Think about whether your book idea is suited to be a novel; it might work better as a blog or an article."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"d970ff228cd8","_type":"block","children":[{"_key":"d970ff228cd80","_type":"span","marks":[],"text":"Only send through relevant CV information. We do not need to know about your A-level results, no matter how brilliant."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"aeb13f708358","_type":"block","children":[{"_key":"aeb13f7083580","_type":"span","marks":[],"text":"If you have been referred to a Curtis Brown agent by a contact at a publishing house please let us know in your letter."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"868df555cf7d","_type":"block","children":[{"_key":"868df555cf7d0","_type":"span","marks":[],"text":"Please do mention if you have submitted to or been in touch with one of our agents before."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"1c9b1a6390b4","_type":"block","children":[{"_key":"1c9b1a6390b40","_type":"span","marks":[],"text":"If your work is rejected then please do not reply pointing out that we have made a mistake. Reading is subjective and there are all kinds of reasons for agents turning down proposals. Don't be down heartened. Other agents might feel differently."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"ece0f232e3a6","_type":"block","children":[{"_key":"ece0f232e3a60","_type":"span","marks":[],"text":"Target people who would be appropriate for your work rather than submitting to all agents at Curtis Brown or selecting somebody at random."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"40fc3131cc43","_type":"block","children":[{"_key":"40fc3131cc430","_type":"span","marks":[],"text":"Do not address a submission to Mr Curtis Brown. He died some time ago. When researching who to submit to, you should have discovered that."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"b759e521b063","_type":"block","children":[{"_key":"b759e521b0630","_type":"span","marks":["em"],"text":"As well as expert teaching from published authors, all our novel-writing courses offer dedicated modules on submitting your novel to literary agents – and include sessions on writing a synopsis and preparing a covering letter. Click for more information or to apply for our "},{"_key":"b759e521b0631","_type":"span","marks":["em","e19f22793530"],"text":"creative writing courses"},{"_key":"b759e521b0632","_type":"span","marks":["em"],"text":"."}],"markDefs":[{"_key":"e19f22793530","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"https://www.curtisbrowncreative.co.uk/creative-writing-courses"}],"style":"normal"}],"categories":[{"_id":"category-555","slug":"writing-tips","title":"Writing Tips"},{"_id":"category-554","slug":"from-the-agents","title":"Literary Agent Advice"}],"coverImage":{"_type":"image","asset":{"_ref":"image-057426de037
