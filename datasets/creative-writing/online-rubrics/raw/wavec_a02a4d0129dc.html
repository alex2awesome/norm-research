se">BY <!-- -->Anna Davis</span></h5><h6 class="text-[16px]"><span class="text-gray-400">22nd Jun 2018</span></h6></header><div class="flex items-start gap-3"><button aria-label="Share on Facebook" class="react-share__ShareButton" style="background-color:transparent;border:none;padding:0;display:inline-flex;border-radius:0;outline-offset:2px;font:inherit;color:inherit;cursor:pointer" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_1255_3248)"><path d="M9.99821 23.8675C4.33309 22.8696 0 17.9335 0 12.0005C0 5.40002 5.40003 0 12.0005 0C18.6009 0 24 5.40002 24 12.0005C24 17.9335 19.6669 22.8677 13.9999 23.8675L13.3334 23.3363H10.6666L9.99821 23.8675Z" fill="#0062E0"></path><path d="M16.6668 15.334L17.1998 12.0007H14V9.66705C14 8.7336 14.3332 7.99991 15.7997 7.99991H17.3333V4.93351C16.4661 4.80003 15.5336 4.66748 14.6655 4.66748C11.9324 4.66748 9.99825 6.33463 9.99825 9.33474V12.0016H7V15.335H9.99825V23.8033C11.3182 24.0699 12.6781 24.0699 13.9981 23.8033V15.3368L16.6668 15.334Z" fill="white"></path></g><defs><clipPath id="clip0_1255_3248"><rect width="24" height="24" fill="white"></rect></clipPath></defs></svg></button><button aria-label="Share on X" class="react-share__ShareButton Demo__some-network__share-button" style="background-color:transparent;border:none;padding:0;display:inline-flex;border-radius:0;outline-offset:2px;font:inherit;color:inherit;cursor:pointer" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" viewBox="0 0 25 25"><path fill="#00acee" fill-opacity="1" d="M7.862 22.814c9.434 0 14.594-7.816 14.594-14.594 0-.222 0-.444-.015-.662A10.434 10.434 0 0025 4.9c-.936.415-1.93.687-2.946.808a5.148 5.148 0 002.255-2.838 10.28 10.28 0 01-3.257 1.245 5.134 5.134 0 00-8.74 4.679A14.562 14.562 0 011.74 3.435a5.132 5.132 0 001.587 6.846A5.091 5.091 0 011 9.641v.065a5.132 5.132 0 004.115 5.028 5.119 5.119 0 01-2.316.087 5.134 5.134 0 004.792 3.563A10.291 10.291 0 010 20.509a14.52 14.52 0 007.862 2.3"></path></svg></button></div></div><div class="text-block blog-post mb-12"><div class="rc"><p>If you spend time online reading tips on how to write a synopsis for a novel, you&#x27;ll find masses of different and contradictory ideas - but I reckon I can safely assert one universal truth: Nobody – but <em>nobody</em> – finds them easy to write!</p><p>The synopsis is a short, lively overview of your novel. It sits alongside the opening of your novel and your <a href="https://www.curtisbrowncreative.co.uk/how-to-write-the-perfect-pitch-letter-to-an-agent/" target="_blank" rel="noopener noreferrer" class="">agent pitch letter</a> in your pitch package, and it lays out the complete narrative arc of your plot. It’s not the same thing as a ‘blurb’ (which is the short teaser paragraph that you find on the back of published books).</p><p>Some agents will read the synopsis all through before even looking at the writing sample. Others will read all of the material you&#x27;ve sent and then look at the synopsis to see where it&#x27;s headed. And there are agents who don&#x27;t give it so much as a cursory glance. Nevertheless you should write one, when you&#x27;re ready to send your novel out - and you should make it as good as you can.</p><p>When applying to one of Curtis Brown Creative&#x27;s selective novel-writing courses or submitting to the agents at <a href="https://www.curtisbrowncreative.co.uk/submissions/" target="_blank" rel="noopener noreferrer" class="">Curtis Brown</a> and <a href="http://cwagency.co.uk/page/submissions" target="_blank" rel="noopener noreferrer" class="">C&amp;W</a>, we like to see a good one-page synopsis of your novel as part of <a href="https://www.curtisbrowncreative.co.uk/tips-on-preparing-your-submission-package/" target="_blank" rel="noopener noreferrer" class="">your pitch package. </a>One page should be enough for you to cover all the information that’s needed, and it makes the synopsis easily readable and digestible. No literary agent worth their salt is going to object to a really good one-pager. And even aside from the fact that agents expect to see a synopsis, it&#x27;s actually a great way to see if your plot is working properly. If you can&#x27;t summarise your story in a page, then there&#x27;s quite probably something wrong with it...</p><p>Here are my tips on how to write a really good one-page synopsis of your novel:</p><h3>1. Put your title at the top </h3><p>Even if it’s still just a working title.</p><h3>2. State what genre you’re writing in</h3><p>If you&#x27;re writing genre fiction, eg romance, science fiction, fantasy, crime thriller, psychological suspense … If you’re not writing in a clear genre or you’re not sure what your genre is, just skip this. If you’re writing for children, you should indicate the age group you’re writing for. (You can find a lot more information about age groups in children&#x27;s fiction <a href="https://www.curtisbrowncreative.co.uk/blog/childrens-fiction-explained-how-to-figure-out-the-target-audience-of-your-book" target="_blank" rel="noopener noreferrer" class="">in this blog post</a>).</p><h3>3. Perfect your pitch line</h3><p>What you <em>definitely </em>need at or near the top of the synopsis is your pitch line. This is usually the key question, dilemma or driving force of the novel – or the <em>heart</em> of the novel, to put it another way. And if you know you have a great hook or a high concept, that should be your pitch line. Writers understandably get very worked up trying to get their pitch lines right – but remember that you’re in any case going on to say more about your story all the way down the page - it’s not all about this one line.</p><h3>4. To quote or not to quote </h3><p>Some people like to include a quote from the novel. Quotes can offer a glimpse of the tone of your novel as well as teasing and enticing the reader. It can be a good way to go if you’re struggling to come up with a pitch line – but go one way or the other here – you don’t need both.</p><h3>5. Keep it simple</h3><p>The synopsis of your novel should then go on to cover your plot in its broad strokes: Set out your story in the <em>simplest</em> terms. Don’t try to include everything: we don’t need all of the intricate twists, turns and subplots – just the major plot points so an agent can see what your novel <em>is</em> and where its headed</p><h3>6. The importance of character </h3><p>Get your protagonist’s name in early on (if you have one clear protagonist) and the main character&#x27;s motivations. It’s good to show whose story this is.</p><p>But don’t put in <em>too </em>many character names. We don’t need your full cast list – in fact we don’t need many names at all or your page will be cluttered with them. This can make your synopsis confusing and difficult to understand.</p><h3>7. Set the scene</h3><p>Give us the when and the where: we need to know the primary setting for the novel and the time period in which it takes place (particularly if it’s historical fiction. We tend to assume a default of ‘now’). Again, though, don’t include <em>lots</em> of place names and dates – keep it simple.</p><h3>8. Spoilers?</h3><p>I’m often asked whether to include the ending of the novel<strong> </strong>in the synopsis. The honest (though annoying) answer is, it’s up to you. Some agents would say they need to see the ending because it’s such an important part of the story – they’re annoyed if it’s not there. But others say they don’t like any big twist in the tale to be given away because they still feel they like to approach the novel as a reader. You can’t rewrite your synopsis for each and every agent (that would be too much), so you’ll just have to decide what feels right for you and your novel.</p><h3>9. Tone</h3><p>The best synopses convey the tone of the novel as well as the plot. If you can find a way to bring the feel, atmosphere or voice of the novel into the synopsis, it will really bring it to life. It’s not essential and not worth fretting over if you can’t see a way to do it, but it just adds that little extra zing.</p><h3>10. Don’t heap praise on your own novel</h3><p>The synopsis is not the place to say you’re going to be a huge international bestseller, or even to comment that the novel is gripping or funny or moving, etc. Leave it to others to make judgments about its top-ten-bestselling or award-winning potential.</p><h3>11. Be succinct </h3><p>Don’t cram as much as possible on to the page<strong>.</strong> One page is a good, readable, concise length (approx. 500 words). Aim to be succinct – and don’t attempt to wedge in more words than really fit onto a page by making your font, spacing or margins tiny. That just makes the synopsis difficult-to-read, which is the opposite of what you want to achieve.</p><h3>12. Don&#x27;t share your full plan</h3><p>Don’t include chapter breakdowns or mini-summaries of the content of individual bits of your book. This isn’t your working plan – the agent or publisher doesn’t need to see all that stuff.</p><h3>13. Story above all else</h3><p>Go for story rather than ‘themes’. Tell us what drives your novel but don’t give a list of themes or imagery with the idea that this will make it seem more deep and meaningful. It’s only worth mentioning themes if your book explores a big issue or if it’s <em>majorly</em> concerned with – for instance – grief, as the driving force of the story.</p><h3>14. Don’t talk about unreliable narrators</h3><p>People often make an issue of their first-person narrators being unreliable. I think this is a hangover from university English degrees. Essentially <em>any </em>and <em>every</em> first-person narrator is unreliable, so it’s not worth highlighting.</p><h3>15. Unusual narrative structures</h3><p>It’s possible that your novel really is impossible to summarise in the way I’m advising here – because it’s so experimental, its cast of characters is enormous and without any sort of centrality; its plot is so unconventional as barely to exist. If your novel is really <em>so </em>extraordinary and unconventional, then you actually won’t be able to produce a ‘normal’ synopsis for it. If that’s the case, see if you can write a page that gives an idea of what you’re trying to do in the novel, and which talks passionately about your novelistic endeavour.</p><p>Or perhaps try a page from the perspective of a specific character to entice the agent and draw them in – even if it&#x27;s not actually an overview of the story in a conventional sense. However, if you read back over it and discover it sounds like an academic exercise or just very pretentious and unreadable, don’t send it out with your work – just send your pitch letter and the opening of the novel itself. I should say though – most novels <em>can</em> be synopsised, so don&#x27;t leap on this final point!</p><p>Good luck with taming the tricky beast that is the synopsis!</p><hr/><h3><strong>Courses to help you pitch with confidence</strong></h3><p>We have a range of courses designed to help you improve your editing skills, learn what literary agents are looking for and how to submit to them with confidence. From our bestselling six-week online Edit &amp; Pitch Your Your Novel course to our popular two-hour Writing Your Synopsis – Masterclass, there&#x27;s a course to suit you.</p><p><a class="btn btn-red" href="/creative-writing-courses/edit-and-pitch">Explore now</a></p></div></div><h5 class="mb-1 text-[16px]">RELATED ARTICLES</h5><div class="grid grid-cols-2 gap-4 "><a class="max-w-[190px]" href="/blog/how-to-write-the-perfect-pitch-letter-to-an-agent"><div class="mb-4"><figure class="rounded-standard border-0 outline-none"><div class="ar"><picture><img width="160" sizes="(min-width: 940px) 50vw, 100vw" decoding="async" alt="Anna Davis, CBC&#x27;s Founder &amp; Director" class="object-cover rounded-standard border-0 outline-none"/></picture><div class="hidden"><div class="ar--placeholder"><img alt="" role="presentation"/></div></div></div></figure></div><h5 class="font-bold leading-tight">How to write the perfect pitch letter to an agent</h5></a><a class="max-w-[190px]" href="/blog/how-to-write-your-elevator-pitch"><div class="mb-4"><figure class="rounded-standard border-0 outline-none"><div class="ar"><picture><img width="160" sizes="(min-width: 940px) 50vw, 100vw" decoding="async" alt="Jonny Geller, CEO of The Curtis Brown Group" class="object-cover rounded-standard border-0 outline-none"/></picture><div class="hidden"><div class="ar--placeholder"><img alt="" role="presentation"/></div></div></div></figure></div><h5 class="font-bold leading-tight">How to write your elevator pitch</h5></a></div></div></section></div></main><footer class="rounded-standard  m-6 mt-24 border-2 border-black p-6 text-left text-gray-600 md:p-8"><div class="flex items-center justify-center border-b border-gray-300 pb-6 lg:justify-between"><div class="mr-12 text-sm md:text-base"><span>Find us on social</span></div><div class="flex justify-center"><a href="https://www.facebook.com/CurtisBrownCreative/" target="_blank" rel="noopener noreferrer" class="mr-6 text-gray-600"><svg aria-hidden="true" focusable="false" data-prefix="fab" data-icon="facebook-f" class="w-4" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" aria-label="Facebook"><path fill="#4267B2" d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"></path></svg></a><a href="https://www.instagram.com/curtisbrowncreative/" class="mr-6 text-gray-600" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" aria-label="Instagram" focusable="false" data-prefix="fab" data-icon="instagram" class="w-6" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="#e95950" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S " fill="#FF004F"></path><path d="M15.8013 8.34534C17.4805 9.54472 19.5369 10.2505 21.7578 10.2505V6.88765C20.5181 6.62382 19.4206 5.97619 18.5953 5.07547C17.1829 4.19454 16.1651 2.74114 15.8668 1.04004H12.753V18.1033C12.746 20.0925 11.1308 21.7031 9.13899 21.7031C7.96522 21.7031 6.92246 21.144 6.26211 20.2777C5.0828 19.6829 4.27415 18.4616 4.27415 17.0511C4.27415 15.0562 5.89198 13.439 7.88807 13.439C8.27048 13.439 8.63908 13.4986 8.98483 13.6082V10.2087C4.69826 10.2972 1.25079 13.7979 1.25079 18.1034C1.25079 20.2525 2.10934 22.2009 3.50258 23.6244C4.75962 24.4681 6.27282 24.96 7.90079 24.96C12.264 24.96 15.8013 21.4246 15.8013 17.0636V8.34534H15.8013Z" fill="black"></path><path d="M21.7578 6.88761V5.97828C20.6398 5.97997 19.5439 5.66706 18.5953 5.0753C19.4349 5.99409 20.5405 6.62769 21.7578 6.88761ZM15.8668 1.04C15.8383 0.877448 15.8164 0.713804 15.8012 0.549458V0H11.502V17.0634C11.4951 19.0524 9.88 20.663 7.88804 20.663C7.30314 20.663 6.75111 20.5243 6.26207 20.2777C6.92242 21.1439 7.96518 21.703 9.13895 21.703C11.1306 21.703 12.746 20.0924 12.753 18.1032V1.04H15.8668ZM8.98495 10.2087V9.24066C8.62571 9.19155 8.26353 9.167 7.90096 9.16718C3.53722 9.16716 0 12.7026 0 17.0634C0 19.7974 1.39019 22.2069 3.50272 23.6243C2.10946 22.2008 1.25094 20.2524 1.25094 18.1032C1.25094 13.798 4.69825 10.2972 8.98495 10.2087Z" fill="#00F2EA"></path></g><defs><clipPath id="clip0_328_1448"><rect width="23.0087" height="26" fill="white"></rect></clipPath></defs></svg></a></div></div><div class="py-10 text-left"><div class="grid-1 grid gap-x-16 gap-y-5 md:grid-cols-2 lg:grid-cols-6"><div class="col-span-2"><h6 class=" mb-4 font-semibold uppercase  "><img alt="CBC Logo" width="120" height="59" decoding="async" data-nimg="1" class="mb-6 block" style="color:transparent" srcSet="/_next/image?url=%2Fimages%2Fcbc-logo.png&amp;w=128&amp;q=75 1x, /_next/image?url=%2Fimages%2Fcbc-logo.png&amp;w=256&amp;q=75 2x" src="/_next/image?url=%2Fimages%2Fcbc-logo.png&amp;w=256&amp;q=75"/>Curtis Brown Creative</h6><p>We&#x27;re the writing school founded by literary agents. We&#x27;ll help you tell your story – from first idea to final draft.</p></div><div class="col-span-2"><h6 class="mb-4 flex font-semibold uppercase  md:justify-start">Useful links</h6><p class="mb-2 columns-2"><a class="btn btn-green mb-2 block" href="/creative-writing-courses">Courses</a><a class="mb-2 block text-gray-600" href="/about">About Us</a><a class="mb-2 block text-gray-600" href="/tutors-and-editors">Tutors &amp; Editors</a><a class="mb-2 block text-gray-600" href="/our-team">Our Team</a><a class="btn btn-green mb-2 block" href="/faqs">Help</a><a class="mb-2 block text-gray-600" href="/student-stories">Testimonials</a><a class="mb-2 block text-gray-600" href="/blog">Blog</a><a class="mb-2 block text-gray-600" href="/breakthrough-writers-programme">Scholarships</a></p></div><div class="col-span-2"><h6 class="mb-4 flex font-semibold uppercase md:justify-start">subscribe to our Newsletter</h6><div class="col-span-2"><form class="form"><div class="col-span-2"><p>Enter your email to receive weekly advice from industry insiders and the latest news about our courses and events.</p><div class="mt-2 flex gap-0 text-sm sm:gap-2"><div class="relative"><input placeholder="Enter your email" class="min-w-[190px] rounded-[.25rem] bg-gray-100 px-3 py-2" id="email-footer" type="email" inputMode="email" autoComplete="email" name="email"/></div><button type="submit" class="btn btn-green is-disabled cursor-not-allowed focus:outline-none" disabled="">Sign Up</button></div><div><div class=" mt-2 text-sm text-gray-400"><label for="acceptTerms-footer" class="form-control"><input id="acceptTerms-footer" type="checkbox" name="acceptTerms"/> <span>Check to confirm you&#x27;ve read our<!-- --> <a class="underline" href="/privacy-policy">privacy policy.</a></span></label></div></div></div></form></div></div></div></div><div class="items-center justify-between gap-4 text-right text-sm text-gray-400 md:flex"><div>© 2023 Copyright Curtis Brown Creative  <a class="underline" href="#">Manage cookie preferences</a> <a href="https://www.curtisbrowncreative.co.uk/privacy-policy" rel="noreferrer" class="underline" target="_blank">Privacy Policy</a> <!-- --> <a rel="noreferrer" href="https://curtisbrowncreative.co.uk/terms-conditions" class="underline" target="_blank">Terms &amp; Conditions</a></div></div></footer></div><section class="Toastify" aria-live="polite" aria-atomic="false" aria-relevant="additions text" aria-label="Notifications Alt+T"></section></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"preview":false,"previewToken":"","data":{"post":{"_id":"post-10936","author":{"name":"Anna Davis","picture":null},"body":[{"_key":"d8f71c063de8","_type":"block","children":[{"_key":"d8f71c063de80","_type":"span","marks":[],"text":"If you spend time online reading tips on how to write a synopsis for a novel, you'll find masses of different and contradictory ideas - but I reckon I can safely assert one universal truth: Nobody – but "},{"_key":"d8f71c063de81","_type":"span","marks":["em"],"text":"nobody"},{"_key":"d8f71c063de82","_type":"span","marks":[],"text":" – finds them easy to write!"}],"markDefs":[],"style":"normal"},{"_key":"d79ecee85bcd","_type":"block","children":[{"_key":"d79ecee85bcd0","_type":"span","marks":[],"text":"The synopsis is a short, lively overview of your novel. It sits alongside the opening of your novel and your "},{"_key":"d79ecee85bcd1","_type":"span","marks":["03d9a3e24c74"],"text":"agent pitch letter"},{"_key":"d79ecee85bcd2","_type":"span","marks":[],"text":" in your pitch package, and it lays out the complete narrative arc of your plot. It’s not the same thing as a ‘blurb’ (which is the short teaser paragraph that you find on the back of published books)."}],"markDefs":[{"_key":"03d9a3e24c74","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"https://www.curtisbrowncreative.co.uk/how-to-write-the-perfect-pitch-letter-to-an-agent/"}],"style":"normal"},{"_key":"1b4ca1704935","_type":"block","children":[{"_key":"1b4ca17049350","_type":"span","marks":[],"text":"Some agents will read the synopsis all through before even looking at the writing sample. Others will read all of the material you've sent and then look at the synopsis to see where it's headed. And there are agents who don't give it so much as a cursory glance. Nevertheless you should write one, when you're ready to send your novel out - and you should make it as good as you can."}],"markDefs":[],"style":"normal"},{"_key":"7ee59cb07bab","_type":"block","children":[{"_key":"7ee59cb07bab0","_type":"span","marks":[],"text":"When applying to one of Curtis Brown Creative's selective novel-writing courses or submitting to the agents at "},{"_key":"7ee59cb07bab1","_type":"span","marks":["4380c295abe3"],"text":"Curtis Brown"},{"_key":"7ee59cb07bab2","_type":"span","marks":[],"text":" and "},{"_key":"7ee59cb07bab3","_type":"span","marks":["56cf3e08bac5"],"text":"C\u0026W"},{"_key":"7ee59cb07bab4","_type":"span","marks":[],"text":", we like to see a good one-page synopsis of your novel as part of "},{"_key":"7ee59cb07bab5","_type":"span","marks":["67fddcf998f7"],"text":"your pitch package. "},{"_key":"7ee59cb07bab6","_type":"span","marks":[],"text":"One page should be enough for you to cover all the information that’s needed, and it makes the synopsis easily readable and digestible. No literary agent worth their salt is going to object to a really good one-pager. And even aside from the fact that agents expect to see a synopsis, it's actually a great way to see if your plot is working properly. If you can't summarise your story in a page, then there's quite probably something wrong with it..."}],"markDefs":[{"_key":"4380c295abe3","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"https://www.curtisbrowncreative.co.uk/submissions/"},{"_key":"56cf3e08bac5","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"http://cwagency.co.uk/page/submissions"},{"_key":"67fddcf998f7","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"https://www.curtisbrowncreative.co.uk/tips-on-preparing-your-submission-package/"}],"style":"normal"},{"_key":"6d7190f59236","_type":"block","children":[{"_key":"6d7190f592360","_type":"span","marks":[],"text":"Here are my tips on how to write a really good one-page synopsis of your novel:"}],"markDefs":[],"style":"normal"},{"_key":"80da3e9ae42b","_type":"block","children":[{"_key":"80da3e9ae42b0","_type":"span","marks":[],"text":"1. Put your title at the top "}],"markDefs":[],"style":"h3"},{"_key":"cbf337731c7c","_type":"block","children":[{"_key":"594e16a46550","_type":"span","marks":[],"text":"Even if it’s still just a working title."}],"markDefs":[],"style":"normal"},{"_key":"dc382154943e","_type":"block","children":[{"_key":"dc382154943e0","_type":"span","marks":[],"text":"2. State what genre you’re writing in"}],"markDefs":[],"style":"h3"},{"_key":"6dc3bc66930b","_type":"block","children":[{"_key":"eaf976c68bef","_type":"span","marks":[],"text":"If you're writing genre fiction, eg romance, science fiction, fantasy, crime thriller, psychological suspense … If you’re not writing in a clear genre or you’re not sure what your genre is, just skip this. If you’re writing for children, you should indicate the age group you’re writing for. (You can find a lot more information about age groups in children's fiction "},{"_key":"dc382154943e3","_type":"span","marks":["c8e070f0e770"],"text":"in this blog post"},{"_key":"dc382154943e4","_type":"span","marks":[],"text":")."}],"markDefs":[{"_key":"c8e070f0e770","_type":"link","isButton":null,"linkType":"external","page":null,"styles":null,"url":"https://www.curtisbrowncreative.co.uk/blog/childrens-fiction-explained-how-to-figure-out-the-target-audience-of-your-book"}],"style":"normal"},{"_key":"a2b9efa61b92","_type":"block","children":[{"_key":"a2b9efa61b920","_type":"span","marks":[],"text":"3. Perfect your pitch line"}],"markDefs":[],"style":"h3"},{"_key":"cac0cb6a825d","_type":"block","children":[{"_key":"af6720d0a9bf","_type":"span","marks":[],"text":"What you "},{"_key":"a2b9efa61b921","_type":"span","marks":["em"],"text":"definitely "},{"_key":"a2b9efa61b922","_type":"span","marks":[],"text":"need at or near the top of the synopsis is your pitch line. This is usually the key question, dilemma or driving force of the novel – or the "},{"_key":"a2b9efa61b925","_type":"span","marks":["em"],"text":"heart"},{"_key":"a2b9efa61b926","_type":"span","marks":[],"text":" of the novel, to put it another way. And if you know you have a great hook or a high concept, that should be your pitch line. Writers understandably get very worked up trying to get their pitch lines right – but remember that you’re in any case going on to say more about your story all the way down the page - it’s not all about this one line."}],"markDefs":[],"style":"normal"},{"_key":"9085b2f8a58b","_type":"block","children":[{"_key":"9085b2f8a58b0","_type":"span","marks":[],"text":"4. To quote or not to quote "}],"markDefs":[],"style":"h3"},{"_key":"9ed5f8636e1a","_type":"block","children":[{"_key":"999a3093d1ba","_type":"span","marks":[],"text":"Some people like to include a quote from the novel. Quotes can offer a glimpse of the tone of your novel as well as teasing and enticing the reader. It can be a good way to go if you’re struggling to come up with a pitch line – but go one way or the other here – you don’t need both."}],"markDefs":[],"style":"normal"},{"_key":"9c893208f975","_type":"block","children":[{"_key":"9c893208f9750","_type":"span","marks":[],"text":"5. Keep it simple"}],"markDefs":[],"style":"h3"},{"_key":"7ebe1ba8caed","_type":"block","children":[{"_key":"57bf21caaae1","_type":"span","marks":[],"text":"The synopsis of your novel should then go on to cover your plot in its broad strokes: Set out your story in the "},{"_key":"9c893208f9753","_type":"span","marks":["em"],"text":"simplest"},{"_key":"9c893208f9754","_type":"span","marks":[],"text":" terms. Don’t try to include everything: we don’t need all of the intricate twists, turns and subplots – just the major plot points so an agent can see what your novel "},{"_key":"9c893208f9755","_type":"span","marks":["em"],"text":"is"},{"_key":"9c893208f9756","_type":"span","marks":[],"text":" and where its headed"}],"markDefs":[],"style":"normal"},{"_key":"2cf38e90a2f2","_type":"block","children":[{"_key":"2cf38e90a2f20","_type":"span","marks":[],"text":"6. The importance of character "}],"markDefs":[],"style":"h3"},{"_key":"908f7a821cf9","_type":"block","children":[{"_key":"edf4346ddd62","_type":"span","marks":[],"text":"Get your protagonist’s name in early on (if you have one clear protagonist) and the main character's motivations. It’s good to show whose story this is."}],"markDefs":[],"style":"normal"},{"_key":"4ddf196bddfe","_type":"block","children":[{"_key":"4ddf196bddfe1","_type":"span","marks":[],"text":"But don’t put in "},{"_key":"4ddf196bddfe2","_type":"span","marks":["em"],"text":"too "},{"_key":"4ddf196bddfe3","_type":"span","marks":[],"text":"many character names. We don’t need your full cast list – in fact we don’t need many names at all or your page will be cluttered with them. This can make your synopsis confusing and difficult to understand."}],"markDefs":[],"style":"normal"},{"_key":"57d7cd8ade1e","_type":"block","children":[{"_key":"57d7cd8ade1e0","_type":"span","marks":[],"text":"7. Set the scene"}],"markDefs":[],"style":"h3"},{"_key":"8f60280c1f0d","_type":"block","children":[{"_key":"57d7cd8ade1e1","_type":"span","marks":[],"text":"Give us the when and the where: we need to know the primary setting for the novel and the time period in which it takes place (particularly if it’s historical fiction. We tend to assume a default of ‘now’). Again, though, don’t include "},{"_key":"57d7cd8ade1e3","_type":"span","marks":["em"],"text":"lots"},{"_key":"57d7cd8ade1e4","_type":"span","marks":[],"text":" of place names and dates – keep it simple."}],"markDefs":[],"style":"normal"},{"_key":"74c1b1a125f9","_type":"block","children":[{"_key":"74c1b1a125f90","_type":"span","marks":[],"text":"8. Spoilers?"}],"markDefs":[],"style":"h3"},{"_key":"8f8c444642cf","_type":"block","children":[{"_key":"66b193e9f1c4","_type":"span","marks":[],"text":"I’m often asked whether to include the ending of the novel"},{"_key":"1207a9d08edd","_type":"span","marks":["strong"],"text":" "},{"_key":"74c1b1a125f92","_type":"span","marks":[],"text":"in the synopsis. The honest (though annoying) answer is, it’s up to you. Some agents would say they need to see the ending because it’s such an important part of the story – they’re annoyed if it’s not there. But others say they don’t like any big twist in the tale to be given away because they still feel they like to approach the novel as a reader. You can’t rewrite your synopsis for each and every agent (that would be too much), so you’ll just have to decide what feels right for you and your novel."}],"markDefs":[],"style":"normal"},{"_key":"ff30dd4e000e","_type":"block","children":[{"_key":"ff30dd4e000e0","_type":"span","marks":[],"text":"9. Tone"}],"markDefs":[],"style":"h3"},{"_key":"6217f5530186","_type":"block","children":[{"_key":"ba636412cef8","_type":"span","marks":[],"text":"The best synopses convey the tone of the novel as well as the plot. If you can find a way to bring the feel, atmosphere or voice of the novel into the synopsis, it will really bring it to life. It’s not essential and not worth fretting over if you can’t see a way to do it, but it just adds that little extra zing."}],"markDefs":[],"style":"normal"},{"_key":"ff68a9a4fe65","_type":"block","children":[{"_key":"ff68a9a4fe650","_type":"span","marks":[],"text":"10. Don’t heap praise on your own novel"}],"markDefs":[],"style":"h3"},{"_key":"c425139629ab","_type":"block","children":[{"_key":"6535a70aa5de","_type":"span","marks":[],"text":"The synopsis is not the place to say you’re going to be a huge international bestseller, or even to comment that the novel is gripping or funny or moving, etc. Leave it to others to make judgments about its top-ten-bestselling or award-winning potential."}],"markDefs":[],"style":"normal"},{"_key":"ed058b5b4bb8","_type":"block","children":[{"_key":"ed058b5b4bb80","_type":"span","marks":[],"text":"11. Be succinct "}],"markDefs":[],"style":"h3"},{"_key":"caaee8eadaae","_type":"block","children":[{"_key":"bab28e0b3adf","_type":"span","marks":[],"text":"Don’t cram as much as possible on to the page"},{"_key":"49ed68f7c118","_type":"span","marks":["strong"],"text":"."},{"_key":"ed058b5b4bb82","_type":"span","marks":[],"text":" One page is a good, readable, concise length (approx. 500 words). Aim to be succinct – and don’t attempt to wedge in more words than really fit onto a page by making your font, spacing or margins tiny. That just makes the synopsis difficult-to-read, which is the opposite of what you want to achieve."}],"markDefs":[],"style":"normal"},{"_key":"fa2a05c0330c","_type":"block","children":[{"_key":"fa2a05c0330c0","_type":"span","marks":[],"text":"12. Don't share your full plan"}],"markDefs":[],"style":"h3"},{"_key":"55a758307237","_type":"block","children":[{"_key":"6b98fc43dd7e","_type":"span","marks":[],"text":"Don’t include chapter breakdowns or mini-summaries of the content of individual bits of your book. This isn’t your working plan – the agent or publisher doesn’t need to see all that stuff."}],"markDefs":[],"style":"normal"},{"_key":"6379ed8ccd83","_type":"block","children":[{"_key":"6379ed8ccd830","_type":"span","marks":[],"text":"13. Story above all else"}],"markDefs":[],"style":"h3"},{"_key":"563b47b019d5","_type":"block","children":[{"_key":"789f9570215d","_type":"span","marks":[],"text":"Go for story rather than ‘themes’. Tell us what drives your novel but don’t give a list of themes or imagery with the idea that this will make it seem more deep and meaningful. It’s only worth mentioning themes if your book explores a big issue or if it’s "},{"_key":"6379ed8ccd833","_type":"span","marks":["em"],"text":"majorly"},{"_key":"6379ed8ccd834","_type":"span","marks":[],"text":" concerned with – for instance – grief, as the driving force of the story."}],"markDefs":[],"style":"normal"},{"_key":"2de17e0cd44f","_type":"block","children":[{"_key":"2de17e0cd44f0","_type":"span","marks":[],"text":"14. Don’t talk about unreliable narrators"}],"markDefs":[],"style":"h3"},{"_key":"190a84cd96e8","_type":"block","children":[{"_key":"ceb3b941d577","_type":"span","marks":[],"text":"People often make an issue of their first-person narrators being unreliable. I think this is a hangover from university English degrees. Essentially "},{"_key":"2de17e0cd44f3","_type":"span","marks":["em"],"text":"any "},{"_key":"2de17e0cd44f4","_type":"span","marks":[],"text":"and "},{"_key":"2de17e0cd44f5","_type":"span","marks":["em"],"text":"every"},{"_key":"2de17e0cd44f6","_type":"span","marks":[],"text":" first-person narrator is unreliable, so it’s not worth highlighting."}],"markDefs":[],"style":"normal"},{"_key":"a79902a80a96","_type":"block","children":[{"_key":"a79902a80a960","_type":"span","marks":[],"text":"15. Unusual narrative structures"}],"markDefs":[],"style":"h3"},{"_key":"5fcbe6dfe808","_type":"block","children":[{"_key":"184432b31d41","_type":"span","marks":[],"text":"It’s possible that your novel really is impossible to summarise in the way I’m advising here – because it’s so experimental, its cast of characters is enormous and without any sort of centrality; its plot is so unconventional as barely to exist. If your novel is really "},{"_key":"a79902a80a963","_type":"span","marks":["em"],"text":"so "},{"_key":"a79902a80a964","_type":"span","marks":[],"text":"extraordinary and unconventional, then you actually won’t be able to produce a ‘normal’ synopsis for it. If that’s the case, see if you can write a page that gives an idea of what you’re trying to do in the novel, and which talks passionately about your novelistic endeavour."}],"markDefs":[],"style":"normal"},{"_key":"82182d7260e8","_type":"block","children":[{"_key":"b0c19625075d","_type":"span","marks":[],"text":"Or perhaps try a page from the perspective of a specific character to entice the agent and draw them in – even if it's not actually an overview of the story in a conventional sense. However, if you read back over it and discover it sounds like an academic exercise or just very pretentious and unreadable, don’t send it out with your work – just send your pitch letter and the opening of the novel itself. I should say though – most novels "},{"_key":"a79902a80a965","_type":"span","marks":["em"],"text":"can"},{"_key":"a79902a80a966","_type":"span","marks":[],"text":" be synopsised, so don't leap on this final point!"}],"markDefs":[],"style":"normal"},{"_key":"6bf73b47e242","_type":"block","children":[{"_key":"6bf73b47e2420","_type":"span","marks":[],"text":"Good luck with taming the tricky beast that is the synopsis!"}],"markDefs":[],"style":"normal"},{"_key":"2e174b172d27","_type":"horizontalRule","markDefs":null},{"_key":"94bc63aa54da","_type":"block","children":[{"_key":"2340efac421f","_type":"span","marks":["strong"],"text":"Courses to help you pitch with confidence"}],"markDefs":[],"style":"h3"},{"_key":"c5d53271af65","_type":"block","children":[{"_key":"4eed2f2ab4ee0","_type":"span","marks":[],"text":"We have a range of courses designed to help you improve your editing skills, learn what literary agents are looking for and how to submit to them with confidence. From our bestselling six-week online Edit \u0026 Pitch Your Your Novel course to our popular two-hour Writing Your Synopsis – Masterclass, there's a course to suit you."}],"markDefs":[],"style":"normal"},{"_key":"132994ad24f7","_type":"block","children":[{"_key":"a4702e219480","_type":"span"
